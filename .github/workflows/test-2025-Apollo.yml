name: Server 2025 Apollo test

on:
  workflow_dispatch:

jobs:
  test-cloud-pc-auto:
    runs-on: windows-2025
    timeout-minutes: 369

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4


#      - name: configure Pagefile
#        uses: al-cheb/configure-pagefile-action@v1.2
#        with:
#          minimum-size: 4GB
#          maximum-size: 4GB
#          disk-root: "D:"

#      - name: Setup RAM Disk
#        uses: chad-golden/setup-ramdisk@main
#        with:
#          size-in-mb: 4096    # Optional: Default is 2048
#          drive-letter: 'R'   # Optional: Default is R
#          copy-workspace: false # Optional: Default is false

      - name: Run Win RDP Enabler
        uses: Veniamin668/win-rdp-enabler@x64-oauth
        with:
           OAUTH_KEY: ${{ secrets.TAIL_OAUTH }}
#           TAIL_KEY: ${{ secrets.TAIL_KEY }}
           ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
           USE_CUSTOM_USER: 'false'
           CUSTOM_USERNAME: ''
           CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}
           HOSTNAME: 'runner-2025'
           ADVERTISE_TAGS: 'tag:ci'

      - name: Install Playwright
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: C:\ms-playwright
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) { throw "python not found in PATH after debloat" }
          python -m pip install playwright
          if ($LASTEXITCODE -ne 0) { throw "pip install playwright failed" }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "playwright install chromium failed" }

      - name: install Apollo
        shell: pwsh
        run: |
          choco install apollo -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install apollo failed: $LASTEXITCODE" }

          $dir = "$env:ProgramFiles\Apollo"
          Get-ChildItem $dir | Select-Object Name
          Get-Service | Where-Object { $_.Name -match 'Apollo|Sunshine' } | Format-Table Name, Status

      - name: Ensure Apollo is running
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Wait-Port([int]$Port, [int]$Seconds) {
            $end = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $end) {
              try {
                $c = New-Object System.Net.Sockets.TcpClient
                $c.Connect('127.0.0.1', $Port)
                $c.Close()
                return $true
              } catch { Start-Sleep -Seconds 2 }
            }
            return $false
          }

          $dir = "$env:ProgramFiles\Apollo"
          $exe = Get-ChildItem $dir -Filter *.exe -Recurse -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -match '^(sunshine|apollo)\.exe$' } |
                 Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem $dir -Recurse -Filter *.exe | Select-Object -First 30 FullName
            throw "Apollo executable not found in $dir"
          }
          Write-Host "Apollo exe: $($exe.FullName)"

          # 1) Служба
          $svc = Get-Service | Where-Object { $_.Name -match 'Apollo|Sunshine' } | Select-Object -First 1
          if ($svc) {
            Write-Host "Service: $($svc.Name) = $($svc.Status)"
            if ($svc.Status -ne 'Running') { Start-Service -Name $svc.Name }
          } else {
            Write-Host "No Apollo/Sunshine service found."
          }

          # 2) Если веб-интерфейс не поднялся — запускаем exe напрямую
          if (-not (Wait-Port 47990 40)) {
            Write-Host "Web UI (47990) is down — launching Apollo manually."
            Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -WindowStyle Hidden
            if (-not (Wait-Port 47990 60)) {
              $log = Join-Path $exe.DirectoryName 'config\sunshine.log'
              if (Test-Path $log) { Get-Content $log -Tail 60 }
              throw "Apollo did not open port 47990."
            }
          }
          Write-Host "Apollo is up (port 47990)."

      - name: Start pairing panel
        shell: pwsh
        env:
          APOLLO_USER: ktoya
          APOLLO_PASSWORD: ${{ secrets.ADMIN_PASS }}
          PAIR_WEB_TOKEN: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          $py     = (Get-Command python).Source
          $script = Join-Path $env:GITHUB_WORKSPACE 'stream-Apollo.py'
          $dir    = 'C:\panel'
          $out    = Join-Path $dir 'panel.out.log'
          $err    = Join-Path $dir 'panel.err.log'
          $runner = Join-Path $dir 'run-panel.ps1'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          function Q([string]$v) { "'" + ($v -replace "'", "''") + "'" }

          # Обёртка с env — секреты лежат только в ней (папка закрыта ACL)
          $lines = @(
            "`$env:APOLLO_USER = $(Q $env:APOLLO_USER)",
            "`$env:APOLLO_PASSWORD = $(Q $env:APOLLO_PASSWORD)",
            "`$env:PAIR_WEB_TOKEN = $(Q $env:PAIR_WEB_TOKEN)",
            "`$env:PLAYWRIGHT_BROWSERS_PATH = 'C:\ms-playwright'",
            "Set-Location $(Q $env:GITHUB_WORKSPACE)",
            "& $(Q $py) -u $(Q $script) 1>> $(Q $out) 2>> $(Q $err)"
          )
          Set-Content -Path $runner -Value $lines -Encoding UTF8
          icacls $dir /inheritance:r /grant "${env:USERNAME}:(OI)(CI)F" "SYSTEM:(OI)(CI)F" "Administrators:(OI)(CI)F" | Out-Null

          # Запуск через Scheduled Task: процесс живёт отдельно от шага/раннера
          $pwsh    = (Get-Command pwsh).Source
          $argLine = "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$runner`""
          $mode    = 'task'
          try {
            $action    = New-ScheduledTaskAction -Execute $pwsh -Argument $argLine
            $principal = New-ScheduledTaskPrincipal -UserId "$env:USERDOMAIN\$env:USERNAME" -LogonType S4U -RunLevel Highest
            $settings  = New-ScheduledTaskSettingsSet -ExecutionTimeLimit ([TimeSpan]::Zero) -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
            Register-ScheduledTask -TaskName 'ApolloPanel' -Action $action -Principal $principal -Settings $settings -Force | Out-Null
            Start-ScheduledTask -TaskName 'ApolloPanel'
          } catch {
            Write-Host "Scheduled task failed ($($_.Exception.Message)) - falling back to Start-Process."
            $mode = 'process'
            Start-Process -FilePath $pwsh -ArgumentList $argLine -WindowStyle Hidden
          }
          Write-Host "Panel launch mode: $mode"

          Start-Sleep -Seconds 15

          Write-Host "---- panel log (stdout) ----"
          if (Test-Path $out) { Get-Content $out -Tail 20 }
          Write-Host "---- panel log (stderr) ----"
          if (Test-Path $err) { Get-Content $err -Tail 20 }

          $proc = Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
                  Where-Object { $_.CommandLine -like '*stream-Apollo*' } | Select-Object -First 1
          if (-not $proc) { throw "Panel process is not running after start." }

          $ts = Get-Command tailscale -ErrorAction SilentlyContinue
          $tsExe = if ($ts) { $ts.Source } else { "$env:ProgramFiles\Tailscale\tailscale.exe" }
          $ip = try { (& $tsExe ip -4 | Select-Object -First 1) } catch { $null }
          if (-not $ip) { $ip = "n/a" }

          Write-Host "======================================================================"
          Write-Host " Panel is running in background (PID $($proc.ProcessId))."
          Write-Host " Port 5902 opens once Apollo setup inside the script is done. Address:"
          Write-Host " http://$($ip):5902/"
          Write-Host "======================================================================"

      - name: Purge Windows Bloat
        uses: Veniamin668/windows-debloater-runner@v8
        with:
          enable: 'true'
          azure-del: 'true'
          choco-del: 'true'
          uwp-del: 'false'
          path-clean: 'true'
          del-installer-user: 'false'
          oobe-disable: 'false'
          npm-del: 'true'
          wsl-rename: 'false'
          optimize: 'true'

      - name: Post-debloat status
        shell: pwsh
        run: |
          function Test-Port([int]$Port) {
            try {
              $c = New-Object System.Net.Sockets.TcpClient
              $c.Connect('127.0.0.1', $Port)
              $c.Close()
              return $true
            } catch { return $false }
          }

          foreach ($port in 47989, 47990, 5902) {
            Write-Host ("port {0}: {1}" -f $port, $(if (Test-Port $port) { 'LISTENING' } else { 'down' }))
          }

          $pp = Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
                Where-Object { $_.CommandLine -like '*stream-Apollo*' } | Select-Object -First 1
          Write-Host ("panel process: {0}" -f $(if ($pp) { "alive (PID $($pp.ProcessId))" } else { 'NOT running' }))
          if (Test-Path 'C:\panel\panel.out.log') { Write-Host "---- panel log (tail) ----"; Get-Content 'C:\panel\panel.out.log' -Tail 8 }

          $ts = Get-Command tailscale -ErrorAction SilentlyContinue
          $tsExe = if ($ts) { $ts.Source } else { "$env:ProgramFiles\Tailscale\tailscale.exe" }
          Write-Host "---- tailscale ----"
          try { & $tsExe ip -4; & $tsExe status | Select-Object -First 5 } catch { Write-Host "tailscale not reachable: $_" }

          Write-Host "---- firewall rules (Apollo/Sunshine) ----"
          Get-NetFirewallRule -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match 'Apollo|Sunshine' } |
            Select-Object DisplayName, Enabled, Direction, Action | Format-Table -AutoSize

      - name: 4. wait session (6 hours)
        shell: pwsh
        run: |
          Write-Host "Cloud PC дрочилка запущена и ждет тебя в сети! Не закрывай этот воркфлоу."

          $dir    = 'C:\panel'
          $runner = Join-Path $dir 'run-panel.ps1'
          $out    = Join-Path $dir 'panel.out.log'
          $err    = Join-Path $dir 'panel.err.log'
          $pwsh   = (Get-Command pwsh).Source

          function Test-Port([int]$Port) {
            try {
              $c = New-Object System.Net.Sockets.TcpClient
              $c.Connect('127.0.0.1', $Port)
              $c.Close()
              return $true
            } catch { return $false }
          }

          function Get-PanelProc {
            Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
              Where-Object { $_.CommandLine -like '*stream-Apollo*' } | Select-Object -First 1
          }

          function Start-Panel {
            if (Get-ScheduledTask -TaskName 'ApolloPanel' -ErrorAction SilentlyContinue) {
              Start-ScheduledTask -TaskName 'ApolloPanel'
            } else {
              Start-Process -FilePath $pwsh -WindowStyle Hidden `
                -ArgumentList "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$runner`""
            }
          }

          while ($true) {
              Start-Sleep -Seconds 60

              # watchdog: панель (по процессу, порт открывается не сразу)
              if (-not (Get-PanelProc)) {
                Write-Host "[watchdog] panel process is gone - restarting."
                if (Test-Path $out) { Get-Content $out -Tail 10 }
                if (Test-Path $err) { Get-Content $err -Tail 10 }
                Start-Panel
              }

              # watchdog: Apollo
              if (-not (Test-Port 47990)) {
                Write-Host "[watchdog] Apollo web UI is down."
                $svc = Get-Service | Where-Object { $_.Name -match 'Apollo|Sunshine' } | Select-Object -First 1
                if ($svc -and $svc.Status -ne 'Running') { Start-Service -Name $svc.Name }
              }
          }

#      - name: Dismount RAM Disk
#        uses: chad-golden/setup-ramdisk/dismount@main
#        with:
#          drive-letter: 'R'   # Optional: Default is R
