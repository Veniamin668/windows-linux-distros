name: Windows 11 CPC WinApss & SSH host

on:
  workflow_dispatch:

jobs:
  overkill:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger
          sudo usermod -aG kvm $USER

      - name: Configure and Start Local SSH Server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server netcat-openbsd curl dialog freerdp3-x11 git iproute2 libnotify-bin
          echo "root:root" | sudo chpasswd
          sudo mkdir -p /var/run/sshd
          sudo sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          echo "PermitRootLogin yes" | sudo tee -a /etc/ssh/sshd_config
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          sudo /usr/sbin/sshd -p 22222 &

      - name: Install Bore & Cloudflared
        run: |
          # Ставим Bore для SSH туннеля
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore && sudo mv bore /usr/local/bin/bore
          
          # Ставим Cloudflared для noVNC веб-морды
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Windows Container (Using your exact command structure)
        env: 
          ADMIN_PASS: ${{ secrets.PASS }} 
          
        run: |
              wget -O CPC.iso "https://archive.org/download/WindowsCPC/26100.2314.241105-1703.GE_RELEASE_SVC_PROD1_CLIENTWNC_RET_X64FRE_EN-US.ISO"
              git clone https://github.com/Veniamin668/winapps.git --depth 1 
              cd winapps
              docker compose -f compose.yaml up -d
              

      - name: Wait for Windows noVNC Port to Open
        run: |
          echo "=== WAITING FOR PORT 8006 TO BE READY ==="
          while ! nc -z localhost 8006; do
            sleep 5
            echo "Port 8006 is not open yet, waiting..."
          done
          echo "=== PORT 8006 IS UP AND RUNNING! ==="

      - name: Launch Tunnels (Insecure TLS Enabled)
        run: |
          echo "=== STARTING TUNNELS ==="
          # Запускаем SSH туннель
          bore local 22222 --to bore.pub &
          
          # Запускаем Cloudflare туннель без проверки TLS
          cloudflared tunnel --no-tls-verify --url http://localhost:8006 &
          
          # Железобетонный вечный затык
          tail -f /dev/null
