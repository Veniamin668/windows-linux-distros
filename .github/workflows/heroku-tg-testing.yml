name: Heroku Userbot Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        env:
          PASSWORD: ${{ secrets.ADMIN_PASS }}
        run: echo runner:$PASSWORD | sudo chpasswd

      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAIL_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAIL_OAUTH }}
          tags: tag:ci
          hostname: heroku-runner
          args: '--advertise-exit-node '
#          log-mode: 'quiet'
          version: 'latest'
          
      - name: Update system & install dependencies
        run: |
          sudo apt update && sudo apt install git python3 python3-venv -y

      - name: Clone main userbot repository
        run: |
          git clone https://github.com/Heroku-userbot/Heroku.git HerokuDir

      - name: Clone private config/session repository into temp folder and distribute
        run: |
          git clone https://${{ secrets.VAULT_TOKEN }}@github.com/Veniamin668/heroku-api.git temp_api
          cp temp_api/*.json HerokuDir/ 2>/dev/null || true
          if [ -d "temp_api/sessions" ]; then
            cp -r temp_api/sessions HerokuDir/
          fi
          rm -rf temp_api

      - name: Setup venv and install requirements
        working-directory: ./HerokuDir
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -r optional_requirements.txt

      - name: Run Userbot and Sleep
        working-directory: ./HerokuDir
        run: |
          source .venv/bin/activate
          
          # Отключаем цвета, интерактивность и буферизацию выводов
          export FORCE_COLOR=0
          export PYTHONUNBUFFERED=1
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          export HEROKU_NO_UPDATE=0
          
          # Запускаем в фоне так, чтобы он вообще не ждал терминал и не мог запросить ввод
          setsid nohup python3 -m heroku > heroku.log 2>&1 < /dev/null &
          
          sleep 3
          ps aux | grep python
          
          echo "Bot is running detached. Sleeping for 5 hours 55 minutes..."
          
          # Таймер на 5 часов 59 минут (35700 секунд)
          sleep 5h 59m

      - name: Commit and push updated configs and sessions
        continue-on-error: true
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Клонируем приватный репозиторий заново в отдельную папку
          git clone https://${{ secrets.VAULT_TOKEN }}@github.com/Veniamin668/heroku-api.git sync_repo
          
          # Копируем измененные файлы конфигураций и сессий из рабочей директории бота обратно
          cp HerokuDir/*.json sync_repo/ 2>/dev/null || true
          if [ -d "HerokuDir/sessions" ]; then
            mkdir -p sync_repo/sessions
            cp -r HerokuDir/sessions/* sync_repo/sessions/ 2>/dev/null || true
          fi
          
          cd sync_repo
          git add .
          # Коммитим только если есть реальные изменения, иначе пропускаем
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-backup bot configs and sessions [skip ci]"
          git push https://${{ secrets.VAULT_TOKEN }}@github.com/Veniamin668/heroku-api.git main
        
