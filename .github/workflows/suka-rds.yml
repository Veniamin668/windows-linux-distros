name: Deploy Custom Cloud Desktops test norm

on:
  workflow_dispatch:
    inputs:
      launch_arch:
        description: 'Запустить Arch Linux (В контейнере)?'
        required: true
        type: boolean
        default: false
      launch_ubuntu:
        description: 'Запустить Ubuntu (НАТИВНО НА ХОСТЕ)?'
        required: true
        type: boolean
        default: true
      launch_debian:
        description: 'Запустить Debian (В контейнере)?'
        required: true
        type: boolean
        default: false
      desktop_env:
        description: 'Выберите графическую оболочку (DE)'
        required: true
        default: 'kde'
        type: choice
        options:
          - 'gnome'
          - 'kde'
          - 'xfce'

jobs:
  # ==========================================
  # ДЖОБА 1: ДЛЯ СИСТЕМ В КОНТЕЙНЕРАХ (ARCH / DEBIAN)
  # ==========================================
  deploy-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Джоба запустится, только если выбран хотя бы один контейнер
    if: ${{ inputs.launch_arch == true || inputs.launch_debian == true }}
    
    strategy:
      fail-fast: false
      matrix:
        os_name: [ 'archlinux', 'debian' ]
        include:
          - os_name: 'archlinux'
            os_image: 'archlinux:latest'
          - os_name: 'debian'
            os_image: 'debian:bookworm-slim'

    container:
      image: ${{ matrix.os_image }}
      options: --privileged --device=/dev/kvm --device=/dev/net/tun --cap-add=NET_ADMIN

    steps:
    
      # --- СТАРТ СЕТИ И СЛУЖБ ДЛЯ КОНТЕЙНЕРОВ ---
      - name: "Arch Install and Start Tailscale"
        if: matrix.os_name == 'archlinux' && inputs.launch_arch == true
        run: |
          pacman -Syu --noconfirm tailscale curl sudo
          mkdir -p /var/run/tailscale /var/lib/tailscale
          tailscaled --state=/var/lib/tailscale/tailscaled.state > /dev/null 2>&1 &
          sleep 3
          tailscale up --authkey="${{ secrets.TAIL_KEY }}" --hostname="desktop-arch" --advertise-exit-node

      - name: "Debian Install and Start Tailscale"
        if: matrix.os_name == 'debian' && inputs.launch_debian == true
        run: |
          # Add Tailscale's GPG key
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          # Add the tailscale repository
          curl -fsSL https://pkgs.tailscale.com/stable/debian/bookworm.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
          # Install Tailscale
          sudo apt-get update && sudo apt-get install tailscale
          mkdir -p /var/run/tailscale /var/lib/tailscale
          tailscaled --state=/var/lib/tailscale/tailscaled.state > /dev/null 2>&1 &
          sleep 3
          tailscale up --authkey="${{ secrets.TAIL_KEY }}" --hostname="desktop-debian" --advertise-exit-node

      # --- НАСТРОЙКА ГРАФИКИ И ПРАВ ДЛЯ КОНТЕЙНЕРОВ ---
      - name: "Setup Arch Linux Desktop"
        if: matrix.os_name == 'archlinux' && inputs.launch_arch == true
        run: |
          pacman -S --noconfirm base-devel git dbus xorg-server xorg-apps nano
          if [ "${{ inputs.desktop_env }}" = "kde" ]; then
            pacman -S --noconfirm plasma-desktop konsole plasma-nm
            DE_START="exec dbus-launch --exit-with-session startplasma-x11"
          elif [ "${{ inputs.desktop_env }}" = "gnome" ]; then
            pacman -S --noconfirm gnome-shell gdm
            DE_START="exec dbus-launch --exit-with-session gnome-session"
          else
            pacman -S --noconfirm xfce4 xfce4-goodies
            DE_START="exec startxfce4"
          fi
          
          # Создание юзера cloud с добавлением в системные и графические группы
          useradd -m -G wheel,tty,video,audio -s /bin/bash cloud
          echo "cloud:cloud" | chpasswd
          echo "cloud ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          
          # Выдаем xrdp доступ к терминалам и видеоустройствам
          usermod -a -G tty,video,audio xrdp || true
          
          # Фикс прав для запуска X-сервера
          echo -e "allowed_users=anybody\nneeds_root_rights=yes" > /etc/X11/Xwrapper.config
          
          # Сброс DBUS и XDG переменных перед запуском DE, чтобы сессия XRDP не вылетала
          echo -e "unset DBUS_SESSION_BUS_ADDRESS\nunset XDG_RUNTIME_DIR\n$DE_START" > /home/cloud/.xinitrc
          chmod +x /home/cloud/.xinitrc && chown cloud:cloud /home/cloud/.xinitrc
          
          # Сборка XRDP из AUR
          git config --global --add safe.directory '*'
          su - cloud -c "git config --global --add safe.directory '*'"
          su - cloud -c "cd /tmp && git clone https://aur.archlinux.org/yay-bin.git && cd yay-bin && makepkg -si --noconfirm"
          su - cloud -c 'yay -S --noconfirm --mflags "--nocheck" xrdp xorgxrdp'

      - name: "Setup Debian Desktop"
        if: matrix.os_name == 'debian' && inputs.launch_debian == true
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update && apt-get install -y dbus dbus-x11 xorg xrdp nano
          if [ "${{ inputs.desktop_env }}" = "kde" ]; then
            apt-get install -y kde-plasma-desktop konsole
            DE_START="export DESKTOP_SESSION=plasma\nexport XDG_CURRENT_DESKTOP=KDE\nexport XDG_SESSION_TYPE=x11\nexec dbus-launch --exit-with-session startplasma-x11"
          elif [ "${{ inputs.desktop_env }}" = "gnome" ]; then
            apt-get install -y gnome-session gnome-flashback
            DE_START="export XDG_CURRENT_DESKTOP=GNOME-Flashback:GNOME\nexec dbus-launch --exit-with-session gnome-session --session=gnome-flashback-metacity"
          else
            apt-get install -y xfce4 xfce4-goodies
            DE_START="exec startxfce4"
          fi
          
          # Создание юзера cloud с добавлением в системные и графические группы
          useradd -m -s /bin/bash cloud
          usermod -a -G sudo,tty,video,audio cloud || true
          echo "cloud:cloud" | chpasswd
          echo "cloud ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          
          # Добавляем xrdp в графические группы Debian
          usermod -a -G tty,video,audio xrdp || true
          
          # Фикс прав для запуска X-сервера
          echo -e "allowed_users=anybody\nneeds_root_rights=yes" > /etc/X11/Xwrapper.config
          
          # Сброс DBUS и XDG переменных для Debian
          echo -e "unset DBUS_SESSION_BUS_ADDRESS\nunset XDG_RUNTIME_DIR\n$DE_START" > /home/cloud/.xsession
          chown cloud:cloud /home/cloud/.xsession

      # --- ЗАПУСК ВСЕХ СЕРВИСОВ И ОЖИДАНИЕ ДЛЯ КОНТЕЙНЕРОВ ---
      - name: "Start Container Services and Keep Alive"
        if: (matrix.os_name == 'archlinux' && inputs.launch_arch == true) || (matrix.os_name == 'debian' && inputs.launch_debian == true)
        run: |
          mkdir -p /run/dbus /var/run/xrdp
          dbus-daemon --system --fork 2>/dev/null || true
          
          # Запуск демонов XRDP графики
          xrdp-keygen xrdp /etc/xrdp/rsakeys.ini
          xrdp-sesman --ns &
          xrdp &
          echo "=========================================="
          echo "  КОНТЕЙНЕР [${{ matrix.os_name }}] ПОДНЯТ!"
          echo "  Логин RDP: cloud"
          echo "  Пароль RDP: cloud"
          echo "=========================================="
          sleep infinity

  # ==========================================
  # ДЖОБА 2: ДЛЯ НАТИВНОГО ХОСТА (UBUNTU)
  # ==========================================
  deploy-native-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: inputs.launch_ubuntu == true

    steps:
      - name: "Ubuntu-Native Connect to Tailscale"
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAIL_KEY }}
          hostname: desktop-ubuntu
          args: '--advertise-exit-node'

      - name: "Setup Native Ubuntu Desktop"
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y xrdp xorg dbus-x11 nano
          
          if [ "${{ inputs.desktop_env }}" = "gnome" ]; then
            sudo apt-get install -y ubuntu-desktop
            DE_START="gnome-session"
          elif [ "${{ inputs.desktop_env }}" = "kde" ]; then
            sudo apt-get install -y kubuntu-desktop
            DE_START="startplasma-x11"
          else
            sudo apt-get install -y xfce4 xfce4-goodies
            DE_START="startxfce4"
          fi
          
          # Задаем пароль 'cloud' для нативного юзера 'runner'
          echo "runner:cloud" | sudo chpasswd
          
          # Фикс прав для Xorg
          sudo sed -i 's/allowed_users=console/allowed_users=anybody/g' /etc/X11/Xwrapper.config || echo "allowed_users=anybody" | sudo tee /etc/X11/Xwrapper.config
          
          # Прописываем старт графической оболочки нативно под runner
          echo "$DE_START" > ~/.xsession
          chmod +x ~/.xsession
          
          # Перезапуск нативного сервиса XRDP
          sudo systemctl restart xrdp
          sudo systemctl enable xrdp

      - name: "Start Ubuntu Services and Keep Alive"
        run: |
          echo "=========================================="
          echo "  НАТИВНАЯ UBUNTU УСПЕШНО ПОДНЯТА!"
          echo "  Устройство в Tailscale: desktop-ubuntu"
          echo "  Логин RDP: runner"
          echo "  Пароль RDP: cloud"
          echo "=========================================="
          sleep infinity
