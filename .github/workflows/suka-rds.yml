name: Deploy Custom Cloud Desktops test norm

on:
  workflow_dispatch:
    inputs:
      launch_arch:
        description: 'Запустить Arch Linux (В LXC Контейнере)?'
        required: true
        type: boolean
        default: false
      launch_debian:
        description: 'Запустить Debian (В LXC Контейнере)?'
        required: true
        type: boolean
        default: false
      launch_ubuntu:
        description: 'Запустить Ubuntu (НАТИВНО НА ХОСТЕ)?'
        required: true
        type: boolean
        default: true
      desktop_env:
        description: 'Выберите графическую оболочку (DE)'
        required: true
        default: 'kde'
        type: choice
        options:
          - 'kde'
          - 'gnome'
          - 'xfce'

jobs:
  # ==========================================
  # ДЖОБА 1: ДЛЯ СИСТЕМ В LXC КОНТЕЙНЕРАХ (ARCH / DEBIAN)
  # ==========================================
  deploy-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: ${{ inputs.launch_arch == true || inputs.launch_debian == true }}
    
    strategy:
      fail-fast: false
      matrix:
        os_name: [ 'archlinux', 'debian' ]

    steps:
      # Пропускаем дистрибутив, если галочка для него не установлена
      - name: "Check if OS is enabled"
        id: check
        run: |
          if [ "${{ matrix.os_name }}" = "archlinux" ] && [ "${{ inputs.launch_arch }}" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.os_name }}" = "debian" ] && [ "${{ inputs.launch_debian }}" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # 1. Установка и инициализация LXD/LXC на хосте GitHub
      - name: "Install and Initialize LXD"
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y snapd
          sudo snap install lxd --channel=latest/stable
          # ФИКС СЕТИ: Включаем глобальный форвардинг пакетов в ядре хоста
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1
          
          # УНИВЕРСАЛЬНЫЙ NAT: Выпускаем всё, что идет через интерфейс lxdbr0, независимо от случайного IP
          sudo iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE || true
          sudo iptables -A FORWARD -i lxdbr0 -j ACCEPT || true
          sudo iptables -A FORWARD -o lxdbr0 -j ACCEPT || true
          sudo lxd init --auto

      # 2. Запуск LXC контейнера с полноценным systemd
      - name: "Launch LXC Container"
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ "${{ matrix.os_name }}" = "archlinux" ]; then
            sudo lxc launch images:archlinux desktop-container
          else
            sudo lxc launch images:debian/12 desktop-container
          fi
          # Даем контейнеру время на инициализацию системы и сети
          sleep 10
          sudo lxc list

      # 3. Подключение Tailscale внутри LXC контейнера (с пробросом env)
      - name: "Install and Start Tailscale inside LXC"
        if: steps.check.outputs.skip != 'true'
        env:
          TAIL_KEY: ${{ secrets.TAIL_KEY }}
        run: |
          if [ "${{ matrix.os_name }}" = "archlinux" ]; then
            # ФИКС СЕТИ ДЛЯ ARCH LXC: Включаем нативный сетевой демон и резолвер
            sudo lxc exec desktop-container -- systemctl enable --now systemd-networkd systemd-resolved
            sleep 5
            
            # Для Arch используем строго pacman
            sudo lxc exec desktop-container -- pacman -Syu --noconfirm tailscale curl sudo dbus
          else
            # Для Debian используем apt
            sudo lxc exec desktop-container -- apt-get update
            sudo lxc exec desktop-container -- apt-get install -y curl sudo dbus dbus-x11
            sudo lxc exec desktop-container -- sudo mkdir -p --mode=0755 /usr/share/keyrings
            sudo lxc exec desktop-container -- curl -fsSL https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg | sudo lxc exec desktop-container -- sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
            sudo lxc exec desktop-container -- curl -fsSL https://pkgs.tailscale.com/stable/debian/bookworm.tailscale-keyring.list | sudo lxc exec desktop-container -- sudo tee /etc/apt/sources.list.d/tailscale.list
            sudo lxc exec desktop-container -- sudo apt-get install tailscale -y
          fi
          
          # Запускаем системную службу tailscaled через нативный systemd контейнера
          sudo lxc exec desktop-container -- systemctl enable --now tailscaled
          sleep 3
          
          # Теперь переменная подхватывается корректно на уровне самого шага
          sudo lxc exec desktop-container --env TAIL_KEY="$TAIL_KEY" -- tailscale up --authkey="$TAIL_KEY" --hostname="desktop-${{ matrix.os_name }}" --advertise-exit-node

      # 4. Установка графики, XRDP и создание пользователя внутри LXC
      - name: "Setup Desktop Environment and XRDP"
        if: steps.check.outputs.skip != 'true'
        run: |
          # Создаем юзера cloud и прописываем дефолтные пароли
          sudo lxc exec desktop-container -- useradd -m -s /bin/bash cloud
          sudo lxc exec desktop-container -- chsh -s /bin/bash root
          sudo lxc exec desktop-container -- sh -c 'echo "cloud:cloud" | chpasswd'
          sudo lxc exec desktop-container -- sh -c 'echo "root:cloud" | chpasswd'
          
          # --- РАЗДЕЛЕНИЕ ЛОГИКИ НАСТРОЙКИ ГРАФИКИ ---
          if [ "${{ matrix.os_name }}" = "archlinux" ]; then
            # НАСТРОЙКА ARCH LINUX (ПАКМАН И YAY)
            sudo lxc exec desktop-container -- pacman -S --noconfirm base-devel git xorg-server xorg-apps nano
            sudo lxc exec desktop-container -- sh -c 'echo "cloud ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers'
            
            if [ "${{ inputs.desktop_env }}" = "kde" ]; then
              sudo lxc exec desktop-container -- pacman -S --noconfirm plasma-desktop konsole plasma-nm
              DE_START="exec dbus-launch --exit-with-session startplasma-x11"
            elif [ "${{ inputs.desktop_env }}" = "gnome" ]; then
              sudo lxc exec desktop-container -- pacman -S --noconfirm gnome-shell gdm
              DE_START="exec dbus-launch --exit-with-session gnome-session"
            else
              sudo lxc exec desktop-container -- pacman -S --noconfirm xfce4 xfce4-goodies
              DE_START="exec startxfce4"
            fi
            
            sudo lxc exec desktop-container -- sh -c "echo 'allowed_users=anybody' > /etc/X11/Xwrapper.config"
            sudo lxc exec desktop-container -- sh -c "echo '$DE_START' > /home/cloud/.xinitrc"
            sudo lxc exec desktop-container -- chmod +x /home/cloud/.xinitrc
            sudo lxc exec desktop-container -- chown cloud:cloud /home/cloud/.xinitrc
            
            # Собираем xrdp и xorgxrdp через yay внутри Арча
            sudo lxc exec desktop-container -- su - cloud -c "git config --global --add safe.directory '*'"
            sudo lxc exec desktop-container -- su - cloud -c "cd /tmp && git clone https://aur.archlinux.org/yay-bin.git && cd yay-bin && makepkg -si --noconfirm"
            sudo lxc exec desktop-container -- su - cloud -c 'yay -S --noconfirm --mflags "--nocheck" xrdp xorgxrdp'
            
            # Включаем службы через полноценный systemd
            sudo lxc exec desktop-container -- systemctl enable --now xrdp xrdp-sesman
            
          else
            # НАСТРОЙКА DEBIAN (APT)
            sudo lxc exec desktop-container -- apt-get install -y xorg xrdp xorgxrdp nano
            sudo lxc exec desktop-container -- sh -c 'echo "cloud ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers'
            sudo lxc exec desktop-container -- usermod -a -G sudo cloud
            
            if [ "${{ inputs.desktop_env }}" = "kde" ]; then
              sudo lxc exec desktop-container -- apt-get install -y kde-plasma-desktop konsole
              DE_START="export DESKTOP_SESSION=plasma\nexport XDG_CURRENT_DESKTOP=KDE\nexport XDG_SESSION_TYPE=x11\nexec dbus-launch --exit-with-session startplasma-x11"
            elif [ "${{ inputs.desktop_env }}" = "gnome" ]; then
              sudo lxc exec desktop-container -- apt-get install -y gnome-session gnome-flashback
              DE_START="export XDG_CURRENT_DESKTOP=GNOME-Flashback:GNOME\nexec dbus-launch --exit-with-session gnome-session --session=gnome-flashback-metacity"
            else
              sudo lxc exec desktop-container -- apt-get install -y xfce4 xfce4-goodies
              DE_START="exec startxfce4"
            fi
            
            sudo lxc exec desktop-container -- sh -c "echo 'allowed_users=anybody' > /etc/X11/Xwrapper.config"
            sudo lxc exec desktop-container -- sh -c "echo -e '$DE_START' > /home/cloud/.xsession"
            sudo lxc exec desktop-container -- chown cloud:cloud /home/cloud/.xsession
            
            # Перезапускаем службу XRDP в Debian
            sudo lxc exec desktop-container -- systemctl restart xrdp
          fi

      # 5. Удержание контейнера активным
      - name: "Keep Alive LXC"
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "=========================================="
          echo "  LXC КОНТЕЙНЕР [${{ matrix.os_name }}] ПОДНЯТ!"
          echo "  Все службы работают через системный systemd."
          echo "  Логин RDP: cloud | Пароль RDP: cloud"
          echo "=========================================="
          sudo lxc exec desktop-container -- sleep infinity

  # ==========================================
  # ДЖОБА 2: ДЛЯ НАТИВНОГО ХОСТА (UBUNTU) - БЕЗ ИЗМЕНЕНИЙ
  # ==========================================
  deploy-native-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: inputs.launch_ubuntu == true

    steps:
      - name: "Ubuntu-Native Connect to Tailscale"
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAIL_KEY }}
          hostname: desktop-ubuntu
          args: '--advertise-exit-node'

      - name: "Setup Native Ubuntu Desktop"
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y xrdp xorg dbus-x11 nano
          
          if [ "${{ inputs.desktop_env }}" = "gnome" ]; then
            sudo apt-get install -y ubuntu-desktop
            DE_START="gnome-session"
          elif [ "${{ inputs.desktop_env }}" = "kde" ]; then
            sudo apt-get install -y kubuntu-desktop
            DE_START="startplasma-x11"
          else
            sudo apt-get install -y xfce4 xfce4-goodies
            DE_START="startxfce4"
          fi
          
          echo "runner:cloud" | sudo chpasswd
          sudo sed -i 's/allowed_users=console/allowed_users=anybody/g' /etc/X11/Xwrapper.config || echo "allowed_users=anybody" | sudo tee /etc/X11/Xwrapper.config
          
          echo "$DE_START" > ~/.xsession
          chmod +x ~/.xsession
          
          sudo systemctl restart xrdp
          sudo systemctl enable xrdp

      - name: "Start Ubuntu Services and Keep Alive"
        run: |
          echo "=========================================="
          echo "  НАТИВНАЯ UBUNTU УСПЕШНО ПОДНЯТА!"
          echo "  Устройство в Tailscale: desktop-ubuntu"
          echo "  Логин RDP: runner | Пароль RDP: cloud"
          echo "=========================================="
          sleep infinity
