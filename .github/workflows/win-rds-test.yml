name: Deploy Windows Native VDI

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: 'Direct URL to Windows Server / Windows 11 ISO'
        required: true
        default: ''
        type: string

      wim_index:
        description: 'Windows image index in install.wim/install.esd'
        required: true
        default: '2'
        type: string

jobs:
  deploy-vdi-native:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: "Generate VDI Master VHDX via DISM"
        shell: powershell
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          $WorkDir = "${{ github.workspace }}\vdi_build"

          New-Item -ItemType Directory -Force -Path $WorkDir | Out-Null

          Write-Host "=========================================="
          Write-Host "  WINDOWS VDI MASTER IMAGE BUILD"
          Write-Host "=========================================="

          $IsoPath = "$WorkDir\windows.iso"

          Write-Host "[1/7] Downloading Windows ISO..."
          curl.exe -L --fail --retry 3 -o "$IsoPath" "${{ inputs.iso_url }}"

          if (!(Test-Path $IsoPath)) {
              throw "Windows ISO was not downloaded."
          }

          Write-Host "[+] ISO downloaded."
          Write-Host ("    Size: {0:N2} GB" -f ((Get-Item $IsoPath).Length / 1GB))

          Write-Host "[2/7] Mounting ISO..."

          $IsoImage = Mount-DiskImage -ImagePath $IsoPath -PassThru
          Start-Sleep -Seconds 3

          $IsoVolume = $IsoImage |
              Get-Volume |
              Where-Object DriveLetter |
              Select-Object -First 1

          if (!$IsoVolume) {
              throw "Failed to determine ISO drive letter."
          }

          $IsoDrive = "$($IsoVolume.DriveLetter):"

          Write-Host "[+] ISO mounted: $IsoDrive"

          $WimPath = "$IsoDrive\sources\install.wim"
          $EsdPath = "$IsoDrive\sources\install.esd"

          if (Test-Path $WimPath) {
              $ImagePath = $WimPath
          }
          elseif (Test-Path $EsdPath) {
              $ImagePath = $EsdPath
          }
          else {
              throw "install.wim/install.esd was not found."
          }

          Write-Host "[+] Image: $ImagePath"

          Write-Host "[3/7] Creating dynamic VHDX..."

          $VhdPath = "$WorkDir\vdi_template.vhdx"

          if (Test-Path $VhdPath) {
              Remove-Item -Force -Path $VhdPath
          }

          New-VHD `
              -Path $VhdPath `
              -SizeBytes 60GB `
              -Dynamic |
              Out-Null

          Write-Host "[4/7] Initializing VHDX..."

          $Vhd = Mount-VHD -Path $VhdPath -Passthru
          $DiskNumber = $Vhd.DiskNumber

          Initialize-Disk `
              -Number $DiskNumber `
              -PartitionStyle GPT `
              -PassThru |
              Out-Null

          $Partition = New-Partition `
              -DiskNumber $DiskNumber `
              -UseMaximumSize `
              -DriveLetter T

          Format-Volume `
              -DriveLetter T `
              -FileSystem NTFS `
              -NewFileSystemLabel "VDI" `
              -Confirm:$false |
              Out-Null

          Write-Host "[+] VHDX mounted as T:"

          Write-Host "[5/7] Applying Windows image with DISM..."

          DISM.exe `
              /Apply-Image `
              /ImageFile:"$ImagePath" `
              /Index:${{ inputs.wim_index }} `
              /ApplyDir:T:\

          if ($LASTEXITCODE -ne 0) {
              throw "DISM /Apply-Image failed with exit code $LASTEXITCODE"
          }

          Write-Host "[+] Windows image applied."

          Write-Host "[6/7] Creating UEFI boot configuration..."

          bcdboot.exe T:\Windows /s T: /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "BCDBOOT failed."
          }

          Write-Host "[+] UEFI boot configuration created."

          Write-Host "[7/7] Finalizing VHDX..."

          Dismount-VHD -Path $VhdPath
          Dismount-DiskImage -ImagePath $IsoPath

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  VDI MASTER VHDX READY"
          Write-Host "=========================================="
          Write-Host "VHDX: $VhdPath"

      - name: "Check Hyper-V and Install RDS Roles"
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "  WINDOWS SERVER ROLES"
          Write-Host "=========================================="

          Import-Module ServerManager

          Write-Host ""
          Write-Host "[1] Checking Hyper-V..."

          $HyperVFeature = Get-WindowsFeature -Name Hyper-V

          if ($HyperVFeature.Installed) {
              Write-Host "[+] Hyper-V is already installed."
          }
          else {
              Write-Host "[!] Hyper-V is not installed."
              Write-Host "[+] Installing Hyper-V..."

              $HyperVResult = Install-WindowsFeature `
                  -Name Hyper-V `
                  -IncludeManagementTools `
                  -Restart:$false

              if (!$HyperVResult.Success) {
                  throw "Hyper-V installation failed."
              }

              Write-Host "[+] Hyper-V installation completed."
          }

          Write-Host ""
          Write-Host "[2] Checking Hyper-V PowerShell module..."

          if (Get-Module -ListAvailable -Name Hyper-V) {
              Write-Host "[+] Hyper-V PowerShell module is available."
          }
          else {
              Write-Host "[!] Hyper-V PowerShell module is missing."
              Write-Host "[+] Installing Hyper-V PowerShell..."

              $HyperVPSResult = Install-WindowsFeature `
                  -Name Hyper-V-PowerShell `
                  -IncludeManagementTools `
                  -Restart:$false

              if (!$HyperVPSResult.Success) {
                  throw "Hyper-V PowerShell installation failed."
              }

              Write-Host "[+] Hyper-V PowerShell installation completed."
          }

          Import-Module Hyper-V -ErrorAction Stop

          Write-Host ""
          Write-Host "[3] Checking RDS Virtualization..."

          $RDSVirtualization = Get-WindowsFeature -Name RDS-Virtualization

          if ($RDSVirtualization.Installed) {
              Write-Host "[+] RDS Virtualization is already installed."
          }
          else {
              Write-Host "[+] Installing RDS Virtualization..."

              $RDSVirtualizationResult = Install-WindowsFeature `
                  -Name RDS-Virtualization `
                  -IncludeManagementTools `
                  -Restart:$false

              Write-Host ""
              Write-Host "RDS Virtualization installation result:"
              $RDSVirtualizationResult |
                  Format-List Success,RestartNeeded,ExitCode,FeatureResult

              if (!$RDSVirtualizationResult.Success) {
                  throw "RDS Virtualization installation failed."
              }

              Write-Host "[+] RDS Virtualization installation completed."

              $RDSVirtualizationCheck =
                  Get-WindowsFeature -Name RDS-Virtualization

              if (!$RDSVirtualizationCheck.Installed) {
                  throw "RDS Virtualization installation was reported successful, but the feature is not installed."
              }

              Write-Host "[+] RDS Virtualization verified."
          }

          Write-Host ""
          Write-Host "[4] Checking RDS Web Access..."

          $RDSWebAccess = Get-WindowsFeature -Name RDS-Web-Access

          if ($RDSWebAccess.Installed) {
              Write-Host "[+] RDS Web Access is already installed."
          }
          else {
              Write-Host "[+] Installing RDS Web Access..."

              $RDSWebAccessResult = Install-WindowsFeature `
                  -Name RDS-Web-Access `
                  -IncludeManagementTools `
                  -Restart:$false

              Write-Host ""
              Write-Host "RDS Web Access installation result:"
              $RDSWebAccessResult |
                  Format-List Success,RestartNeeded,ExitCode,FeatureResult

              if (!$RDSWebAccessResult.Success) {
                  throw "RDS Web Access installation failed."
              }

              Write-Host "[+] RDS Web Access installation completed."

              $RDSWebAccessCheck =
                  Get-WindowsFeature -Name RDS-Web-Access

              if (!$RDSWebAccessCheck.Installed) {
                  throw "RDS Web Access installation was reported successful, but the feature is not installed."
              }

              Write-Host "[+] RDS Web Access verified."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  ROLE CONFIGURATION COMPLETE"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "No custom AutoLogon configuration."
          Write-Host "No runneradmin password modification."
          Write-Host "No Winlogon registry modification."
          Write-Host ""
          Write-Host "Rebooting host and leaving runner bootstrap"
          Write-Host "to the native hosted runner environment."

          Restart-Computer -Force

      - name: "Run Win RDP Enabler (Post-Reboot Connect)"
        uses: Veniamin668/win-rdp-enabler@main
        env:
          TAIL_KEY: ${{ secrets.TAIL_KEY }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          USE_CUSTOM_USER: 'false'
          CUSTOM_USERNAME: ''
          CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}

      - name: "Create VDI Hyper-V NAT Network"
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "  CONFIGURING VDI NETWORK"
          Write-Host "=========================================="

          Import-Module Hyper-V

          $SwitchName = "VDI-NAT"
          $GatewayIP = "192.168.250.1"
          $Prefix = "192.168.250.0/24"
          $NatName = "VDI-NAT"

          $ExistingSwitch =
              Get-VMSwitch -Name $SwitchName -ErrorAction SilentlyContinue

          if (!$ExistingSwitch) {
              Write-Host "[+] Creating Hyper-V Internal Switch..."
              New-VMSwitch `
                  -Name $SwitchName `
                  -SwitchType Internal |
                  Out-Null
          }
          else {
              Write-Host "[*] VDI-NAT switch already exists."
          }

          Start-Sleep -Seconds 2

          $Adapter =
              Get-NetAdapter |
              Where-Object {
                  $_.Name -like "*$SwitchName*"
              } |
              Select-Object -First 1

          if (!$Adapter) {
              $Adapter =
                  Get-NetAdapter |
                  Where-Object {
                      $_.InterfaceDescription -like "*Hyper-V Virtual Ethernet Adapter*"
                  } |
                  Sort-Object ifIndex -Descending |
                  Select-Object -First 1
          }

          if (!$Adapter) {
              throw "Hyper-V Virtual Ethernet Adapter was not found."
          }

          Write-Host "[+] Adapter: $($Adapter.Name)"

          $ExistingIP =
              Get-NetIPAddress `
                  -InterfaceIndex $Adapter.ifIndex `
                  -AddressFamily IPv4 `
                  -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.IPAddress -eq $GatewayIP
              }

          if (!$ExistingIP) {
              Write-Host "[+] Assigning gateway $GatewayIP..."

              New-NetIPAddress `
                  -InterfaceIndex $Adapter.ifIndex `
                  -IPAddress $GatewayIP `
                  -PrefixLength 24 `
                  -ErrorAction Stop |
                  Out-Null
          }
          else {
              Write-Host "[*] Gateway already configured."
          }

          $ExistingNat =
              Get-NetNat -Name $NatName -ErrorAction SilentlyContinue

          if (!$ExistingNat) {
              Write-Host "[+] Creating NAT $Prefix..."

              New-NetNat `
                  -Name $NatName `
                  -InternalIPInterfaceAddressPrefix $Prefix |
                  Out-Null
          }
          else {
              Write-Host "[*] NAT already exists."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  VDI NETWORK READY"
          Write-Host "=========================================="
          Write-Host "Switch : $SwitchName"
          Write-Host "Gateway: $GatewayIP"
          Write-Host "Subnet : $Prefix"

      - name: "Create RDS Master Template VM"
        shell: powershell
        run: |
          Import-Module Hyper-V

          $VMName = "RDS-Master-Template"
          $WorkDir = "${{ github.workspace }}\vdi_build"
          $VhdPath = "$WorkDir\vdi_template.vhdx"
          $VMPath = "$WorkDir\VMs"

          if (!(Test-Path $VhdPath)) {
              throw "Master VHDX was not found: $VhdPath"
          }

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $VMPath |
              Out-Null

          Write-Host "=========================================="
          Write-Host "  CREATING MASTER VM"
          Write-Host "=========================================="

          $ExistingVM =
              Get-VM -Name $VMName -ErrorAction SilentlyContinue

          if ($ExistingVM) {
              Write-Host "[*] Existing Master VM found."

              if ($ExistingVM.State -ne "Off") {
                  Stop-VM `
                      -Name $VMName `
                      -TurnOff `
                      -Force
              }

              Remove-VM `
                  -Name $VMName `
                  -Force
          }

          New-VM `
              -Name $VMName `
              -Generation 2 `
              -MemoryStartupBytes 4GB `
              -VHDPath $VhdPath `
              -Path $VMPath `
              -SwitchName "VDI-NAT"

          Set-VMProcessor `
              -VMName $VMName `
              -Count 4

          Get-VMNetworkAdapter `
              -VMName $VMName |
              Set-VMNetworkAdapter `
                  -SwitchName "VDI-NAT"

          Set-VMFirmware `
              -VMName $VMName `
              -EnableSecureBoot On `
              -SecureBootTemplate "MicrosoftWindows"

          Write-Host ""
          Write-Host "[+] Master VM created."

          Get-VM -Name $VMName |
              Format-List Name,State,Generation,CPUUsage,MemoryAssigned

      - name: "Deploy Native RDS VDI Collection"
        shell: powershell
        run: |
          Import-Module RemoteDesktop

          $Broker = $env:COMPUTERNAME
          $WorkDir = "${{ github.workspace }}\vdi_build"
          $DiskPath = "$WorkDir\CollectionDisks"

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $DiskPath |
              Out-Null

          Write-Host "=========================================="
          Write-Host "  NATIVE RDS VDI COLLECTION"
          Write-Host "=========================================="

          Write-Host "Connection Broker: $Broker"

          Write-Host ""
          Write-Host "Existing RDS deployment:"

          Get-RDServer `
              -ConnectionBroker $Broker `
              -ErrorAction SilentlyContinue |
              Format-Table Server,Roles

          Write-Host ""
          Write-Host "Creating VDI collection..."

          $ExistingCollection =
              Get-RDVirtualDesktopCollection `
                  -ConnectionBroker $Broker `
                  -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.CollectionName -eq "VDI-Cloud-Pool"
              }

          if (!$ExistingCollection) {

              New-RDVirtualDesktopCollection `
                  -ConnectionBroker $Broker `
                  -CollectionName "VDI-Cloud-Pool" `
                  -CollectionDescription "Native Windows VDI Cloud Pool" `
                  -PooledManaged `
                  -VirtualDesktopTemplateName "RDS-Master-Template" `
                  -VirtualDesktopTemplateHostServer $Broker `
                  -VirtualDesktopAllocation @{ $Broker = 1 } `
                  -StorageType LocalStorage `
                  -VirtualDesktopNamePrefix "VDI-NTV-" `
                  -VirtualDesktopPasswordAge 31 `
                  -Path $DiskPath `
                  -Confirm:$false

          }
          else {
              Write-Host "[*] VDI-Cloud-Pool already exists."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  VDI COLLECTION CREATED"
          Write-Host "=========================================="

          Get-RDVirtualDesktopCollection `
              -ConnectionBroker $Broker |
              Format-Table CollectionName,CollectionDescription

      - name: "Show RDS Web Access Information"
        shell: powershell
        run: |
          $Computer = $env:COMPUTERNAME

          Write-Host "=========================================="
          Write-Host "  RDS WEB ACCESS"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "RDS Web Access:"
          Write-Host "https://$Computer/RDWeb"

          Write-Host ""
          Write-Host "Connection is available through"
          Write-Host "Tailscale configured by win-rdp-enabler."

          Write-Host ""
          Write-Host "Tailscale is managed by win-rdp-enabler."

      - name: "Start VDI Engine and Keep Alive"
        shell: powershell
        run: |
          Import-Module Hyper-V
          Import-Module RemoteDesktop

          $Broker = $env:COMPUTERNAME
          $VMName = "RDS-Master-Template"

          Write-Host "=========================================="
          Write-Host "  NATIVE VDI ENGINE ACTIVE"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Host:"
          Write-Host $Broker

          Write-Host ""
          Write-Host "Master VM:"
          Write-Host $VMName

          Write-Host ""
          Write-Host "RDS Web Access:"
          Write-Host "https://$Broker/RDWeb"

          while ($true) {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "  VDI STATUS - $(Get-Date)"
              Write-Host "=========================================="

              Write-Host ""
              Write-Host "Hyper-V VMs:"

              Get-VM |
                  Format-Table Name,State,CPUUsage,MemoryAssigned,Uptime

              Write-Host ""
              Write-Host "RDS Collections:"

              Get-RDVirtualDesktopCollection `
                  -ConnectionBroker $Broker `
                  -ErrorAction SilentlyContinue |
                  Format-Table CollectionName,CollectionDescription

              Write-Host ""
              Write-Host "RDS Servers:"

              Get-RDServer `
                  -ConnectionBroker $Broker `
                  -ErrorAction SilentlyContinue |
                  Format-Table Server,Roles

              Write-Host ""
              Write-Host "VDI NAT:"

              Get-NetNat `
                  -Name "VDI-NAT" `
                  -ErrorAction SilentlyContinue |
                  Format-Table Name,InternalIPInterfaceAddressPrefix,Active

              Write-Host ""
              Write-Host "Time: $(Get-Date)"

              Start-Sleep -Seconds 60
          }
