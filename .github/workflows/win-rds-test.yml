name: Deploy Windows Native VDI

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Direct URL to Windows client ISO"
        required: true
        type: string

      server_iso_url:
        description: "Direct URL to Windows Server ISO"
        required: true
        type: string

      wim_index:
        description: "Windows client WIM/ESD index"
        required: true
        default: "1"
        type: string

      server_wim_index:
        description: "Windows Server WIM/ESD index"
        required: true
        default: "4"
        type: string

      ad_domain:
        description: "Active Directory domain"
        required: true
        default: "vdi.test"
        type: string

      ad_netbios:
        description: "Active Directory NetBIOS name"
        required: true
        default: "VDI"
        type: string


jobs:

  deploy-vdi:

    runs-on: windows-latest
    timeout-minutes: 360

    env:

      WORK_DIR: ${{ github.workspace }}

      # ============================================================
      # L0 -> SERVER-DC01 network
      # ============================================================

      SERVER_SWITCH: SERVER-NAT
      SERVER_GATEWAY: 192.168.251.1
      SERVER_PREFIX: 192.168.251.0/24
      SERVER_IP: 192.168.251.10

      SERVER_VM: SERVER-DC01

      # ============================================================
      # L1 -> nested VDI network inside SERVER-DC01
      # ============================================================

      NESTED_SWITCH: RDS-NAT
      NESTED_GATEWAY: 192.168.252.1
      NESTED_PREFIX: 192.168.252.0/24
      VDI_TEST_IP: 192.168.252.10

      AD_DOMAIN: ${{ inputs.ad_domain }}
      AD_NETBIOS: ${{ inputs.ad_netbios }}


    steps:

      # ============================================================
      # 01. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 02. PREPARE WORKSPACE
      # ============================================================

      - name: Prepare workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== WORKSPACE =========="

          $WorkDir = $env:GITHUB_WORKSPACE

          Write-Host "[*] Workspace: $WorkDir"

          New-Item `
            -ItemType Directory `
            -Path $WorkDir `
            -Force |
            Out-Null

          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, Root, Used, Free |
            Format-Table -AutoSize


      # ============================================================
      # 03. CHECK AUTOUNATTEND
      # ============================================================

      - name: Check Autounattend.xml
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CHECK AUTOUNATTEND.XML =========="

          $path = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Autounattend.xml"

          if (-not (Test-Path $path)) {
              throw "Autounattend.xml was not found in repository root."
          }

          Write-Host "[+] Found: $path"

          $xml = Get-Content `
            -Raw `
            -Path $path

          if (-not $xml.Contains("CHANGE_ME_ADMIN_PASSWORD")) {
              throw "Autounattend.xml does not contain CHANGE_ME_ADMIN_PASSWORD placeholder."
          }

          try {
              $null = [xml]$xml
              Write-Host "[+] XML syntax is valid."
          }
          catch {
              throw "Autounattend.xml is not valid XML: $($_.Exception.Message)"
          }


      # ============================================================
      # 04. DOWNLOAD WINDOWS CLIENT ISO
      # ============================================================

      - name: Download Windows client ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== DOWNLOAD WINDOWS ISO =========="

          $iso = Join-Path `
            $env:GITHUB_WORKSPACE `
            "windows.iso"

          if (Test-Path $iso) {
              Remove-Item $iso -Force
          }

          curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 5 `
            --retry-all-errors `
            -C - `
            -o "$iso" `
            "${{ inputs.iso_url }}"

          if (-not (Test-Path $iso)) {
              throw "Windows ISO was not downloaded."
          }

          Write-Host "[+] ISO: $iso"
          Write-Host "[+] Size: $((Get-Item $iso).Length) bytes"


      # ============================================================
      # 05. MOUNT WINDOWS CLIENT ISO
      # ============================================================

      - name: Mount Windows client ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== MOUNT WINDOWS ISO =========="

          $iso = Join-Path `
            $env:GITHUB_WORKSPACE `
            "windows.iso"

          $diskImage = Mount-DiskImage `
            -ImagePath $iso `
            -PassThru

          $volume = $diskImage |
            Get-Volume |
            Where-Object DriveLetter |
            Select-Object -First 1

          if (-not $volume) {
              throw "Could not determine Windows ISO drive."
          }

          $drive = "$($volume.DriveLetter):"

          Write-Host "[+] ISO mounted at $drive"

          "WINDOWS_ISO_DRIVE=$drive" >> $env:GITHUB_ENV


      # ============================================================
      # 06. FIND WINDOWS IMAGE
      # ============================================================

      - name: Find Windows image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== FIND WINDOWS IMAGE =========="

          $sources = Join-Path `
            $env:WINDOWS_ISO_DRIVE `
            "sources"

          $wim = Join-Path $sources "install.wim"
          $esd = Join-Path $sources "install.esd"

          if (Test-Path $wim) {
              $image = $wim
          }
          elseif (Test-Path $esd) {
              $image = $esd
          }
          else {
              throw "install.wim/install.esd not found."
          }

          Write-Host "[+] Image: $image"

          & dism.exe `
            /Get-WimInfo `
            "/WimFile:$image"

          "WINDOWS_IMAGE_FILE=$image" >> $env:GITHUB_ENV
          "WINDOWS_WIM_INDEX=${{ inputs.wim_index }}" >> $env:GITHUB_ENV


      # ============================================================
      # 07. CREATE CLIENT VHDX
      # ============================================================

      - name: Create Windows VDI master VHDX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE WINDOWS VDI MASTER =========="

          $vhdx = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Windows-VDI-Master.vhdx"

          if (Test-Path $vhdx) {
              Remove-Item $vhdx -Force
          }

          New-VHD `
            -Path $vhdx `
            -SizeBytes 60GB `
            -Dynamic |
            Out-Null

          $disk = Mount-VHD `
            -Path $vhdx `
            -Passthru

          $diskNumber = $disk.DiskNumber

          Initialize-Disk `
            -Number $diskNumber `
            -PartitionStyle GPT

          $efi = New-Partition `
            -DiskNumber $diskNumber `
            -Size 100MB `
            -GptType "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"

          Format-Volume `
            -Partition $efi `
            -FileSystem FAT32 `
            -NewFileSystemLabel "SYSTEM" `
            -Confirm:$false |
            Out-Null

          $osPartition = New-Partition `
            -DiskNumber $diskNumber `
            -UseMaximumSize `
            -AssignDriveLetter

          Format-Volume `
            -Partition $osPartition `
            -FileSystem NTFS `
            -NewFileSystemLabel "Windows" `
            -Confirm:$false |
            Out-Null

          $osDrive = "$($osPartition.DriveLetter):"

          Write-Host "[+] VHDX: $vhdx"
          Write-Host "[+] Disk: $diskNumber"
          Write-Host "[+] OS: $osDrive"

          "MASTER_VHDX=$vhdx" >> $env:GITHUB_ENV
          "MASTER_DISK=$diskNumber" >> $env:GITHUB_ENV
          "MASTER_OS=$osDrive" >> $env:GITHUB_ENV


      # ============================================================
      # 08. APPLY WINDOWS IMAGE
      # ============================================================

      - name: Apply Windows image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== APPLY WINDOWS IMAGE =========="

          & dism.exe `
            /Apply-Image `
            "/ImageFile:$env:WINDOWS_IMAGE_FILE" `
            "/Index:$env:WINDOWS_WIM_INDEX" `
            "/ApplyDir:$env:MASTER_OS" `
            /CheckIntegrity

          if ($LASTEXITCODE -ne 0) {
              throw "DISM image apply failed with exit code $LASTEXITCODE"
          }


      # ============================================================
      # 09. CONFIGURE CLIENT BOOT
      # ============================================================

      - name: Configure VDI boot files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CONFIGURE VDI BOOT =========="

          $diskNumber = [int]$env:MASTER_DISK

          $efiPartition = Get-Partition `
            -DiskNumber $diskNumber |
            Where-Object {
                $_.GptType -eq "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"
            } |
            Select-Object -First 1

          if (-not $efiPartition) {
              throw "EFI partition not found."
          }

          @(
              "select disk $diskNumber"
              "select partition $($efiPartition.PartitionNumber)"
              "assign letter=S"
              "exit"
          ) |
            diskpart.exe

          bcdboot `
            "$env:MASTER_OS\Windows" `
            /s S: `
            /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "BCDBOOT failed with exit code $LASTEXITCODE"
          }


      # ============================================================
      # 10. CLEAN CLIENT IMAGE
      # ============================================================

      - name: Cleanup VDI image
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "========== CLEAN VDI IMAGE =========="

          dism.exe `
            /Image:"$env:MASTER_OS" `
            /Cleanup-Image `
            /StartComponentCleanup


      # ============================================================
      # 11. DISMOUNT CLIENT VHDX
      # ============================================================

      - name: Dismount VDI master
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Dismount-VHD `
            -Path $env:MASTER_VHDX


      # ============================================================
      # 12. DOWNLOAD WINDOWS SERVER ISO
      # ============================================================

      - name: Download Windows Server ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== DOWNLOAD WINDOWS SERVER ISO =========="

          $iso = Join-Path `
            $env:GITHUB_WORKSPACE `
            "windows-server.iso"

          if (Test-Path $iso) {
              Remove-Item $iso -Force
          }

          curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 5 `
            --retry-all-errors `
            -C - `
            -o "$iso" `
            "${{ inputs.server_iso_url }}"

          if (-not (Test-Path $iso)) {
              throw "Windows Server ISO was not downloaded."
          }

          Write-Host "[+] Server ISO: $iso"
          Write-Host "[+] Size: $((Get-Item $iso).Length) bytes"


      # ============================================================
      # 13. MOUNT SERVER ISO
      # ============================================================

      - name: Mount Windows Server ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== MOUNT SERVER ISO =========="

          $iso = Join-Path `
            $env:GITHUB_WORKSPACE `
            "windows-server.iso"

          $diskImage = Mount-DiskImage `
            -ImagePath $iso `
            -PassThru

          $volume = $diskImage |
            Get-Volume |
            Where-Object DriveLetter |
            Select-Object -First 1

          if (-not $volume) {
              throw "Could not determine Windows Server ISO drive."
          }

          $drive = "$($volume.DriveLetter):"

          Write-Host "[+] Server ISO mounted at $drive"

          "SERVER_ISO_DRIVE=$drive" >> $env:GITHUB_ENV


      # ============================================================
      # 14. FIND SERVER IMAGE
      # ============================================================

      - name: Find Windows Server image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== FIND SERVER IMAGE =========="

          $sources = Join-Path `
            $env:SERVER_ISO_DRIVE `
            "sources"

          $wim = Join-Path $sources "install.wim"
          $esd = Join-Path $sources "install.esd"

          if (Test-Path $wim) {
              $image = $wim
          }
          elseif (Test-Path $esd) {
              $image = $esd
          }
          else {
              throw "Server install.wim/install.esd not found."
          }

          Write-Host "[+] Server image: $image"

          & dism.exe `
            /Get-WimInfo `
            "/WimFile:$image"

          "SERVER_IMAGE_FILE=$image" >> $env:GITHUB_ENV
          "SERVER_WIM_INDEX=${{ inputs.server_wim_index }}" >> $env:GITHUB_ENV


      # ============================================================
      # 15. CREATE SERVER VHDX
      # ============================================================

      - name: Create SERVER-DC01 VHDX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE SERVER-DC01 VHDX =========="

          $vhdx = Join-Path `
            $env:GITHUB_WORKSPACE `
            "SERVER-DC01.vhdx"

          if (Test-Path $vhdx) {
              Remove-Item $vhdx -Force
          }

          New-VHD `
            -Path $vhdx `
            -SizeBytes 60GB `
            -Dynamic |
            Out-Null

          $disk = Mount-VHD `
            -Path $vhdx `
            -Passthru

          $diskNumber = $disk.DiskNumber

          Initialize-Disk `
            -Number $diskNumber `
            -PartitionStyle GPT

          $efi = New-Partition `
            -DiskNumber $diskNumber `
            -Size 100MB `
            -GptType "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"

          Format-Volume `
            -Partition $efi `
            -FileSystem FAT32 `
            -NewFileSystemLabel "SYSTEM" `
            -Confirm:$false |
            Out-Null

          $osPartition = New-Partition `
            -DiskNumber $diskNumber `
            -UseMaximumSize `
            -AssignDriveLetter

          Format-Volume `
            -Partition $osPartition `
            -FileSystem NTFS `
            -NewFileSystemLabel "Windows" `
            -Confirm:$false |
            Out-Null

          $osDrive = "$($osPartition.DriveLetter):"

          Write-Host "[+] VHDX: $vhdx"
          Write-Host "[+] Disk: $diskNumber"
          Write-Host "[+] OS: $osDrive"

          "SERVER_VHDX=$vhdx" >> $env:GITHUB_ENV
          "SERVER_DISK=$diskNumber" >> $env:GITHUB_ENV
          "SERVER_OS=$osDrive" >> $env:GITHUB_ENV


      # ============================================================
      # 16. APPLY SERVER IMAGE
      # ============================================================

      - name: Apply Windows Server image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== APPLY WINDOWS SERVER IMAGE =========="

          & dism.exe `
            /Apply-Image `
            "/ImageFile:$env:SERVER_IMAGE_FILE" `
            "/Index:$env:SERVER_WIM_INDEX" `
            "/ApplyDir:$env:SERVER_OS" `
            /CheckIntegrity

          if ($LASTEXITCODE -ne 0) {
              throw "Server DISM image apply failed with exit code $LASTEXITCODE"
          }


      # ============================================================
      # 17. INSTALL SERVER AUTOUNATTEND
      # ============================================================

      - name: Install Server Autounattend.xml
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== INSTALL SERVER UNATTEND =========="

          $source = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Autounattend.xml"

          if (-not (Test-Path $source)) {
              throw "Repository Autounattend.xml not found."
          }

          if ([string]::IsNullOrWhiteSpace($env:ADMIN_PASS)) {
              throw "ADMIN_PASS secret is empty or unavailable."
          }

          $targetDir = Join-Path `
            $env:SERVER_OS `
            "Windows\Panther"

          $target = Join-Path `
            $targetDir `
            "Unattend.xml"

          New-Item `
            -ItemType Directory `
            -Path $targetDir `
            -Force |
            Out-Null

          $content = Get-Content `
            -Raw `
            -Path $source

          if (-not $content.Contains("CHANGE_ME_ADMIN_PASSWORD")) {
              throw "Password placeholder is missing from Autounattend.xml."
          }

          $content = $content.Replace(
              "CHANGE_ME_ADMIN_PASSWORD",
              $env:ADMIN_PASS
          )

          Set-Content `
            -Path $target `
            -Value $content `
            -Encoding UTF8

          Write-Host "[+] Server Unattend.xml installed."


      # ============================================================
      # 18. SERVER BOOT
      # ============================================================

      - name: Configure Server boot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CONFIGURE SERVER BOOT =========="

          $diskNumber = [int]$env:SERVER_DISK

          $efiPartition = Get-Partition `
            -DiskNumber $diskNumber |
            Where-Object {
                $_.GptType -eq "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"
            } |
            Select-Object -First 1

          if (-not $efiPartition) {
              throw "Server EFI partition not found."
          }

          @(
              "select disk $diskNumber"
              "select partition $($efiPartition.PartitionNumber)"
              "assign letter=T"
              "exit"
          ) |
            diskpart.exe

          bcdboot `
            "$env:SERVER_OS\Windows" `
            /s T: `
            /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "Server BCDBOOT failed with exit code $LASTEXITCODE"
          }


      # ============================================================
      # 19. DISMOUNT SERVER VHDX
      # ============================================================

      - name: Dismount Server VHDX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Dismount-VHD `
            -Path $env:SERVER_VHDX


      # ============================================================
      # 20. CREATE SERVER-NAT ON L0
      # ============================================================

      - name: Create SERVER-NAT network
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE SERVER-NAT =========="

          $switch = Get-VMSwitch `
            -Name $env:SERVER_SWITCH `
            -ErrorAction SilentlyContinue

          if (-not $switch) {

              New-VMSwitch `
                -Name $env:SERVER_SWITCH `
                -SwitchType Internal |
                Out-Null
          }

          $adapter = Get-NetAdapter |
            Where-Object {
                $_.Name -like "*$env:SERVER_SWITCH*"
            } |
            Select-Object -First 1

          if (-not $adapter) {
              throw "SERVER-NAT adapter not found."
          }

          $existing = Get-NetIPAddress `
            -InterfaceIndex $adapter.ifIndex `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue |
            Where-Object {
                $_.IPAddress -eq $env:SERVER_GATEWAY
            }

          if (-not $existing) {

              New-NetIPAddress `
                -InterfaceIndex $adapter.ifIndex `
                -IPAddress $env:SERVER_GATEWAY `
                -PrefixLength 24 |
                Out-Null
          }

          $nat = Get-NetNat `
            -Name "SERVER-NAT" `
            -ErrorAction SilentlyContinue

          if (-not $nat) {

              New-NetNat `
                -Name "SERVER-NAT" `
                -InternalIPInterfaceAddressPrefix $env:SERVER_PREFIX |
                Out-Null
          }

          Write-Host "[+] SERVER-NAT ready."


      # ============================================================
      # 21. CREATE SERVER-DC01
      # ============================================================

      - name: Create SERVER-DC01 VM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE SERVER-DC01 =========="

          $vm = Get-VM `
            -Name $env:SERVER_VM `
            -ErrorAction SilentlyContinue

          if (-not $vm) {

              New-VM `
                -Name $env:SERVER_VM `
                -Generation 2 `
                -MemoryStartupBytes 4GB `
                -VHDPath $env:SERVER_VHDX `
                -SwitchName $env:SERVER_SWITCH |
                Out-Null
          }

          Set-VM `
            -Name $env:SERVER_VM `
            -AutomaticStopAction TurnOff `
            -AutomaticStartAction Nothing

          # ========================================================
          # NESTED VIRTUALIZATION MUST BE ENABLED BEFORE FIRST BOOT
          # ========================================================

          Set-VMProcessor `
            -VMName $env:SERVER_VM `
            -ExposeVirtualizationExtensions $true

          Set-VMNetworkAdapter `
            -VMName $env:SERVER_VM `
            -MacAddressSpoofing On

          # ========================================================
          # SECURE BOOT
          # ========================================================

          Set-VMFirmware `
            -VMName $env:SERVER_VM `
            -EnableSecureBoot On

          # ========================================================
          # vTPM
          # ========================================================

          Set-VMKeyProtector `
            -VMName $env:SERVER_VM `
            -NewLocalKeyProtector

          Enable-VMTPM `
            -VMName $env:SERVER_VM

          # ========================================================
          # GUEST SERVICE INTERFACE
          # Needed later to copy VHDX into SERVER-DC01
          # ========================================================

          Enable-VMIntegrationService `
            -VMName $env:SERVER_VM `
            -Name "Guest Service Interface"

          Write-Host "[+] SERVER-DC01 created."
          Write-Host "[+] Nested virtualization: ON"
          Write-Host "[+] MAC spoofing: ON"
          Write-Host "[+] Secure Boot: ON"
          Write-Host "[+] vTPM: ON"
          Write-Host "[+] Guest Service Interface: ON"


      # ============================================================
      # 22. VERIFY SERVER VM BEFORE FIRST BOOT
      # ============================================================

      - name: Verify SERVER-DC01 firmware and virtualization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== VERIFY SERVER VM =========="

          $processor = Get-VMProcessor `
            -VMName $env:SERVER_VM

          $firmware = Get-VMFirmware `
            -VMName $env:SERVER_VM

          $tpm = Get-VMSecurity `
            -VMName $env:SERVER_VM

          Write-Host "Nested virtualization: $($processor.ExposeVirtualizationExtensions)"
          Write-Host "Secure Boot: $($firmware.EnableSecureBoot)"
          Write-Host "Key protector configured: $($tpm.KeyProtector -ne $null)"

          if (-not $processor.ExposeVirtualizationExtensions) {
              throw "Nested virtualization is NOT enabled before first boot."
          }

          if ($firmware.EnableSecureBoot -ne "On") {
              throw "Secure Boot is not enabled."
          }


      # ============================================================
      # 23. START SERVER-DC01
      # ============================================================

      - name: Start SERVER-DC01
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== START SERVER-DC01 =========="

          Start-VM `
            -Name $env:SERVER_VM

          Get-VM `
            -Name $env:SERVER_VM |
            Select-Object `
              Name,
              State,
              Generation,
              MemoryStartup |
            Format-List

          Get-VMProcessor `
            -VMName $env:SERVER_VM |
            Select-Object `
              Count,
              ExposeVirtualizationExtensions |
            Format-List


      # ============================================================
      # 24. WAIT FOR POWERSHELL DIRECT
      # ============================================================

      - name: Wait for PowerShell Direct
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== WAIT FOR POWERSHELL DIRECT =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          $connected = $false

          for ($i = 1; $i -le 60; $i++) {

              Write-Host "[*] PowerShell Direct attempt $i/60..."

              try {

                  $result = Invoke-Command `
                    -VMName $env:SERVER_VM `
                    -Credential $cred `
                    -ScriptBlock {
                        hostname
                        whoami
                    } `
                    -ErrorAction Stop

                  Write-Host "[+] Guest responded:"

                  $result |
                    ForEach-Object {
                        Write-Host "    $_"
                    }

                  $connected = $true
                  break
              }
              catch {

                  Write-Host "[*] Guest not ready."

                  Start-Sleep -Seconds 10
              }
          }

          if (-not $connected) {
              throw "PowerShell Direct could not connect to SERVER-DC01."
          }


      # ============================================================
      # 25. CONFIGURE SERVER NETWORK
      # ============================================================

      - name: Configure SERVER-DC01 network
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CONFIGURE SERVER NETWORK =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ArgumentList `
              $env:SERVER_IP,
              $env:SERVER_GATEWAY `
            -ScriptBlock {

                param(
                    $StaticIP,
                    $Gateway
                )

                $adapter = Get-NetAdapter |
                    Where-Object Status -eq "Up" |
                    Select-Object -First 1

                if (-not $adapter) {
                    throw "No active network adapter found."
                }

                Write-Host "Adapter: $($adapter.Name)"

                Get-NetIPAddress `
                    -InterfaceIndex $adapter.ifIndex `
                    -AddressFamily IPv4 `
                    -ErrorAction SilentlyContinue |
                    Where-Object {
                        $_.IPAddress -notlike "169.254.*" -and
                        $_.IPAddress -ne "127.0.0.1"
                    } |
                    Remove-NetIPAddress `
                        -Confirm:$false `
                        -ErrorAction SilentlyContinue

                New-NetIPAddress `
                    -InterfaceIndex $adapter.ifIndex `
                    -IPAddress $StaticIP `
                    -PrefixLength 24 `
                    -DefaultGateway $Gateway

                Set-DnsClientServerAddress `
                    -InterfaceIndex $adapter.ifIndex `
                    -ServerAddresses @($Gateway)

                Get-NetIPAddress `
                    -InterfaceIndex $adapter.ifIndex `
                    -AddressFamily IPv4
            }


      # ============================================================
      # 26. INSTALL HYPER-V INSIDE SERVER-DC01
      # ============================================================

      - name: Install nested Hyper-V inside SERVER-DC01
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== INSTALL NESTED HYPER-V =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ScriptBlock {

                Install-WindowsFeature `
                    -Name Hyper-V `
                    -IncludeManagementTools `
                    -Restart:$false

                Get-WindowsFeature Hyper-V |
                    Select-Object Name, InstallState
            }


      # ============================================================
      # 27. REBOOT SERVER-DC01 AFTER HYPER-V INSTALL
      # ============================================================

      - name: Reboot SERVER-DC01 for nested Hyper-V
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== REBOOT SERVER-DC01 =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ScriptBlock {
                Restart-Computer -Force
            } `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 20


      # ============================================================
      # 28. WAIT AFTER HYPER-V REBOOT
      # ============================================================

      - name: Wait for SERVER-DC01 after Hyper-V reboot
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== WAIT AFTER HYPER-V REBOOT =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          $connected = $false

          for ($i = 1; $i -le 60; $i++) {

              try {

                  Invoke-Command `
                    -VMName $env:SERVER_VM `
                    -Credential $cred `
                    -ScriptBlock {
                        hostname
                        Get-WindowsFeature Hyper-V |
                            Select-Object Name, InstallState
                    } `
                    -ErrorAction Stop

                  Write-Host "[+] SERVER-DC01 is back."

                  $connected = $true
                  break
              }
              catch {

                  Write-Host "[*] Waiting..."

                  Start-Sleep -Seconds 10
              }
          }

          if (-not $connected) {
              throw "SERVER-DC01 did not return after Hyper-V installation."
          }


      # ============================================================
      # 29. INSTALL AD DS + DNS
      # ============================================================

      - name: Install AD DS and DNS inside SERVER-DC01
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== INSTALL AD DS + DNS =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ScriptBlock {

                Install-WindowsFeature `
                    AD-Domain-Services,
                    DNS `
                    -IncludeManagementTools

                Get-WindowsFeature `
                    AD-Domain-Services,
                    DNS |
                    Select-Object Name, InstallState
            }


      # ============================================================
      # 30. PROMOTE SERVER-DC01
      # ============================================================

      - name: Promote SERVER-DC01 to domain controller
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== PROMOTE SERVER-DC01 =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ArgumentList `
              $env:AD_DOMAIN,
              $env:AD_NETBIOS,
              $env:ADMIN_PASS `
            -ScriptBlock {

                param(
                    $Domain,
                    $Netbios,
                    $AdminPassword
                )

                $safeModePassword = ConvertTo-SecureString `
                    $AdminPassword `
                    -AsPlainText `
                    -Force

                Install-ADDSForest `
                    -DomainName $Domain `
                    -DomainNetbiosName $Netbios `
                    -SafeModeAdministratorPassword $safeModePassword `
                    -InstallDns `
                    -CreateDnsDelegation:$false `
                    -DatabasePath "C:\Windows\NTDS" `
                    -LogPath "C:\Windows\NTDS" `
                    -SysvolPath "C:\Windows\SYSVOL" `
                    -NoRebootOnCompletion:$false `
                    -Force
            }


      # ============================================================
      # 31. WAIT FOR DC REBOOT
      # ============================================================

      - name: Wait for domain controller reboot
        shell: pwsh
        run: |
          Write-Host "========== WAIT FOR DC REBOOT =========="

          Start-Sleep -Seconds 30

          for ($i = 1; $i -le 30; $i++) {

              $vm = Get-VM `
                -Name $env:SERVER_VM `
                -ErrorAction SilentlyContinue

              if ($vm) {
                  Write-Host "[*] VM state: $($vm.State)"
              }

              Start-Sleep -Seconds 5
          }


      # ============================================================
      # 32. RECONNECT AFTER AD DS
      # ============================================================

      - name: Reconnect to SERVER-DC01
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== RECONNECT TO SERVER-DC01 =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          $connected = $false

          for ($i = 1; $i -le 60; $i++) {

              try {

                  $result = Invoke-Command `
                    -VMName $env:SERVER_VM `
                    -Credential $cred `
                    -ScriptBlock {
                        hostname
                        whoami

                        Get-Service `
                            NTDS,
                            DNS |
                            Select-Object Name, Status
                    } `
                    -ErrorAction Stop

                  $result |
                    ForEach-Object {
                        Write-Host "    $_"
                    }

                  $connected = $true
                  break
              }
              catch {

                  Write-Host "[*] DC not ready."

                  Start-Sleep -Seconds 10
              }
          }

          if (-not $connected) {
              throw "Could not reconnect to SERVER-DC01."
          }


      # ============================================================
      # 33. VERIFY AD DS / DNS
      # ============================================================

      - name: Verify AD DS and DNS
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== VERIFY AD DS / DNS =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ScriptBlock {

                Write-Host "========== HOSTNAME =========="
                hostname

                Write-Host "========== DOMAIN =========="

                Get-CimInstance `
                    Win32_ComputerSystem |
                    Select-Object `
                        Name,
                        Domain,
                        PartOfDomain

                Write-Host "========== AD DOMAIN =========="

                Import-Module ActiveDirectory

                Get-ADDomain |
                    Select-Object `
                        DNSRoot,
                        NetBIOSName,
                        DomainMode,
                        Forest

                Write-Host "========== DNS =========="

                Get-Service DNS |
                    Select-Object Name, Status, StartType

                Write-Host "========== NTDS =========="

                Get-Service NTDS |
                    Select-Object Name, Status, StartType

                Write-Host "========== HYPER-V =========="

                Get-WindowsFeature Hyper-V |
                    Select-Object Name, InstallState
            }


      # ============================================================
      # 34. INSTALL RDS ROLES INSIDE SERVER-DC01
      # ============================================================

      - name: Install RDS roles inside SERVER-DC01
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== INSTALL RDS INSIDE SERVER-DC01 =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ScriptBlock {

                $features = @(
                    "RDS-Connection-Broker",
                    "RDS-Web-Access",
                    "RDS-Virtualization"
                )

                Install-WindowsFeature `
                    -Name $features `
                    -IncludeManagementTools `
                    -Restart:$false

                Get-WindowsFeature |
                    Where-Object {
                        $_.Name -in $features
                    } |
                    Select-Object Name, InstallState
            }


      # ============================================================
      # 35. ENABLE NESTED RDS NETWORK INSIDE SERVER-DC01
      # ============================================================

      - name: Create nested RDS NAT network
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE NESTED RDS-NAT =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ArgumentList `
              $env:NESTED_SWITCH,
              $env:NESTED_GATEWAY,
              $env:NESTED_PREFIX `
            -ScriptBlock {

                param(
                    $SwitchName,
                    $Gateway,
                    $Prefix
                )

                $switch = Get-VMSwitch `
                    -Name $SwitchName `
                    -ErrorAction SilentlyContinue

                if (-not $switch) {

                    New-VMSwitch `
                        -Name $SwitchName `
                        -SwitchType Internal |
                        Out-Null
                }

                $adapter = Get-NetAdapter |
                    Where-Object {
                        $_.Name -like "*$SwitchName*"
                    } |
                    Select-Object -First 1

                if (-not $adapter) {
                    throw "Nested RDS-NAT adapter not found."
                }

                $existing = Get-NetIPAddress `
                    -InterfaceIndex $adapter.ifIndex `
                    -AddressFamily IPv4 `
                    -ErrorAction SilentlyContinue |
                    Where-Object {
                        $_.IPAddress -eq $Gateway
                    }

                if (-not $existing) {

                    New-NetIPAddress `
                        -InterfaceIndex $adapter.ifIndex `
                        -IPAddress $Gateway `
                        -PrefixLength 24 |
                        Out-Null
                }

                $nat = Get-NetNat `
                    -Name "RDS-NAT" `
                    -ErrorAction SilentlyContinue

                if (-not $nat) {

                    New-NetNat `
                        -Name "RDS-NAT" `
                        -InternalIPInterfaceAddressPrefix $Prefix |
                        Out-Null
                }

                Write-Host "[+] Nested switch: $SwitchName"
                Write-Host "[+] Gateway: $Gateway"

                Get-VMSwitch |
                    Select-Object Name, SwitchType

                Get-NetNat |
                    Select-Object Name, InternalIPInterfaceAddressPrefix
            }


      # ============================================================
      # 36. COPY CLIENT VHDX INTO SERVER-DC01
      # ============================================================

      - name: Copy client VHDX into SERVER-DC01
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== COPY CLIENT VHDX INTO SERVER-DC01 =========="

          $destination = "C:\VDI\Windows-VDI-Master.vhdx"

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential (
                New-Object `
                    System.Management.Automation.PSCredential(
                        ".\Administrator",
                        (
                            ConvertTo-SecureString `
                                "${{ secrets.ADMIN_PASS }}" `
                                -AsPlainText `
                                -Force
                        )
                    )
            ) `
            -ScriptBlock {

                New-Item `
                    -ItemType Directory `
                    -Path "C:\VDI" `
                    -Force |
                    Out-Null
            }

          Copy-VMFile `
            -Name $env:SERVER_VM `
            -SourcePath $env:MASTER_VHDX `
            -DestinationPath $destination `
            -FileSource Host `
            -CreateFullPath

          Write-Host "[+] Client VHDX copied into SERVER-DC01."

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential (
                New-Object `
                    System.Management.Automation.PSCredential(
                        ".\Administrator",
                        (
                            ConvertTo-SecureString `
                                "${{ secrets.ADMIN_PASS }}" `
                                -AsPlainText `
                                -Force
                        )
                    )
            ) `
            -ScriptBlock {

                Get-Item `
                    "C:\VDI\Windows-VDI-Master.vhdx" |
                    Select-Object Name, Length, FullName
            }


      # ============================================================
      # 37. CREATE RDS MASTER TEMPLATE INSIDE SERVER-DC01
      # ============================================================

      - name: Create nested RDS master template
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE NESTED RDS MASTER =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ArgumentList `
              "C:\VDI\Windows-VDI-Master.vhdx",
              $env:NESTED_SWITCH `
            -ScriptBlock {

                param(
                    $MasterVHDX,
                    $SwitchName
                )

                $vmName = "RDS-Master-Template"

                $existing = Get-VM `
                    -Name $vmName `
                    -ErrorAction SilentlyContinue

                if (-not $existing) {

                    New-VM `
                        -Name $vmName `
                        -Generation 2 `
                        -MemoryStartupBytes 4GB `
                        -VHDPath $MasterVHDX `
                        -SwitchName $SwitchName |
                        Out-Null
                }

                Set-VM `
                    -Name $vmName `
                    -AutomaticStopAction TurnOff `
                    -AutomaticStartAction Nothing

                Stop-VM `
                    -Name $vmName `
                    -TurnOff `
                    -Force `
                    -ErrorAction SilentlyContinue

                Write-Host "[+] Nested RDS master created."

                Get-VM `
                    -Name $vmName |
                    Select-Object `
                        Name,
                        State,
                        Generation,
                        MemoryStartup
            }


      # ============================================================
      # 38. CREATE NESTED DIFFERENCING DISK
      # ============================================================

      - name: Create nested RDS differencing disk
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE NESTED DIFFERENCING DISK =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ArgumentList `
              "C:\VDI\Windows-VDI-Master.vhdx" `
            -ScriptBlock {

                param($ParentVHDX)

                $diff = "C:\VDI\RDS-Test-01.vhdx"

                if (Test-Path $diff) {
                    Remove-Item $diff -Force
                }

                New-VHD `
                    -Path $diff `
                    -ParentPath $ParentVHDX `
                    -Differencing |
                    Out-Null

                Write-Host "[+] Nested differencing disk: $diff"

                Get-VHD `
                    -Path $diff |
                    Select-Object `
                        Path,
                        ParentPath,
                        VhdType,
                        FileSize
            }


      # ============================================================
      # 39. CREATE RDS-TEST-01 INSIDE SERVER-DC01
      # ============================================================

      - name: Create nested RDS-Test-01
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE NESTED RDS-TEST-01 =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ArgumentList `
              "C:\VDI\RDS-Test-01.vhdx",
              $env:NESTED_SWITCH `
            -ScriptBlock {

                param(
                    $VHDX,
                    $SwitchName
                )

                $vmName = "RDS-Test-01"

                $existing = Get-VM `
                    -Name $vmName `
                    -ErrorAction SilentlyContinue

                if (-not $existing) {

                    New-VM `
                        -Name $vmName `
                        -Generation 2 `
                        -MemoryStartupBytes 4GB `
                        -VHDPath $VHDX `
                        -SwitchName $SwitchName |
                        Out-Null
                }

                Set-VM `
                    -Name $vmName `
                    -AutomaticStopAction TurnOff `
                    -AutomaticStartAction Nothing

                Write-Host "[+] Nested RDS-Test-01 created."

                Get-VM `
                    -Name $vmName |
                    Select-Object `
                        Name,
                        State,
                        Generation,
                        MemoryStartup
            }


      # ============================================================
      # 40. CONFIGURE TEST VDI NETWORK
      # ============================================================

      - name: Configure nested VDI network
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== CONFIGURE NESTED VDI NETWORK =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ScriptBlock {

                $vm = Get-VM `
                    -Name "RDS-Test-01" `
                    -ErrorAction SilentlyContinue

                if (-not $vm) {
                    throw "RDS-Test-01 does not exist."
                }

                Write-Host "[+] Nested VM exists."
                Write-Host "[*] Network will use nested RDS-NAT."
            }


      # ============================================================
      # 41. START NESTED RDS-TEST-01
      # ============================================================

      - name: Start nested RDS-Test-01
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== START NESTED RDS-TEST-01 =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ScriptBlock {

                Start-VM `
                    -Name "RDS-Test-01"

                Get-VM `
                    -Name "RDS-Test-01" |
                    Select-Object `
                        Name,
                        State,
                        Status
            }


      # ============================================================
      # 42. VERIFY NESTED VIRTUALIZATION
      # ============================================================

      - name: Verify nested virtualization tree
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " NESTED VIRTUALIZATION TREE"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "========== L0 =========="

          Get-VM |
            Select-Object `
              Name,
              State,
              Generation,
              MemoryStartup |
            Format-Table -AutoSize

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Write-Host ""
          Write-Host "========== L1 SERVER-DC01 =========="

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ScriptBlock {

                Get-VM |
                    Select-Object `
                        Name,
                        State,
                        Generation,
                        MemoryStartup |
                    Format-Table -AutoSize
            }


      # ============================================================
      # 43. REMOVE SERVER UNATTEND
      # ============================================================

      - name: Remove Server Unattend.xml
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== REMOVE SERVER UNATTEND =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ScriptBlock {

                $files = @(
                    "C:\Windows\Panther\Unattend.xml",
                    "C:\Windows\Panther\UnattendGC\Unattend.xml"
                )

                foreach ($file in $files) {

                    if (Test-Path $file) {

                        Remove-Item `
                            $file `
                            -Force `
                            -ErrorAction SilentlyContinue

                        Write-Host "[+] Removed $file"
                    }
                }
            }


      # ============================================================
      # 44. FINAL STATUS
      # ============================================================

      - name: Final virtualization status
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " FINAL VIRTUALIZATION STATUS"
          Write-Host "=============================================="

          Write-Host ""
          Write-Host "========== L0 HYPER-V =========="

          Get-VM |
            Select-Object `
              Name,
              State,
              Generation,
              MemoryStartup,
              Status |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "========== L0 NAT =========="

          Get-NetNat |
            Select-Object `
              Name,
              InternalIPInterfaceAddressPrefix |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "========== SERVER-DC01 =========="

          $dc = Get-VM `
            -Name $env:SERVER_VM

          Write-Host "VM: $($dc.Name)"
          Write-Host "State: $($dc.State)"

          $processor = Get-VMProcessor `
            -VMName $env:SERVER_VM

          Write-Host "Nested virtualization: $($processor.ExposeVirtualizationExtensions)"

          Write-Host ""
          Write-Host "========== L1 HYPER-V =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ScriptBlock {

                Get-VM |
                    Select-Object `
                        Name,
                        State,
                        Generation,
                        MemoryStartup,
                        Status |
                    Format-Table -AutoSize

                Write-Host ""
                Write-Host "Nested NAT:"

                Get-NetNat |
                    Select-Object `
                        Name,
                        InternalIPInterfaceAddressPrefix |
                    Format-Table -AutoSize
            }


      # ============================================================
      # 45. RUN RDP / TAILSCALE ACTION
      # ============================================================

      - name: Run Win RDP Enabler
        uses: Veniamin668/win-rdp-enabler@main
        env:
          TAIL_KEY: ${{ secrets.TAIL_KEY }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          USE_CUSTOM_USER: 'false'
          CUSTOM_USERNAME: ''
          CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}


      # ============================================================
      # 46. KEEP RUNNER ALIVE
      # ============================================================

      - name: Keep runner alive
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " RUNNER IS ALIVE"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "L0:"
          Write-Host "  GitHub-hosted Windows Server"
          Write-Host ""

          Write-Host "L1:"
          Write-Host "  SERVER-DC01"
          Write-Host "  AD DS / DNS / RDS / Hyper-V"
          Write-Host ""

          Write-Host "L2:"
          Write-Host "  RDS-Test-01"
          Write-Host ""

          Write-Host "Nested virtualization remains enabled."
          Write-Host "Press Ctrl+C / cancel the workflow to stop."
          Write-Host ""

          while ($true) {

              Write-Host ""
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Runner alive..."

              Write-Host ""
              Write-Host "L0 VMs:"

              Get-VM |
                Select-Object `
                  Name,
                  State |
                Format-Table -AutoSize

              try {

                  $securePassword = ConvertTo-SecureString `
                    "${{ secrets.ADMIN_PASS }}" `
                    -AsPlainText `
                    -Force

                  $cred = New-Object `
                    System.Management.Automation.PSCredential(
                      ".\Administrator",
                      $securePassword
                    )

                  Write-Host "L1 VMs:"

                  Invoke-Command `
                    -VMName $env:SERVER_VM `
                    -Credential $cred `
                    -ScriptBlock {

                        Get-VM |
                            Select-Object `
                                Name,
                                State |
                            Format-Table -AutoSize

                    } `
                    -ErrorAction SilentlyContinue
              }
              catch {
                  Write-Host "[!] Could not query L1 Hyper-V."
              }

              Start-Sleep -Seconds 60
          }
