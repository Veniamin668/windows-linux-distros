name: Deploy Windows Native VDI

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Direct URL to Windows client ISO"
        required: true
        type: string

      server_iso_url:
        description: "Direct URL to Windows Server ISO"
        required: true
        type: string

      wim_index:
        description: "Windows client WIM/ESD index"
        required: true
        default: "1"
        type: string

      server_wim_index:
        description: "Windows Server WIM/ESD index"
        required: true
        default: "4"
        type: string

      ad_domain:
        description: "Active Directory domain"
        required: true
        default: "vdi.test"
        type: string

      ad_netbios:
        description: "Active Directory NetBIOS name"
        required: true
        default: "VDI"
        type: string


jobs:
  deploy-vdi:

    runs-on: windows-latest
    timeout-minutes: 360

    env:
      WORK_DIR: ${{ github.workspace }}

      VDI_SWITCH: VDI-NAT
      VDI_GATEWAY: 192.168.250.1
      VDI_PREFIX: 192.168.250.0/24

      SERVER_SWITCH: SERVER-NAT
      SERVER_GATEWAY: 192.168.251.1
      SERVER_PREFIX: 192.168.251.0/24
      SERVER_IP: 192.168.251.10

      SERVER_VM: SERVER-DC01

      AD_DOMAIN: ${{ inputs.ad_domain }}
      AD_NETBIOS: ${{ inputs.ad_netbios }}

    steps:

      # ============================================================
      # 01. PREPARE WORKSPACE
      # ============================================================

      - name: Prepare workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== WORKSPACE =========="

          $WorkDir = $env:GITHUB_WORKSPACE

          Write-Host "[*] Workspace: $WorkDir"

          New-Item -ItemType Directory -Path $WorkDir -Force | Out-Null

          Get-PSDrive -PSProvider FileSystem |
              Select-Object Name, Root, Used, Free |
              Format-Table -AutoSize


      # ============================================================
      # 02. CHECK AUTOUNATTEND.XML
      # ============================================================

      - name: Check Autounattend.xml
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CHECK AUTOUNATTEND.XML =========="

          $path = Join-Path $env:GITHUB_WORKSPACE "Autounattend.xml"

          if (-not (Test-Path $path)) {
              throw "Autounattend.xml was not found in repository root."
          }

          Write-Host "[+] Found: $path"

          $xml = Get-Content -Raw -Path $path

          if (-not $xml.Contains("CHANGE_ME_ADMIN_PASSWORD")) {
              throw "Autounattend.xml does not contain CHANGE_ME_ADMIN_PASSWORD placeholder."
          }

          Write-Host "[+] Password placeholder found."

          try {
              $null = [xml]$xml
              Write-Host "[+] XML syntax is valid."
          }
          catch {
              throw "Autounattend.xml is not valid XML: $($_.Exception.Message)"
          }


      # ============================================================
      # 03. DOWNLOAD WINDOWS CLIENT ISO
      # ============================================================

      - name: Download Windows client ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== DOWNLOAD WINDOWS ISO =========="

          $iso = Join-Path $env:GITHUB_WORKSPACE "windows.iso"

          if (Test-Path $iso) {
              Remove-Item $iso -Force
          }

          curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 5 `
            --retry-all-errors `
            -C - `
            -o "$iso" `
            "${{ inputs.iso_url }}"

          if (-not (Test-Path $iso)) {
              throw "Windows ISO was not downloaded."
          }

          Write-Host "[+] ISO: $iso"
          Write-Host "[+] Size: $((Get-Item $iso).Length) bytes"


      # ============================================================
      # 04. MOUNT WINDOWS ISO
      # ============================================================

      - name: Mount Windows ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== MOUNT WINDOWS ISO =========="

          $iso = Join-Path $env:GITHUB_WORKSPACE "windows.iso"

          $diskImage = Mount-DiskImage `
            -ImagePath $iso `
            -PassThru

          $volume = $diskImage |
            Get-Volume |
            Where-Object DriveLetter |
            Select-Object -First 1

          if (-not $volume) {
              throw "Could not determine Windows ISO drive."
          }

          $drive = "$($volume.DriveLetter):"

          Write-Host "[+] ISO mounted at $drive"

          "WINDOWS_ISO_DRIVE=$drive" >> $env:GITHUB_ENV


      # ============================================================
      # 05. FIND WINDOWS IMAGE
      # ============================================================

      - name: Find Windows image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== FIND WINDOWS IMAGE =========="

          $sources = Join-Path $env:WINDOWS_ISO_DRIVE "sources"

          $wim = Join-Path $sources "install.wim"
          $esd = Join-Path $sources "install.esd"

          if (Test-Path $wim) {
              $image = $wim
          }
          elseif (Test-Path $esd) {
              $image = $esd
          }
          else {
              throw "install.wim/install.esd not found."
          }

          Write-Host "[+] Image: $image"

          & dism.exe /Get-WimInfo "/WimFile:$image"

          "WINDOWS_IMAGE_FILE=$image" >> $env:GITHUB_ENV
          "WINDOWS_WIM_INDEX=${{ inputs.wim_index }}" >> $env:GITHUB_ENV


      # ============================================================
      # 06. CREATE VDI MASTER VHDX
      # ============================================================

      - name: Create VDI master VHDX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE VDI MASTER VHDX =========="

          $vhdx = Join-Path $env:GITHUB_WORKSPACE "Windows-VDI-Master.vhdx"

          if (Test-Path $vhdx) {
              Remove-Item $vhdx -Force
          }

          New-VHD `
            -Path $vhdx `
            -SizeBytes 60GB `
            -Dynamic | Out-Null

          $disk = Mount-VHD `
            -Path $vhdx `
            -Passthru

          $diskNumber = $disk.DiskNumber

          Initialize-Disk `
            -Number $diskNumber `
            -PartitionStyle GPT

          $efi = New-Partition `
            -DiskNumber $diskNumber `
            -Size 100MB `
            -GptType "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"

          Format-Volume `
            -Partition $efi `
            -FileSystem FAT32 `
            -NewFileSystemLabel "SYSTEM" `
            -Confirm:$false | Out-Null

          $osPartition = New-Partition `
            -DiskNumber $diskNumber `
            -UseMaximumSize `
            -AssignDriveLetter

          Format-Volume `
            -Partition $osPartition `
            -FileSystem NTFS `
            -NewFileSystemLabel "Windows" `
            -Confirm:$false | Out-Null

          $osDrive = "$($osPartition.DriveLetter):"

          Write-Host "[+] VHDX: $vhdx"
          Write-Host "[+] Disk: $diskNumber"
          Write-Host "[+] OS: $osDrive"

          "MASTER_VHDX=$vhdx" >> $env:GITHUB_ENV
          "MASTER_DISK=$diskNumber" >> $env:GITHUB_ENV
          "MASTER_OS=$osDrive" >> $env:GITHUB_ENV


      # ============================================================
      # 07. APPLY WINDOWS IMAGE
      # ============================================================

      - name: Apply Windows image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== APPLY WINDOWS IMAGE =========="

          & dism.exe `
            /Apply-Image `
            "/ImageFile:$env:WINDOWS_IMAGE_FILE" `
            "/Index:$env:WINDOWS_WIM_INDEX" `
            "/ApplyDir:$env:MASTER_OS" `
            /CheckIntegrity

          if ($LASTEXITCODE -ne 0) {
              throw "DISM image apply failed with exit code $LASTEXITCODE"
          }


      # ============================================================
      # 08. CONFIGURE VDI BOOT
      # ============================================================

      - name: Configure VDI boot files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CONFIGURE VDI BOOT =========="

          $diskNumber = [int]$env:MASTER_DISK

          $efiPartition = Get-Partition -DiskNumber $diskNumber |
              Where-Object {
                  $_.GptType -eq "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"
              } |
              Select-Object -First 1

          if (-not $efiPartition) {
              throw "EFI partition not found."
          }

          $diskpart = @"
select disk $diskNumber
select partition $($efiPartition.PartitionNumber)
assign letter=S
exit
"@

          $diskpart | diskpart.exe

          bcdboot `
            "$env:MASTER_OS\Windows" `
            /s S: `
            /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "BCDBOOT failed with exit code $LASTEXITCODE"
          }


      # ============================================================
      # 09. CLEAN VDI IMAGE
      # ============================================================

      - name: Cleanup VDI image
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "========== CLEAN VDI IMAGE =========="

          dism.exe `
            /Image:"$env:MASTER_OS" `
            /Cleanup-Image `
            /StartComponentCleanup


      # ============================================================
      # 10. DISMOUNT VDI MASTER
      # ============================================================

      - name: Dismount VDI master
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Dismount-VHD `
            -Path $env:MASTER_VHDX


      # ============================================================
      # 11. INSTALL RDS ROLES
      # ============================================================

      - name: Install RDS roles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== INSTALL RDS =========="

          $features = @(
              "RDS-Connection-Broker",
              "RDS-Web-Access",
              "RDS-Virtualization"
          )

          Install-WindowsFeature `
            -Name $features `
            -IncludeManagementTools `
            -Restart:$false


      # ============================================================
      # 12. CREATE VDI NAT
      # ============================================================

      - name: Create VDI NAT network
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE VDI-NAT =========="

          $switch = Get-VMSwitch `
            -Name $env:VDI_SWITCH `
            -ErrorAction SilentlyContinue

          if (-not $switch) {
              New-VMSwitch `
                -Name $env:VDI_SWITCH `
                -SwitchType Internal | Out-Null
          }

          $adapter = Get-NetAdapter |
              Where-Object {
                  $_.Name -like "*$env:VDI_SWITCH*"
              } |
              Select-Object -First 1

          if (-not $adapter) {
              throw "VDI NAT adapter not found."
          }

          $existing = Get-NetIPAddress `
            -InterfaceIndex $adapter.ifIndex `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue |
            Where-Object IPAddress -eq $env:VDI_GATEWAY

          if (-not $existing) {
              New-NetIPAddress `
                -InterfaceIndex $adapter.ifIndex `
                -IPAddress $env:VDI_GATEWAY `
                -PrefixLength 24 | Out-Null
          }

          $nat = Get-NetNat `
            -Name "VDI-NAT" `
            -ErrorAction SilentlyContinue

          if (-not $nat) {
              New-NetNat `
                -Name "VDI-NAT" `
                -InternalIPInterfaceAddressPrefix $env:VDI_PREFIX | Out-Null
          }


      # ============================================================
      # 13. CREATE RDS MASTER TEMPLATE
      # ============================================================

      - name: Create RDS master template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE RDS-Master-Template =========="

          $vm = Get-VM `
            -Name "RDS-Master-Template" `
            -ErrorAction SilentlyContinue

          if (-not $vm) {

              New-VM `
                -Name "RDS-Master-Template" `
                -Generation 2 `
                -MemoryStartupBytes 4GB `
                -VHDPath $env:MASTER_VHDX `
                -SwitchName $env:VDI_SWITCH

          }

          Set-VM `
            -Name "RDS-Master-Template" `
            -AutomaticStopAction TurnOff `
            -AutomaticStartAction Nothing

          Stop-VM `
            -Name "RDS-Master-Template" `
            -TurnOff `
            -Force `
            -ErrorAction SilentlyContinue


      # ============================================================
      # 14. DOWNLOAD WINDOWS SERVER ISO
      # ============================================================

      - name: Download Windows Server ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== DOWNLOAD WINDOWS SERVER ISO =========="

          $iso = Join-Path $env:GITHUB_WORKSPACE "windows-server.iso"

          if (Test-Path $iso) {
              Remove-Item $iso -Force
          }

          curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 5 `
            --retry-all-errors `
            -C - `
            -o "$iso" `
            "${{ inputs.server_iso_url }}"

          if (-not (Test-Path $iso)) {
              throw "Windows Server ISO was not downloaded."
          }

          Write-Host "[+] Server ISO: $iso"


      # ============================================================
      # 15. MOUNT SERVER ISO
      # ============================================================

      - name: Mount Windows Server ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== MOUNT SERVER ISO =========="

          $iso = Join-Path $env:GITHUB_WORKSPACE "windows-server.iso"

          $diskImage = Mount-DiskImage `
            -ImagePath $iso `
            -PassThru

          $volume = $diskImage |
            Get-Volume |
            Where-Object DriveLetter |
            Select-Object -First 1

          if (-not $volume) {
              throw "Could not determine Windows Server ISO drive."
          }

          $drive = "$($volume.DriveLetter):"

          Write-Host "[+] Server ISO mounted at $drive"

          "SERVER_ISO_DRIVE=$drive" >> $env:GITHUB_ENV


      # ============================================================
      # 16. FIND SERVER IMAGE
      # ============================================================

      - name: Find Windows Server image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== FIND SERVER IMAGE =========="

          $sources = Join-Path $env:SERVER_ISO_DRIVE "sources"

          $wim = Join-Path $sources "install.wim"
          $esd = Join-Path $sources "install.esd"

          if (Test-Path $wim) {
              $image = $wim
          }
          elseif (Test-Path $esd) {
              $image = $esd
          }
          else {
              throw "Server install.wim/install.esd not found."
          }

          Write-Host "[+] Server image: $image"

          & dism.exe /Get-WimInfo "/WimFile:$image"

          "SERVER_IMAGE_FILE=$image" >> $env:GITHUB_ENV
          "SERVER_WIM_INDEX=${{ inputs.server_wim_index }}" >> $env:GITHUB_ENV


      # ============================================================
      # 17. CREATE SERVER VHDX
      # ============================================================

      - name: Create SERVER-DC01 VHDX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE SERVER-DC01 VHDX =========="

          $vhdx = Join-Path `
            $env:GITHUB_WORKSPACE `
            "SERVER-DC01.vhdx"

          if (Test-Path $vhdx) {
              Remove-Item $vhdx -Force
          }

          New-VHD `
            -Path $vhdx `
            -SizeBytes 60GB `
            -Dynamic | Out-Null

          $disk = Mount-VHD `
            -Path $vhdx `
            -Passthru

          $diskNumber = $disk.DiskNumber

          Initialize-Disk `
            -Number $diskNumber `
            -PartitionStyle GPT

          $efi = New-Partition `
            -DiskNumber $diskNumber `
            -Size 100MB `
            -GptType "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"

          Format-Volume `
            -Partition $efi `
            -FileSystem FAT32 `
            -NewFileSystemLabel "SYSTEM" `
            -Confirm:$false | Out-Null

          $osPartition = New-Partition `
            -DiskNumber $diskNumber `
            -UseMaximumSize `
            -AssignDriveLetter

          Format-Volume `
            -Partition $osPartition `
            -FileSystem NTFS `
            -NewFileSystemLabel "Windows" `
            -Confirm:$false | Out-Null

          $osDrive = "$($osPartition.DriveLetter):"

          Write-Host "[+] VHDX: $vhdx"
          Write-Host "[+] Disk: $diskNumber"
          Write-Host "[+] OS: $osDrive"

          "SERVER_VHDX=$vhdx" >> $env:GITHUB_ENV
          "SERVER_DISK=$diskNumber" >> $env:GITHUB_ENV
          "SERVER_OS=$osDrive" >> $env:GITHUB_ENV


      # ============================================================
      # 18. APPLY WINDOWS SERVER IMAGE
      # ============================================================

      - name: Apply Windows Server image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== APPLY WINDOWS SERVER IMAGE =========="

          & dism.exe `
            /Apply-Image `
            "/ImageFile:$env:SERVER_IMAGE_FILE" `
            "/Index:$env:SERVER_WIM_INDEX" `
            "/ApplyDir:$env:SERVER_OS" `
            /CheckIntegrity

          if ($LASTEXITCODE -ne 0) {
              throw "Server DISM image apply failed with exit code $LASTEXITCODE"
          }


      # ============================================================
      # 19. INSTALL AUTOUNATTEND FROM REPOSITORY
      # ============================================================

      - name: Install Server Autounattend.xml
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== INSTALL SERVER UNATTEND =========="

          $source = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Autounattend.xml"

          if (-not (Test-Path $source)) {
              throw "Repository Autounattend.xml not found."
          }

          if ([string]::IsNullOrWhiteSpace($env:ADMIN_PASS)) {
              throw "ADMIN_PASS secret is empty or unavailable."
          }

          $targetDir = Join-Path `
            $env:SERVER_OS `
            "Windows\Panther"

          $target = Join-Path `
            $targetDir `
            "Unattend.xml"

          New-Item `
            -ItemType Directory `
            -Path $targetDir `
            -Force | Out-Null

          $content = Get-Content `
            -Raw `
            -Path $source

          if (-not $content.Contains("CHANGE_ME_ADMIN_PASSWORD")) {
              throw "Password placeholder is missing from Autounattend.xml."
          }

          $content = $content.Replace(
              "CHANGE_ME_ADMIN_PASSWORD",
              $env:ADMIN_PASS
          )

          Set-Content `
            -Path $target `
            -Value $content `
            -Encoding UTF8

          if (-not (Test-Path $target)) {
              throw "Failed to create guest Unattend.xml."
          }

          Write-Host "[+] Unattend.xml installed into Server VHDX."
          Write-Host "[+] Password value was not printed."


      # ============================================================
      # 20. SERVER BOOT
      # ============================================================

      - name: Configure Server boot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CONFIGURE SERVER BOOT =========="

          $diskNumber = [int]$env:SERVER_DISK

          $efiPartition = Get-Partition -DiskNumber $diskNumber |
              Where-Object {
                  $_.GptType -eq "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"
              } |
              Select-Object -First 1

          if (-not $efiPartition) {
              throw "Server EFI partition not found."
          }

          $diskpart = @"
select disk $diskNumber
select partition $($efiPartition.PartitionNumber)
assign letter=T
exit
"@

          $diskpart | diskpart.exe

          bcdboot `
            "$env:SERVER_OS\Windows" `
            /s T: `
            /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "Server BCDBOOT failed with exit code $LASTEXITCODE"
          }


      # ============================================================
      # 21. DISMOUNT SERVER VHDX
      # ============================================================

      - name: Dismount Server VHDX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Dismount-VHD `
            -Path $env:SERVER_VHDX


      # ============================================================
      # 22. CREATE SERVER-NAT
      # ============================================================

      - name: Create SERVER-NAT network
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE SERVER-NAT =========="

          $switch = Get-VMSwitch `
            -Name $env:SERVER_SWITCH `
            -ErrorAction SilentlyContinue

          if (-not $switch) {
              New-VMSwitch `
                -Name $env:SERVER_SWITCH `
                -SwitchType Internal | Out-Null
          }

          $adapter = Get-NetAdapter |
              Where-Object {
                  $_.Name -like "*$env:SERVER_SWITCH*"
              } |
              Select-Object -First 1

          if (-not $adapter) {
              throw "SERVER-NAT adapter not found."
          }

          $existing = Get-NetIPAddress `
            -InterfaceIndex $adapter.ifIndex `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue |
            Where-Object IPAddress -eq $env:SERVER_GATEWAY

          if (-not $existing) {
              New-NetIPAddress `
                -InterfaceIndex $adapter.ifIndex `
                -IPAddress $env:SERVER_GATEWAY `
                -PrefixLength 24 | Out-Null
          }

          $nat = Get-NetNat `
            -Name "SERVER-NAT" `
            -ErrorAction SilentlyContinue

          if (-not $nat) {
              New-NetNat `
                -Name "SERVER-NAT" `
                -InternalIPInterfaceAddressPrefix $env:SERVER_PREFIX | Out-Null
          }


      # ============================================================
      # 23. CREATE SERVER-DC01 VM
      # ============================================================

      - name: Create SERVER-DC01 VM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE SERVER-DC01 =========="

          $vm = Get-VM `
            -Name $env:SERVER_VM `
            -ErrorAction SilentlyContinue

          if (-not $vm) {

              New-VM `
                -Name $env:SERVER_VM `
                -Generation 2 `
                -MemoryStartupBytes 4GB `
                -VHDPath $env:SERVER_VHDX `
                -SwitchName $env:SERVER_SWITCH

          }

          Set-VM `
            -Name $env:SERVER_VM `
            -AutomaticStopAction TurnOff `
            -AutomaticStartAction Nothing

          Set-VMProcessor `
            -VMName $env:SERVER_VM `
            -ExposeVirtualizationExtensions $true

          Set-VMNetworkAdapter `
            -VMName $env:SERVER_VM `
            -MacAddressSpoofing On

          Write-Host "[+] Nested virtualization enabled."
          Write-Host "[+] MAC spoofing enabled."


      # ============================================================
      # 24. START SERVER-DC01
      # ============================================================

      - name: Start SERVER-DC01
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== START SERVER-DC01 =========="

          Start-VM `
            -Name $env:SERVER_VM

          Get-VM `
            -Name $env:SERVER_VM |
            Select-Object Name, State, Generation, MemoryStartup,
                @{N="CPU";E={(Get-VMProcessor -VMName $_.Name).Count}},
                @{N="Nested";E={(Get-VMProcessor -VMName $_.Name).ExposeVirtualizationExtensions}} |
            Format-List


      # ============================================================
      # 25. WAIT FOR POWERSHELL DIRECT
      # ============================================================

      - name: Wait for PowerShell Direct
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== WAIT FOR POWERSHELL DIRECT =========="

          if ([string]::IsNullOrWhiteSpace($env:ADMIN_PASS)) {
              throw "ADMIN_PASS secret is empty."
          }

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          $connected = $false

          for ($i = 1; $i -le 60; $i++) {

              Write-Host "[*] PowerShell Direct attempt $i/60..."

              try {

                  $result = Invoke-Command `
                    -VMName $env:SERVER_VM `
                    -Credential $cred `
                    -ScriptBlock {
                        hostname
                        whoami
                    } `
                    -ErrorAction Stop

                  Write-Host "[+] Guest responded:"
                  $result | ForEach-Object {
                      Write-Host "    $_"
                  }

                  $connected = $true
                  break

              }
              catch {

                  Write-Host "[*] Guest not ready: $($_.Exception.Message)"

                  Start-Sleep -Seconds 10
              }
          }

          if (-not $connected) {
              throw "PowerShell Direct could not authenticate/connect to SERVER-DC01."
          }


      # ============================================================
      # 26. CONFIGURE SERVER NETWORK INSIDE GUEST
      # ============================================================

      - name: Configure SERVER-DC01 network
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CONFIGURE GUEST NETWORK =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ArgumentList `
              $env:SERVER_IP,
              $env:SERVER_GATEWAY `
            -ScriptBlock {

                param(
                    $StaticIP,
                    $Gateway
                )

                $adapter = Get-NetAdapter |
                    Where-Object Status -eq "Up" |
                    Select-Object -First 1

                if (-not $adapter) {
                    throw "No active network adapter found."
                }

                Write-Host "Adapter: $($adapter.Name)"

                Get-NetIPAddress `
                    -InterfaceIndex $adapter.ifIndex `
                    -AddressFamily IPv4 `
                    -ErrorAction SilentlyContinue |
                    Where-Object {
                        $_.IPAddress -notlike "169.254.*"
                    } |
                    Remove-NetIPAddress `
                        -Confirm:$false `
                        -ErrorAction SilentlyContinue

                New-NetIPAddress `
                    -InterfaceIndex $adapter.ifIndex `
                    -IPAddress $StaticIP `
                    -PrefixLength 24 `
                    -DefaultGateway $Gateway

                Set-DnsClientServerAddress `
                    -InterfaceIndex $adapter.ifIndex `
                    -ServerAddresses @($Gateway)

                Write-Host "Guest IP configured:"
                Get-NetIPAddress `
                    -InterfaceIndex $adapter.ifIndex `
                    -AddressFamily IPv4
            }


      # ============================================================
      # 27. INSTALL AD DS + DNS INSIDE VM
      # ============================================================

      - name: Install AD DS and DNS inside SERVER-DC01
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== INSTALL AD DS + DNS IN GUEST =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ScriptBlock {

                Install-WindowsFeature `
                    AD-Domain-Services,
                    DNS `
                    -IncludeManagementTools

                Get-WindowsFeature `
                    AD-Domain-Services,
                    DNS |
                    Select-Object Name, InstallState
            }


      # ============================================================
      # 28. PROMOTE SERVER-DC01 TO DOMAIN CONTROLLER
      # ============================================================

      - name: Promote SERVER-DC01 to domain controller
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== PROMOTE SERVER-DC01 =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ArgumentList `
              $env:AD_DOMAIN,
              $env:AD_NETBIOS,
              $env:ADMIN_PASS `
            -ScriptBlock {

                param(
                    $Domain,
                    $Netbios,
                    $AdminPassword
                )

                $safeModePassword = ConvertTo-SecureString `
                    $AdminPassword `
                    -AsPlainText `
                    -Force

                Install-ADDSForest `
                    -DomainName $Domain `
                    -DomainNetbiosName $Netbios `
                    -SafeModeAdministratorPassword $safeModePassword `
                    -InstallDns `
                    -CreateDnsDelegation:$false `
                    -DatabasePath "C:\Windows\NTDS" `
                    -LogPath "C:\Windows\NTDS" `
                    -SysvolPath "C:\Windows\SYSVOL" `
                    -NoRebootOnCompletion:$false `
                    -Force
            }


      # ============================================================
      # 29. WAIT FOR DC REBOOT
      # ============================================================

      - name: Wait for domain controller reboot
        shell: pwsh
        run: |
          Write-Host "========== WAIT FOR DC REBOOT =========="

          Start-Sleep -Seconds 20

          for ($i = 1; $i -le 60; $i++) {

              $vm = Get-VM `
                -Name $env:SERVER_VM `
                -ErrorAction SilentlyContinue

              if ($vm) {
                  Write-Host "[*] VM state: $($vm.State)"
              }

              Start-Sleep -Seconds 5
          }


      # ============================================================
      # 30. WAIT FOR POWERSHELL DIRECT AFTER PROMOTION
      # ============================================================

      - name: Reconnect to SERVER-DC01
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== RECONNECT TO DOMAIN CONTROLLER =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          $connected = $false

          for ($i = 1; $i -le 60; $i++) {

              Write-Host "[*] Reconnect attempt $i/60..."

              try {

                  $result = Invoke-Command `
                    -VMName $env:SERVER_VM `
                    -Credential $cred `
                    -ScriptBlock {
                        hostname
                        whoami
                        Get-Service NTDS, DNS |
                            Select-Object Name, Status
                    } `
                    -ErrorAction Stop

                  $result | ForEach-Object {
                      Write-Host "    $_"
                  }

                  $connected = $true
                  break

              }
              catch {

                  Write-Host "[*] DC not ready: $($_.Exception.Message)"

                  Start-Sleep -Seconds 10
              }
          }

          if (-not $connected) {
              throw "Could not reconnect to SERVER-DC01 after AD DS promotion."
          }


      # ============================================================
      # 31. VERIFY AD DS / DNS INSIDE VM
      # ============================================================

      - name: Verify AD DS and DNS
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== VERIFY AD DS / DNS =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ScriptBlock {

                Write-Host "========== HOSTNAME =========="
                hostname

                Write-Host "========== DOMAIN =========="
                Get-CimInstance Win32_ComputerSystem |
                    Select-Object Name, Domain, PartOfDomain

                Write-Host "========== AD DOMAIN =========="

                Import-Module ActiveDirectory

                Get-ADDomain |
                    Select-Object DNSRoot,
                        NetBIOSName,
                        DomainMode,
                        Forest

                Write-Host "========== DNS =========="

                Get-Service DNS |
                    Select-Object Name, Status, StartType

                Write-Host "========== NTDS =========="

                Get-Service NTDS |
                    Select-Object Name, Status, StartType

                Write-Host "========== IP =========="

                Get-NetIPAddress `
                    -AddressFamily IPv4 |
                    Where-Object {
                        $_.IPAddress -notlike "127.*"
                    } |
                    Select-Object IPAddress,
                        PrefixLength,
                        InterfaceAlias
            }


      # ============================================================
      # 32. REMOVE UNATTEND PASSWORD FROM GUEST
      # ============================================================

      - name: Remove guest Unattend.xml
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== REMOVE GUEST UNATTEND =========="

          $securePassword = ConvertTo-SecureString `
            $env:ADMIN_PASS `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $securePassword
            )

          Invoke-Command `
            -VMName $env:SERVER_VM `
            -Credential $cred `
            -ScriptBlock {

                $files = @(
                    "C:\Windows\Panther\Unattend.xml",
                    "C:\Windows\Panther\UnattendGC\Unattend.xml"
                )

                foreach ($file in $files) {

                    if (Test-Path $file) {

                        Remove-Item `
                            $file `
                            -Force `
                            -ErrorAction SilentlyContinue

                        Write-Host "[+] Removed $file"
                    }
                }
            }


      # ============================================================
      # 33. CREATE DIFFERENCING VDI DISK
      # ============================================================

      - name: Create VDI test differencing disk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE VDI DIFFERENCING DISK =========="

          $diff = Join-Path `
            $env:GITHUB_WORKSPACE `
            "RDS-Test-01.vhdx"

          if (Test-Path $diff) {
              Remove-Item $diff -Force
          }

          New-VHD `
            -Path $diff `
            -ParentPath $env:MASTER_VHDX `
            -Differencing | Out-Null

          Write-Host "[+] Differencing disk created: $diff"

          "VDI_TEST_VHDX=$diff" >> $env:GITHUB_ENV


      # ============================================================
      # 34. CREATE TEST VDI VM
      # ============================================================

      - name: Create RDS-Test-01 VM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE RDS-TEST-01 =========="

          $vm = Get-VM `
            -Name "RDS-Test-01" `
            -ErrorAction SilentlyContinue

          if (-not $vm) {

              New-VM `
                -Name "RDS-Test-01" `
                -Generation 2 `
                -MemoryStartupBytes 4GB `
                -VHDPath $env:VDI_TEST_VHDX `
                -SwitchName $env:VDI_SWITCH

          }

          Set-VM `
            -Name "RDS-Test-01" `
            -AutomaticStopAction TurnOff `
            -AutomaticStartAction Nothing


      # ============================================================
      # 35. CHECK RDS DEPLOYMENT REQUIREMENTS
      # ============================================================

      - name: Check RDS environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== RDS ENVIRONMENT =========="

          Get-WindowsFeature |
            Where-Object {
                $_.Name -like "RDS-*"
            } |
            Select-Object Name, InstallState

          Get-Service |
            Where-Object {
                $_.Name -like "RD*"
            } |
            Select-Object Name, Status


      # ============================================================
      # 36. START TEST VDI
      # ============================================================

      - name: Start RDS-Test-01
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Start-VM `
            -Name "RDS-Test-01"

          Get-VM `
            -Name "RDS-Test-01" |
            Select-Object Name, State, Status


      # ============================================================
      # 37. VERIFY MASTER IS OFF
      # ============================================================

      - name: Verify master VM is OFF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== VERIFY MASTER =========="

          $master = Get-VM `
            -Name "RDS-Master-Template"

          if ($master.State -ne "Off") {

              Write-Host "[!] Master is running. Stopping..."

              Stop-VM `
                -Name "RDS-Master-Template" `
                -TurnOff `
                -Force
          }

          Get-VM `
            -Name "RDS-Master-Template" |
            Select-Object Name, State


      # ============================================================
      # 38. RUN RDP / TAILSCALE ACTION
      # ============================================================

      - name: Run Win RDP Enabler
        uses: Veniamin668/win-rdp-enabler@main
        env:
          TAIL_KEY: ${{ secrets.TAIL_KEY }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}

          USE_CUSTOM_USER: 'false'
          CUSTOM_USERNAME: ''
          CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}


      # ============================================================
      # 39. FINAL STATUS
      # ============================================================

      - name: Final virtualization status
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " FINAL VIRTUALIZATION STATUS"
          Write-Host "=============================================="

          Get-VM |
            Select-Object `
              Name,
              State,
              Generation,
              MemoryStartup,
              Status |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "========== VDI SWITCH =========="

          Get-VMSwitch |
            Select-Object Name,
                SwitchType,
                NetAdapterInterfaceDescription |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "========== NAT =========="

          Get-NetNat |
            Select-Object Name,
                InternalIPInterfaceAddressPrefix |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "========== SERVER-DC01 =========="

          $dc = Get-VM -Name "SERVER-DC01"

          Write-Host "VM: $($dc.Name)"
          Write-Host "State: $($dc.State)"

          $processor = Get-VMProcessor `
            -VMName "SERVER-DC01"

          Write-Host "Nested virtualization: $($processor.ExposeVirtualizationExtensions)"


      # ============================================================
      # 40. KEEP RUNNER ALIVE
      # ============================================================

      - name: Keep runner alive
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " RUNNER IS ALIVE"
          Write-Host " =============================================="
          Write-Host ""
          Write-Host "Hyper-V VMs remain running."
          Write-Host "SERVER-DC01 is the AD DS / DNS server."
          Write-Host "RDS-Test-01 is the VDI test VM."
          Write-Host ""
          Write-Host "Press Ctrl+C / cancel the workflow to stop."
          Write-Host ""

          while ($true) {

              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Runner alive..."

              Get-VM |
                Select-Object Name, State |
                Format-Table -AutoSize

              Start-Sleep -Seconds 60
          }
