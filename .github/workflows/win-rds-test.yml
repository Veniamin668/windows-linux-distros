name: Deploy Windows Native VDI

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Windows client ISO URL"
        required: true
        type: string

      server_iso_url:
        description: "Windows Server ISO URL"
        required: true
        type: string

      wim_index:
        description: "Windows client WIM index"
        required: true
        default: "1"
        type: string

      server_wim_index:
        description: "Windows Server WIM index"
        required: true
        default: "4"
        type: string

      ad_domain:
        description: "AD DNS domain"
        required: true
        default: "vdi.test"
        type: string

      ad_netbios:
        description: "AD NetBIOS name"
        required: true
        default: "VDI"
        type: string

jobs:
  deploy-vdi:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      WORK_DIR: ${{ github.workspace }}

      CLIENT_ISO: ${{ github.workspace }}\windows.iso
      SERVER_ISO: ${{ github.workspace }}\windows-server.iso

      CLIENT_VHDX: ${{ github.workspace }}\Windows-VDI-Master.vhdx
      SERVER_VHDX: ${{ github.workspace }}\Windows-Server-DC01.vhdx

      SERVER_VM: SERVER-DC01
      TEMPLATE_VM: RDS-Master-Template

      SERVER_SWITCH: SERVER-NAT
      SERVER_GATEWAY: 192.168.251.1
      SERVER_PREFIX: 192.168.251.0/24
      SERVER_IP: 192.168.251.10

      RDS_SWITCH: RDS-NAT
      RDS_GATEWAY: 192.168.252.1
      RDS_PREFIX: 192.168.252.0/24

      AD_DOMAIN: ${{ inputs.ad_domain }}
      AD_NETBIOS: ${{ inputs.ad_netbios }}

      RDS_COLLECTION: Windows-VDI-Pool
      RDS_VM_PREFIX: RDS-Test-

      TEMPLATE_VHDX: C:\VDI\Templates\RDS-Master-Template.vhdx
      RDS_STORAGE: C:\VDI\Collections
      RDS_TEMPLATE_STORAGE: C:\VDI\Templates

    steps:

      # ============================================================
      # DOWNLOAD ISO
      # ============================================================

      - name: Download Windows client ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== DOWNLOAD WINDOWS CLIENT ISO =========="

          if (-not (Test-Path $env:CLIENT_ISO)) {
              Invoke-WebRequest `
                  -Uri "${{ inputs.iso_url }}" `
                  -OutFile $env:CLIENT_ISO `
                  -UseBasicParsing
          }

          Write-Host "[+] Client ISO ready:"
          Get-Item $env:CLIENT_ISO | Select-Object FullName,Length

      - name: Download Windows Server ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== DOWNLOAD WINDOWS SERVER ISO =========="

          if (-not (Test-Path $env:SERVER_ISO)) {
              Invoke-WebRequest `
                  -Uri "${{ inputs.server_iso_url }}" `
                  -OutFile $env:SERVER_ISO `
                  -UseBasicParsing
          }

          Write-Host "[+] Server ISO ready:"
          Get-Item $env:SERVER_ISO | Select-Object FullName,Length


      # ============================================================
      # PREPARE CLIENT VHDX
      # ============================================================

      - name: Prepare Windows VDI master VHDX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== PREPARE WINDOWS VDI MASTER =========="

          $vhdx = $env:CLIENT_VHDX

          if (Test-Path $vhdx) {
              Remove-Item $vhdx -Force
          }

          New-VHD `
              -Path $vhdx `
              -SizeBytes 60GB `
              -Dynamic | Out-Null

          Mount-VHD -Path $vhdx -Passthru | Out-Null

          $disk = Get-Disk |
              Where-Object {
                  $_.OperationalStatus -eq 'Offline' -or
                  $_.PartitionStyle -eq 'RAW'
              } |
              Sort-Object Number -Descending |
              Select-Object -First 1

          if (-not $disk) {
              $disk = Get-Disk |
                  Where-Object PartitionStyle -eq 'RAW' |
                  Sort-Object Number -Descending |
                  Select-Object -First 1
          }

          if (-not $disk) {
              throw "Could not locate mounted client VHDX disk."
          }

          Write-Host "[+] Disk: $($disk.Number)"

          Set-Disk -Number $disk.Number -IsOffline $false
          Set-Disk -Number $disk.Number -IsReadOnly $false

          Initialize-Disk `
              -Number $disk.Number `
              -PartitionStyle GPT `
              -Confirm:$false

          $efi = New-Partition `
              -DiskNumber $disk.Number `
              -Size 100MB `
              -GptType "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"

          $msr = New-Partition `
              -DiskNumber $disk.Number `
              -Size 16MB `
              -GptType "{E3C9E316-0B5C-4DB8-817D-F92DF00215AE}"

          $os = New-Partition `
              -DiskNumber $disk.Number `
              -UseMaximumSize `
              -AssignDriveLetter

          Format-Volume `
              -Partition $efi `
              -FileSystem FAT32 `
              -NewFileSystemLabel "SYSTEM" `
              -Confirm:$false | Out-Null

          Format-Volume `
              -Partition $os `
              -FileSystem NTFS `
              -NewFileSystemLabel "Windows" `
              -Confirm:$false | Out-Null

          $efi = Get-Partition `
              -DiskNumber $disk.Number `
              -PartitionNumber $efi.PartitionNumber

          $os = Get-Partition `
              -DiskNumber $disk.Number `
              -PartitionNumber $os.PartitionNumber

          if (-not $efi.DriveLetter) {
              Set-Partition `
                  -DiskNumber $disk.Number `
                  -PartitionNumber $efi.PartitionNumber `
                  -NewDriveLetter S
          }

          $efiDrive = "S:"
          $osDrive = "$($os.DriveLetter):"

          Write-Host "[+] EFI: $efiDrive"
          Write-Host "[+] OS : $osDrive"

          $isoMount = Mount-DiskImage `
              -ImagePath $env:CLIENT_ISO `
              -PassThru

          $isoDrive = (
              $isoMount |
              Get-Volume
          ).DriveLetter

          if (-not $isoDrive) {
              throw "Could not determine client ISO drive letter."
          }

          $installWim = "${isoDrive}:\sources\install.wim"

          if (-not (Test-Path $installWim)) {
              $installWim = "${isoDrive}:\sources\install.esd"
          }

          if (-not (Test-Path $installWim)) {
              throw "install.wim/install.esd not found."
          }

          Write-Host "[+] Applying image: $installWim"

          dism.exe `
              /Apply-Image `
              "/ImageFile:$installWim" `
              "/Index:${{ inputs.wim_index }}" `
              "/ApplyDir:$osDrive\" `
              /CheckIntegrity

          if ($LASTEXITCODE -ne 0) {
              throw "DISM Apply-Image failed: $LASTEXITCODE"
          }

          bcdboot.exe `
              "$osDrive\Windows" `
              /s $efiDrive `
              /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "BCDBoot failed: $LASTEXITCODE"
          }

          Dismount-DiskImage -ImagePath $env:CLIENT_ISO

          Dismount-VHD -Path $vhdx

          Write-Host "[+] Client VHDX prepared."


      # ============================================================
      # PREPARE SERVER VHDX
      # ============================================================

      - name: Prepare Windows Server DC01 VHDX
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== PREPARE WINDOWS SERVER DC01 =========="

          $vhdx = $env:SERVER_VHDX

          if (Test-Path $vhdx) {
              Remove-Item $vhdx -Force
          }

          New-VHD `
              -Path $vhdx `
              -SizeBytes 80GB `
              -Dynamic | Out-Null

          Mount-VHD -Path $vhdx -Passthru | Out-Null

          $disk = Get-Disk |
              Where-Object PartitionStyle -eq 'RAW' |
              Sort-Object Number -Descending |
              Select-Object -First 1

          if (-not $disk) {
              throw "Could not locate mounted server VHDX disk."
          }

          Set-Disk -Number $disk.Number -IsOffline $false
          Set-Disk -Number $disk.Number -IsReadOnly $false

          Initialize-Disk `
              -Number $disk.Number `
              -PartitionStyle GPT `
              -Confirm:$false

          $efi = New-Partition `
              -DiskNumber $disk.Number `
              -Size 100MB `
              -GptType "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"

          $msr = New-Partition `
              -DiskNumber $disk.Number `
              -Size 16MB `
              -GptType "{E3C9E316-0B5C-4DB8-817D-F92DF00215AE}"

          $os = New-Partition `
              -DiskNumber $disk.Number `
              -UseMaximumSize `
              -AssignDriveLetter

          Format-Volume `
              -Partition $efi `
              -FileSystem FAT32 `
              -NewFileSystemLabel "SYSTEM" `
              -Confirm:$false | Out-Null

          Format-Volume `
              -Partition $os `
              -FileSystem NTFS `
              -NewFileSystemLabel "Windows" `
              -Confirm:$false | Out-Null

          $efi = Get-Partition `
              -DiskNumber $disk.Number `
              -PartitionNumber $efi.PartitionNumber

          $os = Get-Partition `
              -DiskNumber $disk.Number `
              -PartitionNumber $os.PartitionNumber

          if (-not $efi.DriveLetter) {
              Set-Partition `
                  -DiskNumber $disk.Number `
                  -PartitionNumber $efi.PartitionNumber `
                  -NewDriveLetter T
          }

          $efiDrive = "T:"
          $osDrive = "$($os.DriveLetter):"

          $isoMount = Mount-DiskImage `
              -ImagePath $env:SERVER_ISO `
              -PassThru

          $isoDrive = (
              $isoMount |
              Get-Volume
          ).DriveLetter

          if (-not $isoDrive) {
              throw "Could not determine Server ISO drive letter."
          }

          $installWim = "${isoDrive}:\sources\install.wim"

          if (-not (Test-Path $installWim)) {
              $installWim = "${isoDrive}:\sources\install.esd"
          }

          if (-not (Test-Path $installWim)) {
              throw "Server install.wim/install.esd not found."
          }

          Write-Host "[+] Applying Server image."

          dism.exe `
              /Apply-Image `
              "/ImageFile:$installWim" `
              "/Index:${{ inputs.server_wim_index }}" `
              "/ApplyDir:$osDrive\" `
              /CheckIntegrity

          if ($LASTEXITCODE -ne 0) {
              throw "DISM Apply-Image failed: $LASTEXITCODE"
          }

          @'
          <?xml version="1.0" encoding="utf-8"?>
          <unattend xmlns="urn:schemas-microsoft-com:unattend"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

              <settings pass="specialize">
                  <component
                      name="Microsoft-Windows-Shell-Setup"
                      processorArchitecture="amd64"
                      publicKeyToken="31bf3856ad364e35"
                      language="neutral"
                      versionScope="nonSxS">

                      <ComputerName>SERVER-DC01</ComputerName>

                  </component>
              </settings>

              <settings pass="oobeSystem">
                  <component
                      name="Microsoft-Windows-Shell-Setup"
                      processorArchitecture="amd64"
                      publicKeyToken="31bf3856ad364e35"
                      language="neutral"
                      versionScope="nonSxS">

                      <OOBE>
                          <HideEULAPage>true</HideEULAPage>
                          <HideLocalAccountScreen>true</HideLocalAccountScreen>
                          <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>
                          <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
                          <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
                          <NetworkLocation>Work</NetworkLocation>
                          <ProtectYourPC>1</ProtectYourPC>
                      </OOBE>

                      <UserAccounts>
                          <AdministratorPassword>
                              <Value>CHANGE_ME_ADMIN_PASSWORD</Value>
                              <PlainText>true</PlainText>
                          </AdministratorPassword>
                      </UserAccounts>

                  </component>
              </settings>

          </unattend>
          '@ | Set-Content `
              -Path "$osDrive\Windows\Panther\Unattend.xml" `
              -Encoding UTF8

          $content = Get-Content `
              -Path "$osDrive\Windows\Panther\Unattend.xml" `
              -Raw

          $content = $content.Replace(
              "CHANGE_ME_ADMIN_PASSWORD",
              $env:ADMIN_PASS
          )

          Set-Content `
              -Path "$osDrive\Windows\Panther\Unattend.xml" `
              -Value $content `
              -Encoding UTF8

          bcdboot.exe `
              "$osDrive\Windows" `
              /s $efiDrive `
              /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "BCDBoot failed: $LASTEXITCODE"
          }

          Dismount-DiskImage -ImagePath $env:SERVER_ISO

          Dismount-VHD -Path $vhdx

          Write-Host "[+] SERVER-DC01 VHDX prepared."


      # ============================================================
      # CREATE OUTER NAT
      # ============================================================

      - name: Prepare outer Hyper-V networking
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== OUTER HYPER-V NETWORK =========="

          if (-not (Get-VMSwitch -Name $env:SERVER_SWITCH -ErrorAction SilentlyContinue)) {

              New-VMSwitch `
                  -Name $env:SERVER_SWITCH `
                  -SwitchType Internal | Out-Null

              $adapter = Get-NetAdapter `
                  -Name "vEthernet ($env:SERVER_SWITCH)"

              New-NetIPAddress `
                  -InterfaceIndex $adapter.ifIndex `
                  -IPAddress $env:SERVER_GATEWAY `
                  -PrefixLength 24

              New-NetNat `
                  -Name $env:SERVER_SWITCH `
                  -InternalIPInterfaceAddressPrefix $env:SERVER_PREFIX

              Write-Host "[+] SERVER-NAT created."
          }
          else {
              Write-Host "[*] SERVER-NAT already exists."
          }


      # ============================================================
      # CREATE SERVER-DC01
      # ============================================================

      - name: Create SERVER-DC01
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE SERVER-DC01 =========="

          if (Get-VM -Name $env:SERVER_VM -ErrorAction SilentlyContinue) {
              Stop-VM `
                  -Name $env:SERVER_VM `
                  -TurnOff `
                  -Force `
                  -ErrorAction SilentlyContinue

              Remove-VM `
                  -Name $env:SERVER_VM `
                  -Force
          }

          New-VM `
              -Name $env:SERVER_VM `
              -Generation 2 `
              -MemoryStartupBytes 4GB `
              -VHDPath $env:SERVER_VHDX `
              -SwitchName $env:SERVER_SWITCH | Out-Null

          Set-VMProcessor `
              -VMName $env:SERVER_VM `
              -Count 4 `
              -ExposeVirtualizationExtensions $true

          Set-VMNetworkAdapter `
              -VMName $env:SERVER_VM `
              -MacAddressSpoofing On

          Enable-VMIntegrationService `
              -VMName $env:SERVER_VM `
              -Name "Guest Service Interface"

          try {
              Set-VMFirmware `
                  -VMName $env:SERVER_VM `
                  -EnableSecureBoot On

              Write-Host "[+] Secure Boot: ON"
          }
          catch {
              Write-Warning "Secure Boot could not be enabled: $($_.Exception.Message)"
          }

          try {
              if (Get-Command Set-VMKeyProtector -ErrorAction SilentlyContinue) {
                  Set-VMKeyProtector `
                      -VMName $env:SERVER_VM `
                      -NewLocalKeyProtector

                  Write-Host "[+] Local key protector configured."
              }

              if (Get-Command Enable-VMTPM -ErrorAction SilentlyContinue) {
                  Enable-VMTPM `
                      -VMName $env:SERVER_VM

                  Write-Host "[+] vTPM enabled."
              }
          }
          catch {
              Write-Warning "vTPM/key protector unavailable: $($_.Exception.Message)"
          }

          Write-Host "[+] Nested virtualization: ON"
          Write-Host "[+] MAC spoofing: ON"
          Write-Host "[+] Guest Service Interface: ON"


      # ============================================================
      # VERIFY SECURITY SETTINGS
      # ============================================================

      - name: Verify SERVER-DC01 firmware settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== VERIFY SERVER VM =========="

          Get-VM `
              -Name $env:SERVER_VM |
              Select-Object Name,State,Generation,MemoryStartup

          Get-VMProcessor `
              -VMName $env:SERVER_VM |
              Select-Object VMName,Count,ExposeVirtualizationExtensions

          Get-VMNetworkAdapter `
              -VMName $env:SERVER_VM |
              Select-Object VMName,MacAddressSpoofing

          try {
              Get-VMFirmware `
                  -VMName $env:SERVER_VM |
                  Format-List *
          }
          catch {
              Write-Warning "Get-VMFirmware failed: $($_.Exception.Message)"
          }

          try {
              Get-VMSecurity `
                  -VMName $env:SERVER_VM |
                  Format-List *
          }
          catch {
              Write-Warning "Get-VMSecurity failed: $($_.Exception.Message)"
          }

          Write-Host "[*] Firmware/security verification is informational."


      # ============================================================
      # START SERVER
      # ============================================================

      - name: Start SERVER-DC01
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== START SERVER-DC01 =========="

          Start-VM -Name $env:SERVER_VM | Out-Null

          Write-Host "[+] SERVER-DC01 started."


      # ============================================================
      # WAIT FOR POWERSHELL DIRECT
      # ============================================================

      - name: Wait for SERVER-DC01 PowerShell Direct
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== WAIT FOR SERVER-DC01 =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          $ready = $false

          for ($i = 1; $i -le 120; $i++) {

              try {
                  Invoke-Command `
                      -VMName $env:SERVER_VM `
                      -Credential $cred `
                      -ScriptBlock {
                          "READY"
                      } `
                      -ErrorAction Stop | Out-Null

                  $ready = $true
                  Write-Host "[+] PowerShell Direct ready."
                  break
              }
              catch {
                  Write-Host "[*] Waiting... $i/120"
                  Start-Sleep -Seconds 5
              }
          }

          if (-not $ready) {
              throw "SERVER-DC01 did not become available through PowerShell Direct."


      # ============================================================
      # CONFIGURE SERVER NETWORK
      # ============================================================

      - name: Configure SERVER-DC01 network
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CONFIGURE SERVER NETWORK =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  param(
                      $ServerIP,
                      $Gateway
                  )

                  $adapter = Get-NetAdapter |
                      Where-Object Status -eq "Up" |
                      Select-Object -First 1

                  if (-not $adapter) {
                      throw "No active network adapter found."
                  }

                  Get-NetIPAddress `
                      -InterfaceIndex $adapter.ifIndex `
                      -AddressFamily IPv4 `
                      -ErrorAction SilentlyContinue |
                      Where-Object {
                          $_.IPAddress -ne "127.0.0.1"
                      } |
                      Remove-NetIPAddress `
                          -Confirm:$false `
                          -ErrorAction SilentlyContinue

                  New-NetIPAddress `
                      -InterfaceIndex $adapter.ifIndex `
                      -IPAddress $ServerIP `
                      -PrefixLength 24 `
                      -DefaultGateway $Gateway `
                      -ErrorAction Stop | Out-Null

                  Set-DnsClientServerAddress `
                      -InterfaceIndex $adapter.ifIndex `
                      -ServerAddresses @("127.0.0.1","8.8.8.8")

                  Write-Host "[+] IP: $ServerIP"
                  Write-Host "[+] Gateway: $Gateway"

              } `
              -ArgumentList `
                  $env:SERVER_IP,
                  $env:SERVER_GATEWAY


      # ============================================================
      # INSTALL NESTED HYPER-V
      # ============================================================

      - name: Install nested Hyper-V
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== INSTALL NESTED HYPER-V =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  $feature = Get-WindowsFeature Hyper-V

                  if (-not $feature.Installed) {

                      Install-WindowsFeature `
                          Hyper-V `
                          -IncludeManagementTools

                      Write-Host "[+] Hyper-V installed."
                  }
                  else {
                      Write-Host "[*] Hyper-V already installed."
                  }

              }

          Write-Host "[*] Waiting for SERVER-DC01 reboot..."

          Start-Sleep -Seconds 20

          $ready = $false

          for ($i = 1; $i -le 120; $i++) {

              try {
                  Invoke-Command `
                      -VMName $env:SERVER_VM `
                      -Credential $cred `
                      -ScriptBlock { "READY" } `
                      -ErrorAction Stop | Out-Null

                  $ready = $true
                  break
              }
              catch {
                  Write-Host "[*] Waiting after Hyper-V reboot... $i/120"
                  Start-Sleep -Seconds 5
              }
          }

          if (-not $ready) {
              throw "SERVER-DC01 did not return after Hyper-V installation."


      # ============================================================
      # INSTALL AD DS / DNS
      # ============================================================

      - name: Install AD DS and DNS
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== INSTALL AD DS + DNS =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  Install-WindowsFeature `
                      AD-Domain-Services `
                      DNS `
                      -IncludeManagementTools

                  Import-Module ADDSDeployment

                  $safeModePassword = ConvertTo-SecureString `
                      $using:env:ADMIN_PASS `
                      -AsPlainText `
                      -Force

                  Install-ADDSForest `
                      -DomainName $using:env:AD_DOMAIN `
                      -DomainNetbiosName $using:env:AD_NETBIOS `
                      -SafeModeAdministratorPassword $safeModePassword `
                      -InstallDns `
                      -CreateDnsDelegation:$false `
                      -DatabasePath "C:\Windows\NTDS" `
                      -LogPath "C:\Windows\NTDS" `
                      -SysvolPath "C:\Windows\SYSVOL" `
                      -NoRebootOnCompletion:$false `
                      -Force

              }

          Start-Sleep -Seconds 30


      # ============================================================
      # WAIT AFTER DOMAIN CONTROLLER PROMOTION
      # ============================================================

      - name: Wait for domain controller
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== WAIT FOR DOMAIN CONTROLLER =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          $ready = $false

          for ($i = 1; $i -le 180; $i++) {

              try {
                  $result = Invoke-Command `
                      -VMName $env:SERVER_VM `
                      -Credential $cred `
                      -ScriptBlock {

                          Get-Service `
                              -Name NTDS `
                              -ErrorAction Stop |
                              Select-Object -ExpandProperty Status
                      } `
                      -ErrorAction Stop

                  if ($result -eq "Running") {
                      $ready = $true
                      Write-Host "[+] NTDS is running."
                      break
                  }
              }
              catch {
              }

              Write-Host "[*] Waiting for AD DS... $i/180"
              Start-Sleep -Seconds 5
          }

          if (-not $ready) {
              throw "AD DS did not become ready."


      # ============================================================
      # CREATE NESTED RDS NAT + DHCP
      # ============================================================

      - name: Configure nested RDS NAT and DHCP
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== CONFIGURE RDS-NAT =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  $switch = Get-VMSwitch `
                      -Name $using:env:RDS_SWITCH `
                      -ErrorAction SilentlyContinue

                  if (-not $switch) {
                      New-VMSwitch `
                          -Name $using:env:RDS_SWITCH `
                          -SwitchType Internal | Out-Null
                  }

                  $adapter = Get-NetAdapter `
                      -Name "vEthernet ($using:env:RDS_SWITCH)" `
                      -ErrorAction Stop

                  $existing = Get-NetIPAddress `
                      -InterfaceIndex $adapter.ifIndex `
                      -AddressFamily IPv4 `
                      -ErrorAction SilentlyContinue |
                      Where-Object IPAddress -eq $using:env:RDS_GATEWAY

                  if (-not $existing) {
                      New-NetIPAddress `
                          -InterfaceIndex $adapter.ifIndex `
                          -IPAddress $using:env:RDS_GATEWAY `
                          -PrefixLength 24 `
                          -ErrorAction Stop | Out-Null
                  }

                  if (-not (Get-NetNat -Name $using:env:RDS_SWITCH -ErrorAction SilentlyContinue)) {
                      New-NetNat `
                          -Name $using:env:RDS_SWITCH `
                          -InternalIPInterfaceAddressPrefix $using:env:RDS_PREFIX
                  }

                  Write-Host "[+] RDS-NAT ready."

                  # DHCP is used because the RDS broker-created
                  # pooled desktops cannot all have one static address.

                  if (-not (Get-WindowsFeature DHCP).Installed) {
                      Install-WindowsFeature `
                          DHCP `
                          -IncludeManagementTools
                  }

                  Import-Module DhcpServer

                  try {
                      Add-DhcpServerInDC `
                          -DnsName $env:COMPUTERNAME `
                          -IPAddress $using:env:SERVER_IP `
                          -ErrorAction SilentlyContinue
                  }
                  catch {
                  }

                  $scope = Get-DhcpServerv4Scope `
                      -ScopeId 192.168.252.0 `
                      -ErrorAction SilentlyContinue

                  if (-not $scope) {

                      Add-DhcpServerv4Scope `
                          -Name "RDS-NAT Scope" `
                          -StartRange 192.168.252.100 `
                          -EndRange 192.168.252.200 `
                          -SubnetMask 255.255.255.0 `
                          -State Active

                      Add-DhcpServerv4ExclusionRange `
                          -ScopeId 192.168.252.0 `
                          -StartRange 192.168.252.1 `
                          -EndRange 192.168.252.99

                      Set-DhcpServerv4OptionValue `
                          -ScopeId 192.168.252.0 `
                          -Router 192.168.252.1 `
                          -DnsServer 192.168.252.1 `
                          -DnsDomain $using:env:AD_DOMAIN
                  }

                  Restart-Service DHCPServer -ErrorAction SilentlyContinue

                  Write-Host "[+] DHCP configured."
              }


      # ============================================================
      # VERIFY AD
      # ============================================================

      - name: Verify AD DS and DNS
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== VERIFY AD DS + DNS =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  Write-Host "--- Computer ---"
                  Get-CimInstance Win32_ComputerSystem |
                      Select-Object Name,Domain,PartOfDomain

                  Write-Host "--- AD Domain ---"

                  try {
                      Import-Module ActiveDirectory

                      Get-ADDomain |
                          Select-Object DNSRoot,NetBIOSName,DomainMode
                  }
                  catch {
                      Write-Warning $_.Exception.Message
                  }

                  Write-Host "--- Services ---"

                  Get-Service NTDS,DNS,Netlogon |
                      Select-Object Name,Status

                  Write-Host "--- DNS ---"

                  Resolve-DnsName `
                      $using:env:AD_DOMAIN `
                      -ErrorAction Continue
              }


      # ============================================================
      # COPY CLIENT VHDX INTO L1
      # ============================================================

      - name: Copy VDI master VHDX into SERVER-DC01
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== COPY VDI MASTER INTO L1 =========="

          $secure = ConvertTo-SecureString `
              "${{ secrets.ADMIN_PASS }}" `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  New-Item `
                      -Path "C:\VDI\Templates" `
                      -ItemType Directory `
                      -Force | Out-Null

                  New-Item `
                      -Path "C:\VDI\Collections" `
                      -ItemType Directory `
                      -Force | Out-Null

              }

          Enable-VMIntegrationService `
              -VMName $env:SERVER_VM `
              -Name "Guest Service Interface"

          Copy-VMFile `
              -Name $env:SERVER_VM `
              -SourcePath $env:CLIENT_VHDX `
              -DestinationPath $env:TEMPLATE_VHDX `
              -FileSource Host `
              -CreateFullPath

          Write-Host "[+] Client VHDX copied into SERVER-DC01."


      # ============================================================
      # CREATE ONLY THE RDS TEMPLATE VM
      # ============================================================

      - name: Create RDS master template VM
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE RDS MASTER TEMPLATE =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  if (Get-VM `
                      -Name $using:env:TEMPLATE_VM `
                      -ErrorAction SilentlyContinue) {

                      Stop-VM `
                          -Name $using:env:TEMPLATE_VM `
                          -TurnOff `
                          -Force `
                          -ErrorAction SilentlyContinue

                      Remove-VM `
                          -Name $using:env:TEMPLATE_VM `
                          -Force
                  }

                  New-VM `
                      -Name $using:env:TEMPLATE_VM `
                      -Generation 2 `
                      -MemoryStartupBytes 2GB `
                      -VHDPath $using:env:TEMPLATE_VHDX `
                      -SwitchName $using:env:RDS_SWITCH | Out-Null

                  Set-VMProcessor `
                      -VMName $using:env:TEMPLATE_VM `
                      -Count 2

                  Set-VMFirmware `
                      -VMName $using:env:TEMPLATE_VM `
                      -EnableSecureBoot On `
                      -ErrorAction SilentlyContinue

                  Set-VMNetworkAdapter `
                      -VMName $using:env:TEMPLATE_VM `
                      -MacAddressSpoofing On

                  Write-Host "[+] RDS-Master-Template created."
                  Write-Host "[*] This VM is the template only."
                  Write-Host "[*] RDS-Test-01 will NOT be created with New-VM."
              }


      # ============================================================
      # BOOT TEMPLATE AND SYSPREP
      # ============================================================

      - name: Prepare RDS template with Sysprep
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== PREPARE RDS TEMPLATE =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  Start-VM `
                      -Name $using:env:TEMPLATE_VM `
                      -ErrorAction SilentlyContinue

              }

          Start-Sleep -Seconds 15

          $templateReady = $false

          for ($i = 1; $i -le 120; $i++) {

              try {

                  $result = Invoke-Command `
                      -VMName $env:SERVER_VM `
                      -Credential $cred `
                      -ScriptBlock {

                          Get-VM `
                              -Name $using:env:TEMPLATE_VM |
                              Select-Object -ExpandProperty State

                      } `
                      -ErrorAction Stop

                  if ($result -eq "Running") {
                      $templateReady = $true
                      break
                  }

              }
              catch {
              }

              Start-Sleep -Seconds 5
          }

          if (-not $templateReady) {
              throw "RDS-Master-Template did not start."


          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  Write-Host "[*] Waiting for template guest..."

                  for ($i = 1; $i -le 120; $i++) {

                      try {

                          $session = New-PSSession `
                              -VMName $using:env:TEMPLATE_VM `
                              -Credential $using:cred `
                              -ErrorAction Stop

                          Write-Host "[+] Template guest is accessible."
                          Remove-PSSession $session
                          break

                      }
                      catch {
                          Start-Sleep -Seconds 5
                      }
                  }

                  try {

                      Invoke-Command `
                          -VMName $using:env:TEMPLATE_VM `
                          -Credential $using:cred `
                          -ScriptBlock {

                              Write-Host "[*] Running Sysprep..."

                              Start-Process `
                                  "$env:WINDIR\System32\Sysprep\Sysprep.exe" `
                                  -ArgumentList `
                                      "/generalize /oobe /shutdown /quiet" `
                                  -Wait

                          }

                  }
                  catch {
                      Write-Warning "Template Sysprep invocation returned: $($_.Exception.Message)"
                  }

              }


      # ============================================================
      # DEPLOY NATIVE RDS VDI
      # ============================================================

      - name: Deploy native RDS VDI
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== DEPLOY NATIVE RDS VDI =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  Import-Module RemoteDesktop -ErrorAction Stop

                  $fqdn = "$env:COMPUTERNAME.$using:env:AD_DOMAIN"

                  Write-Host "[+] Connection Broker: $fqdn"
                  Write-Host "[+] Web Access:        $fqdn"
                  Write-Host "[+] RD Virtualization: $fqdn"

                  $deployment = Get-RDDeployment `
                      -ConnectionBroker $fqdn `
                      -ErrorAction SilentlyContinue

                  if (-not $deployment) {

                      Write-Host "[*] Creating native VDI deployment..."

                      New-RDVirtualDesktopDeployment `
                          -ConnectionBroker $fqdn `
                          -VirtualizationHost $fqdn `
                          -WebAccessServer $fqdn `
                          -ErrorAction Stop

                      Write-Host "[+] Native RDS VDI deployment created."

                  }
                  else {
                      Write-Host "[*] RDS deployment already exists."
                  }

              }


      # ============================================================
      # CONFIGURE RDS VIRTUALIZATION SERVER
      # ============================================================

      - name: Configure RD Virtualization Host
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== CONFIGURE RD VIRTUALIZATION HOST =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  Import-Module RemoteDesktop

                  $fqdn = "$env:COMPUTERNAME.$using:env:AD_DOMAIN"

                  try {

                      $servers = Get-RDServer `
                          -ConnectionBroker $fqdn `
                          -ErrorAction Stop

                      $servers |
                          Format-Table `
                              Server,Roles `
                              -AutoSize

                  }
                  catch {
                      Write-Warning $_.Exception.Message
                  }

              }


      # ============================================================
      # CREATE MANAGED POOLED COLLECTION
      # ============================================================

      - name: Create managed pooled VDI collection
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== CREATE MANAGED POOLED VDI =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  Import-Module RemoteDesktop

                  $fqdn = "$env:COMPUTERNAME.$using:env:AD_DOMAIN"

                  Write-Host "[+] Template host: $fqdn"
                  Write-Host "[+] Template:      $using:env:TEMPLATE_VM"
                  Write-Host "[+] Allocation:    1 desktop on $fqdn"

                  $existing = Get-RDVirtualDesktopCollection `
                      -ConnectionBroker $fqdn `
                      -CollectionName $using:env:RDS_COLLECTION `
                      -ErrorAction SilentlyContinue

                  if (-not $existing) {

                      $allocation = @{
                          $fqdn = 1
                      }

                      New-RDVirtualDesktopCollection `
                          -CollectionName $using:env:RDS_COLLECTION `
                          -PooledManaged `
                          -VirtualDesktopTemplateName $using:env:TEMPLATE_VM `
                          -VirtualDesktopTemplateHostServer $fqdn `
                          -VirtualDesktopAllocation $allocation `
                          -StorageType LocalStorage `
                          -LocalStoragePath $using:env:RDS_STORAGE `
                          -VirtualDesktopTemplateStoragePath $using:env:RDS_TEMPLATE_STORAGE `
                          -Domain $using:env:AD_DOMAIN `
                          -Description "Native managed pooled Windows VDI collection" `
                          -UserGroups "$using:env:AD_NETBIOS\Domain Users" `
                          -ConnectionBroker $fqdn `
                          -VirtualDesktopNamePrefix $using:env:RDS_VM_PREFIX `
                          -VirtualDesktopPasswordAge 0 `
                          -Force

                      Write-Host "[+] Managed pooled collection created."
                      Write-Host "[*] RDS Broker is now responsible for creating RDS-Test-01."

                  }
                  else {
                      Write-Host "[*] Collection already exists."
                  }

              }


      # ============================================================
      # WAIT FOR BROKER-CREATED DESKTOP
      # ============================================================

      - name: Wait for RDS broker-created desktop
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== WAIT FOR RDS BROKER DESKTOP =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          $found = $false

          for ($i = 1; $i -le 180; $i++) {

              try {

                  $desktops = Invoke-Command `
                      -VMName $env:SERVER_VM `
                      -Credential $cred `
                      -ScriptBlock {

                          Import-Module RemoteDesktop

                          $fqdn = "$env:COMPUTERNAME.$using:env:AD_DOMAIN"

                          Get-RDVirtualDesktop `
                              -CollectionName $using:env:RDS_COLLECTION `
                              -ConnectionBroker $fqdn `
                              -ErrorAction Stop |
                              Select-Object `
                                  VirtualDesktopName,
                                  VirtualDesktopStatus

                      } `
                      -ErrorAction Stop

                  if ($desktops) {

                      Write-Host ""
                      Write-Host "========== RDS DESKTOPS =========="

                      $desktops |
                          Format-Table -AutoSize

                      if (
                          $desktops |
                          Where-Object {
                              $_.VirtualDesktopName -like "$using:env:RDS_VM_PREFIX*"
                          }
                      ) {
                          $found = $true
                          break
                      }
                  }

              }
              catch {
                  Write-Host "[*] Broker still creating desktop... $i/180"
              }

              Start-Sleep -Seconds 5
          }

          if (-not $found) {
              Write-Warning "RDS did not report a pooled desktop within the timeout."
              Write-Warning "The workflow will continue so the broker state can be inspected."
          }


      # ============================================================
      # PUBLISH RD DESKTOP
      # ============================================================

      - name: Publish VDI collection to RD Web Access
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== PUBLISH RDS COLLECTION =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  Import-Module RemoteDesktop

                  $fqdn = "$env:COMPUTERNAME.$using:env:AD_DOMAIN"

                  try {

                      Set-RDRemoteDesktop `
                          -CollectionName $using:env:RDS_COLLECTION `
                          -ShowInWebAccess $true `
                          -ConnectionBroker $fqdn `
                          -ErrorAction Stop

                      Write-Host "[+] Collection published to RD Web Access."

                  }
                  catch {
                      Write-Warning $_.Exception.Message
                  }

              }


      # ============================================================
      # REMOVE IIS REQUIRE SSL FROM ENTIRE RDWeb ZONE
      # ============================================================

      - name: Disable IIS Require SSL for entire RDWeb zone
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== DISABLE IIS REQUIRE SSL FOR RDWeb =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  Import-Module WebAdministration

                  Write-Host "[*] Searching IIS for RDWeb..."

                  $site = Get-Website `
                      -Name "Default Web Site" `
                      -ErrorAction SilentlyContinue

                  if (-not $site) {
                      Write-Warning "Default Web Site not found."
                      return
                  }

                  # ------------------------------------------------
                  # ROOT RDWeb
                  # ------------------------------------------------

                  $locations = New-Object `
                      System.Collections.Generic.List[string]

                  $locations.Add(
                      "Default Web Site/RDWeb"
                  )

                  # ------------------------------------------------
                  # IIS applications under RDWeb
                  # ------------------------------------------------

                  try {

                      Get-WebApplication `
                          -Site "Default Web Site" |
                          Where-Object {
                              $_.Path -like "/RDWeb*"
                          } |
                          ForEach-Object {

                              $location =
                                  "Default Web Site" +
                                  $_.Path

                              if (
                                  -not $locations.Contains($location)
                              ) {
                                  $locations.Add($location)
                              }
                          }

                  }
                  catch {
                      Write-Warning "Could not enumerate IIS applications: $($_.Exception.Message)"
                  }

                  # ------------------------------------------------
                  # IIS virtual directories under RDWeb
                  # ------------------------------------------------

                  try {

                      Get-WebVirtualDirectory `
                          -Site "Default Web Site" |
                          Where-Object {
                              $_.Path -like "/RDWeb*"
                          } |
                          ForEach-Object {

                              $location =
                                  "Default Web Site" +
                                  $_.Path

                              if (
                                  -not $locations.Contains($location)
                              ) {
                                  $locations.Add($location)
                              }
                          }

                  }
                  catch {
                      Write-Warning "Could not enumerate IIS virtual directories: $($_.Exception.Message)"
                  }

                  # ------------------------------------------------
                  # APPLY sslFlags=None
                  # ------------------------------------------------

                  foreach ($location in $locations) {

                      try {

                          Set-WebConfigurationProperty `
                              -PSPath "IIS:\" `
                              -Filter "system.webServer/security/access" `
                              -Name "sslFlags" `
                              -Value "None" `
                              -Location $location `
                              -Force `
                              -ErrorAction Stop

                          Write-Host "[+] Require SSL disabled: $location"

                      }
                      catch {

                          Write-Warning `
                              "[-] Failed: $location : $($_.Exception.Message)"
                      }
                  }

                  # ------------------------------------------------
                  # VERIFY
                  # ------------------------------------------------

                  Write-Host ""
                  Write-Host "========== VERIFY RDWeb SSL SETTINGS =========="

                  foreach ($location in $locations) {

                      try {

                          $value = Get-WebConfigurationProperty `
                              -PSPath "IIS:\" `
                              -Filter "system.webServer/security/access" `
                              -Name "sslFlags" `
                              -Location $location `
                              -ErrorAction Stop

                          Write-Host "$location -> sslFlags=$value"

                      }
                      catch {
                          Write-Warning "Could not read: $location"
                      }
                  }

                  iisreset /noforce

                  Write-Host "[+] IIS RDWeb Require SSL processing completed."

              }


      # ============================================================
      # FINAL RDS STATUS
      # ============================================================

      - name: Final RDS status
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 FINAL VDI STATUS"
          Write-Host "============================================================"

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator",$secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  Write-Host ""
                  Write-Host "----- Nested Hyper-V -----"

                  Get-VMSwitch |
                      Select-Object Name,SwitchType

                  Get-VM |
                      Select-Object `
                          Name,
                          State,
                          Generation,
                          CPUUsage,
                          MemoryAssigned |
                      Format-Table -AutoSize

                  Write-Host ""
                  Write-Host "----- RDS Deployment -----"

                  Import-Module RemoteDesktop

                  $fqdn = "$env:COMPUTERNAME.$using:env:AD_DOMAIN"

                  try {

                      Get-RDServer `
                          -ConnectionBroker $fqdn |
                          Format-Table `
                              Server,
                              Roles `
                              -AutoSize

                  }
                  catch {
                      Write-Warning $_.Exception.Message
                  }

                  Write-Host ""
                  Write-Host "----- RDS Collections -----"

                  try {

                      Get-RDVirtualDesktopCollection `
                          -ConnectionBroker $fqdn |
                          Format-Table `
                              CollectionName,
                              CollectionDescription `
                              -AutoSize

                  }
                  catch {
                      Write-Warning $_.Exception.Message
                  }

                  Write-Host ""
                  Write-Host "----- RDS Virtual Desktops -----"

                  try {

                      Get-RDVirtualDesktop `
                          -CollectionName $using:env:RDS_COLLECTION `
                          -ConnectionBroker $fqdn |
                          Format-Table `
                              VirtualDesktopName,
                              VirtualDesktopStatus `
                              -AutoSize

                  }
                  catch {
                      Write-Warning $_.Exception.Message
                  }

                  Write-Host ""
                  Write-Host "----- IIS RDWeb -----"

                  try {

                      Import-Module WebAdministration

                      Get-WebApplication `
                          -Site "Default Web Site" |
                          Where-Object Path -like "/RDWeb*" |
                          Select-Object Path,PhysicalPath

                  }
                  catch {
                      Write-Warning $_.Exception.Message
                  }

              }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "SERVER-DC01 : 192.168.251.10"
          Write-Host "RDS-NAT     : 192.168.252.1/24"
          Write-Host "RDS pool    : $env:RDS_COLLECTION"
          Write-Host "Template    : $env:TEMPLATE_VM"
          Write-Host "Desktop     : created by RDS Broker"
          Write-Host "============================================================"


      # ============================================================
      # KEEP RUNNER ALIVE
      # ============================================================

      - name: Keep lab alive
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "LAB IS RUNNING"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "SERVER-DC01 is running."
          Write-Host "Nested Hyper-V is running."
          Write-Host "RDS VDI deployment is configured."
          Write-Host "RDS managed pooled collection is configured."
          Write-Host "RDS Broker is responsible for pooled desktop creation."
          Write-Host "IIS RDWeb Require SSL was disabled."
          Write-Host ""

          Start-Sleep -Seconds 300
