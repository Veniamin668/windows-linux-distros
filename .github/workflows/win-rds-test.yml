name: Deploy Windows Native VDI

on:
  workflow_dispatch:
    inputs:

      iso_url:
        description: "Direct Windows ISO URL"
        required: true
        type: string

      wim_index:
        description: "Windows image index"
        required: true
        default: "1"
        type: string

      server_iso_url:
        description: "Direct Windows Server ISO URL for SERVER-DC01"
        required: true
        type: string

      server_wim_index:
        description: "Windows Server image index"
        required: true
        default: "4"
        type: string

      ad_domain:
        description: "AD DS forest/domain name"
        required: true
        default: "vdi.test"
        type: string

      ad_netbios:
        description: "AD NetBIOS name"
        required: true
        default: "VDI"
        type: string

jobs:

  deploy-vdi:

    runs-on: windows-latest
    timeout-minutes: 360

    env:
      WORK_DIR: ${{ github.workspace }}

      WINDOWS_ISO_URL: ${{ inputs.iso_url }}
      WINDOWS_WIM_INDEX: ${{ inputs.wim_index }}

      SERVER_ISO_URL: ${{ inputs.server_iso_url }}
      SERVER_WIM_INDEX: ${{ inputs.server_wim_index }}

      AD_DOMAIN: ${{ inputs.ad_domain }}
      AD_NETBIOS: ${{ inputs.ad_netbios }}

      SERVER_ADMIN_PASSWORD: ${{ secrets.SERVER_ADMIN_PASSWORD }}

    steps:

      # ============================================================
      # 1. PREPARE WORKSPACE
      # ============================================================

      - name: Prepare workspace
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                  PREPARE WORKSPACE"
          Write-Host "============================================================"

          New-Item `
            -ItemType Directory `
            -Path $env:WORK_DIR `
            -Force | Out-Null

          Write-Host "[+] Workspace:"
          Write-Host $env:WORK_DIR


      # ============================================================
      # 2. DOWNLOAD WINDOWS ISO
      # ============================================================

      - name: Download Windows ISO
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                   DOWNLOAD WINDOWS ISO"
          Write-Host "============================================================"

          $iso = Join-Path `
            $env:WORK_DIR `
            "windows.iso"

          if (Test-Path $iso) {
              Remove-Item $iso -Force
          }

          & curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 5 `
            --retry-all-errors `
            -C - `
            -o $iso `
            $env:WINDOWS_ISO_URL

          if ($LASTEXITCODE -ne 0) {
              throw "Windows ISO download failed."
          }

          if (-not (Test-Path $iso)) {
              throw "Windows ISO was not created."
          }

          Write-Host "[+] Windows ISO downloaded."

          "WINDOWS_ISO=$iso" >> $env:GITHUB_ENV


      # ============================================================
      # 3. MOUNT WINDOWS ISO
      # ============================================================

      - name: Mount Windows ISO
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                    MOUNT WINDOWS ISO"
          Write-Host "============================================================"

          Dismount-DiskImage `
            -ImagePath $env:WINDOWS_ISO `
            -ErrorAction SilentlyContinue

          Mount-DiskImage `
            -ImagePath $env:WINDOWS_ISO

          $image = Get-DiskImage `
            -ImagePath $env:WINDOWS_ISO

          $volume = $image |
            Get-Volume |
            Where-Object {
              $_.DriveLetter
            } |
            Select-Object -First 1

          if (-not $volume) {
              throw "Could not determine Windows ISO drive."
          }

          $drive = "$($volume.DriveLetter):"

          Write-Host "[+] Windows ISO mounted at $drive"

          "WINDOWS_ISO_DRIVE=$drive" >> $env:GITHUB_ENV


      # ============================================================
      # 4. FIND WINDOWS IMAGE
      # ============================================================

      - name: Locate Windows image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                  LOCATE WINDOWS IMAGE"
          Write-Host "============================================================"

          $wim = Join-Path `
            $env:WINDOWS_ISO_DRIVE `
            "sources\install.wim"

          $esd = Join-Path `
            $env:WINDOWS_ISO_DRIVE `
            "sources\install.esd"

          if (Test-Path $wim) {
              $image = $wim
          }
          elseif (Test-Path $esd) {
              $image = $esd
          }
          else {
              throw "install.wim/install.esd not found."
          }

          & dism.exe `
            /Get-WimInfo `
            "/WimFile:$image"

          if ($LASTEXITCODE -ne 0) {
              throw "DISM /Get-WimInfo failed."
          }

          "WINDOWS_IMAGE_FILE=$image" >> $env:GITHUB_ENV


      # ============================================================
      # 5. CREATE VDI MASTER VHDX
      # ============================================================

      - name: Create VDI master VHDX
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                  CREATE VDI MASTER VHDX"
          Write-Host "============================================================"

          $vhdx = Join-Path `
            $env:WORK_DIR `
            "Windows-VDI-Master.vhdx"

          if (Test-Path $vhdx) {
              Remove-Item $vhdx -Force
          }

          New-VHD `
            -Path $vhdx `
            -SizeBytes 60GB `
            -Dynamic | Out-Null

          $disk = Mount-VHD `
            -Path $vhdx `
            -Passthru

          Initialize-Disk `
            -Number $disk.Number `
            -PartitionStyle GPT

          $efi = New-Partition `
            -DiskNumber $disk.Number `
            -Size 100MB `
            -GptType "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"

          Format-Volume `
            -Partition $efi `
            -FileSystem FAT32 `
            -NewFileSystemLabel "SYSTEM" `
            -Confirm:$false | Out-Null

          $osPartition = New-Partition `
            -DiskNumber $disk.Number `
            -UseMaximumSize `
            -AssignDriveLetter

          Format-Volume `
            -Partition $osPartition `
            -FileSystem NTFS `
            -NewFileSystemLabel "WINDOWS" `
            -Confirm:$false | Out-Null

          $osDrive = "$($osPartition.DriveLetter):"

          Write-Host "[+] Disk: $($disk.Number)"
          Write-Host "[+] OS:   $osDrive"

          "MASTER_VHDX=$vhdx" >> $env:GITHUB_ENV
          "MASTER_DISK=$($disk.Number)" >> $env:GITHUB_ENV
          "MASTER_OS=$osDrive" >> $env:GITHUB_ENV


      # ============================================================
      # 6. APPLY VDI WINDOWS IMAGE
      # ============================================================

      - name: Apply VDI Windows image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                 APPLY VDI WINDOWS IMAGE"
          Write-Host "============================================================"

          & dism.exe `
            /Apply-Image `
            "/ImageFile:$env:WINDOWS_IMAGE_FILE" `
            "/Index:$env:WINDOWS_WIM_INDEX" `
            "/ApplyDir:$env:MASTER_OS" `
            /CheckIntegrity

          if ($LASTEXITCODE -ne 0) {
              throw "DISM /Apply-Image failed."
          }

          Write-Host "[+] VDI Windows image applied."


      # ============================================================
      # 7. CONFIGURE VDI BOOT
      # ============================================================

      - name: Configure VDI boot files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $diskNumber = [int]$env:MASTER_DISK

          $efiPartition = Get-Partition `
            -DiskNumber $diskNumber |
            Where-Object {
              $_.GptType -eq
              "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"
            } |
            Select-Object -First 1

          if (-not $efiPartition) {
              throw "EFI partition not found."
          }

          $partitionNumber = $efiPartition.PartitionNumber

          $diskpartFile = Join-Path `
            $env:WORK_DIR `
            "vdi-diskpart.txt"

          @(
              "select disk $diskNumber"
              "select partition $partitionNumber"
              "assign letter=S"
              "exit"
          ) | Set-Content `
                -Path $diskpartFile `
                -Encoding ASCII

          & diskpart.exe /s $diskpartFile

          if ($LASTEXITCODE -ne 0) {
              throw "diskpart failed."
          }

          & bcdboot.exe `
            "$env:MASTER_OS\Windows" `
            /s S: `
            /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "BCDBOOT failed."
          }

          Write-Host "[+] VDI boot configured."


      # ============================================================
      # 8. VDI IMAGE CLEANUP
      # ============================================================

      - name: Cleanup VDI image
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "                    VDI IMAGE CLEANUP"
          Write-Host "============================================================"

          dism.exe `
            "/Image:$env:MASTER_OS" `
            /Cleanup-Image `
            /StartComponentCleanup


      # ============================================================
      # 9. DISMOUNT VDI MASTER
      # ============================================================

      - name: Dismount VDI master
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Dismount-VHD `
            -Path $env:MASTER_VHDX

          Write-Host "[+] VDI master VHDX dismounted."


      # ============================================================
      # 10. INSTALL RDS ROLES ON HOST
      # ============================================================

      - name: Install RDS roles
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                     INSTALL RDS ROLES"
          Write-Host "============================================================"

          Install-WindowsFeature `
            RDS-Connection-Broker, `
            RDS-Web-Access, `
            RDS-Virtualization `
            -IncludeManagementTools `
            -Restart:$false

          Write-Host "[+] RDS roles installed on Hyper-V host."


      # ============================================================
      # 11. VERIFY RDS ROLES
      # ============================================================

      - name: Verify RDS roles
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Get-WindowsFeature |
            Where-Object {
              $_.Name -in @(
                "RDS-Connection-Broker",
                "RDS-Web-Access",
                "RDS-Virtualization"
              )
            } |
            Format-Table Name,InstallState


      # ============================================================
      # 12. CREATE VDI-NAT
      # ============================================================

      - name: Create VDI-NAT
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $switchName = "VDI-NAT"
          $gateway = "192.168.250.1"
          $prefix = "192.168.250.0/24"

          if (-not (Get-VMSwitch -Name $switchName -ErrorAction SilentlyContinue)) {

              New-VMSwitch `
                -Name $switchName `
                -SwitchType Internal | Out-Null
          }

          $adapter = Get-NetAdapter `
            -Name "vEthernet ($switchName)" `
            -ErrorAction Stop

          $ip = Get-NetIPAddress `
            -InterfaceIndex $adapter.ifIndex `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.IPAddress -eq $gateway
            }

          if (-not $ip) {

              New-NetIPAddress `
                -InterfaceIndex $adapter.ifIndex `
                -IPAddress $gateway `
                -PrefixLength 24 `
                -AddressFamily IPv4 | Out-Null
          }

          if (-not (Get-NetNat -Name $switchName -ErrorAction SilentlyContinue)) {

              New-NetNat `
                -Name $switchName `
                -InternalIPInterfaceAddressPrefix $prefix | Out-Null
          }

          "VDI_SWITCH=$switchName" >> $env:GITHUB_ENV

          Write-Host "[+] VDI-NAT ready."


      # ============================================================
      # 13. CREATE RDS MASTER VM
      # ============================================================

      - name: Create RDS master template
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $vmName = "RDS-Master-Template"

          if (Get-VM -Name $vmName -ErrorAction SilentlyContinue) {

              Stop-VM `
                -Name $vmName `
                -TurnOff `
                -Force `
                -ErrorAction SilentlyContinue

              Remove-VM `
                -Name $vmName `
                -Force
          }

          New-VM `
            -Name $vmName `
            -Generation 2 `
            -MemoryStartupBytes 4GB `
            -VHDPath $env:MASTER_VHDX `
            -SwitchName $env:VDI_SWITCH | Out-Null

          Set-VM `
            -Name $vmName `
            -AutomaticStopAction TurnOff `
            -AutomaticStartAction Nothing

          Stop-VM `
            -Name $vmName `
            -TurnOff `
            -Force `
            -ErrorAction SilentlyContinue

          "MASTER_VM=$vmName" >> $env:GITHUB_ENV

          Get-VM -Name $vmName |
            Select-Object Name,State,Generation,MemoryStartup |
            Format-Table


      # ============================================================
      # ============================================================
      #
      #                SERVER-DC01 SECTION
      #
      # ============================================================
      # ============================================================


      # ============================================================
      # 14. DOWNLOAD WINDOWS SERVER ISO
      # ============================================================

      - name: Download Windows Server ISO
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "              DOWNLOAD WINDOWS SERVER ISO"
          Write-Host "============================================================"

          $iso = Join-Path `
            $env:WORK_DIR `
            "windows-server.iso"

          if (Test-Path $iso) {
              Remove-Item $iso -Force
          }

          & curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 5 `
            --retry-all-errors `
            -C - `
            -o $iso `
            $env:SERVER_ISO_URL

          if ($LASTEXITCODE -ne 0) {
              throw "Windows Server ISO download failed."
          }

          if (-not (Test-Path $iso)) {
              throw "Windows Server ISO was not created."
          }

          Write-Host "[+] Server ISO downloaded."

          "SERVER_ISO=$iso" >> $env:GITHUB_ENV


      # ============================================================
      # 15. MOUNT SERVER ISO
      # ============================================================

      - name: Mount Windows Server ISO
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Dismount-DiskImage `
            -ImagePath $env:SERVER_ISO `
            -ErrorAction SilentlyContinue

          Mount-DiskImage `
            -ImagePath $env:SERVER_ISO

          $image = Get-DiskImage `
            -ImagePath $env:SERVER_ISO

          $volume = $image |
            Get-Volume |
            Where-Object {
              $_.DriveLetter
            } |
            Select-Object -First 1

          if (-not $volume) {
              throw "Could not determine Server ISO drive."
          }

          $drive = "$($volume.DriveLetter):"

          Write-Host "[+] Server ISO mounted at $drive"

          "SERVER_ISO_DRIVE=$drive" >> $env:GITHUB_ENV


      # ============================================================
      # 16. LOCATE SERVER IMAGE
      # ============================================================

      - name: Locate Windows Server image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "             LOCATE WINDOWS SERVER IMAGE"
          Write-Host "============================================================"

          $wim = Join-Path `
            $env:SERVER_ISO_DRIVE `
            "sources\install.wim"

          $esd = Join-Path `
            $env:SERVER_ISO_DRIVE `
            "sources\install.esd"

          if (Test-Path $wim) {
              $image = $wim
          }
          elseif (Test-Path $esd) {
              $image = $esd
          }
          else {
              throw "Server install.wim/install.esd not found."
          }

          & dism.exe `
            /Get-WimInfo `
            "/WimFile:$image"

          if ($LASTEXITCODE -ne 0) {
              throw "Server DISM /Get-WimInfo failed."
          }

          "SERVER_IMAGE_FILE=$image" >> $env:GITHUB_ENV


      # ============================================================
      # 17. CREATE SERVER VHDX
      # ============================================================

      - name: Create SERVER-DC01 VHDX
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                 CREATE SERVER VHDX"
          Write-Host "============================================================"

          $vhdx = Join-Path `
            $env:WORK_DIR `
            "SERVER-DC01.vhdx"

          if (Test-Path $vhdx) {
              Remove-Item $vhdx -Force
          }

          New-VHD `
            -Path $vhdx `
            -SizeBytes 60GB `
            -Dynamic | Out-Null

          $disk = Mount-VHD `
            -Path $vhdx `
            -Passthru

          Initialize-Disk `
            -Number $disk.Number `
            -PartitionStyle GPT

          $efi = New-Partition `
            -DiskNumber $disk.Number `
            -Size 100MB `
            -GptType "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"

          Format-Volume `
            -Partition $efi `
            -FileSystem FAT32 `
            -NewFileSystemLabel "SYSTEM" `
            -Confirm:$false | Out-Null

          $osPartition = New-Partition `
            -DiskNumber $disk.Number `
            -UseMaximumSize `
            -AssignDriveLetter

          Format-Volume `
            -Partition $osPartition `
            -FileSystem NTFS `
            -NewFileSystemLabel "SERVER-OS" `
            -Confirm:$false | Out-Null

          $osDrive = "$($osPartition.DriveLetter):"

          Write-Host "[+] Server disk: $($disk.Number)"
          Write-Host "[+] Server OS:   $osDrive"

          "SERVER_VHDX=$vhdx" >> $env:GITHUB_ENV
          "SERVER_DISK=$($disk.Number)" >> $env:GITHUB_ENV
          "SERVER_OS=$osDrive" >> $env:GITHUB_ENV


      # ============================================================
      # 18. APPLY SERVER IMAGE
      # ============================================================

      - name: Apply Windows Server image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "              APPLY WINDOWS SERVER IMAGE"
          Write-Host "============================================================"

          & dism.exe `
            /Apply-Image `
            "/ImageFile:$env:SERVER_IMAGE_FILE" `
            "/Index:$env:SERVER_WIM_INDEX" `
            "/ApplyDir:$env:SERVER_OS" `
            /CheckIntegrity

          if ($LASTEXITCODE -ne 0) {
              throw "Server DISM /Apply-Image failed."
          }

          Write-Host "[+] Server image applied."


      # ============================================================
      # 19. CREATE UNATTEND.XML INSIDE SERVER VHDX
      # ============================================================

      - name: Configure SERVER-DC01 Unattend.xml
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "              CREATE SERVER UNATTEND.XML"
          Write-Host "============================================================"

          if ([string]::IsNullOrWhiteSpace($env:SERVER_ADMIN_PASSWORD)) {
              throw "SERVER_ADMIN_PASSWORD secret is empty."
          }

          $panther = Join-Path `
            $env:SERVER_OS `
            "Windows\Panther"

          $unattend = Join-Path `
            $panther `
            "Unattend.xml"

          New-Item `
            -ItemType Directory `
            -Path $panther `
            -Force | Out-Null

          $password = $env:SERVER_ADMIN_PASSWORD

          $xml = @"
<?xml version="1.0" encoding="utf-8"?>

<unattend
    xmlns="urn:schemas-microsoft-com:unattend"
    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

    <settings pass="specialize">

        <component
            name="Microsoft-Windows-Shell-Setup"
            processorArchitecture="amd64"
            publicKeyToken="31bf3856ad364e35"
            language="neutral"
            versionScope="nonSxS">

            <ComputerName>SERVER-DC01</ComputerName>

        </component>

    </settings>

    <settings pass="oobeSystem">

        <component
            name="Microsoft-Windows-Shell-Setup"
            processorArchitecture="amd64"
            publicKeyToken="31bf3856ad364e35"
            language="neutral"
            versionScope="nonSxS">

            <OOBE>

                <HideEULAPage>true</HideEULAPage>

                <HideLocalAccountScreen>true</HideLocalAccountScreen>

                <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>

                <HideOnlineAccountScreens>true</HideOnlineAccountScreens>

                <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>

                <NetworkLocation>Work</NetworkLocation>

                <ProtectYourPC>1</ProtectYourPC>

            </OOBE>

            <UserAccounts>

                <AdministratorPassword>
                    <Value>$password</Value>
                    <PlainText>true</PlainText>
                </AdministratorPassword>

            </UserAccounts>

        </component>

    </settings>

</unattend>
"@

          Set-Content `
            -Path $unattend `
            -Value $xml `
            -Encoding UTF8

          if (-not (Test-Path $unattend)) {
              throw "Unattend.xml was not created."
          }

          Write-Host "[+] Unattend.xml written inside SERVER-DC01 VHDX."
          Write-Host "[+] Password configured for built-in Administrator."
          Write-Host "[+] XML contents are NOT printed."


      # ============================================================
      # 20. CONFIGURE SERVER BOOT
      # ============================================================

      - name: Configure SERVER-DC01 boot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                 CONFIGURE SERVER BOOT"
          Write-Host "============================================================"

          $diskNumber = [int]$env:SERVER_DISK

          $efi = Get-Partition `
            -DiskNumber $diskNumber |
            Where-Object {
              $_.GptType -eq
              "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"
            } |
            Select-Object -First 1

          if (-not $efi) {
              throw "Server EFI partition not found."
          }

          $partitionNumber = $efi.PartitionNumber

          $diskpartFile = Join-Path `
            $env:WORK_DIR `
            "server-diskpart.txt"

          @(
              "select disk $diskNumber"
              "select partition $partitionNumber"
              "assign letter=S"
              "exit"
          ) | Set-Content `
                -Path $diskpartFile `
                -Encoding ASCII

          & diskpart.exe /s $diskpartFile

          if ($LASTEXITCODE -ne 0) {
              throw "Server diskpart failed."
          }

          & bcdboot.exe `
            "$env:SERVER_OS\Windows" `
            /s S: `
            /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "Server BCDBOOT failed."
          }

          Write-Host "[+] Server boot configured."


      # ============================================================
      # 21. VERIFY SERVER UNATTEND
      # ============================================================

      - name: Verify SERVER-DC01 image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                VERIFY SERVER IMAGE"
          Write-Host "============================================================"

          $unattend = Join-Path `
            $env:SERVER_OS `
            "Windows\Panther\Unattend.xml"

          if (-not (Test-Path $unattend)) {
              throw "SERVER Unattend.xml is missing."
          }

          Write-Host "[+] Unattend.xml exists."

          if (-not (Test-Path "$env:SERVER_OS\Windows")) {
              throw "Windows directory is missing."
          }

          if (-not (Test-Path "S:\EFI\Microsoft\Boot\bootmgfw.efi")) {
              throw "UEFI boot files are missing."
          }

          Write-Host "[+] Server image is ready."


      # ============================================================
      # 22. DISMOUNT SERVER VHDX
      # ============================================================

      - name: Dismount SERVER-DC01 VHDX
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Dismount-VHD `
            -Path $env:SERVER_VHDX

          Write-Host "[+] SERVER-DC01 VHDX dismounted."


      # ============================================================
      # 23. CREATE SERVER-NAT
      # ============================================================

      - name: Create SERVER-NAT
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                    CREATE SERVER-NAT"
          Write-Host "============================================================"

          $switchName = "SERVER-NAT"
          $gateway = "192.168.251.1"
          $prefix = "192.168.251.0/24"

          if (-not (Get-VMSwitch -Name $switchName -ErrorAction SilentlyContinue)) {

              New-VMSwitch `
                -Name $switchName `
                -SwitchType Internal | Out-Null
          }

          $adapter = Get-NetAdapter `
            -Name "vEthernet ($switchName)" `
            -ErrorAction Stop

          $existingIP = Get-NetIPAddress `
            -InterfaceIndex $adapter.ifIndex `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.IPAddress -eq $gateway
            }

          if (-not $existingIP) {

              New-NetIPAddress `
                -InterfaceIndex $adapter.ifIndex `
                -IPAddress $gateway `
                -PrefixLength 24 `
                -AddressFamily IPv4 | Out-Null
          }

          if (-not (Get-NetNat -Name $switchName -ErrorAction SilentlyContinue)) {

              New-NetNat `
                -Name $switchName `
                -InternalIPInterfaceAddressPrefix $prefix | Out-Null
          }

          "SERVER_SWITCH=$switchName" >> $env:GITHUB_ENV

          Write-Host "[+] SERVER-NAT ready."
          Write-Host "[+] Gateway: $gateway"
          Write-Host "[+] Network: $prefix"


      # ============================================================
      # 24. CREATE SERVER-DC01 VM
      # ============================================================

      - name: Create SERVER-DC01 VM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                  CREATE SERVER-DC01"
          Write-Host "============================================================"

          $vmName = "SERVER-DC01"

          $old = Get-VM `
            -Name $vmName `
            -ErrorAction SilentlyContinue

          if ($old) {

              if ($old.State -ne "Off") {

                  Stop-VM `
                    -Name $vmName `
                    -TurnOff `
                    -Force
              }

              Remove-VM `
                -Name $vmName `
                -Force
          }

          New-VM `
            -Name $vmName `
            -Generation 2 `
            -MemoryStartupBytes 4GB `
            -VHDPath $env:SERVER_VHDX `
            -SwitchName $env:SERVER_SWITCH | Out-Null

          Set-VMProcessor `
            -VMName $vmName `
            -Count 2 `
            -ExposeVirtualizationExtensions $true

          Set-VMNetworkAdapter `
            -VMName $vmName `
            -MacAddressSpoofing On

          Set-VM `
            -Name $vmName `
            -AutomaticStopAction TurnOff `
            -AutomaticStartAction Nothing

          Write-Host "[+] SERVER-DC01 created."
          Write-Host "[+] Nested virtualization enabled."
          Write-Host "[+] MAC spoofing enabled."


      # ============================================================
      # 25. START SERVER-DC01
      # ============================================================

      - name: Start SERVER-DC01
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                  START SERVER-DC01"
          Write-Host "============================================================"

          Start-VM `
            -Name "SERVER-DC01"

          Start-Sleep -Seconds 5

          Get-VM `
            -Name "SERVER-DC01" |
            Select-Object `
              Name,
              State,
              Status,
              Generation,
              MemoryStartup |
            Format-List


      # ============================================================
      # 26. BUILD POWERSHELL DIRECT CREDENTIAL
      # ============================================================

      - name: Prepare SERVER-DC01 credentials
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SERVER_ADMIN_PASSWORD)) {
              throw "SERVER_ADMIN_PASSWORD secret is empty."
          }

          $secure = ConvertTo-SecureString `
            $env:SERVER_ADMIN_PASSWORD `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $secure
            )

          $global:ServerCredential = $cred

          Write-Host "[+] SERVER-DC01 credential prepared."


      # ============================================================
      # 27. WAIT FOR POWERSHELL DIRECT
      # ============================================================

      - name: Wait for SERVER-DC01 PowerShell Direct
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "             WAIT FOR SERVER-DC01 PS DIRECT"
          Write-Host "============================================================"

          $secure = ConvertTo-SecureString `
            $env:SERVER_ADMIN_PASSWORD `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $secure
            )

          $ready = $false

          for ($i = 1; $i -le 60; $i++) {

              Write-Host "[*] Attempt $i/60..."

              try {

                  $result = Invoke-Command `
                    -VMName "SERVER-DC01" `
                    -Credential $cred `
                    -ScriptBlock {

                        [PSCustomObject]@{
                            ComputerName = $env:COMPUTERNAME
                            User = [Security.Principal.WindowsIdentity]::GetCurrent().Name
                            OS = (Get-CimInstance Win32_OperatingSystem).Caption
                            Build = (Get-CimInstance Win32_OperatingSystem).BuildNumber
                        }

                    } `
                    -ErrorAction Stop

                  Write-Host ""
                  Write-Host "[+] PowerShell Direct SUCCESS."
                  Write-Host ""

                  $result | Format-List

                  $ready = $true
                  break

              }
              catch {

                  Write-Host "[!] Guest not ready/authentication failed."
              }

              Start-Sleep -Seconds 10
          }

          if (-not $ready) {

              Write-Host ""
              Write-Host "[!] SERVER-DC01 PowerShell Direct did not become ready."
              Write-Host "[!] AD DS stages will not run."

              exit 0
          }


      # ============================================================
      # 28. CONFIGURE SERVER NETWORK INSIDE VM
      # ============================================================

      - name: Configure SERVER-DC01 network inside guest
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "          GUEST: CONFIGURE SERVER NETWORK"
          Write-Host "============================================================"

          $secure = ConvertTo-SecureString `
            $env:SERVER_ADMIN_PASSWORD `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $secure
            )

          Invoke-Command `
            -VMName "SERVER-DC01" `
            -Credential $cred `
            -ScriptBlock {

                $ErrorActionPreference = "Stop"

                $ip = "192.168.251.10"
                $prefix = 24
                $gateway = "192.168.251.1"

                $adapter = Get-NetAdapter |
                    Where-Object {
                        $_.Status -eq "Up"
                    } |
                    Select-Object -First 1

                if (-not $adapter) {
                    throw "No active network adapter found."
                }

                Write-Host "[+] Adapter: $($adapter.Name)"

                Get-NetIPAddress `
                    -InterfaceIndex $adapter.ifIndex `
                    -AddressFamily IPv4 `
                    -ErrorAction SilentlyContinue |
                    Where-Object {
                        $_.IPAddress -notlike "169.254.*"
                    } |
                    Remove-NetIPAddress `
                        -Confirm:$false `
                        -ErrorAction SilentlyContinue

                Get-NetRoute `
                    -InterfaceIndex $adapter.ifIndex `
                    -AddressFamily IPv4 `
                    -ErrorAction SilentlyContinue |
                    Where-Object {
                        $_.DestinationPrefix -eq "0.0.0.0/0"
                    } |
                    Remove-NetRoute `
                        -Confirm:$false `
                        -ErrorAction SilentlyContinue

                New-NetIPAddress `
                    -InterfaceIndex $adapter.ifIndex `
                    -IPAddress $ip `
                    -PrefixLength $prefix `
                    -DefaultGateway $gateway

                Write-Host "[+] Static IP configured: $ip"
                Write-Host "[+] Gateway: $gateway"

            }


      # ============================================================
      # 29. INSTALL AD DS + DNS INSIDE VM
      # ============================================================

      - name: Install AD DS and DNS inside SERVER-DC01
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "        GUEST: INSTALL AD DS + DNS"
          Write-Host "============================================================"

          $secure = ConvertTo-SecureString `
            $env:SERVER_ADMIN_PASSWORD `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $secure
            )

          Invoke-Command `
            -VMName "SERVER-DC01" `
            -Credential $cred `
            -ScriptBlock {

                $ErrorActionPreference = "Stop"

                Write-Host "[*] Installing AD-Domain-Services and DNS..."

                Install-WindowsFeature `
                    AD-Domain-Services, `
                    DNS `
                    -IncludeManagementTools

                Write-Host "[+] AD DS and DNS roles installed."

            }


      # ============================================================
      # 30. PROMOTE SERVER-DC01 TO NEW FOREST
      # ============================================================

      - name: Promote SERVER-DC01 to AD DS forest
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "             GUEST: PROMOTE TO AD DS"
          Write-Host "============================================================"

          $secure = ConvertTo-SecureString `
            $env:SERVER_ADMIN_PASSWORD `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $secure
            )

          Invoke-Command `
            -VMName "SERVER-DC01" `
            -Credential $cred `
            -ScriptBlock {

                $ErrorActionPreference = "Stop"

                $domain = $using:env:AD_DOMAIN
                $netbios = $using:env:AD_NETBIOS

                Write-Host "[+] Forest: $domain"
                Write-Host "[+] NetBIOS: $netbios"

                $safeModePassword = ConvertTo-SecureString `
                    $using:env:SERVER_ADMIN_PASSWORD `
                    -AsPlainText `
                    -Force

                Install-ADDSForest `
                    -DomainName $domain `
                    -DomainNetbiosName $netbios `
                    -SafeModeAdministratorPassword $safeModePassword `
                    -InstallDns `
                    -CreateDnsDelegation:$false `
                    -DatabasePath "C:\Windows\NTDS" `
                    -LogPath "C:\Windows\NTDS" `
                    -SysvolPath "C:\Windows\SYSVOL" `
                    -NoRebootOnCompletion:$false `
                    -Force

            }

          Write-Host ""
          Write-Host "[*] SERVER-DC01 may now be rebooting."
          Write-Host "[*] This is a GUEST reboot."
          Write-Host "[*] GitHub Actions / Hyper-V host is NOT rebooted."


      # ============================================================
      # 31. WAIT FOR SERVER-DC01 AFTER AD DS REBOOT
      # ============================================================

      - name: Wait for SERVER-DC01 after AD DS reboot
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "        WAIT FOR SERVER-DC01 AFTER AD DS REBOOT"
          Write-Host "============================================================"

          Start-Sleep -Seconds 20

          $secure = ConvertTo-SecureString `
            $env:SERVER_ADMIN_PASSWORD `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $secure
            )

          $ready = $false

          for ($i = 1; $i -le 60; $i++) {

              Write-Host "[*] Attempt $i/60..."

              try {

                  $result = Invoke-Command `
                    -VMName "SERVER-DC01" `
                    -Credential $cred `
                    -ScriptBlock {

                        [PSCustomObject]@{
                            ComputerName = $env:COMPUTERNAME
                            User = [Security.Principal.WindowsIdentity]::GetCurrent().Name
                            Domain = (Get-CimInstance Win32_ComputerSystem).Domain
                            OS = (Get-CimInstance Win32_OperatingSystem).Caption
                        }

                    } `
                    -ErrorAction Stop

                  Write-Host "[+] SERVER-DC01 is back online."

                  $result | Format-List

                  $ready = $true
                  break

              }
              catch {

                  Write-Host "[!] Guest still rebooting/not ready."
              }

              Start-Sleep -Seconds 10
          }

          if (-not $ready) {
              throw "SERVER-DC01 did not return after AD DS promotion."
          }


      # ============================================================
      # 32. VERIFY AD DS + DNS INSIDE VM
      # ============================================================

      - name: Verify AD DS and DNS inside SERVER-DC01
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "           GUEST: VERIFY AD DS + DNS"
          Write-Host "============================================================"

          $secure = ConvertTo-SecureString `
            $env:SERVER_ADMIN_PASSWORD `
            -AsPlainText `
            -Force

          $cred = New-Object `
            System.Management.Automation.PSCredential(
              ".\Administrator",
              $secure
            )

          Invoke-Command `
            -VMName "SERVER-DC01" `
            -Credential $cred `
            -ScriptBlock {

                $ErrorActionPreference = "Stop"

                Write-Host "========== COMPUTER =========="

                Get-CimInstance Win32_ComputerSystem |
                    Select-Object `
                        Name,
                        Domain,
                        PartOfDomain |
                    Format-List

                Write-Host ""
                Write-Host "========== AD DS =========="

                Get-Service `
                    NTDS |
                    Select-Object `
                        Name,
                        Status,
                        StartType |
                    Format-List

                Write-Host ""
                Write-Host "========== DNS =========="

                Get-Service `
                    DNS |
                    Select-Object `
                        Name,
                        Status,
                        StartType |
                    Format-List

                Write-Host ""
                Write-Host "========== DOMAIN =========="

                Get-ADDomain |
                    Select-Object `
                        DNSRoot,
                        NetBIOSName,
                        DomainMode |
                    Format-List

                Write-Host ""
                Write-Host "========== FOREST =========="

                Get-ADForest |
                    Select-Object `
                        Name,
                        RootDomain,
                        ForestMode |
                    Format-List

                Write-Host ""
                Write-Host "========== DNS RESOLUTION =========="

                Resolve-DnsName `
                    $env:AD_DOMAIN `
                    -ErrorAction Stop

                Write-Host ""
                Write-Host "[+] AD DS verification successful."

            }


      # ============================================================
      # 33. VERIFY SERVER-NAT FROM HOST
      # ============================================================

      - name: Verify SERVER-NAT
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "                  VERIFY SERVER-NAT"
          Write-Host "============================================================"

          Get-VMSwitch `
            -Name "SERVER-NAT" |
            Format-List Name,SwitchType

          Write-Host ""

          Get-NetIPAddress |
            Where-Object {
              $_.IPAddress -eq "192.168.251.1"
            } |
            Format-Table `
              IPAddress,
              PrefixLength,
              InterfaceAlias

          Write-Host ""

          Get-NetNat `
            -Name "SERVER-NAT" `
            -ErrorAction SilentlyContinue |
            Format-List


      # ============================================================
      # 34. SERVER VM FINAL STATUS
      # ============================================================

      - name: SERVER-DC01 final status
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "                SERVER-DC01 FINAL STATUS"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "========== VM =========="

          Get-VM `
            -Name "SERVER-DC01" |
            Select-Object `
              Name,
              State,
              Status,
              Generation,
              MemoryStartup |
            Format-List

          Write-Host ""
          Write-Host "========== PROCESSOR =========="

          Get-VMProcessor `
            -VMName "SERVER-DC01" |
            Select-Object `
              VMName,
              Count,
              ExposeVirtualizationExtensions |
            Format-List

          Write-Host ""
          Write-Host "========== NETWORK =========="

          Get-VMNetworkAdapter `
            -VMName "SERVER-DC01" |
            Select-Object `
              VMName,
              Name,
              SwitchName,
              Status,
              MacAddress,
              IPAddresses |
            Format-List

          Write-Host ""
          Write-Host "========== INTEGRATION =========="

          Get-VMIntegrationService `
            -VMName "SERVER-DC01" |
            Select-Object `
              Name,
              Enabled,
              PrimaryStatusDescription,
              SecondaryStatusDescription |
            Format-Table -AutoSize


      # ============================================================
      # 35. CREATE DIFFERENCING DISK FOR TEST VDI
      # ============================================================

      - name: Create RDS test differencing disk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "             CREATE RDS TEST DIFFERENCING DISK"
          Write-Host "============================================================"

          $testVhdx = Join-Path `
            $env:WORK_DIR `
            "RDS-Test-01.vhdx"

          if (Test-Path $testVhdx) {
              Remove-Item $testVhdx -Force
          }

          New-VHD `
            -Path $testVhdx `
            -ParentPath $env:MASTER_VHDX | Out-Null

          "TEST_VHDX=$testVhdx" >> $env:GITHUB_ENV

          Write-Host "[+] Differencing disk created."


      # ============================================================
      # 36. CREATE TEST VDI VM
      # ============================================================

      - name: Create RDS-Test-01
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $vmName = "RDS-Test-01"

          if (Get-VM `
                -Name $vmName `
                -ErrorAction SilentlyContinue) {

              Stop-VM `
                -Name $vmName `
                -TurnOff `
                -Force `
                -ErrorAction SilentlyContinue

              Remove-VM `
                -Name $vmName `
                -Force
          }

          New-VM `
            -Name $vmName `
            -Generation 2 `
            -MemoryStartupBytes 4GB `
            -VHDPath $env:TEST_VHDX `
            -SwitchName $env:VDI_SWITCH | Out-Null

          Set-VM `
            -Name $vmName `
            -AutomaticStopAction TurnOff `
            -AutomaticStartAction Nothing

          Write-Host "[+] RDS-Test-01 created."


      # ============================================================
      # 37. RDS DEPLOYMENT TEST
      # ============================================================

      - name: Test RDS deployment
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "                 TEST RDS DEPLOYMENT"
          Write-Host "============================================================"

          $computer = $env:COMPUTERNAME

          $computerSystem = Get-CimInstance `
            Win32_ComputerSystem

          Write-Host "[+] ComputerName:"
          Write-Host $computer

          Write-Host "[+] Domain:"
          Write-Host $computerSystem.Domain

          Write-Host "[+] PartOfDomain:"
          Write-Host $computerSystem.PartOfDomain

          try {

              $fqdn = [System.Net.Dns]::GetHostEntry(
                  $computer
              ).HostName

              Write-Host "[+] FQDN:"
              Write-Host $fqdn

          }
          catch {

              Write-Host "[!] Could not determine FQDN."
              $fqdn = $computer
          }

          try {

              New-RDVirtualDesktopDeployment `
                -ConnectionBroker $fqdn `
                -WebAccessServer $fqdn `
                -VirtualizationHost $fqdn `
                -ErrorAction Stop

              Write-Host "[+] RDS deployment created."

          }
          catch {

              Write-Host ""
              Write-Host "[!] RDS deployment failed."
              Write-Host $_.Exception.Message
              Write-Host ""

              Write-Host "[!] This is expected if the Hyper-V host is still"
              Write-Host "[!] a WORKGROUP machine."
          }


      # ============================================================
      # 38. VERIFY MASTER OFF
      # ============================================================

      - name: Verify RDS master template
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "               VERIFY MASTER TEMPLATE"
          Write-Host "============================================================"

          Get-VM `
            -Name "RDS-Master-Template" |
            Select-Object `
              Name,
              State,
              Generation,
              MemoryStartup |
            Format-List


      # ============================================================
      # 39. RUN WIN RDP ENABLER
      # ============================================================

      - name: Run Win RDP Enabler
        uses: Veniamin668/win-rdp-enabler@main
        env:
          TAIL_KEY: ${{ secrets.TAIL_KEY }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          USE_CUSTOM_USER: 'false'
          CUSTOM_USERNAME: ''
          CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}


      # ============================================================
      # 40. FINAL STATUS
      # ============================================================

      - name: Final status
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                     FINAL STATUS"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "========== ALL VMS =========="

          Get-VM |
            Select-Object `
              Name,
              State,
              Status,
              Generation,
              MemoryStartup |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "========== VDI NETWORK =========="

          Get-VMSwitch `
            -Name "VDI-NAT" `
            -ErrorAction SilentlyContinue |
            Format-Table Name,SwitchType

          Write-Host ""
          Write-Host "========== SERVER NETWORK =========="

          Get-VMSwitch `
            -Name "SERVER-NAT" `
            -ErrorAction SilentlyContinue |
            Format-Table Name,SwitchType

          Write-Host ""
          Write-Host "========== SERVER PROCESSOR =========="

          Get-VMProcessor `
            -VMName "SERVER-DC01" `
            -ErrorAction SilentlyContinue |
            Select-Object `
              VMName,
              Count,
              ExposeVirtualizationExtensions |
            Format-Table


      # ============================================================
      # 41. KEEP RUNNER ALIVE
      # ============================================================

      - name: Keep runner alive
        shell: powershell
        run: |
          Write-Host "============================================================"
          Write-Host "                  RUNNER IS ALIVE"
          Write-Host "============================================================"

          while ($true) {
              Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') - VDI environment alive..."
              Start-Sleep -Seconds 300
          }
