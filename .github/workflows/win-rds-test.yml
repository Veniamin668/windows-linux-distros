name: Deploy Windows Native VDI

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Direct URL to Windows ISO"
        required: true
        type: string

      wim_index:
        description: "Windows image index inside install.wim/install.esd"
        required: true
        default: "1"
        type: string

jobs:
  deploy-vdi:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. PATHS
      # ============================================================
      - name: Prepare workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $WorkDir = $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "                 PREPARE WORKSPACE"
          Write-Host "============================================================"
          Write-Host "[+] GITHUB_WORKSPACE:"
          Write-Host "    $WorkDir"

          if (-not (Test-Path $WorkDir)) {
              throw "GITHUB_WORKSPACE does not exist: $WorkDir"
          }

          $iso  = Join-Path $WorkDir "windows.iso"
          $vhdx = Join-Path $WorkDir "Windows-VDI-Master.vhdx"

          Write-Host "[+] ISO : $iso"
          Write-Host "[+] VHDX: $vhdx"

      # ============================================================
      # 2. DOWNLOAD ISO
      # ============================================================
      - name: Download Windows ISO
        shell: pwsh
        env:
          ISO_URL: ${{ inputs.iso_url }}
        run: |
          $ErrorActionPreference = "Stop"

          $WorkDir = $env:GITHUB_WORKSPACE
          $iso = Join-Path $WorkDir "windows.iso"
          $url = $env:ISO_URL

          Write-Host "============================================================"
          Write-Host "                    DOWNLOAD WINDOWS ISO"
          Write-Host "============================================================"
          Write-Host "[+] Destination:"
          Write-Host "    $iso"

          if ([string]::IsNullOrWhiteSpace($url)) {
              throw "ISO URL is empty."
          }

          curl.exe `
              -L `
              --fail `
              --retry 5 `
              --retry-delay 5 `
              --retry-all-errors `
              -C - `
              -o "$iso" `
              "$url"

          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
              throw "curl failed with exit code $exitCode"
          }

          if (-not (Test-Path $iso)) {
              throw "ISO was not downloaded."
          }

          $size = (Get-Item $iso).Length

          Write-Host "[+] ISO downloaded."
          Write-Host "[+] Size: $([math]::Round($size / 1GB, 2)) GB"

      # ============================================================
      # 3. MOUNT ISO
      # ============================================================
      - name: Mount Windows ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iso = Join-Path $env:GITHUB_WORKSPACE "windows.iso"

          Write-Host "============================================================"
          Write-Host "                       MOUNT ISO"
          Write-Host "============================================================"

          $diskImage = Mount-DiskImage `
              -ImagePath $iso `
              -PassThru

          Start-Sleep -Seconds 3

          $volume = $diskImage |
              Get-Volume |
              Where-Object DriveLetter |
              Select-Object -First 1

          if (-not $volume) {
              throw "Could not determine ISO drive letter."
          }

          $drive = "$($volume.DriveLetter):"

          Write-Host "[+] ISO mounted at $drive"

          "ISO_DRIVE=$drive" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 4. FIND INSTALL.WIM / INSTALL.ESD
      # ============================================================
      - name: Find Windows image
        shell: pwsh
        env:
          WIM_INDEX: ${{ inputs.wim_index }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                  FIND WINDOWS IMAGE"
          Write-Host "============================================================"

          $sources = Join-Path $env:ISO_DRIVE "sources"

          $wim = Join-Path $sources "install.wim"
          $esd = Join-Path $sources "install.esd"

          if (Test-Path $wim) {
              $imageFile = $wim
          }
          elseif (Test-Path $esd) {
              $imageFile = $esd
          }
          else {
              throw "Neither install.wim nor install.esd was found."
          }

          Write-Host "[+] Image:"
          Write-Host "    $imageFile"

          Write-Host ""
          Write-Host "========== DISM IMAGE INFO =========="

          dism.exe /Get-WimInfo /WimFile:"$imageFile"

          if ($LASTEXITCODE -ne 0) {
              throw "DISM /Get-WimInfo failed."
          }

          "IMAGE_FILE=$imageFile" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 5. CREATE MASTER VHDX
      # ============================================================
      - name: Create master VHDX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $WorkDir = $env:GITHUB_WORKSPACE
          $vhdx = Join-Path $WorkDir "Windows-VDI-Master.vhdx"

          Write-Host "============================================================"
          Write-Host "                    CREATE MASTER VHDX"
          Write-Host "============================================================"

          if (Test-Path $vhdx) {
              Write-Host "[*] Existing VHDX found. Removing it..."
              Remove-Item $vhdx -Force
          }

          New-VHD `
              -Path $vhdx `
              -SizeBytes 60GB `
              -Dynamic |
              Out-Null

          Write-Host "[+] Created:"
          Write-Host "    $vhdx"

          $vhd = Mount-VHD `
              -Path $vhdx `
              -Passthru

          Start-Sleep -Seconds 2

          $disk = Get-Disk |
              Where-Object {
                  $_.Location -like "*$([IO.Path]::GetFileName($vhdx))*"
              } |
              Select-Object -First 1

          if (-not $disk) {
              $disk = Get-Disk |
                  Where-Object {
                      $_.Number -eq $vhd.DiskNumber
                  } |
                  Select-Object -First 1
          }

          if (-not $disk) {
              throw "Could not locate mounted VHDX disk."
          }

          Write-Host "[+] Disk number: $($disk.Number)"

          Initialize-Disk `
              -Number $disk.Number `
              -PartitionStyle GPT

          $efi = New-Partition `
              -DiskNumber $disk.Number `
              -Size 100MB `
              -GptType "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"

          Format-Volume `
              -Partition $efi `
              -FileSystem FAT32 `
              -NewFileSystemLabel "EFI" `
              -Confirm:$false |
              Out-Null

          $os = New-Partition `
              -DiskNumber $disk.Number `
              -UseMaximumSize `
              -AssignDriveLetter

          Format-Volume `
              -Partition $os `
              -FileSystem NTFS `
              -NewFileSystemLabel "Windows" `
              -Confirm:$false |
              Out-Null

          $osLetter = "$($os.DriveLetter):"

          Write-Host "[+] Windows partition: $osLetter"

          "MASTER_VHDX=$vhdx" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MASTER_DISK=$($disk.Number)" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MASTER_OS=$osLetter" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 6. APPLY WINDOWS IMAGE
      # ============================================================
      - name: Apply Windows image
        shell: pwsh
        env:
          WIM_INDEX: ${{ inputs.wim_index }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                   APPLY WINDOWS IMAGE"
          Write-Host "============================================================"

          Write-Host "[+] Image : $env:IMAGE_FILE"
          Write-Host "[+] Index : $env:WIM_INDEX"
          Write-Host "[+] Target: $env:MASTER_OS"

          dism.exe `
              /Apply-Image `
              /ImageFile:"$env:IMAGE_FILE" `
              /Index:$env:WIM_INDEX `
              /ApplyDir:"$env:MASTER_OS" `
              /CheckIntegrity

          if ($LASTEXITCODE -ne 0) {
              throw "DISM /Apply-Image failed."
          }

          Write-Host "[+] Windows image applied."

# ============================================================
      # 7. BOOT FILES
      # ============================================================
      - name: Configure boot files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                    CONFIGURE BOOT"
          Write-Host "============================================================"

          $diskNumber = [int]$env:MASTER_DISK

          # --------------------------------------------------------
          # Find EFI System Partition
          # --------------------------------------------------------
          $efiPartition = Get-Partition -DiskNumber $diskNumber |
              Where-Object {
                  $_.GptType -eq "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"
              } |
              Select-Object -First 1

          if (-not $efiPartition) {
              throw "EFI System Partition not found on disk $diskNumber."
          }

          $partitionNumber = $efiPartition.PartitionNumber

          Write-Host "[+] EFI partition found:"
          Write-Host "    Disk       : $diskNumber"
          Write-Host "    Partition  : $partitionNumber"
          Write-Host "    Size       : $([math]::Round($efiPartition.Size / 1MB, 2)) MB"
          Write-Host "    DriveLetter: '$($efiPartition.DriveLetter)'"

          # --------------------------------------------------------
          # Assign S: using DiskPart
          # --------------------------------------------------------
          if (-not $efiPartition.DriveLetter) {

              Write-Host "[*] Assigning drive letter S: to EFI partition..."

              $diskpartScript = @"
          select disk $diskNumber
          select partition $partitionNumber
          assign letter=S
          exit
          "@

              $diskpartFile = Join-Path $env:TEMP "assign-efi.txt"

              Set-Content `
                  -Path $diskpartFile `
                  -Value $diskpartScript `
                  -Encoding ASCII

              $dpOutput = & diskpart.exe /s $diskpartFile 2>&1

              $dpOutput | ForEach-Object {
                  Write-Host $_
              }

              if ($LASTEXITCODE -ne 0) {
                  throw "DiskPart failed to assign S: to EFI partition."
              }

              Remove-Item $diskpartFile -Force -ErrorAction SilentlyContinue
          }

          # --------------------------------------------------------
          # Re-read partition
          # --------------------------------------------------------
          $efiPartition = Get-Partition `
              -DiskNumber $diskNumber `
              -PartitionNumber $partitionNumber

          if (-not $efiPartition.DriveLetter) {
              throw "EFI partition still has no drive letter after DiskPart."
          }

          $efiLetter = "$($efiPartition.DriveLetter):"

          Write-Host "[+] EFI: $efiLetter"
          Write-Host "[+] OS : $env:MASTER_OS"

          # --------------------------------------------------------
          # Verify Windows installation
          # --------------------------------------------------------
          if (-not (Test-Path "$env:MASTER_OS\Windows")) {
              throw "Windows directory not found at $env:MASTER_OS\Windows"
          }

          Write-Host "[+] Windows installation found."

          # --------------------------------------------------------
          # Create UEFI boot files
          # --------------------------------------------------------
          Write-Host "[*] Running BCDBOOT..."

          & bcdboot.exe `
              "$env:MASTER_OS\Windows" `
              /s $efiLetter `
              /f UEFI `
              /v

          if ($LASTEXITCODE -ne 0) {
              throw "BCDBOOT failed with exit code $LASTEXITCODE."
          }

          Write-Host "[+] Boot files configured successfully."

          # --------------------------------------------------------
          # Verify boot files
          # --------------------------------------------------------
          if (-not (Test-Path "$efiLetter\EFI\Microsoft\Boot")) {
              throw "EFI boot directory was not created."
          }

          Write-Host "[+] EFI boot directory verified:"
          Write-Host "    $efiLetter\EFI\Microsoft\Boot"

          Get-ChildItem "$efiLetter\EFI\Microsoft\Boot" -Force |
              Select-Object Name, Length
             
      # ============================================================
      # 8. IMAGE CLEANUP
      # ============================================================
      - name: Optimize master image
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "                   OPTIMIZE MASTER IMAGE"
          Write-Host "============================================================"

          Write-Host "[*] Running component cleanup..."

          dism.exe `
              /Image:"$env:MASTER_OS" `
              /Cleanup-Image `
              /StartComponentCleanup

          Write-Host "[+] Component cleanup finished."

      # ============================================================
      # 9. DISMOUNT MASTER VHDX
      # ============================================================
      - name: Dismount master VHDX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                  DISMOUNT MASTER VHDX"
          Write-Host "============================================================"

          $disk = Get-Disk -Number $env:MASTER_DISK

          if ($disk.IsOffline) {
              Set-Disk -Number $disk.Number -IsOffline:$false
          }

          Dismount-VHD `
              -Path "$env:MASTER_VHDX"

          Write-Host "[+] Master VHDX dismounted."
          Write-Host "[+] Path:"
          Write-Host "    $env:MASTER_VHDX"

      # ============================================================
      # 10. INSTALL RDS ROLES
      # ============================================================
      - name: Install RDS roles
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                     INSTALL RDS"
          Write-Host "============================================================"

          $features = @(
              "RDS-Connection-Broker",
              "RDS-Web-Access",
              "RDS-Virtualization"
          )

          foreach ($feature in $features) {

              Write-Host ""
              Write-Host "========== $feature =========="

              $result = Install-WindowsFeature `
                  -Name $feature `
                  -IncludeManagementTools `
                  -Restart:$false

              Write-Host "[+] Success      : $($result.Success)"
              Write-Host "[+] RestartNeeded : $($result.RestartNeeded)"
              Write-Host "[+] ExitCode      : $($result.ExitCode)"

              if (-not $result.Success) {
                  throw "Failed to install $feature"
              }
          }

          Write-Host ""
          Write-Host "[+] RDS role installation complete."
          Write-Host "[!] No manual reboot performed."

      # ============================================================
      # 11. VERIFY RDS ROLES
      # ============================================================
      - name: Verify RDS roles
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "                     VERIFY RDS"
          Write-Host "============================================================"

          Get-WindowsFeature |
              Where-Object {
                  $_.Name -in @(
                      "RDS-Connection-Broker",
                      "RDS-Web-Access",
                      "RDS-Virtualization"
                  )
              } |
              Format-Table Name,InstallState -AutoSize

          Write-Host ""
          Write-Host "========== RDS SERVICES =========="

          Get-Service |
              Where-Object {
                  $_.Name -match "TermService|RDMS|Tssdis|W3SVC"
              } |
              Format-Table Name,Status,StartType -AutoSize

      # ============================================================
      # 12. HYPER-V NETWORK
      # ============================================================
      - name: Configure Hyper-V VDI network
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                 CONFIGURE VDI NETWORK"
          Write-Host "============================================================"

          $switchName = "VDI-NAT"
          $gatewayIp = "192.168.250.1"
          $prefix = 24
          $natName = "VDI-NAT"

          $switch = Get-VMSwitch -Name $switchName -ErrorAction SilentlyContinue

          if (-not $switch) {
              Write-Host "[+] Creating internal switch..."

              New-VMSwitch `
                  -Name $switchName `
                  -SwitchType Internal |
                  Out-Null
          }
          else {
              Write-Host "[*] VDI-NAT already exists."
          }

          $adapter = Get-NetAdapter |
              Where-Object {
                  $_.Name -like "*$switchName*"
              } |
              Select-Object -First 1

          if (-not $adapter) {
              throw "Could not find Hyper-V internal switch adapter."
          }

          $existingIp = Get-NetIPAddress `
              -InterfaceIndex $adapter.ifIndex `
              -AddressFamily IPv4 `
              -ErrorAction SilentlyContinue

          if (-not ($existingIp | Where-Object IPAddress -eq $gatewayIp)) {

              if ($existingIp) {
                  $existingIp |
                      Remove-NetIPAddress `
                      -Confirm:$false `
                      -ErrorAction SilentlyContinue
              }

              New-NetIPAddress `
                  -IPAddress $gatewayIp `
                  -PrefixLength $prefix `
                  -InterfaceIndex $adapter.ifIndex |
                  Out-Null
          }

          $nat = Get-NetNat `
              -Name $natName `
              -ErrorAction SilentlyContinue

          if (-not $nat) {
              New-NetNat `
                  -Name $natName `
                  -InternalIPInterfaceAddressPrefix "192.168.250.0/24" |
                  Out-Null
          }

          Write-Host "[+] Switch : $switchName"
          Write-Host "[+] Gateway: $gatewayIp"
          Write-Host "[+] NAT    : 192.168.250.0/24"

          Write-Host ""
          Get-VMSwitch -Name $switchName
          Get-NetNat -Name $natName

          "VDI_SWITCH=$switchName" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 13. MASTER TEMPLATE VM
      # ============================================================
      - name: Create master template VM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                 CREATE MASTER VM"
          Write-Host "============================================================"

          $vmName = "RDS-Master-Template"

          $existing = Get-VM `
              -Name $vmName `
              -ErrorAction SilentlyContinue

          if ($existing) {
              Write-Host "[*] Master VM already exists."

              if ($existing.State -ne "Off") {
                  Stop-VM `
                      -Name $vmName `
                      -Force `
                      -TurnOff
              }
          }
          else {
              New-VM `
                  -Name $vmName `
                  -Generation 2 `
                  -MemoryStartupBytes 4GB `
                  -VHDPath "$env:MASTER_VHDX" `
                  -SwitchName "$env:VDI_SWITCH" |
                  Out-Null
          }

          Set-VM `
              -Name $vmName `
              -AutomaticStopAction TurnOff `
              -AutomaticStartAction Nothing

          Stop-VM `
              -Name $vmName `
              -Force `
              -TurnOff `
              -ErrorAction SilentlyContinue

          $vm = Get-VM -Name $vmName

          Write-Host "[+] Name : $($vm.Name)"
          Write-Host "[+] State: $($vm.State)"
          Write-Host "[+] VHDX : $env:MASTER_VHDX"

          if ($vm.State -ne "Off") {
              throw "Master VM is not OFF."
          }

          "MASTER_VM=$vmName" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 14. CREATE RDS DEPLOYMENT
      # ============================================================
      - name: Create RDS deployment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                  CREATE RDS DEPLOYMENT"
          Write-Host "============================================================"

          $computer = $env:COMPUTERNAME

          Write-Host "[+] Connection Broker: $computer"
          Write-Host "[+] Web Access       : $computer"
          Write-Host "[+] Virtualization   : $computer"

          $deployment = Get-RDServer `
              -ErrorAction SilentlyContinue

          if ($deployment) {
              Write-Host "[*] Existing RDS deployment detected."
              $deployment |
                  Format-Table Server,Roles -AutoSize
          }
          else {
              Write-Host "[+] Creating new RDS VDI deployment..."

              New-RDVirtualDesktopDeployment `
                  -ConnectionBroker $computer `
                  -WebAccessServer $computer `
                  -VirtualizationHost $computer

              Write-Host "[+] RDS deployment created."
          }

          Write-Host ""
          Write-Host "========== RDS SERVERS =========="

          Get-RDServer |
              Format-Table Server,Roles -AutoSize

      # ============================================================
      # 15. CREATE TEST DIFFERENCING DISK
      # ============================================================
      - name: Create test VDI disk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                  CREATE TEST VDI DISK"
          Write-Host "============================================================"

          $testDisk = Join-Path `
              $env:GITHUB_WORKSPACE `
              "RDS-Test-01.vhdx"

          if (Test-Path $testDisk) {
              Remove-Item `
                  $testDisk `
                  -Force
          }

          New-VHD `
              -Path $testDisk `
              -ParentPath "$env:MASTER_VHDX" |
              Out-Null

          Write-Host "[+] Test disk:"
          Write-Host "    $testDisk"

          "TEST_VHDX=$testDisk" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 16. CREATE TEST VM
      # ============================================================
      - name: Create first test VM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                   CREATE TEST VM"
          Write-Host "============================================================"

          $vmName = "RDS-Test-01"

          $existing = Get-VM `
              -Name $vmName `
              -ErrorAction SilentlyContinue

          if ($existing) {
              Write-Host "[*] Existing test VM found."

              if ($existing.State -ne "Off") {
                  Stop-VM `
                      -Name $vmName `
                      -Force `
                      -TurnOff
              }

              Remove-VM `
                  -Name $vmName `
                  -Force
          }

          New-VM `
              -Name $vmName `
              -Generation 2 `
              -MemoryStartupBytes 4GB `
              -VHDPath "$env:TEST_VHDX" `
              -SwitchName "$env:VDI_SWITCH" |
              Out-Null

          Set-VM `
              -Name $vmName `
              -AutomaticStopAction TurnOff `
              -AutomaticStartAction Nothing

          Write-Host "[+] VM created:"
          Write-Host "    $vmName"

          Get-VM -Name $vmName |
              Format-Table Name,State,Generation,MemoryStartup -AutoSize

          "TEST_VM=$vmName" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 17. CREATE RDS COLLECTION
      # ============================================================
      - name: Create VDI collection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                  CREATE VDI COLLECTION"
          Write-Host "============================================================"

          $collectionName = "Test-VDI"
          $computer = $env:COMPUTERNAME

          $existing = Get-RDVirtualDesktopCollection `
              -CollectionName $collectionName `
              -ConnectionBroker $computer `
              -ErrorAction SilentlyContinue

          if ($existing) {
              Write-Host "[*] Collection already exists."
          }
          else {
              Write-Host "[+] Creating collection..."

              New-RDVirtualDesktopCollection `
                  -CollectionName $collectionName `
                  -PooledUnmanaged `
                  -VirtualDesktopName "$env:TEST_VM" `
                  -ConnectionBroker $computer `
                  -Description "Automated first VDI test desktop" `
                  -Force

              Write-Host "[+] Collection created."
          }

          Write-Host ""
          Write-Host "========== COLLECTIONS =========="

          Get-RDVirtualDesktopCollection `
              -ConnectionBroker $computer |
              Format-Table CollectionName,CollectionType -AutoSize

          "RDS_COLLECTION=$collectionName" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 18. PUBLISH TO RD WEB ACCESS
      # ============================================================
      - name: Publish VDI collection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                 PUBLISH VDI COLLECTION"
          Write-Host "============================================================"

          $computer = $env:COMPUTERNAME

          Set-RDRemoteDesktop `
              -CollectionName "$env:RDS_COLLECTION" `
              -ShowInWebAccess $true `
              -ConnectionBroker $computer `
              -Force

          Write-Host "[+] Collection published to RD Web Access."

      # ============================================================
      # 19. START TEST VM
      # ============================================================
      - name: Start first VDI desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                    START TEST VDI"
          Write-Host "============================================================"

          $vm = Get-VM -Name "$env:TEST_VM"

          if ($vm.State -eq "Off") {
              Start-VM -Name "$env:TEST_VM"
          }

          Start-Sleep -Seconds 5

          $vm = Get-VM -Name "$env:TEST_VM"

          Write-Host "[+] Test VM state: $($vm.State)"

          if ($vm.State -ne "Running") {
              throw "Test VDI VM failed to start."
          }

      # ============================================================
      # 20. RDS DIAGNOSTICS
      # ============================================================
      - name: RDS diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                     RDS DIAGNOSTICS"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "========== RDS SERVERS =========="

          Get-RDServer |
              Format-Table Server,Roles -AutoSize

          Write-Host ""
          Write-Host "========== VDI COLLECTIONS =========="

          Get-RDVirtualDesktopCollection |
              Format-Table CollectionName,CollectionType -AutoSize

          Write-Host ""
          Write-Host "========== VDI MACHINES =========="

          Get-RDVirtualDesktop `
              -CollectionName "$env:RDS_COLLECTION" `
              -ConnectionBroker $env:COMPUTERNAME |
              Format-Table `
                  CollectionName,
                  VirtualDesktopName,
                  Status,
                  AssignedUser -AutoSize

          Write-Host ""
          Write-Host "========== HYPER-V =========="

          Get-VM |
              Format-Table `
                  Name,
                  State,
                  Generation,
                  MemoryStartup -AutoSize

          Write-Host ""
          Write-Host "========== NETWORK =========="

          Get-VMSwitch |
              Format-Table `
                  Name,
                  SwitchType,
                  NetAdapterInterfaceDescription -AutoSize

          Write-Host ""
          Write-Host "========== NAT =========="

          Get-NetNat |
              Format-Table `
                  Name,
                  InternalIPInterfaceAddressPrefix,
                  ActiveSessionCount -AutoSize

          Write-Host ""
          Write-Host "========== RD WEB =========="

          Write-Host "URL:"
          Write-Host "https://$env:COMPUTERNAME/RDWeb"

          Write-Host ""
          Write-Host "============================================================"

      # ============================================================
      # 21. VERIFY MASTER IS OFF
      # ============================================================
      - name: Verify master template is OFF
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                VERIFY MASTER TEMPLATE"
          Write-Host "============================================================"

          $master = Get-VM -Name "$env:MASTER_VM"

          Write-Host "[+] Master VM:"
          Write-Host "    Name : $($master.Name)"
          Write-Host "    State: $($master.State)"

          if ($master.State -ne "Off") {
              Stop-VM `
                  -Name "$env:MASTER_VM" `
                  -Force `
                  -TurnOff
          }

          $master = Get-VM -Name "$env:MASTER_VM"

          if ($master.State -ne "Off") {
              throw "Master template VM is not OFF."
          }

          Write-Host "[+] Master template confirmed OFF."

      # ============================================================
      # 22. RDP / TAILSCALE ACTION
      # ============================================================
      - name: Run Win RDP Enabler
        uses: Veniamin668/win-rdp-enabler@main
        env:
         TAIL_KEY: ${{ secrets.TAIL_KEY }}
         ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
         USE_CUSTOM_USER: 'false'
         CUSTOM_USERNAME: ''
         CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}

      # ============================================================
      # 23. FINAL STATUS
      # ============================================================
      - name: Final VDI status
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "              NATIVE WINDOWS VDI READY"
          Write-Host "============================================================"

          Write-Host "[+] Master Template VM"
          Write-Host "    Name : $env:MASTER_VM"

          $master = Get-VM -Name "$env:MASTER_VM"

          Write-Host "    State: $($master.State)"

          Write-Host ""
          Write-Host "[+] Test VDI VM"
          Write-Host "    Name : $env:TEST_VM"

          $test = Get-VM -Name "$env:TEST_VM"

          Write-Host "    State: $($test.State)"

          Write-Host ""
          Write-Host "[+] Master VHDX"
          Write-Host "    $env:MASTER_VHDX"

          Write-Host ""
          Write-Host "[+] Test VHDX"
          Write-Host "    $env:TEST_VHDX"

          Write-Host ""
          Write-Host "[+] RDS Collection"
          Write-Host "    $env:RDS_COLLECTION"

          Write-Host ""
          Write-Host "[+] RD Web Access"
          Write-Host "    https://$env:COMPUTERNAME/RDWeb"

          Write-Host ""
          Write-Host "[+] Hyper-V VDI network"
          Write-Host "    $env:VDI_SWITCH"

          Write-Host ""
          Write-Host "[+] Master template remains OFF."
          Write-Host "[+] Test desktop is RUNNING."
          Write-Host "[+] RDP/Tailscale handled by win-rdp-enabler."
          Write-Host "[+] No manual host reboot performed."

          Write-Host ""
          Write-Host "============================================================"

      # ============================================================
      # 24. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep runner alive
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    KEEP RUNNER ALIVE"
          Write-Host "============================================================"

          Write-Host "[*] RDS master template remains OFF."
          Write-Host "[*] RDS-Test-01 remains RUNNING."
          Write-Host "[*] Runner will stay alive."
          Write-Host "[*] Stop the workflow manually when finished."

          while ($true) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] VDI runner alive..."
              Start-Sleep -Seconds 30
          }
