name: Deploy Windows Native VDI

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Windows client ISO URL"
        required: true
        type: string

      server_iso_url:
        description: "Windows Server ISO URL"
        required: true
        type: string

      wim_index:
        description: "Windows client WIM index"
        required: true
        default: "1"
        type: string

      server_wim_index:
        description: "Windows Server WIM index"
        required: true
        default: "4"
        type: string

      ad_domain:
        description: "AD DNS domain"
        required: true
        default: "vdi.test"
        type: string

      ad_netbios:
        description: "AD NetBIOS name"
        required: true
        default: "VDI"
        type: string

jobs:
  deploy-vdi:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      WORK_DIR: ${{ github.workspace }}

      CLIENT_ISO: ${{ github.workspace }}\windows.iso
      SERVER_ISO: ${{ github.workspace }}\windows-server.iso

      CLIENT_VHDX: ${{ github.workspace }}\Windows-VDI-Master.vhdx
      SERVER_VHDX: ${{ github.workspace }}\Windows-Server-DC01.vhdx

      SERVER_VM: SERVER-DC01
      TEMPLATE_VM: RDS-Master-Template

      SERVER_SWITCH: SERVER-NAT
      SERVER_GATEWAY: 192.168.251.1
      SERVER_PREFIX: 192.168.251.0/24
      SERVER_IP: 192.168.251.10

      RDS_SWITCH: RDS-NAT
      RDS_GATEWAY: 192.168.252.1
      RDS_PREFIX: 192.168.252.0/24

      AD_DOMAIN: ${{ inputs.ad_domain }}
      AD_NETBIOS: ${{ inputs.ad_netbios }}

      RDS_COLLECTION: Windows-VDI-Pool
      RDS_VM_PREFIX: RDS-Test-

      TEMPLATE_VHDX: C:\VDI\Templates\RDS-Master-Template.vhdx
      RDS_STORAGE: C:\VDI\Collections
      RDS_TEMPLATE_STORAGE: C:\VDI\Templates

    steps:

      # ============================================================
      # CHECK WORKSPACE / AUTOUNATTEND
      # ============================================================

      - name: Check workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== WORKSPACE =========="

          Write-Host "GITHUB_WORKSPACE:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Looking for:"
          Write-Host "$env:GITHUB_WORKSPACE\Autounattend.xml"

          $unattend = "$env:GITHUB_WORKSPACE\Autounattend.xml"

          if (-not (Test-Path -LiteralPath $unattend)) {

              Write-Host ""
              Write-Host "========== WORKSPACE CONTENT =========="

              Get-ChildItem `
                  -LiteralPath $env:GITHUB_WORKSPACE `
                  -Force |
                  Select-Object Name, FullName, Length |
                  Format-Table -AutoSize

              throw "Autounattend.xml not found: $unattend"
          }

          Write-Host ""
          Write-Host "[+] Autounattend.xml found."

          Get-Item `
              -LiteralPath $unattend |
              Select-Object FullName, Length


      # ============================================================
      # DOWNLOAD CLIENT ISO
      # ============================================================

      - name: Download Windows client ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== DOWNLOAD WINDOWS CLIENT ISO =========="

          if (Test-Path -LiteralPath $env:CLIENT_ISO) {
              Remove-Item `
                  -LiteralPath $env:CLIENT_ISO `
                  -Force
          }

          curl.exe `
              -L `
              --fail `
              --retry 5 `
              --retry-delay 5 `
              --retry-all-errors `
              "${{ inputs.iso_url }}" `
              -o "$env:CLIENT_ISO"

          if ($LASTEXITCODE -ne 0) {
              throw "curl failed downloading client ISO: $LASTEXITCODE"
          }

          if (-not (Test-Path -LiteralPath $env:CLIENT_ISO)) {
              throw "Client ISO was not created."
          }

          Get-Item `
              -LiteralPath $env:CLIENT_ISO |
              Select-Object FullName, Length

          Write-Host "[+] Client ISO downloaded."


      # ============================================================
      # DOWNLOAD SERVER ISO
      # ============================================================

      - name: Download Windows Server ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== DOWNLOAD WINDOWS SERVER ISO =========="

          if (Test-Path -LiteralPath $env:SERVER_ISO) {
              Remove-Item `
                  -LiteralPath $env:SERVER_ISO `
                  -Force
          }

          curl.exe `
              -L `
              --fail `
              --retry 5 `
              --retry-delay 5 `
              --retry-all-errors `
              "${{ inputs.server_iso_url }}" `
              -o "$env:SERVER_ISO"

          if ($LASTEXITCODE -ne 0) {
              throw "curl failed downloading Server ISO: $LASTEXITCODE"
          }

          if (-not (Test-Path -LiteralPath $env:SERVER_ISO)) {
              throw "Server ISO was not created."
          }

          Get-Item `
              -LiteralPath $env:SERVER_ISO |
              Select-Object FullName, Length

          Write-Host "[+] Server ISO downloaded."


      # ============================================================
      # PREPARE CLIENT VHDX
      # ============================================================

      - name: Prepare Windows VDI master VHDX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== PREPARE WINDOWS VDI MASTER =========="

          $vhdx = $env:CLIENT_VHDX

          if (Test-Path -LiteralPath $vhdx) {
              Remove-Item `
                  -LiteralPath $vhdx `
                  -Force
          }

          New-VHD `
              -Path $vhdx `
              -SizeBytes 60GB `
              -Dynamic |
              Out-Null

          Mount-VHD `
              -Path $vhdx `
              -Passthru |
              Out-Null

          $disk = Get-Disk |
              Where-Object {
                  $_.PartitionStyle -eq 'RAW'
              } |
              Sort-Object Number -Descending |
              Select-Object -First 1

          if (-not $disk) {
              throw "Could not locate mounted client VHDX disk."
          }

          Write-Host "[+] Disk: $($disk.Number)"

          Set-Disk `
              -Number $disk.Number `
              -IsOffline $false

          Set-Disk `
              -Number $disk.Number `
              -IsReadOnly $false

          Initialize-Disk `
              -Number $disk.Number `
              -PartitionStyle GPT `
              -Confirm:$false

          $efi = New-Partition `
              -DiskNumber $disk.Number `
              -Size 100MB `
              -GptType "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"

          New-Partition `
              -DiskNumber $disk.Number `
              -Size 16MB `
              -GptType "{E3C9E316-0B5C-4DB8-817D-F92DF00215AE}" |
              Out-Null

          $os = New-Partition `
              -DiskNumber $disk.Number `
              -UseMaximumSize `
              -AssignDriveLetter

          Format-Volume `
              -Partition $efi `
              -FileSystem FAT32 `
              -NewFileSystemLabel "SYSTEM" `
              -Confirm:$false |
              Out-Null

          Format-Volume `
              -Partition $os `
              -FileSystem NTFS `
              -NewFileSystemLabel "Windows" `
              -Confirm:$false |
              Out-Null

          if (-not $efi.DriveLetter) {
              Set-Partition `
                  -DiskNumber $disk.Number `
                  -PartitionNumber $efi.PartitionNumber `
                  -NewDriveLetter S
          }

          $efiDrive = "S:"
          $osDrive = "$($os.DriveLetter):"

          Write-Host "[+] EFI: $efiDrive"
          Write-Host "[+] OS : $osDrive"

          $isoMount = Mount-DiskImage `
              -ImagePath $env:CLIENT_ISO `
              -PassThru

          $isoDrive = (
              $isoMount |
              Get-Volume
          ).DriveLetter

          if (-not $isoDrive) {
              throw "Could not determine client ISO drive letter."
          }

          $installWim = "${isoDrive}:\sources\install.wim"

          if (-not (Test-Path -LiteralPath $installWim)) {
              $installWim = "${isoDrive}:\sources\install.esd"
          }

          if (-not (Test-Path -LiteralPath $installWim)) {
              throw "install.wim/install.esd not found."
          }

          Write-Host "[+] Applying: $installWim"

          dism.exe `
              /Apply-Image `
              "/ImageFile:$installWim" `
              "/Index:${{ inputs.wim_index }}" `
              "/ApplyDir:$osDrive\" `
              /CheckIntegrity

          if ($LASTEXITCODE -ne 0) {
              throw "DISM Apply-Image failed: $LASTEXITCODE"
          }

          bcdboot.exe `
              "$osDrive\Windows" `
              /s $efiDrive `
              /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "BCDBoot failed: $LASTEXITCODE"
          }

          Dismount-DiskImage `
              -ImagePath $env:CLIENT_ISO

          Dismount-VHD `
              -Path $vhdx

          Write-Host "[+] Client VHDX prepared."


      # ============================================================
      # PREPARE SERVER VHDX
      # ============================================================

      - name: Prepare Windows Server DC01 VHDX
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== PREPARE WINDOWS SERVER DC01 =========="

          $vhdx = $env:SERVER_VHDX

          if (Test-Path -LiteralPath $vhdx) {
              Remove-Item `
                  -LiteralPath $vhdx `
                  -Force
          }

          New-VHD `
              -Path $vhdx `
              -SizeBytes 80GB `
              -Dynamic |
              Out-Null

          Mount-VHD `
              -Path $vhdx `
              -Passthru |
              Out-Null

          $disk = Get-Disk |
              Where-Object {
                  $_.PartitionStyle -eq 'RAW'
              } |
              Sort-Object Number -Descending |
              Select-Object -First 1

          if (-not $disk) {
              throw "Could not locate mounted server VHDX disk."
          }

          Write-Host "[+] Disk: $($disk.Number)"

          Set-Disk `
              -Number $disk.Number `
              -IsOffline $false

          Set-Disk `
              -Number $disk.Number `
              -IsReadOnly $false

          Initialize-Disk `
              -Number $disk.Number `
              -PartitionStyle GPT `
              -Confirm:$false

          $efi = New-Partition `
              -DiskNumber $disk.Number `
              -Size 100MB `
              -GptType "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"

          New-Partition `
              -DiskNumber $disk.Number `
              -Size 16MB `
              -GptType "{E3C9E316-0B5C-4DB8-817D-F92DF00215AE}" |
              Out-Null

          $os = New-Partition `
              -DiskNumber $disk.Number `
              -UseMaximumSize `
              -AssignDriveLetter

          Format-Volume `
              -Partition $efi `
              -FileSystem FAT32 `
              -NewFileSystemLabel "SYSTEM" `
              -Confirm:$false |
              Out-Null

          Format-Volume `
              -Partition $os `
              -FileSystem NTFS `
              -NewFileSystemLabel "Windows" `
              -Confirm:$false |
              Out-Null

          if (-not $efi.DriveLetter) {
              Set-Partition `
                  -DiskNumber $disk.Number `
                  -PartitionNumber $efi.PartitionNumber `
                  -NewDriveLetter T
          }

          $efiDrive = "T:"
          $osDrive = "$($os.DriveLetter):"

          Write-Host "[+] EFI: $efiDrive"
          Write-Host "[+] OS : $osDrive"

          $isoMount = Mount-DiskImage `
              -ImagePath $env:SERVER_ISO `
              -PassThru

          $isoDrive = (
              $isoMount |
              Get-Volume
          ).DriveLetter

          if (-not $isoDrive) {
              throw "Could not determine Server ISO drive letter."
          }

          $installWim = "${isoDrive}:\sources\install.wim"

          if (-not (Test-Path -LiteralPath $installWim)) {
              $installWim = "${isoDrive}:\sources\install.esd"
          }

          if (-not (Test-Path -LiteralPath $installWim)) {
              throw "Server install.wim/install.esd not found."
          }

          Write-Host "[+] Applying: $installWim"

          dism.exe `
              /Apply-Image `
              "/ImageFile:$installWim" `
              "/Index:${{ inputs.server_wim_index }}" `
              "/ApplyDir:$osDrive\" `
              /CheckIntegrity

          if ($LASTEXITCODE -ne 0) {
              throw "DISM Apply-Image failed: $LASTEXITCODE"
          }

          # ========================================================
          # AUTOUNATTEND FROM REPOSITORY
          # ========================================================

          $unattendSource = "$env:GITHUB_WORKSPACE\Autounattend.xml"

          Write-Host "[*] Looking for:"
          Write-Host "    $unattendSource"

          if (-not (Test-Path -LiteralPath $unattendSource)) {

              Write-Host ""
              Write-Host "========== WORKSPACE CONTENT =========="

              Get-ChildItem `
                  -LiteralPath $env:GITHUB_WORKSPACE `
                  -Force |
                  Select-Object Name, FullName, Length |
                  Format-Table -AutoSize

              throw "Autounattend.xml not found: $unattendSource"
          }

          Write-Host "[+] Found repository Autounattend.xml."

          # Read repository file without exposing password.
          $unattendContent = Get-Content `
              -LiteralPath $unattendSource `
              -Raw

          if (
              $unattendContent.Contains(
                  "CHANGE_ME_ADMIN_PASSWORD"
              )
          ) {

              Write-Host "[*] Replacing Administrator password placeholder."

              $unattendContent =
                  $unattendContent.Replace(
                      "CHANGE_ME_ADMIN_PASSWORD",
                      $env:ADMIN_PASS
                  )
          }
          else {
              Write-Host "[*] Administrator password placeholder not found."
          }

          # Fresh Windows image may not contain Panther yet.
          New-Item `
              -Path "$osDrive\Windows\Panther" `
              -ItemType Directory `
              -Force |
              Out-Null

          Set-Content `
              -LiteralPath "$osDrive\Windows\Panther\Autounattend.xml" `
              -Value $unattendContent `
              -Encoding UTF8 `
              -Force

          if (
              -not (
                  Test-Path `
                      -LiteralPath "$osDrive\Windows\Panther\Autounattend.xml"
              )
          ) {
              throw "Failed to inject Autounattend.xml."
          }

          Write-Host "[+] Autounattend.xml injected into Windows image."

          # ========================================================
          # BOOT FILES
          # ========================================================

          bcdboot.exe `
              "$osDrive\Windows" `
              /s $efiDrive `
              /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "BCDBoot failed: $LASTEXITCODE"
          }

          Dismount-DiskImage `
              -ImagePath $env:SERVER_ISO

          Dismount-VHD `
              -Path $vhdx

          Write-Host "[+] Server VHDX prepared."


      # ============================================================
      # OUTER NAT
      # ============================================================

      - name: Prepare outer Hyper-V networking
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== OUTER HYPER-V NETWORK =========="

          if (-not (
              Get-VMSwitch `
                  -Name $env:SERVER_SWITCH `
                  -ErrorAction SilentlyContinue
          )) {

              New-VMSwitch `
                  -Name $env:SERVER_SWITCH `
                  -SwitchType Internal |
                  Out-Null
          }

          $adapter = Get-NetAdapter `
              -Name "vEthernet ($env:SERVER_SWITCH)" `
              -ErrorAction Stop

          if (-not (
              Get-NetIPAddress `
                  -InterfaceIndex $adapter.ifIndex `
                  -IPAddress $env:SERVER_GATEWAY `
                  -ErrorAction SilentlyContinue
          )) {

              New-NetIPAddress `
                  -InterfaceIndex $adapter.ifIndex `
                  -IPAddress $env:SERVER_GATEWAY `
                  -PrefixLength 24 |
                  Out-Null
          }

          if (-not (
              Get-NetNat `
                  -Name $env:SERVER_SWITCH `
                  -ErrorAction SilentlyContinue
          )) {

              New-NetNat `
                  -Name $env:SERVER_SWITCH `
                  -InternalIPInterfaceAddressPrefix `
                  $env:SERVER_PREFIX
          }

          Write-Host "[+] SERVER-NAT ready."


      # ============================================================
      # CREATE SERVER-DC01
      # ============================================================

      - name: Create SERVER-DC01
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE SERVER-DC01 =========="

          if (Get-VM `
              -Name $env:SERVER_VM `
              -ErrorAction SilentlyContinue
          ) {

              Stop-VM `
                  -Name $env:SERVER_VM `
                  -TurnOff `
                  -Force `
                  -ErrorAction SilentlyContinue

              Remove-VM `
                  -Name $env:SERVER_VM `
                  -Force
          }

          New-VM `
              -Name $env:SERVER_VM `
              -Generation 2 `
              -MemoryStartupBytes 4GB `
              -VHDPath $env:SERVER_VHDX `
              -SwitchName $env:SERVER_SWITCH |
              Out-Null

          # IMPORTANT:
          # Nested virtualization is enabled BEFORE FIRST BOOT.

          Set-VMProcessor `
              -VMName $env:SERVER_VM `
              -Count 4 `
              -ExposeVirtualizationExtensions $true

          Set-VMNetworkAdapter `
              -VMName $env:SERVER_VM `
              -MacAddressSpoofing On

          Enable-VMIntegrationService `
              -VMName $env:SERVER_VM `
              -Name "Guest Service Interface"

          try {
              Set-VMFirmware `
                  -VMName $env:SERVER_VM `
                  -EnableSecureBoot On

              Write-Host "[+] Secure Boot enabled."
          }
          catch {
              Write-Warning `
                  "Secure Boot could not be enabled: $($_.Exception.Message)"
          }

          try {

              if (
                  Get-Command `
                      Set-VMKeyProtector `
                      -ErrorAction SilentlyContinue
              ) {

                  Set-VMKeyProtector `
                      -VMName $env:SERVER_VM `
                      -NewLocalKeyProtector

                  Write-Host "[+] Local key protector configured."
              }

              if (
                  Get-Command `
                      Enable-VMTPM `
                      -ErrorAction SilentlyContinue
              ) {

                  Enable-VMTPM `
                      -VMName $env:SERVER_VM

                  Write-Host "[+] vTPM enabled."
              }

          }
          catch {
              Write-Warning `
                  "vTPM/key protector unavailable: $($_.Exception.Message)"
          }

          Write-Host "[+] SERVER-DC01 ready for first boot."


      # ============================================================
      # VERIFY SERVER VM
      # ============================================================

      - name: Verify SERVER-DC01 configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== VERIFY SERVER VM =========="

          Get-VM `
              -Name $env:SERVER_VM |
              Select-Object `
                  Name,
                  State,
                  Generation,
                  MemoryStartup |
              Format-Table -AutoSize

          Get-VMProcessor `
              -VMName $env:SERVER_VM |
              Select-Object `
                  VMName,
                  Count,
                  ExposeVirtualizationExtensions |
              Format-Table -AutoSize

          Get-VMNetworkAdapter `
              -VMName $env:SERVER_VM |
              Select-Object `
                  VMName,
                  MacAddressSpoofing |
              Format-Table -AutoSize

          try {
              Get-VMFirmware `
                  -VMName $env:SERVER_VM |
                  Format-List *
          }
          catch {
              Write-Warning $_.Exception.Message
          }

          try {
              Get-VMSecurity `
                  -VMName $env:SERVER_VM |
                  Format-List *
          }
          catch {
              Write-Warning $_.Exception.Message
          }


      # ============================================================
      # START SERVER
      # ============================================================

      - name: Start SERVER-DC01
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== START SERVER-DC01 =========="

          Start-VM `
              -Name $env:SERVER_VM |
              Out-Null

          Write-Host "[+] SERVER-DC01 started."


      # ============================================================
      # WAIT POWER SHELL DIRECT
      # ============================================================

      - name: Wait for SERVER-DC01 PowerShell Direct
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== WAIT FOR SERVER-DC01 =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator", $secure)

          $ready = $false

          for ($i = 1; $i -le 120; $i++) {

              try {

                  Invoke-Command `
                      -VMName $env:SERVER_VM `
                      -Credential $cred `
                      -ScriptBlock {
                          "READY"
                      } `
                      -ErrorAction Stop |
                      Out-Null

                  $ready = $true

                  Write-Host "[+] PowerShell Direct ready."

                  break
              }
              catch {

                  Write-Host "[*] Waiting... $i/120"

                  Start-Sleep -Seconds 5
              }
          }

          if (-not $ready) {
              throw "SERVER-DC01 did not become available through PowerShell Direct."
          }


      # ============================================================
      # SERVER NETWORK
      # ============================================================

      - name: Configure SERVER-DC01 network
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CONFIGURE SERVER NETWORK =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator", $secure)

          $serverIP = $env:SERVER_IP
          $gateway = $env:SERVER_GATEWAY

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ArgumentList $serverIP, $gateway `
              -ScriptBlock {

                  param(
                      [string]$ServerIP,
                      [string]$Gateway
                  )

                  $adapter = Get-NetAdapter |
                      Where-Object Status -eq "Up" |
                      Select-Object -First 1

                  if (-not $adapter) {
                      throw "No active network adapter."
                  }

                  Get-NetIPAddress `
                      -InterfaceIndex $adapter.ifIndex `
                      -AddressFamily IPv4 `
                      -ErrorAction SilentlyContinue |
                      Where-Object {
                          $_.IPAddress -ne "127.0.0.1"
                      } |
                      Remove-NetIPAddress `
                          -Confirm:$false `
                          -ErrorAction SilentlyContinue

                  New-NetIPAddress `
                      -InterfaceIndex $adapter.ifIndex `
                      -IPAddress $ServerIP `
                      -PrefixLength 24 `
                      -DefaultGateway $Gateway |
                      Out-Null

                  Set-DnsClientServerAddress `
                      -InterfaceIndex $adapter.ifIndex `
                      -ServerAddresses @(
                          "127.0.0.1",
                          "8.8.8.8"
                      )

                  Write-Host "[+] IP: $ServerIP"
                  Write-Host "[+] Gateway: $Gateway"
              }


      # ============================================================
      # INSTALL NESTED HYPER-V
      # ============================================================

      - name: Install nested Hyper-V
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== INSTALL NESTED HYPER-V =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator", $secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  $feature = Get-WindowsFeature Hyper-V

                  if (-not $feature.Installed) {

                      Install-WindowsFeature `
                          Hyper-V `
                          -IncludeManagementTools

                      Write-Host "[+] Hyper-V installed."
                  }
                  else {
                      Write-Host "[*] Hyper-V already installed."
                  }
              }

          Start-Sleep -Seconds 20

          $ready = $false

          for ($i = 1; $i -le 120; $i++) {

              try {

                  Invoke-Command `
                      -VMName $env:SERVER_VM `
                      -Credential $cred `
                      -ScriptBlock {
                          "READY"
                      } `
                      -ErrorAction Stop |
                      Out-Null

                  $ready = $true
                  break
              }
              catch {

                  Write-Host `
                      "[*] Waiting after Hyper-V installation... $i/120"

                  Start-Sleep -Seconds 5
              }
          }

          if (-not $ready) {
              throw "SERVER-DC01 did not return after Hyper-V installation."
          }


      # ============================================================
      # AD DS + DNS
      # ============================================================

      - name: Install AD DS and DNS
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== INSTALL AD DS + DNS =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator", $secure)

          $domain = $env:AD_DOMAIN
          $netbios = $env:AD_NETBIOS
          $adminPass = $env:ADMIN_PASS

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ArgumentList $domain, $netbios, $adminPass `
              -ScriptBlock {

                  param(
                      [string]$Domain,
                      [string]$Netbios,
                      [string]$AdminPassword
                  )

                  Install-WindowsFeature `
                      AD-Domain-Services `
                      DNS `
                      -IncludeManagementTools

                  Import-Module ADDSDeployment

                  $safeModePassword =
                      ConvertTo-SecureString `
                          $AdminPassword `
                          -AsPlainText `
                          -Force

                  Install-ADDSForest `
                      -DomainName $Domain `
                      -DomainNetbiosName $Netbios `
                      -SafeModeAdministratorPassword $safeModePassword `
                      -InstallDns `
                      -CreateDnsDelegation:$false `
                      -DatabasePath "C:\Windows\NTDS" `
                      -LogPath "C:\Windows\NTDS" `
                      -SysvolPath "C:\Windows\SYSVOL" `
                      -NoRebootOnCompletion:$false `
                      -Force
              }

          Start-Sleep -Seconds 30


      # ============================================================
      # WAIT AD DS
      # ============================================================

      - name: Wait for domain controller
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== WAIT FOR DOMAIN CONTROLLER =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator", $secure)

          $ready = $false

          for ($i = 1; $i -le 180; $i++) {

              try {

                  $status = Invoke-Command `
                      -VMName $env:SERVER_VM `
                      -Credential $cred `
                      -ScriptBlock {

                          (Get-Service NTDS -ErrorAction Stop).Status
                      } `
                      -ErrorAction Stop

                  if ($status -eq "Running") {

                      $ready = $true

                      Write-Host "[+] NTDS is running."

                      break
                  }
              }
              catch {
              }

              Write-Host `
                  "[*] Waiting for AD DS... $i/180"

              Start-Sleep -Seconds 5
          }

          if (-not $ready) {
              throw "AD DS did not become ready."
          }


      # ============================================================
      # VERIFY AD
      # ============================================================

      - name: Verify AD DS and DNS
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== VERIFY AD DS + DNS =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator", $secure)

          $domain = $env:AD_DOMAIN

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ArgumentList $domain `
              -ScriptBlock {

                  param([string]$Domain)

                  Write-Host "--- Computer ---"

                  Get-CimInstance `
                      Win32_ComputerSystem |
                      Select-Object `
                          Name,
                          Domain,
                          PartOfDomain

                  Write-Host "--- AD Domain ---"

                  try {

                      Import-Module ActiveDirectory

                      Get-ADDomain |
                          Select-Object `
                              DNSRoot,
                              NetBIOSName,
                              DomainMode
                  }
                  catch {
                      Write-Warning $_.Exception.Message
                  }

                  Write-Host "--- Services ---"

                  Get-Service `
                      NTDS,
                      DNS,
                      Netlogon |
                      Select-Object Name, Status

                  Write-Host "--- DNS ---"

                  Resolve-DnsName `
                      $Domain `
                      -ErrorAction Continue
              }


      # ============================================================
      # NESTED RDS NAT
      # ============================================================

      - name: Configure nested RDS NAT
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== CONFIGURE RDS-NAT =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator", $secure)

          $switchName = $env:RDS_SWITCH
          $gateway = $env:RDS_GATEWAY
          $prefix = $env:RDS_PREFIX

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ArgumentList $switchName, $gateway, $prefix `
              -ScriptBlock {

                  param(
                      [string]$SwitchName,
                      [string]$Gateway,
                      [string]$Prefix
                  )

                  if (-not (
                      Get-VMSwitch `
                          -Name $SwitchName `
                          -ErrorAction SilentlyContinue
                  )) {

                      New-VMSwitch `
                          -Name $SwitchName `
                          -SwitchType Internal |
                          Out-Null
                  }

                  $adapter = Get-NetAdapter `
                      -Name "vEthernet ($SwitchName)" `
                      -ErrorAction Stop

                  if (-not (
                      Get-NetIPAddress `
                          -InterfaceIndex $adapter.ifIndex `
                          -IPAddress $Gateway `
                          -ErrorAction SilentlyContinue
                  )) {

                      New-NetIPAddress `
                          -InterfaceIndex $adapter.ifIndex `
                          -IPAddress $Gateway `
                          -PrefixLength 24 |
                          Out-Null
                  }

                  if (-not (
                      Get-NetNat `
                          -Name $SwitchName `
                          -ErrorAction SilentlyContinue
                  )) {

                      New-NetNat `
                          -Name $SwitchName `
                          -InternalIPInterfaceAddressPrefix $Prefix
                  }

                  Write-Host "[+] RDS-NAT ready."
              }


      # ============================================================
      # COPY CLIENT VHDX INTO L1
      # ============================================================

      - name: Copy VDI master VHDX into SERVER-DC01
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== COPY VDI MASTER INTO L1 =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator", $secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  New-Item `
                      -Path "C:\VDI\Templates" `
                      -ItemType Directory `
                      -Force |
                      Out-Null

                  New-Item `
                      -Path "C:\VDI\Collections" `
                      -ItemType Directory `
                      -Force |
                      Out-Null
              }

          Copy-VMFile `
              -Name $env:SERVER_VM `
              -SourcePath $env:CLIENT_VHDX `
              -DestinationPath $env:TEMPLATE_VHDX `
              -FileSource Host `
              -CreateFullPath

          Write-Host "[+] Client VHDX copied into SERVER-DC01."


      # ============================================================
      # CREATE ONLY MASTER TEMPLATE VM
      # ============================================================

      - name: Create RDS master template VM
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "========== CREATE RDS MASTER TEMPLATE =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator", $secure)

          $templateVM = $env:TEMPLATE_VM
          $templateVHDX = $env:TEMPLATE_VHDX
          $rdsSwitch = $env:RDS_SWITCH

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ArgumentList $templateVM, $templateVHDX, $rdsSwitch `
              -ScriptBlock {

                  param(
                      [string]$TemplateVM,
                      [string]$TemplateVHDX,
                      [string]$RdsSwitch
                  )

                  if (Get-VM `
                      -Name $TemplateVM `
                      -ErrorAction SilentlyContinue
                  ) {

                      Stop-VM `
                          -Name $TemplateVM `
                          -TurnOff `
                          -Force `
                          -ErrorAction SilentlyContinue

                      Remove-VM `
                          -Name $TemplateVM `
                          -Force
                  }

                  New-VM `
                      -Name $TemplateVM `
                      -Generation 2 `
                      -MemoryStartupBytes 2GB `
                      -VHDPath $TemplateVHDX `
                      -SwitchName $RdsSwitch |
                      Out-Null

                  Set-VMProcessor `
                      -VMName $TemplateVM `
                      -Count 2

                  try {
                      Set-VMFirmware `
                          -VMName $TemplateVM `
                          -EnableSecureBoot On
                  }
                  catch {
                      Write-Warning $_.Exception.Message
                  }

                  Write-Host "[+] RDS-Master-Template created."
                  Write-Host "[*] RDS-Test-01 will NOT be created manually."
                  Write-Host "[*] RDS Connection Broker creates managed desktops."
              }


      # ============================================================
      # DEPLOY RDS VDI
      # ============================================================

      - name: Deploy native RDS VDI
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== DEPLOY NATIVE RDS VDI =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator", $secure)

          $domain = $env:AD_DOMAIN

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ArgumentList $domain `
              -ScriptBlock {

                  param([string]$Domain)

                  Import-Module RemoteDesktop

                  $fqdn =
                      "$env:COMPUTERNAME.$Domain"

                  Write-Host "[+] Connection Broker: $fqdn"
                  Write-Host "[+] Virtualization Host: $fqdn"
                  Write-Host "[+] Web Access: $fqdn"

                  $deployment = Get-RDDeployment `
                      -ConnectionBroker $fqdn `
                      -ErrorAction SilentlyContinue

                  if (-not $deployment) {

                      New-RDVirtualDesktopDeployment `
                          -ConnectionBroker $fqdn `
                          -VirtualizationHost $fqdn `
                          -WebAccessServer $fqdn `
                          -CreateVirtualSwitch `
                          -ErrorAction Stop

                      Write-Host "[+] RDS VDI deployment created."
                  }
                  else {
                      Write-Host "[*] RDS VDI deployment already exists."
                  }
              }


      # ============================================================
      # CREATE MANAGED POOLED COLLECTION
      # ============================================================

      - name: Create managed pooled VDI collection
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== CREATE MANAGED POOLED VDI =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator", $secure)

          $domain = $env:AD_DOMAIN
          $collection = $env:RDS_COLLECTION
          $templateVM = $env:TEMPLATE_VM
          $prefix = $env:RDS_VM_PREFIX
          $storage = $env:RDS_STORAGE
          $templateStorage = $env:RDS_TEMPLATE_STORAGE
          $netbios = $env:AD_NETBIOS

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ArgumentList `
                  $domain,
                  $collection,
                  $templateVM,
                  $prefix,
                  $storage,
                  $templateStorage,
                  $netbios `
              -ScriptBlock {

                  param(
                      [string]$Domain,
                      [string]$Collection,
                      [string]$TemplateVM,
                      [string]$Prefix,
                      [string]$Storage,
                      [string]$TemplateStorage,
                      [string]$Netbios
                  )

                  Import-Module RemoteDesktop

                  $fqdn =
                      "$env:COMPUTERNAME.$Domain"

                  $existing =
                      Get-RDVirtualDesktopCollection `
                          -ConnectionBroker $fqdn `
                          -CollectionName $Collection `
                          -ErrorAction SilentlyContinue

                  if (-not $existing) {

                      $allocation = @{
                          $fqdn = 1
                      }

                      New-RDVirtualDesktopCollection `
                          -CollectionName $Collection `
                          -PooledManaged `
                          -VirtualDesktopTemplateName $TemplateVM `
                          -VirtualDesktopTemplateHostServer $fqdn `
                          -VirtualDesktopAllocation $allocation `
                          -StorageType LocalStorage `
                          -LocalStoragePath $Storage `
                          -VirtualDesktopTemplateStoragePath $TemplateStorage `
                          -Description "Native managed pooled Windows VDI collection" `
                          -UserGroups "$Netbios\Domain Users" `
                          -ConnectionBroker $fqdn `
                          -VirtualDesktopNamePrefix $Prefix `
                          -VirtualDesktopPasswordAge 0 `
                          -Force

                      Write-Host "[+] Managed pooled collection created."
                      Write-Host "[*] RDS Broker will create the desktop."

                  }
                  else {
                      Write-Host "[*] Collection already exists."
                  }
              }


      # ============================================================
      # WAIT FOR BROKER DESKTOP
      # ============================================================

      - name: Wait for RDS broker-created desktop
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== WAIT FOR RDS BROKER DESKTOP =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator", $secure)

          $domain = $env:AD_DOMAIN
          $collection = $env:RDS_COLLECTION
          $prefix = $env:RDS_VM_PREFIX

          $found = $false

          for ($i = 1; $i -le 180; $i++) {

              try {

                  $desktops = Invoke-Command `
                      -VMName $env:SERVER_VM `
                      -Credential $cred `
                      -ArgumentList $domain, $collection `
                      -ScriptBlock {

                          param(
                              [string]$Domain,
                              [string]$Collection
                          )

                          Import-Module RemoteDesktop

                          $fqdn =
                              "$env:COMPUTERNAME.$Domain"

                          Get-RDVirtualDesktop `
                              -CollectionName $Collection `
                              -ConnectionBroker $fqdn `
                              -ErrorAction Stop |
                              Select-Object `
                                  VirtualDesktopName,
                                  VirtualDesktopStatus
                      } `
                      -ErrorAction Stop

                  if ($desktops) {

                      Write-Host ""
                      Write-Host "========== RDS DESKTOPS =========="

                      $desktops |
                          Format-Table -AutoSize

                      $brokerDesktop =
                          $desktops |
                          Where-Object {
                              $_.VirtualDesktopName `
                                  -like "$prefix*"
                          }

                      if ($brokerDesktop) {

                          $found = $true

                          Write-Host ""
                          Write-Host "[+] RDS Broker created desktop:"

                          $brokerDesktop |
                              Format-Table -AutoSize

                          break
                      }
                  }

              }
              catch {

                  Write-Host `
                      "[*] Broker still creating desktop... $i/180"
              }

              Start-Sleep -Seconds 5
          }

          if (-not $found) {

              Write-Warning `
                  "No broker-created desktop reported within timeout."

              Write-Warning `
                  "Continuing for final state inspection."
          }


      # ============================================================
      # PUBLISH COLLECTION
      # ============================================================

      - name: Publish VDI collection to RD Web
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== PUBLISH RDS COLLECTION =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator", $secure)

          $domain = $env:AD_DOMAIN
          $collection = $env:RDS_COLLECTION

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ArgumentList $domain, $collection `
              -ScriptBlock {

                  param(
                      [string]$Domain,
                      [string]$Collection
                  )

                  Import-Module RemoteDesktop

                  $fqdn =
                      "$env:COMPUTERNAME.$Domain"

                  try {

                      Set-RDRemoteDesktop `
                          -CollectionName $Collection `
                          -ShowInWebAccess $true `
                          -ConnectionBroker $fqdn `
                          -ErrorAction Stop

                      Write-Host "[+] Collection published to RD Web."
                  }
                  catch {

                      Write-Warning $_.Exception.Message
                  }
              }


      # ============================================================
      # IIS RDWEB - DISABLE REQUIRE SSL
      # ============================================================

      - name: Disable IIS Require SSL for RDWeb
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "========== DISABLE IIS REQUIRE SSL FOR RDWeb =========="

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator", $secure)

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ScriptBlock {

                  Import-Module WebAdministration

                  $locations =
                      New-Object `
                          System.Collections.Generic.List[string]

                  # Root RDWeb zone.
                  $locations.Add(
                      "Default Web Site/RDWeb"
                  )

                  # RDWeb applications.
                  try {

                      Get-WebApplication `
                          -Site "Default Web Site" |
                          Where-Object {
                              $_.Path -like "/RDWeb*"
                          } |
                          ForEach-Object {

                              $location =
                                  "Default Web Site" +
                                  $_.Path

                              if (
                                  -not $locations.Contains($location)
                              ) {

                                  $locations.Add($location)
                              }
                          }
                  }
                  catch {

                      Write-Warning `
                          "Could not enumerate RDWeb applications: $($_.Exception.Message)"
                  }

                  # RDWeb virtual directories.
                  try {

                      Get-WebVirtualDirectory `
                          -Site "Default Web Site" |
                          Where-Object {
                              $_.Path -like "/RDWeb*"
                          } |
                          ForEach-Object {

                              $location =
                                  "Default Web Site" +
                                  $_.Path

                              if (
                                  -not $locations.Contains($location)
                              ) {

                                  $locations.Add($location)
                              }
                          }
                  }
                  catch {

                      Write-Warning `
                          "Could not enumerate RDWeb virtual directories: $($_.Exception.Message)"
                  }

                  Write-Host ""
                  Write-Host "========== RDWeb LOCATIONS =========="

                  $locations |
                      ForEach-Object {
                          Write-Host $_
                      }

                  Write-Host ""
                  Write-Host "========== SET sslFlags=None =========="

                  foreach ($location in $locations) {

                      try {

                          Set-WebConfigurationProperty `
                              -PSPath "IIS:\" `
                              -Filter "system.webServer/security/access" `
                              -Name "sslFlags" `
                              -Value "None" `
                              -Location $location `
                              -Force `
                              -ErrorAction Stop

                          Write-Host `
                              "[+] Require SSL disabled: $location"
                      }
                      catch {

                          Write-Warning `
                              "[-] $location : $($_.Exception.Message)"
                      }
                  }

                  Write-Host ""
                  Write-Host "========== VERIFY sslFlags =========="

                  foreach ($location in $locations) {

                      try {

                          $value =
                              Get-WebConfigurationProperty `
                                  -PSPath "IIS:\" `
                                  -Filter "system.webServer/security/access" `
                                  -Name "sslFlags" `
                                  -Location $location `
                                  -ErrorAction Stop

                          Write-Host `
                              "$location -> sslFlags=$value"
                      }
                      catch {

                          Write-Warning `
                              "Could not read $location"
                      }
                  }

                  Write-Host ""
                  Write-Host "[*] Restarting IIS..."

                  iisreset /noforce

                  Write-Host "[+] RDWeb IIS configuration complete."
              }


      # ============================================================
      # FINAL STATUS
      # ============================================================

      - name: Final RDS status
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    FINAL VDI STATUS"
          Write-Host "============================================================"

          $secure = ConvertTo-SecureString `
              $env:ADMIN_PASS `
              -AsPlainText `
              -Force

          $cred = New-Object `
              System.Management.Automation.PSCredential `
              ("Administrator", $secure)

          $domain = $env:AD_DOMAIN
          $collection = $env:RDS_COLLECTION

          Invoke-Command `
              -VMName $env:SERVER_VM `
              -Credential $cred `
              -ArgumentList $domain, $collection `
              -ScriptBlock {

                  param(
                      [string]$Domain,
                      [string]$Collection
                  )

                  Write-Host ""
                  Write-Host "----- Nested Hyper-V -----"

                  Get-VMSwitch |
                      Select-Object `
                          Name,
                          SwitchType |
                      Format-Table -AutoSize

                  Get-VM |
                      Select-Object `
                          Name,
                          State,
                          Generation,
                          CPUUsage,
                          MemoryAssigned |
                      Format-Table -AutoSize

                  Write-Host ""
                  Write-Host "----- RDS Deployment -----"

                  Import-Module RemoteDesktop

                  $fqdn =
                      "$env:COMPUTERNAME.$Domain"

                  try {

                      Get-RDServer `
                          -ConnectionBroker $fqdn |
                          Format-Table `
                              Server,
                              Roles `
                              -AutoSize
                  }
                  catch {

                      Write-Warning $_.Exception.Message
                  }

                  Write-Host ""
                  Write-Host "----- RDS Collections -----"

                  try {

                      Get-RDVirtualDesktopCollection `
                          -ConnectionBroker $fqdn |
                          Format-Table `
                              CollectionName,
                              CollectionDescription `
                              -AutoSize
                  }
                  catch {

                      Write-Warning $_.Exception.Message
                  }

                  Write-Host ""
                  Write-Host "----- RDS Virtual Desktops -----"

                  try {

                      Get-RDVirtualDesktop `
                          -CollectionName $Collection `
                          -ConnectionBroker $fqdn |
                          Format-Table `
                              VirtualDesktopName,
                              VirtualDesktopStatus `
                              -AutoSize
                  }
                  catch {

                      Write-Warning $_.Exception.Message
                  }

                  Write-Host ""
                  Write-Host "----- RDWeb -----"

                  try {

                      Get-WebApplication `
                          -Site "Default Web Site" |
                          Where-Object {
                              $_.Path -like "/RDWeb*"
                          } |
                          Select-Object `
                              Path,
                              PhysicalPath |
                          Format-Table -AutoSize
                  }
                  catch {

                      Write-Warning $_.Exception.Message
                  }
              }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "SERVER-DC01       : $env:SERVER_IP"
          Write-Host "SERVER-NAT        : $env:SERVER_GATEWAY/24"
          Write-Host "RDS-NAT           : $env:RDS_GATEWAY/24"
          Write-Host "RDS collection    : $env:RDS_COLLECTION"
          Write-Host "RDS template      : $env:TEMPLATE_VM"
          Write-Host "RDS-Test-01       : BROKER MANAGED"
          Write-Host "RDWeb Require SSL : DISABLED"
          Write-Host "============================================================"


      # ============================================================
      # KEEP LAB ALIVE
      # ============================================================

      - name: Keep lab alive
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                       LAB IS RUNNING"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "SERVER-DC01       : $env:SERVER_VM"
          Write-Host "Nested Hyper-V    : ENABLED"
          Write-Host "AD DS / DNS       : ENABLED"
          Write-Host "RDS VDI           : ENABLED"
          Write-Host "RDS Collection    : $env:RDS_COLLECTION"
          Write-Host "RDS Template      : $env:TEMPLATE_VM"
          Write-Host "RDS-Test-01       : CREATED BY RDS BROKER"
          Write-Host "RDWeb Require SSL : DISABLED"
          Write-Host ""

          Start-Sleep -Seconds 300
