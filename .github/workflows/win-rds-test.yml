name: Deploy Windows Native VDI

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Direct Windows ISO URL"
        required: true
        type: string

      wim_index:
        description: "Windows image index inside install.wim/install.esd"
        required: false
        default: "1"
        type: string

jobs:

  deploy:
    name: Deploy Native Windows VDI
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. DOWNLOAD WINDOWS ISO
      # ============================================================
      - name: Download Windows ISO
        shell: powershell
        run: |
          $iso = "$env:RUNNER_TEMP\windows.iso"
          $url = "${{ inputs.iso_url }}"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "              WINDOWS ISO DOWNLOAD"
          Write-Host "============================================================"
          Write-Host ""

          if (Test-Path $iso) {
              Remove-Item $iso -Force
          }

          Write-Host "[*] Downloading Windows ISO..."
          Write-Host "[*] curl output is shown directly below."
          Write-Host ""

          curl.exe `
              -L `
              --fail `
              --retry 5 `
              --retry-delay 5 `
              --retry-all-errors `
              -C - `
              -o "$iso" `
              "$url"

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  DOWNLOAD RESULT"
          Write-Host "============================================================"
          Write-Host "[*] curl exit code: $exitCode"

          if ($exitCode -ne 0) {
              throw "curl failed with exit code $exitCode"
          }

          if (-not (Test-Path $iso)) {
              throw "ISO file was not created"
          }

          $size = (Get-Item $iso).Length
          $sizeGB = $size / 1GB

          Write-Host "[+] Download completed successfully"
          Write-Host "[+] ISO size: $($sizeGB.ToString('N2')) GB"
          Write-Host "[+] ISO: $iso"

          "ISO_PATH=$iso" >> $env:GITHUB_ENV


      # ============================================================
      # 2. MOUNT ISO
      # ============================================================
      - name: Mount Windows ISO
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  MOUNT WINDOWS ISO"
          Write-Host "============================================================"

          $iso = "$env:ISO_PATH"

          if (-not (Test-Path $iso)) {
              throw "Windows ISO not found: $iso"
          }

          Write-Host "[*] Mounting ISO..."

          $image = Mount-DiskImage `
              -ImagePath $iso `
              -PassThru

          Start-Sleep -Seconds 3

          $volume = $image |
              Get-Volume |
              Where-Object DriveLetter |
              Select-Object -First 1

          if (-not $volume) {
              throw "Could not determine mounted ISO drive"
          }

          $drive = "$($volume.DriveLetter):"

          Write-Host "[+] ISO mounted at $drive"

          "ISO_DRIVE=$drive" >> $env:GITHUB_ENV


      # ============================================================
      # 3. FIND INSTALL.WIM / INSTALL.ESD
      # ============================================================
      - name: Find Windows Image
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  FIND WINDOWS IMAGE"
          Write-Host "============================================================"

          $drive = "$env:ISO_DRIVE"

          $wim = Join-Path $drive "sources\install.wim"
          $esd = Join-Path $drive "sources\install.esd"

          if (Test-Path $wim) {

              $imageFile = $wim

              Write-Host "[+] Found install.wim"

          }
          elseif (Test-Path $esd) {

              $imageFile = $esd

              Write-Host "[+] Found install.esd"

          }
          else {

              throw "Neither install.wim nor install.esd was found"

          }

          Write-Host "[+] Image: $imageFile"

          "IMAGE_FILE=$imageFile" >> $env:GITHUB_ENV


      # ============================================================
      # 4. INSPECT WINDOWS IMAGE
      # ============================================================
      - name: Inspect Windows Image
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  WINDOWS IMAGE INFO"
          Write-Host "============================================================"

          dism.exe /Get-WimInfo /WimFile:"$env:IMAGE_FILE"

          if ($LASTEXITCODE -ne 0) {
              throw "DISM Get-WimInfo failed with exit code $LASTEXITCODE"
          }


      # ============================================================
      # 5. CREATE MASTER VHDX
      # ============================================================
      - name: Create Master VHDX
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  CREATE MASTER VHDX"
          Write-Host "============================================================"

          $vhdx = "$env:RUNNER_TEMP\Windows-VDI-Master.vhdx"

          if (Test-Path $vhdx) {
              Remove-Item $vhdx -Force
          }

          Write-Host "[*] Creating dynamic 60 GB VHDX..."

          New-VHD `
              -Path $vhdx `
              -SizeBytes 60GB `
              -Dynamic |
              Out-Null

          Write-Host "[+] VHDX created"
          Write-Host "    $vhdx"

          "VHDX_PATH=$vhdx" >> $env:GITHUB_ENV


      # ============================================================
      # 6. INITIALIZE VHDX
      # ============================================================
      - name: Initialize Master VHDX
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  INITIALIZE MASTER VHDX"
          Write-Host "============================================================"

          $vhdx = "$env:VHDX_PATH"

          Write-Host "[*] Mounting VHDX..."

          $disk = Mount-VHD `
              -Path $vhdx `
              -Passthru

          Start-Sleep -Seconds 2

          Write-Host "[*] Initializing GPT..."

          Initialize-Disk `
              -Number $disk.Number `
              -PartitionStyle GPT `
              -ErrorAction Stop

          # --------------------------------------------------------
          # EFI SYSTEM PARTITION
          # --------------------------------------------------------
          Write-Host "[*] Creating EFI partition..."

          $efiPartition = New-Partition `
              -DiskNumber $disk.Number `
              -Size 100MB `
              -GptType "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"

          Format-Volume `
              -Partition $efiPartition `
              -FileSystem FAT32 `
              -NewFileSystemLabel "SYSTEM" `
              -Confirm:$false |
              Out-Null

          # --------------------------------------------------------
          # WINDOWS PARTITION
          # --------------------------------------------------------
          Write-Host "[*] Creating Windows partition..."

          $windowsPartition = New-Partition `
              -DiskNumber $disk.Number `
              -UseMaximumSize `
              -AssignDriveLetter

          Format-Volume `
              -Partition $windowsPartition `
              -FileSystem NTFS `
              -NewFileSystemLabel "Windows" `
              -Confirm:$false |
              Out-Null

          $windowsLetter = "$($windowsPartition.DriveLetter):"

          # --------------------------------------------------------
          # EFI DRIVE LETTER
          # --------------------------------------------------------
          $systemPartition = Get-Partition `
              -DiskNumber $disk.Number |
              Where-Object {
                  $_.GptType -eq "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"
              }

          $systemVolume = $systemPartition | Get-Volume

          if (-not $systemVolume.DriveLetter) {

              $systemPartition |
                  Add-PartitionAccessPath `
                  -AssignDriveLetter

              $systemVolume = $systemPartition | Get-Volume
          }

          $systemLetter = "$($systemVolume.DriveLetter):"

          Write-Host ""
          Write-Host "[+] Disk number:        $($disk.Number)"
          Write-Host "[+] Windows partition: $windowsLetter"
          Write-Host "[+] EFI partition:     $systemLetter"

          "VHDX_DISK_NUMBER=$($disk.Number)" >> $env:GITHUB_ENV
          "VHDX_WINDOWS=$windowsLetter" >> $env:GITHUB_ENV
          "VHDX_SYSTEM=$systemLetter" >> $env:GITHUB_ENV


      # ============================================================
      # 7. APPLY WINDOWS IMAGE
      # ============================================================
      - name: Apply Windows Image
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  APPLY WINDOWS IMAGE"
          Write-Host "============================================================"

          $image = "$env:IMAGE_FILE"
          $target = "$env:VHDX_WINDOWS"
          $index = "${{ inputs.wim_index }}"

          Write-Host "[*] Image : $image"
          Write-Host "[*] Index : $index"
          Write-Host "[*] Target: $target"
          Write-Host ""

          dism.exe `
              /Apply-Image `
              /ImageFile:"$image" `
              /Index:$index `
              /ApplyDir:"$target"

          if ($LASTEXITCODE -ne 0) {
              throw "DISM Apply-Image failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "[+] Windows image applied successfully"


      # ============================================================
      # 8. INSTALL WINDOWS BOOTLOADER
      # ============================================================
      - name: Install Windows Bootloader
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  INSTALL WINDOWS BOOTLOADER"
          Write-Host "============================================================"

          bcdboot.exe `
              "$env:VHDX_WINDOWS\Windows" `
              /s "$env:VHDX_SYSTEM" `
              /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "BCDBOOT failed with exit code $LASTEXITCODE"
          }

          Write-Host "[+] UEFI bootloader installed"


      # ============================================================
      # 9. PREPARE MASTER IMAGE
      # ============================================================
      - name: Prepare Master Image
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  PREPARE MASTER IMAGE"
          Write-Host "============================================================"

          Write-Host "[*] Current Windows edition:"

          dism.exe `
              /Image:"$env:VHDX_WINDOWS" `
              /Get-CurrentEdition

          if ($LASTEXITCODE -ne 0) {
              Write-Host "[!] Get-CurrentEdition returned $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "[+] Master image preparation complete"


      # ============================================================
      # 10. DISMOUNT MASTER VHDX
      # ============================================================
      - name: Dismount Master VHDX
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  DISMOUNT MASTER VHDX"
          Write-Host "============================================================"

          $vhdx = "$env:VHDX_PATH"

          $disk = Get-VHD `
              -Path $vhdx `
              -ErrorAction Stop

          if ($disk.Attached) {

              Write-Host "[*] Dismounting VHDX..."

              Dismount-VHD `
                  -Path $vhdx `
                  -ErrorAction Stop

              Write-Host "[+] Master VHDX is offline"

          }
          else {

              Write-Host "[+] Master VHDX already offline"

          }


      # ============================================================
      # 11. INSTALL HYPER-V
      # ============================================================
      - name: Install Hyper-V
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  INSTALL HYPER-V"
          Write-Host "============================================================"

          $feature = Get-WindowsOptionalFeature `
              -Online `
              -FeatureName Microsoft-Hyper-V-All

          if ($feature.State -eq "Enabled") {

              Write-Host "[+] Hyper-V already enabled"

          }
          else {

              Write-Host "[*] Enabling Hyper-V..."

              Enable-WindowsOptionalFeature `
                  -Online `
                  -FeatureName Microsoft-Hyper-V-All `
                  -All `
                  -NoRestart

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to enable Hyper-V"
              }

              Write-Host "[+] Hyper-V enabled"
          }


      # ============================================================
      # 12. INSTALL RDS VIRTUALIZATION
      # ============================================================
      - name: Install RDS Virtualization
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  RDS VIRTUALIZATION"
          Write-Host "============================================================"

          $result = Install-WindowsFeature `
              -Name RDS-Virtualization `
              -IncludeManagementTools

          $result |
              Select-Object `
                  Success,
                  RestartNeeded,
                  ExitCode,
                  FeatureResult |
              Format-List

          if (-not $result.Success) {
              throw "RDS-Virtualization installation failed"
          }

          Write-Host ""
          Write-Host "[+] RDS-Virtualization installed"
          Write-Host "[*] Restart required: $($result.RestartNeeded)"


      # ============================================================
      # 13. INSTALL RDS WEB ACCESS
      # ============================================================
      - name: Install RDS Web Access
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  RDS WEB ACCESS"
          Write-Host "============================================================"

          $result = Install-WindowsFeature `
              -Name RDS-Web-Access `
              -IncludeManagementTools

          $result |
              Select-Object `
                  Success,
                  RestartNeeded,
                  ExitCode,
                  FeatureResult |
              Format-List

          if (-not $result.Success) {
              throw "RDS-Web-Access installation failed"
          }

          Write-Host ""
          Write-Host "[+] RDS-Web-Access installed"
          Write-Host "[*] Restart required: $($result.RestartNeeded)"


      # ============================================================
      # 14. VERIFY RDS
      # ============================================================
      - name: Verify RDS Installation
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  VERIFY RDS"
          Write-Host "============================================================"

          Get-WindowsFeature `
              RDS-Virtualization,
              RDS-Web-Access |
              Select-Object `
                  Name,
                  DisplayName,
                  InstallState |
              Format-Table -AutoSize

          Write-Host ""
          Write-Host "[+] RDS role verification complete"


      # ============================================================
      # 15. CREATE VDI NAT NETWORK
      # ============================================================
      - name: Configure VDI NAT Network
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  VDI NAT NETWORK"
          Write-Host "============================================================"

          $switchName = "VDI-NAT"
          $gateway = "192.168.250.1"
          $natName = "VDI-NAT"

          # --------------------------------------------------------
          # CREATE INTERNAL SWITCH
          # --------------------------------------------------------
          $switch = Get-VMSwitch `
              -Name $switchName `
              -ErrorAction SilentlyContinue

          if (-not $switch) {

              Write-Host "[*] Creating internal switch..."

              New-VMSwitch `
                  -Name $switchName `
                  -SwitchType Internal |
                  Out-Null

              Write-Host "[+] Internal switch created"

          }
          else {

              Write-Host "[+] Internal switch already exists"

          }

          # --------------------------------------------------------
          # FIND HOST ADAPTER
          # --------------------------------------------------------
          $adapter = Get-NetAdapter |
              Where-Object {
                  $_.Name -like "*$switchName*"
              } |
              Select-Object -First 1

          if (-not $adapter) {
              throw "Could not find adapter for $switchName"
          }

          Write-Host "[+] Adapter: $($adapter.Name)"

          # --------------------------------------------------------
          # CONFIGURE GATEWAY
          # --------------------------------------------------------
          $existingIP = Get-NetIPAddress `
              -InterfaceIndex $adapter.ifIndex `
              -AddressFamily IPv4 `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.IPAddress -eq $gateway
              }

          if (-not $existingIP) {

              Get-NetIPAddress `
                  -InterfaceIndex $adapter.ifIndex `
                  -AddressFamily IPv4 `
                  -ErrorAction SilentlyContinue |
                  Remove-NetIPAddress `
                  -Confirm:$false `
                  -ErrorAction SilentlyContinue

              New-NetIPAddress `
                  -InterfaceIndex $adapter.ifIndex `
                  -IPAddress $gateway `
                  -PrefixLength 24 |
                  Out-Null

              Write-Host "[+] Gateway configured: $gateway/24"

          }
          else {

              Write-Host "[+] Gateway already configured"

          }

          # --------------------------------------------------------
          # CREATE NAT
          # --------------------------------------------------------
          $nat = Get-NetNat `
              -Name $natName `
              -ErrorAction SilentlyContinue

          if (-not $nat) {

              Write-Host "[*] Creating NAT..."

              New-NetNat `
                  -Name $natName `
                  -InternalIPInterfaceAddressPrefix "192.168.250.0/24" |
                  Out-Null

              Write-Host "[+] NAT created"

          }
          else {

              Write-Host "[+] NAT already exists"

          }

          Write-Host ""
          Write-Host "[+] VDI network ready"
          Write-Host "    Switch : $switchName"
          Write-Host "    Gateway: $gateway"
          Write-Host "    NAT    : 192.168.250.0/24"


      # ============================================================
      # 16. CREATE MASTER TEMPLATE VM
      # ============================================================
      - name: Create RDS Master Template VM
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "              CREATE RDS MASTER TEMPLATE"
          Write-Host "============================================================"

          $vmName = "RDS-Master-Template"
          $vhdx = "$env:VHDX_PATH"
          $switchName = "VDI-NAT"

          if (-not (Test-Path $vhdx)) {
              throw "Master VHDX not found: $vhdx"
          }

          # --------------------------------------------------------
          # Check existing VM
          # --------------------------------------------------------
          $existing = Get-VM `
              -Name $vmName `
              -ErrorAction SilentlyContinue

          if ($existing) {

              Write-Host "[+] Template VM already exists"

          }
          else {

              Write-Host "[*] Creating Generation 2 template VM..."
              Write-Host "[*] Memory: 4 GB"
              Write-Host "[*] VHDX:   $vhdx"
              Write-Host "[*] Switch: $switchName"

              New-VM `
                  -Name $vmName `
                  -Generation 2 `
                  -MemoryStartupBytes 4GB `
                  -VHDPath $vhdx `
                  -SwitchName $switchName |
                  Out-Null

              Write-Host "[+] Template VM created"

          }

          # --------------------------------------------------------
          # Template VM must NEVER auto-start
          # --------------------------------------------------------
          Set-VM `
              -Name $vmName `
              -AutomaticStopAction TurnOff `
              -AutomaticStartAction Nothing

          # --------------------------------------------------------
          # IMPORTANT:
          # The template VM is intentionally NOT started.
          # --------------------------------------------------------
          $vm = Get-VM -Name $vmName

          if ($vm.State -ne "Off") {

              Write-Host "[!] Template VM is not OFF"
              Write-Host "[*] Stopping template VM..."

              Stop-VM `
                  -Name $vmName `
                  -Force

              Start-Sleep -Seconds 2

          }

          $vm = Get-VM -Name $vmName

          Write-Host ""
          Write-Host "[+] MASTER TEMPLATE READY"
          Write-Host "    Name : $($vm.Name)"
          Write-Host "    State: $($vm.State)"
          Write-Host "    VHDX : $vhdx"

          if ($vm.State -ne "Off") {
              throw "Master template VM is not Off"
          }

          Write-Host ""
          Write-Host "[+] Template VM remains OFF"
          Write-Host "[+] No Start-VM was performed"


      # ============================================================
      # 17. VERIFY MASTER TEMPLATE
      # ============================================================
      - name: Verify Master Template
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "              VERIFY MASTER TEMPLATE"
          Write-Host "============================================================"

          $vmName = "RDS-Master-Template"

          $vm = Get-VM `
              -Name $vmName `
              -ErrorAction Stop

          $vhdx = Get-VHD `
              -Path "$env:VHDX_PATH" `
              -ErrorAction Stop

          Write-Host "[+] VM:"
          Write-Host "    Name : $($vm.Name)"
          Write-Host "    State: $($vm.State)"
          Write-Host "    Gen  : $($vm.Generation)"

          Write-Host ""
          Write-Host "[+] VHDX:"
          Write-Host "    Path    : $env:VHDX_PATH"
          Write-Host "    Format  : $($vhdx.VhdFormat)"
          Write-Host "    Type    : $($vhdx.VhdType)"
          Write-Host "    Size    : $([math]::Round($vhdx.Size / 1GB, 2)) GB"
          Write-Host "    FileSize: $([math]::Round($vhdx.FileSize / 1GB, 2)) GB"
          Write-Host "    Attached: $($vhdx.Attached)"

          if ($vm.State -ne "Off") {
              throw "RDS-Master-Template is running"
          }

          Write-Host ""
          Write-Host "[+] Master template verification passed"


      # ============================================================
      # 18. ENABLE RDP / TAILSCALE
      # ============================================================
      - name: Enable RDP Access
        uses: Veniamin668/win-rdp-enabler@main
        with:
          USE_CUSTOM_USER: 'false'
          CUSTOM_USERNAME: ''
          CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}
          TAIL_KEY: ${{ secrets.TAIL_KEY }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}


      # ============================================================
      # 19. FINAL STATUS
      # ============================================================
      - name: Show Final VDI Status
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "              NATIVE WINDOWS VDI READY"
          Write-Host "============================================================"
          Write-Host ""

          $vm = Get-VM `
              -Name "RDS-Master-Template" `
              -ErrorAction Stop

          Write-Host "[+] Master Template VM"
          Write-Host "    Name : $($vm.Name)"
          Write-Host "    State: $($vm.State)"

          Write-Host ""
          Write-Host "[+] Master VHDX"
          Write-Host "    $env:VHDX_PATH"

          Write-Host ""
          Write-Host "[+] Hyper-V installed"
          Write-Host "[+] RDS-Virtualization installed"
          Write-Host "[+] RDS-Web-Access installed"
          Write-Host "[+] VDI NAT configured"
          Write-Host "[+] Master VM object created"
          Write-Host "[+] Master VM remains OFF"
          Write-Host "[+] No manual host reboot performed"
          Write-Host "[+] RDP/Tailscale action executed"

          Write-Host ""
          Write-Host "============================================================"


      # ============================================================
      # 20. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  KEEP RUNNER ALIVE"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "[*] RDS master template remains OFF."
          Write-Host "[*] Runner will stay alive."
          Write-Host "[*] Stop the workflow manually when finished."
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] VDI runner alive..."
              Start-Sleep -Seconds 60
          }5
