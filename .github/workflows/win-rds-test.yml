name: Deploy Windows Native VDI

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Direct URL to Windows ISO"
        required: true
        type: string

      server_iso:
        description: "Direct URL to Windows Server ISO"
        required: true
        type: string

      wim_index:
        description: "Windows image index inside install.wim/install.esd"
        required: true
        default: "6"
        type: string

      server_wim_index:
        description: "Windows Server image index inside install.wim/install.esd"
        required: true
        default: "4"
        type: string

jobs:
  deploy-vdi:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. PATHS
      # ============================================================
      - name: Prepare workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $WorkDir = $env:GITHUB_WORKSPACE

          Write-Host "============================================================"
          Write-Host "                 PREPARE WORKSPACE"
          Write-Host "============================================================"

          Write-Host "[+] GITHUB_WORKSPACE:"
          Write-Host "    $WorkDir"

          if (-not (Test-Path $WorkDir)) {
              throw "GITHUB_WORKSPACE does not exist: $WorkDir"
          }

          $iso       = Join-Path $WorkDir "windows.iso"
          $serverIso = Join-Path $WorkDir "server.iso"
          $vhdx      = Join-Path $WorkDir "Windows-VDI-Master.vhdx"
          $serverVhdx = Join-Path $WorkDir "Server-DC01.vhdx"

          Write-Host "[+] VDI ISO:"
          Write-Host "    $iso"

          Write-Host "[+] Server ISO:"
          Write-Host "    $serverIso"

          Write-Host "[+] VDI VHDX:"
          Write-Host "    $vhdx"

          Write-Host "[+] Server VHDX:"
          Write-Host "    $serverVhdx"

      # ============================================================
      # 2. DOWNLOAD WINDOWS ISO
      # ============================================================
      - name: Download Windows ISO
        shell: pwsh
        env:
          ISO_URL: ${{ inputs.iso_url }}
        run: |
          $ErrorActionPreference = "Stop"

          $iso = Join-Path $env:GITHUB_WORKSPACE "windows.iso"
          $url = $env:ISO_URL

          Write-Host "============================================================"
          Write-Host "                    DOWNLOAD WINDOWS ISO"
          Write-Host "============================================================"

          if ([string]::IsNullOrWhiteSpace($url)) {
              throw "ISO URL is empty."
          }

          curl.exe `
              -L `
              --fail `
              --retry 5 `
              --retry-delay 5 `
              --retry-all-errors `
              -C - `
              -o "$iso" `
              "$url"

          if ($LASTEXITCODE -ne 0) {
              throw "curl failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path $iso)) {
              throw "Windows ISO was not downloaded."
          }

          $size = (Get-Item $iso).Length

          Write-Host "[+] Windows ISO downloaded."
          Write-Host "[+] Size: $([math]::Round($size / 1GB, 2)) GB"

      # ============================================================
      # 3. DOWNLOAD WINDOWS SERVER ISO
      # ============================================================
      - name: Download Windows Server ISO
        shell: pwsh
        env:
          SERVER_ISO_URL: ${{ inputs.server_iso }}
        run: |
          $ErrorActionPreference = "Stop"

          $serverIso = Join-Path $env:GITHUB_WORKSPACE "server.iso"
          $url = $env:SERVER_ISO_URL

          Write-Host "============================================================"
          Write-Host "                 DOWNLOAD WINDOWS SERVER ISO"
          Write-Host "============================================================"

          if ([string]::IsNullOrWhiteSpace($url)) {
              throw "Server ISO URL is empty."
          }

          Write-Host "[+] Destination:"
          Write-Host "    $serverIso"

          curl.exe `
              -L `
              --fail `
              --retry 5 `
              --retry-delay 5 `
              --retry-all-errors `
              -C - `
              -o "$serverIso" `
              "$url"

          if ($LASTEXITCODE -ne 0) {
              throw "curl failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path $serverIso)) {
              throw "Windows Server ISO was not downloaded."
          }

          $size = (Get-Item $serverIso).Length

          Write-Host "[+] Windows Server ISO downloaded."
          Write-Host "[+] Size: $([math]::Round($size / 1GB, 2)) GB"

      # ============================================================
      # 4. MOUNT WINDOWS ISO
      # ============================================================
      - name: Mount Windows ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iso = Join-Path $env:GITHUB_WORKSPACE "windows.iso"

          Write-Host "============================================================"
          Write-Host "                       MOUNT WINDOWS ISO"
          Write-Host "============================================================"

          $diskImage = Mount-DiskImage `
              -ImagePath $iso `
              -PassThru

          Start-Sleep -Seconds 3

          $volume = $diskImage |
              Get-Volume |
              Where-Object DriveLetter |
              Select-Object -First 1

          if (-not $volume) {
              throw "Could not determine Windows ISO drive letter."
          }

          $drive = "$($volume.DriveLetter):"

          Write-Host "[+] Windows ISO mounted at $drive"

          "ISO_DRIVE=$drive" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 5. FIND WINDOWS IMAGE
      # ============================================================
      - name: Find Windows image
        shell: pwsh
        env:
          WIM_INDEX: ${{ inputs.wim_index }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                  FIND WINDOWS IMAGE"
          Write-Host "============================================================"

          $sources = Join-Path $env:ISO_DRIVE "sources"

          $wim = Join-Path $sources "install.wim"
          $esd = Join-Path $sources "install.esd"

          if (Test-Path $wim) {
              $imageFile = $wim
          }
          elseif (Test-Path $esd) {
              $imageFile = $esd
          }
          else {
              throw "Neither install.wim nor install.esd was found."
          }

          Write-Host "[+] Image:"
          Write-Host "    $imageFile"

          Write-Host ""
          Write-Host "========== DISM IMAGE INFO =========="

          dism.exe /Get-WimInfo /WimFile:"$imageFile"

          if ($LASTEXITCODE -ne 0) {
              throw "DISM /Get-WimInfo failed."
          }

          "IMAGE_FILE=$imageFile" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 6. CREATE MASTER VHDX
      # ============================================================
      - name: Create master VHDX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $WorkDir = $env:GITHUB_WORKSPACE
          $vhdx = Join-Path $WorkDir "Windows-VDI-Master.vhdx"

          Write-Host "============================================================"
          Write-Host "                    CREATE MASTER VHDX"
          Write-Host "============================================================"

          if (Test-Path $vhdx) {
              Remove-Item $vhdx -Force
          }

          New-VHD `
              -Path $vhdx `
              -SizeBytes 60GB `
              -Dynamic |
              Out-Null

          $vhd = Mount-VHD `
              -Path $vhdx `
              -Passthru

          Start-Sleep -Seconds 2

          $disk = Get-Disk |
              Where-Object {
                  $_.Number -eq $vhd.DiskNumber
              } |
              Select-Object -First 1

          if (-not $disk) {
              throw "Could not locate mounted VDI VHDX disk."
          }

          Write-Host "[+] Disk number: $($disk.Number)"

          Initialize-Disk `
              -Number $disk.Number `
              -PartitionStyle GPT

          $efi = New-Partition `
              -DiskNumber $disk.Number `
              -Size 100MB `
              -GptType "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"

          Format-Volume `
              -Partition $efi `
              -FileSystem FAT32 `
              -NewFileSystemLabel "EFI" `
              -Confirm:$false |
              Out-Null

          $os = New-Partition `
              -DiskNumber $disk.Number `
              -UseMaximumSize `
              -AssignDriveLetter

          Format-Volume `
              -Partition $os `
              -FileSystem NTFS `
              -NewFileSystemLabel "Windows" `
              -Confirm:$false |
              Out-Null

          $osLetter = "$($os.DriveLetter):"

          Write-Host "[+] Windows partition: $osLetter"

          "MASTER_VHDX=$vhdx" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MASTER_DISK=$($disk.Number)" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "MASTER_OS=$osLetter" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 7. APPLY WINDOWS IMAGE
      # ============================================================
      - name: Apply Windows image
        shell: pwsh
        env:
          WIM_INDEX: ${{ inputs.wim_index }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                   APPLY WINDOWS IMAGE"
          Write-Host "============================================================"

          dism.exe `
              /Apply-Image `
              /ImageFile:"$env:IMAGE_FILE" `
              /Index:$env:WIM_INDEX `
              /ApplyDir:"$env:MASTER_OS" `
              /CheckIntegrity

          if ($LASTEXITCODE -ne 0) {
              throw "DISM /Apply-Image failed."
          }

          Write-Host "[+] Windows image applied."

      # ============================================================
      # 8. BOOT FILES
      # ============================================================
      - name: Configure boot files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                    CONFIGURE BOOT"
          Write-Host "============================================================"

          $diskNumber = [int]$env:MASTER_DISK

          $efiPartition = Get-Partition -DiskNumber $diskNumber |
              Where-Object {
                  $_.GptType -eq "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"
              } |
              Select-Object -First 1

          if (-not $efiPartition) {
              throw "EFI partition not found."
          }

          $partitionNumber = $efiPartition.PartitionNumber

          $diskpartFile = Join-Path $env:TEMP "efi.txt"

          $diskpartLines = @(
              "select disk $diskNumber"
              "select partition $partitionNumber"
              "assign letter=S"
              "exit"
          )

          Set-Content `
              -Path $diskpartFile `
              -Value $diskpartLines `
              -Encoding ASCII

          & diskpart.exe /s $diskpartFile

          $diskpartExit = $LASTEXITCODE

          Remove-Item `
              $diskpartFile `
              -Force `
              -ErrorAction SilentlyContinue

          if ($diskpartExit -ne 0) {
              throw "DiskPart failed with exit code $diskpartExit."
          }

          if (-not (Test-Path "$env:MASTER_OS\Windows")) {
              throw "Windows directory not found."
          }

          & bcdboot.exe `
              "$env:MASTER_OS\Windows" `
              /s S: `
              /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "BCDBOOT failed."
          }

          Write-Host "[+] VDI boot files configured."

      # ============================================================
      # 9. OPTIMIZE MASTER IMAGE
      # ============================================================
      - name: Optimize master image
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "                   OPTIMIZE MASTER IMAGE"
          Write-Host "============================================================"

          dism.exe `
              /Image:"$env:MASTER_OS" `
              /Cleanup-Image `
              /StartComponentCleanup

          Write-Host "[+] Component cleanup finished."

      # ============================================================
      # 10. DISMOUNT MASTER
      # ============================================================
      - name: Dismount master VHDX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Dismount-VHD `
              -Path "$env:MASTER_VHDX"

          Write-Host "[+] Master VHDX dismounted."

      # ============================================================
      # 11. INSTALL RDS ROLES
      # ============================================================
      - name: Install RDS roles
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                     INSTALL RDS"
          Write-Host "============================================================"

          $features = @(
              "RDS-Connection-Broker",
              "RDS-Web-Access",
              "RDS-Virtualization"
          )

          foreach ($feature in $features) {

              Write-Host ""
              Write-Host "========== $feature =========="

              $result = Install-WindowsFeature `
                  -Name $feature `
                  -IncludeManagementTools `
                  -Restart:$false

              Write-Host "[+] Success       : $($result.Success)"
              Write-Host "[+] RestartNeeded : $($result.RestartNeeded)"
              Write-Host "[+] ExitCode      : $($result.ExitCode)"

              if (-not $result.Success) {
                  throw "Failed to install $feature"
              }
          }

          Write-Host "[+] RDS role installation complete."
          Write-Host "[!] No manual reboot performed."

      # ============================================================
      # 12. VERIFY RDS
      # ============================================================
      - name: Verify RDS roles
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "                     VERIFY RDS"
          Write-Host "============================================================"

          Get-WindowsFeature |
              Where-Object {
                  $_.Name -in @(
                      "RDS-Connection-Broker",
                      "RDS-Web-Access",
                      "RDS-Virtualization"
                  )
              } |
              Format-Table Name,InstallState -AutoSize

          Write-Host ""
          Write-Host "========== RDS SERVICES =========="

          Get-Service |
              Where-Object {
                  $_.Name -match "TermService|RDMS|Tssdis|W3SVC"
              } |
              Format-Table Name,Status,StartType -AutoSize

      # ============================================================
      # 13. VDI NETWORK
      # ============================================================
      - name: Configure Hyper-V VDI network
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                 CONFIGURE VDI NETWORK"
          Write-Host "============================================================"

          $switchName = "VDI-NAT"
          $gatewayIp  = "192.168.250.1"
          $prefix     = 24
          $natName    = "VDI-NAT"
          $natPrefix  = "192.168.250.0/24"

          $switch = Get-VMSwitch `
              -Name $switchName `
              -ErrorAction SilentlyContinue

          if (-not $switch) {
              New-VMSwitch `
                  -Name $switchName `
                  -SwitchType Internal `
                  -ErrorAction Stop |
                  Out-Null

              Write-Host "[+] VDI switch created."
          }
          else {
              Write-Host "[*] VDI-NAT already exists."
          }

          $adapter = Get-NetAdapter |
              Where-Object {
                  $_.Name -eq "vEthernet ($switchName)"
              } |
              Select-Object -First 1

          if (-not $adapter) {
              throw "Could not find VDI Hyper-V adapter."
          }

          $gatewayExists = Get-NetIPAddress `
              -InterfaceIndex $adapter.ifIndex `
              -AddressFamily IPv4 `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.IPAddress -eq $gatewayIp
              }

          if (-not $gatewayExists) {

              Get-NetIPAddress `
                  -InterfaceIndex $adapter.ifIndex `
                  -AddressFamily IPv4 `
                  -ErrorAction SilentlyContinue |
                  Remove-NetIPAddress `
                      -Confirm:$false `
                      -ErrorAction SilentlyContinue

              New-NetIPAddress `
                  -IPAddress $gatewayIp `
                  -PrefixLength $prefix `
                  -InterfaceIndex $adapter.ifIndex `
                  -ErrorAction Stop |
                  Out-Null
          }

          $nat = Get-NetNat `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.Name -eq $natName
              } |
              Select-Object -First 1

          if (-not $nat) {
              New-NetNat `
                  -Name $natName `
                  -InternalIPInterfaceAddressPrefix $natPrefix `
                  -ErrorAction Stop |
                  Out-Null
          }

          "VDI_SWITCH=$switchName" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "[+] VDI network ready."

      # ============================================================
      # 14. SERVER NETWORK
      # ============================================================
      - name: Configure Hyper-V Server network
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                CONFIGURE SERVER NETWORK"
          Write-Host "============================================================"

          $switchName = "SERVER-NAT"
          $gatewayIp  = "192.168.251.1"
          $prefix     = 24
          $natName    = "SERVER-NAT"
          $natPrefix  = "192.168.251.0/24"

          $switch = Get-VMSwitch `
              -Name $switchName `
              -ErrorAction SilentlyContinue

          if (-not $switch) {

              Write-Host "[+] Creating SERVER-NAT..."

              New-VMSwitch `
                  -Name $switchName `
                  -SwitchType Internal `
                  -ErrorAction Stop |
                  Out-Null
          }
          else {
              Write-Host "[*] SERVER-NAT already exists."
          }

          $adapter = Get-NetAdapter |
              Where-Object {
                  $_.Name -eq "vEthernet ($switchName)"
              } |
              Select-Object -First 1

          if (-not $adapter) {
              throw "Could not find Hyper-V adapter: vEthernet ($switchName)"
          }

          Write-Host "[+] Adapter: $($adapter.Name)"

          $gatewayExists = Get-NetIPAddress `
              -InterfaceIndex $adapter.ifIndex `
              -AddressFamily IPv4 `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.IPAddress -eq $gatewayIp
              }

          if (-not $gatewayExists) {

              Write-Host "[+] Configuring gateway $gatewayIp/$prefix"

              Get-NetIPAddress `
                  -InterfaceIndex $adapter.ifIndex `
                  -AddressFamily IPv4 `
                  -ErrorAction SilentlyContinue |
                  Remove-NetIPAddress `
                      -Confirm:$false `
                      -ErrorAction SilentlyContinue

              New-NetIPAddress `
                  -IPAddress $gatewayIp `
                  -PrefixLength $prefix `
                  -InterfaceIndex $adapter.ifIndex `
                  -ErrorAction Stop |
                  Out-Null
          }

          $nat = Get-NetNat `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.Name -eq $natName
              } |
              Select-Object -First 1

          if ($nat) {

              Write-Host "[+] SERVER-NAT already exists."

              if ($nat.InternalIPInterfaceAddressPrefix -ne $natPrefix) {
                  throw "SERVER-NAT has unexpected prefix: $($nat.InternalIPInterfaceAddressPrefix)"
              }

          }
          else {

              Write-Host "[+] Creating SERVER-NAT..."

              New-NetNat `
                  -Name $natName `
                  -InternalIPInterfaceAddressPrefix $natPrefix `
                  -ErrorAction Stop |
                  Out-Null
          }

          "SERVER_SWITCH=$switchName" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 SERVER NETWORK READY"
          Write-Host "============================================================"

          Write-Host "[+] Switch : $switchName"
          Write-Host "[+] Gateway: $gatewayIp"
          Write-Host "[+] NAT    : $natName"
          Write-Host "[+] Prefix : $natPrefix"

          Get-VMSwitch -Name $switchName

          Get-NetIPAddress `
              -InterfaceIndex $adapter.ifIndex `
              -AddressFamily IPv4 |
              Select-Object IPAddress,PrefixLength,InterfaceIndex

          Get-NetNat |
              Where-Object Name -eq $natName |
              Select-Object Name,InternalIPInterfaceAddressPrefix

      # ============================================================
      # 15. MOUNT SERVER ISO
      # ============================================================
      - name: Mount Windows Server ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $serverIso = Join-Path `
              $env:GITHUB_WORKSPACE `
              "server.iso"

          Write-Host "============================================================"
          Write-Host "                  MOUNT SERVER ISO"
          Write-Host "============================================================"

          $diskImage = Mount-DiskImage `
              -ImagePath $serverIso `
              -PassThru

          Start-Sleep -Seconds 3

          $volume = $diskImage |
              Get-Volume |
              Where-Object DriveLetter |
              Select-Object -First 1

          if (-not $volume) {
              throw "Could not determine Server ISO drive letter."
          }

          $drive = "$($volume.DriveLetter):"

          Write-Host "[+] Server ISO mounted at $drive"

          "SERVER_ISO_DRIVE=$drive" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 16. FIND SERVER IMAGE
      # ============================================================
      - name: Find Windows Server image
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                FIND WINDOWS SERVER IMAGE"
          Write-Host "============================================================"

          $sources = Join-Path $env:SERVER_ISO_DRIVE "sources"

          $wim = Join-Path $sources "install.wim"
          $esd = Join-Path $sources "install.esd"

          if (Test-Path $wim) {
              $imageFile = $wim
          }
          elseif (Test-Path $esd) {
              $imageFile = $esd
          }
          else {
              throw "Neither install.wim nor install.esd was found."
          }

          Write-Host "[+] Server image:"
          Write-Host "    $imageFile"

          dism.exe /Get-WimInfo /WimFile:"$imageFile"

          if ($LASTEXITCODE -ne 0) {
              throw "DISM /Get-WimInfo failed for Server image."
          }

          "SERVER_IMAGE_FILE=$imageFile" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 17. CREATE SERVER VHDX
      # ============================================================
      - name: Create Server VHDX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $serverVhdx = Join-Path `
              $env:GITHUB_WORKSPACE `
              "Server-DC01.vhdx"

          Write-Host "============================================================"
          Write-Host "                  CREATE SERVER VHDX"
          Write-Host "============================================================"

          if (Test-Path $serverVhdx) {
              Remove-Item `
                  $serverVhdx `
                  -Force
          }

          New-VHD `
              -Path $serverVhdx `
              -SizeBytes 60GB `
              -Dynamic |
              Out-Null

          $vhd = Mount-VHD `
              -Path $serverVhdx `
              -Passthru

          Start-Sleep -Seconds 2

          $disk = Get-Disk `
              -Number $vhd.DiskNumber

          Initialize-Disk `
              -Number $disk.Number `
              -PartitionStyle GPT

          $efi = New-Partition `
              -DiskNumber $disk.Number `
              -Size 100MB `
              -GptType "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"

          Format-Volume `
              -Partition $efi `
              -FileSystem FAT32 `
              -NewFileSystemLabel "EFI" `
              -Confirm:$false |
              Out-Null

          $os = New-Partition `
              -DiskNumber $disk.Number `
              -UseMaximumSize `
              -AssignDriveLetter

          Format-Volume `
              -Partition $os `
              -FileSystem NTFS `
              -NewFileSystemLabel "Windows Server" `
              -Confirm:$false |
              Out-Null

          $osLetter = "$($os.DriveLetter):"

          Write-Host "[+] Server disk: $($disk.Number)"
          Write-Host "[+] Server OS : $osLetter"

          "SERVER_VHDX=$serverVhdx" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "SERVER_DISK=$($disk.Number)" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "SERVER_OS=$osLetter" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 18. APPLY SERVER IMAGE
      # ============================================================
      - name: Apply Windows Server image
        shell: pwsh
        env:
          SERVER_WIM_INDEX: ${{ inputs.server_wim_index }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                APPLY WINDOWS SERVER IMAGE"
          Write-Host "============================================================"

          Write-Host "[+] Image : $env:SERVER_IMAGE_FILE"
          Write-Host "[+] Index : $env:SERVER_WIM_INDEX"
          Write-Host "[+] Target: $env:SERVER_OS"

          dism.exe `
              /Apply-Image `
              /ImageFile:"$env:SERVER_IMAGE_FILE" `
              /Index:$env:SERVER_WIM_INDEX `
              /ApplyDir:"$env:SERVER_OS" `
              /CheckIntegrity

          if ($LASTEXITCODE -ne 0) {
              throw "DISM /Apply-Image failed for Windows Server."
          }

          Write-Host "[+] Windows Server image applied."

      # ============================================================
      # 19. SERVER BOOT FILES
      # ============================================================
      - name: Configure Server boot files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "               CONFIGURE SERVER BOOT"
          Write-Host "============================================================"

          $diskNumber = [int]$env:SERVER_DISK

          $efiPartition = Get-Partition `
              -DiskNumber $diskNumber |
              Where-Object {
                  $_.GptType -eq "{C12A7328-F81F-11D2-BA4B-00A0C93EC93B}"
              } |
              Select-Object -First 1

          if (-not $efiPartition) {
              throw "Server EFI partition not found."
          }

          $partitionNumber = $efiPartition.PartitionNumber

          $diskpartFile = Join-Path `
              $env:TEMP `
              "server-efi.txt"

          $diskpartLines = @(
              "select disk $diskNumber"
              "select partition $partitionNumber"
              "assign letter=T"
              "exit"
          )

          Set-Content `
              -Path $diskpartFile `
              -Value $diskpartLines `
              -Encoding ASCII

          & diskpart.exe /s $diskpartFile

          $diskpartExit = $LASTEXITCODE

          Remove-Item `
              $diskpartFile `
              -Force `
              -ErrorAction SilentlyContinue

          if ($diskpartExit -ne 0) {
              throw "DiskPart failed for Server EFI."
          }

          if (-not (Test-Path "$env:SERVER_OS\Windows")) {
              throw "Server Windows directory not found."
          }

          & bcdboot.exe `
              "$env:SERVER_OS\Windows" `
              /s T: `
              /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "BCDBOOT failed for Server VM."
          }

          Write-Host "[+] Server boot files configured."

      # ============================================================
      # 20. DISMOUNT SERVER VHDX
      # ============================================================
      - name: Dismount Server VHDX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Dismount-VHD `
              -Path "$env:SERVER_VHDX"

          Write-Host "[+] Server VHDX dismounted."

      # ============================================================
      # 21. CREATE SERVER VM
      # ============================================================
      - name: Create Server VM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                    CREATE SERVER VM"
          Write-Host "============================================================"

          $vmName = "SERVER-DC01"

          $existing = Get-VM `
              -Name $vmName `
              -ErrorAction SilentlyContinue

          if ($existing) {

              Write-Host "[*] Existing SERVER-DC01 found."

              if ($existing.State -ne "Off") {
                  Stop-VM `
                      -Name $vmName `
                      -Force `
                      -TurnOff
              }

              Remove-VM `
                  -Name $vmName `
                  -Force
          }

          New-VM `
              -Name $vmName `
              -Generation 2 `
              -MemoryStartupBytes 4GB `
              -VHDPath "$env:SERVER_VHDX" `
              -SwitchName "$env:SERVER_SWITCH" |
              Out-Null

          # --------------------------------------------------------
          # Nested virtualization
          # --------------------------------------------------------
          Set-VMProcessor `
              -VMName $vmName `
              -ExposeVirtualizationExtensions $true

          Set-VM `
              -Name $vmName `
              -AutomaticStopAction TurnOff `
              -AutomaticStartAction Nothing

          Write-Host "[+] Server VM created."
          Write-Host "[+] Name: $vmName"
          Write-Host "[+] Switch: $env:SERVER_SWITCH"
          Write-Host "[+] Nested virtualization: ENABLED"

          Get-VMProcessor `
              -VMName $vmName |
              Format-Table `
                  VMName,
                  Count,
                  ExposeVirtualizationExtensions -AutoSize

          "SERVER_VM=$vmName" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 22. START SERVER VM
      # ============================================================
      - name: Start Server VM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                    START SERVER VM"
          Write-Host "============================================================"

          $vmName = $env:SERVER_VM

          Start-VM `
              -Name $vmName

          Write-Host "[+] VM start requested."

          $timeout = 180
          $elapsed = 0

          while ($elapsed -lt $timeout) {

              $vm = Get-VM -Name $vmName

              Write-Host "[*] State: $($vm.State)"

              if ($vm.State -eq "Running") {
                  break
              }

              Start-Sleep -Seconds 5
              $elapsed += 5
          }

          $vm = Get-VM -Name $vmName

          if ($vm.State -ne "Running") {
              throw "SERVER-DC01 failed to reach Running state."
          }

          Write-Host "[+] SERVER-DC01 is RUNNING."

      # ============================================================
      # 23. SERVER VM INTEGRATION SERVICES
      # ============================================================
      - name: Verify Server VM integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "               VERIFY SERVER VM INTEGRATION"
          Write-Host "============================================================"

          $vmName = $env:SERVER_VM

          Write-Host ""
          Write-Host "========== VM =========="

          Get-VM `
              -Name $vmName |
              Format-Table `
                  Name,
                  State,
                  Generation,
                  MemoryStartup -AutoSize

          Write-Host ""
          Write-Host "========== PROCESSOR =========="

          Get-VMProcessor `
              -VMName $vmName |
              Format-Table `
                  VMName,
                  Count,
                  ExposeVirtualizationExtensions -AutoSize

          Write-Host ""
          Write-Host "========== NETWORK =========="

          Get-VMNetworkAdapter `
              -VMName $vmName |
              Format-Table `
                  VMName,
                  Name,
                  SwitchName,
                  Status,
                  MacAddress -AutoSize

          Write-Host ""
          Write-Host "========== INTEGRATION SERVICES =========="

          Get-VMIntegrationService `
              -VMName $vmName |
              Format-Table `
                  VMName,
                  Name,
                  Enabled,
                  PrimaryStatusDescription,
                  SecondaryStatusDescription -AutoSize

      # ============================================================
      # 24. POWERHELL DIRECT CHECK
      # ============================================================
      - name: Test PowerShell Direct
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                  TEST POWERSHELL DIRECT"
          Write-Host "============================================================"

          $vmName = $env:SERVER_VM

          Write-Host "[+] VM: $vmName"
          Write-Host "[*] Waiting for guest OS..."

          $credential = New-Object `
              System.Management.Automation.PSCredential(
                  "Administrator",
                  (ConvertTo-SecureString `
                      $env:ADMIN_PASS `
                      -AsPlainText `
                      -Force)
              )

          $connected = $false
          $timeout = 180
          $elapsed = 0

          while ($elapsed -lt $timeout) {

              try {

                  $result = Invoke-Command `
                      -VMName $vmName `
                      -Credential $credential `
                      -ScriptBlock {
                          Get-CimInstance Win32_OperatingSystem |
                              Select-Object `
                                  Caption,
                                  Version,
                                  BuildNumber,
                                  LastBootUpTime
                      } `
                      -ErrorAction Stop

                  Write-Host ""
                  Write-Host "========== GUEST OS =========="

                  $result |
                      Format-List

                  $connected = $true
                  break
              }
              catch {
                  Write-Host "[*] Guest not ready yet..."
                  Start-Sleep -Seconds 10
                  $elapsed += 10
              }
          }

          if (-not $connected) {
              Write-Host ""
              Write-Host "[!] PowerShell Direct could not authenticate to the guest."
              Write-Host "[!] This is an integration test only."
              Write-Host "[!] AD DS installation is NOT performed."
          }
          else {
              Write-Host ""
              Write-Host "[+] PowerShell Direct works."
          }

      # ============================================================
      # 25. SERVER VM NETWORK INFORMATION
      # ============================================================
      - name: Inspect Server VM network
        shell: pwsh
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "============================================================"
          Write-Host "                SERVER VM NETWORK CHECK"
          Write-Host "============================================================"

          $credential = New-Object `
              System.Management.Automation.PSCredential(
                  "Administrator",
                  (ConvertTo-SecureString `
                      $env:ADMIN_PASS `
                      -AsPlainText `
                      -Force)
              )

          try {

              Invoke-Command `
                  -VMName $env:SERVER_VM `
                  -Credential $credential `
                  -ScriptBlock {

                      Write-Host "========== GUEST NETWORK =========="

                      Get-NetIPConfiguration |
                          Format-List

                      Write-Host ""
                      Write-Host "========== IP ADDRESSES =========="

                      Get-NetIPAddress `
                          -AddressFamily IPv4 |
                          Format-Table `
                              InterfaceAlias,
                              IPAddress,
                              PrefixLength -AutoSize

                      Write-Host ""
                      Write-Host "========== ROUTES =========="

                      Get-NetRoute `
                          -AddressFamily IPv4 |
                          Format-Table `
                              DestinationPrefix,
                              NextHop,
                              InterfaceAlias,
                              RouteMetric -AutoSize
                  }

          }
          catch {

              Write-Host "[!] Could not inspect guest network."
              Write-Host "[!] This is expected until the Server guest has its network configured."
          }

      # ============================================================
      # 26. CREATE MASTER TEMPLATE VM
      # ============================================================
      - name: Create master template VM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                 CREATE MASTER VM"
          Write-Host "============================================================"

          $vmName = "RDS-Master-Template"

          $existing = Get-VM `
              -Name $vmName `
              -ErrorAction SilentlyContinue

          if ($existing) {

              if ($existing.State -ne "Off") {
                  Stop-VM `
                      -Name $vmName `
                      -Force `
                      -TurnOff
              }

          }
          else {

              New-VM `
                  -Name $vmName `
                  -Generation 2 `
                  -MemoryStartupBytes 4GB `
                  -VHDPath "$env:MASTER_VHDX" `
                  -SwitchName "$env:VDI_SWITCH" |
                  Out-Null
          }

          Set-VM `
              -Name $vmName `
              -AutomaticStopAction TurnOff `
              -AutomaticStartAction Nothing

          Stop-VM `
              -Name $vmName `
              -Force `
              -TurnOff `
              -ErrorAction SilentlyContinue

          $vm = Get-VM -Name $vmName

          Write-Host "[+] Name : $($vm.Name)"
          Write-Host "[+] State: $($vm.State)"
          Write-Host "[+] VHDX : $env:MASTER_VHDX"

          if ($vm.State -ne "Off") {
              throw "Master VM is not OFF."
          }

          "MASTER_VM=$vmName" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 27. CREATE RDS DEPLOYMENT
      # ============================================================
      - name: Create RDS deployment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                  CREATE RDS DEPLOYMENT"
          Write-Host "============================================================"

          $computer = $env:COMPUTERNAME

          Write-Host "[+] ComputerName: $computer"

          $computerSystem = Get-CimInstance Win32_ComputerSystem

          Write-Host "[+] DNSHostName : $($computerSystem.DNSHostName)"
          Write-Host "[+] Domain      : $($computerSystem.Domain)"
          Write-Host "[+] PartOfDomain: $($computerSystem.PartOfDomain)"

          $fqdn = $null

          try {
              $fqdn = [System.Net.Dns]::GetHostEntry($computer).HostName
          }
          catch {
              Write-Host "[!] DNS lookup failed."
          }

          if (-not $fqdn) {
              throw "Could not determine a valid FQDN for $computer."
          }

          Write-Host "[+] FQDN        : $fqdn"

          $deployment = Get-RDServer `
              -ErrorAction SilentlyContinue

          if ($deployment) {

              Write-Host "[*] Existing RDS deployment detected."

              $deployment |
                  Format-Table Server,Roles -AutoSize
          }
          else {

              Write-Host "[+] Creating new RDS VDI deployment..."

              Write-Host "[+] Connection Broker: $fqdn"
              Write-Host "[+] Web Access       : $fqdn"
              Write-Host "[+] Virtualization   : $fqdn"

              New-RDVirtualDesktopDeployment `
                  -ConnectionBroker $fqdn `
                  -WebAccessServer $fqdn `
                  -VirtualizationHost $fqdn `
                  -ErrorAction Stop

              Write-Host "[+] RDS deployment created."
          }

          Write-Host ""
          Write-Host "========== RDS SERVERS =========="

          Get-RDServer |
              Format-Table Server,Roles -AutoSize

      # ============================================================
      # 28. CREATE TEST DIFFERENCING DISK
      # ============================================================
      - name: Create test VDI disk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                  CREATE TEST VDI DISK"
          Write-Host "============================================================"

          $testDisk = Join-Path `
              $env:GITHUB_WORKSPACE `
              "RDS-Test-01.vhdx"

          if (Test-Path $testDisk) {
              Remove-Item `
                  $testDisk `
                  -Force
          }

          New-VHD `
              -Path $testDisk `
              -ParentPath "$env:MASTER_VHDX" |
              Out-Null

          Write-Host "[+] Test disk:"
          Write-Host "    $testDisk"

          "TEST_VHDX=$testDisk" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 29. CREATE TEST VM
      # ============================================================
      - name: Create first test VM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                   CREATE TEST VM"
          Write-Host "============================================================"

          $vmName = "RDS-Test-01"

          $existing = Get-VM `
              -Name $vmName `
              -ErrorAction SilentlyContinue

          if ($existing) {

              if ($existing.State -ne "Off") {
                  Stop-VM `
                      -Name $vmName `
                      -Force `
                      -TurnOff
              }

              Remove-VM `
                  -Name $vmName `
                  -Force
          }

          New-VM `
              -Name $vmName `
              -Generation 2 `
              -MemoryStartupBytes 4GB `
              -VHDPath "$env:TEST_VHDX" `
              -SwitchName "$env:VDI_SWITCH" |
              Out-Null

          Set-VM `
              -Name $vmName `
              -AutomaticStopAction TurnOff `
              -AutomaticStartAction Nothing

          Write-Host "[+] VM created: $vmName"

          "TEST_VM=$vmName" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 30. CREATE RDS COLLECTION
      # ============================================================
      - name: Create VDI collection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================================"
          Write-Host "                  CREATE VDI COLLECTION"
          Write-Host "============================================================"

          $collectionName = "Test-VDI"
          $computer = $env:COMPUTERNAME

          $existing = Get-RDVirtualDesktopCollection `
              -CollectionName $collectionName `
              -ConnectionBroker $computer `
              -ErrorAction SilentlyContinue

          if ($existing) {

              Write-Host "[*] Collection already exists."

          }
          else {

              New-RDVirtualDesktopCollection `
                  -CollectionName $collectionName `
                  -PooledUnmanaged `
                  -VirtualDesktopName "$env:TEST_VM" `
                  -ConnectionBroker $computer `
                  -Description "Automated first VDI test desktop" `
                  -Force

              Write-Host "[+] Collection created."
          }

          Get-RDVirtualDesktopCollection `
              -ConnectionBroker $computer |
              Format-Table CollectionName,CollectionType -AutoSize

          "RDS_COLLECTION=$collectionName" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 31. PUBLISH TO RD WEB ACCESS
      # ============================================================
      - name: Publish VDI collection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $computer = $env:COMPUTERNAME

          Set-RDRemoteDesktop `
              -CollectionName "$env:RDS_COLLECTION" `
              -ShowInWebAccess $true `
              -ConnectionBroker $computer `
              -Force

          Write-Host "[+] Collection published."

      # ============================================================
      # 32. START TEST VM
      # ============================================================
      - name: Start first VDI desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vm = Get-VM `
              -Name "$env:TEST_VM"

          if ($vm.State -eq "Off") {
              Start-VM `
                  -Name "$env:TEST_VM"
          }

          Start-Sleep -Seconds 5

          $vm = Get-VM `
              -Name "$env:TEST_VM"

          Write-Host "[+] Test VM state: $($vm.State)"

          if ($vm.State -ne "Running") {
              throw "Test VDI VM failed to start."
          }

      # ============================================================
      # 33. RDS DIAGNOSTICS
      # ============================================================
      - name: RDS diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                     RDS DIAGNOSTICS"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "========== RDS SERVERS =========="

          Get-RDServer |
              Format-Table Server,Roles -AutoSize

          Write-Host ""
          Write-Host "========== VDI COLLECTIONS =========="

          Get-RDVirtualDesktopCollection |
              Format-Table CollectionName,CollectionType -AutoSize

          Write-Host ""
          Write-Host "========== HYPER-V =========="

          Get-VM |
              Format-Table `
                  Name,
                  State,
                  Generation,
                  MemoryStartup -AutoSize

          Write-Host ""
          Write-Host "========== HYPER-V SWITCHES =========="

          Get-VMSwitch |
              Format-Table `
                  Name,
                  SwitchType,
                  NetAdapterInterfaceDescription -AutoSize

          Write-Host ""
          Write-Host "========== NAT =========="

          Get-NetNat |
              Format-Table `
                  Name,
                  InternalIPInterfaceAddressPrefix,
                  ActiveSessionCount -AutoSize

          Write-Host ""
          Write-Host "========== RD WEB =========="

          Write-Host "https://$env:COMPUTERNAME/RDWeb"

      # ============================================================
      # 34. VERIFY MASTER IS OFF
      # ============================================================
      - name: Verify master template is OFF
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $master = Get-VM `
              -Name "$env:MASTER_VM"

          if ($master.State -ne "Off") {

              Stop-VM `
                  -Name "$env:MASTER_VM" `
                  -Force `
                  -TurnOff
          }

          $master = Get-VM `
              -Name "$env:MASTER_VM"

          if ($master.State -ne "Off") {
              throw "Master template VM is not OFF."
          }

          Write-Host "[+] Master template confirmed OFF."

      # ============================================================
      # 35. RDP / TAILSCALE ACTION
      # ============================================================
      - name: Run Win RDP Enabler
        uses: Veniamin668/win-rdp-enabler@main
        env:
          TAIL_KEY: ${{ secrets.TAIL_KEY }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          USE_CUSTOM_USER: 'false'
          CUSTOM_USERNAME: ''
          CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}

      # ============================================================
      # 36. FINAL STATUS
      # ============================================================
      - name: Final VDI status
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "              NATIVE WINDOWS VDI STATUS"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "[+] SERVER VM"
          $server = Get-VM -Name "$env:SERVER_VM"
          Write-Host "    Name : $($server.Name)"
          Write-Host "    State: $($server.State)"

          Write-Host ""
          Write-Host "[+] SERVER NETWORK"
          Write-Host "    Switch: $env:SERVER_SWITCH"

          Write-Host ""
          Write-Host "[+] MASTER TEMPLATE"
          $master = Get-VM -Name "$env:MASTER_VM"
          Write-Host "    Name : $($master.Name)"
          Write-Host "    State: $($master.State)"

          Write-Host ""
          Write-Host "[+] TEST VDI"
          $test = Get-VM -Name "$env:TEST_VM"
          Write-Host "    Name : $($test.Name)"
          Write-Host "    State: $($test.State)"

          Write-Host ""
          Write-Host "[+] MASTER VHDX"
          Write-Host "    $env:MASTER_VHDX"

          Write-Host ""
          Write-Host "[+] SERVER VHDX"
          Write-Host "    $env:SERVER_VHDX"

          Write-Host ""
          Write-Host "[+] TEST VHDX"
          Write-Host "    $env:TEST_VHDX"

          Write-Host ""
          Write-Host "[+] VDI NETWORK"
          Write-Host "    $env:VDI_SWITCH"

          Write-Host ""
          Write-Host "[+] SERVER NETWORK"
          Write-Host "    $env:SERVER_SWITCH"

          Write-Host ""
          Write-Host "[+] RDS COLLECTION"
          Write-Host "    $env:RDS_COLLECTION"

          Write-Host ""
          Write-Host "[+] RD WEB"
          Write-Host "    https://$env:COMPUTERNAME/RDWeb"

          Write-Host ""
          Write-Host "[+] No manual host reboot performed."

      # ============================================================
      # 37. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep runner alive
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    KEEP RUNNER ALIVE"
          Write-Host "============================================================"

          Write-Host "[*] SERVER-DC01 remains RUNNING."
          Write-Host "[*] RDS master template remains OFF."
          Write-Host "[*] RDS-Test-01 remains RUNNING."
          Write-Host "[*] Runner will stay alive."
          Write-Host "[*] Stop the workflow manually when finished."

          while ($true) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] VDI runner alive..."
              Start-Sleep -Seconds 30
          }
