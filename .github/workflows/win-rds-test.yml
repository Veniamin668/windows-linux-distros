name: Deploy Windows Native VDI

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Direct Windows ISO URL"
        required: true
        type: string

      wim_index:
        description: "Windows image index"
        required: true
        default: "1"
        type: string

jobs:
  deploy-vdi:
    name: Deploy Native Windows VDI
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. DOWNLOAD WINDOWS ISO
      # ============================================================

      - name: Download Windows ISO
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iso = "$env:RUNNER_TEMP\windows.iso"

          Write-Host "=========================================="
          Write-Host "  DOWNLOADING WINDOWS ISO"
          Write-Host "=========================================="

          Invoke-WebRequest `
            -Uri "${{ inputs.iso_url }}" `
            -OutFile $iso `
            -UseBasicParsing

          Write-Host "ISO: $iso"
          Write-Host ("Size: {0:N2} GB" -f ((Get-Item $iso).Length / 1GB))

      # ============================================================
      # 2. MOUNT ISO + FIND INSTALL IMAGE
      # ============================================================

      - name: Mount Windows ISO
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iso = "$env:RUNNER_TEMP\windows.iso"

          Write-Host "=========================================="
          Write-Host "  MOUNTING WINDOWS ISO"
          Write-Host "=========================================="

          Mount-DiskImage -ImagePath $iso

          Start-Sleep -Seconds 3

          $disk = Get-DiskImage -ImagePath $iso |
            Get-Volume

          $drive = "$($disk.DriveLetter):"

          Write-Host "Mounted at: $drive"

          "ISO_DRIVE=$drive" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Locate Windows Image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  LOCATING INSTALL IMAGE"
          Write-Host "=========================================="

          $wim = Join-Path $env:ISO_DRIVE "sources\install.wim"
          $esd = Join-Path $env:ISO_DRIVE "sources\install.esd"

          if (Test-Path $wim) {
              $image = $wim
          }
          elseif (Test-Path $esd) {
              $image = $esd
          }
          else {
              throw "install.wim/install.esd not found"
          }

          Write-Host "Image: $image"

          "INSTALL_IMAGE=$image" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      # ============================================================
      # 3. CREATE VHDX
      # ============================================================

      - name: Create VDI VHDX
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  CREATING VDI VHDX"
          Write-Host "=========================================="

          $vhd = "$env:RUNNER_TEMP\windows-vdi.vhdx"

          if (Test-Path $vhd) {
              Remove-Item $vhd -Force
          }

          New-VHD `
            -Path $vhd `
            -SizeBytes 60GB `
            -Dynamic | Out-Null

          Mount-VHD `
            -Path $vhd `
            -Passthru |
            Initialize-Disk `
              -PartitionStyle GPT `
              -PassThru |
            New-Partition `
              -UseMaximumSize `
              -AssignDriveLetter |
            Format-Volume `
              -FileSystem NTFS `
              -NewFileSystemLabel "Windows" `
              -Confirm:$false

          Start-Sleep -Seconds 2

          $disk = Get-VHD -Path $vhd

          Write-Host "VHDX: $vhd"
          Write-Host ("Maximum size: {0:N2} GB" -f ($disk.Size / 1GB))

          "VDI_VHD=$vhd" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      # ============================================================
      # 4. APPLY WINDOWS IMAGE
      # ============================================================

      - name: Apply Windows Image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  APPLYING WINDOWS IMAGE"
          Write-Host "=========================================="

          $vhd = $env:VDI_VHD

          $partition = Get-Partition -DiskNumber (
              (Get-DiskImage -ImagePath $vhd | Get-Disk).Number
          ) |
          Where-Object DriveLetter

          $target = "$($partition.DriveLetter):"

          Write-Host "Target: $target"
          Write-Host "Image : $env:INSTALL_IMAGE"
          Write-Host "Index : ${{ inputs.wim_index }}"

          dism.exe /Apply-Image `
            /ImageFile:"$env:INSTALL_IMAGE" `
            /Index:${{ inputs.wim_index }} `
            /ApplyDir:"$target\" `
            /CheckIntegrity

          if ($LASTEXITCODE -ne 0) {
              throw "DISM Apply-Image failed: $LASTEXITCODE"
          }

          Write-Host "Windows image applied successfully."

          bcdboot.exe "$target\Windows" `
            /s "$target" `
            /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "BCDBOOT failed: $LASTEXITCODE"
          }

          Write-Host "Boot files created."

      # ============================================================
      # 5. DISMOUNT VHDX
      # ============================================================

      - name: Dismount VDI VHDX
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Dismount-VHD `
            -Path $env:VDI_VHD

          Write-Host "VHDX dismounted."

      # ============================================================
      # 6. INSTALL HYPER-V
      # ============================================================

      - name: Install Hyper-V
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  HYPER-V"
          Write-Host "=========================================="

          $feature = Get-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All

          if ($feature.State -ne "Enabled") {

              Write-Host "Installing Hyper-V..."

              Enable-WindowsOptionalFeature `
                -Online `
                -FeatureName Microsoft-Hyper-V-All `
                -All `
                -NoRestart

          }
          else {
              Write-Host "Hyper-V already installed."
          }

          Get-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All |
            Select-Object FeatureName,State

      # ============================================================
      # 7. INSTALL RDS VIRTUALIZATION
      # ============================================================

      - name: Install RDS Virtualization
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  RDS VIRTUALIZATION"
          Write-Host "=========================================="

          $result = Install-WindowsFeature `
            -Name RDS-Virtualization `
            -IncludeManagementTools

          $result |
            Format-List Name,DisplayName,Success,RestartNeeded,ExitCode

          if (-not $result.Success) {
              throw "RDS-Virtualization installation failed."
          }

          Write-Host ""
          Write-Host "Restart required: $($result.RestartNeeded)"

      # ============================================================
      # 8. INSTALL RDS WEB ACCESS
      # ============================================================

      - name: Install RDS Web Access
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  RDS WEB ACCESS"
          Write-Host "=========================================="

          $result = Install-WindowsFeature `
            -Name RDS-Web-Access `
            -IncludeManagementTools

          $result |
            Format-List Name,DisplayName,Success,RestartNeeded,ExitCode

          if (-not $result.Success) {
              throw "RDS-Web-Access installation failed."
          }

          Write-Host ""
          Write-Host "Restart required: $($result.RestartNeeded)"

      # ============================================================
      # 9. VERIFY RDS WITHOUT REBOOT
      # ============================================================

      - name: Verify RDS Without Reboot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  RDS VERIFICATION WITHOUT REBOOT"
          Write-Host "=========================================="

          Get-WindowsFeature `
            RDS-Virtualization,
            RDS-Web-Access |
            Select-Object Name,InstallState |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Services:"

          Get-Service `
            TermService,
            W3SVC `
            -ErrorAction SilentlyContinue |
            Select-Object Name,Status,StartType |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Hyper-V:"

          Get-Service `
            vmms `
            -ErrorAction SilentlyContinue |
            Select-Object Name,Status,StartType |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  NO HOST REBOOT"
          Write-Host "  Continuing directly to VDI deployment."
          Write-Host "=========================================="

      # ============================================================
      # 10. CREATE INTERNAL HYPER-V SWITCH
      # ============================================================

      - name: Create VDI Network
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  VDI NETWORK"
          Write-Host "=========================================="

          $switchName = "VDI-NAT"

          $existing = Get-VMSwitch `
            -Name $switchName `
            -ErrorAction SilentlyContinue

          if (-not $existing) {

              New-VMSwitch `
                -SwitchName $switchName `
                -SwitchType Internal | Out-Null

              Write-Host "Created switch: $switchName"

          }
          else {
              Write-Host "Switch already exists."
          }

          $adapter = Get-NetAdapter |
            Where-Object {
              $_.Name -like "*$switchName*"
            } |
            Select-Object -First 1

          if (-not $adapter) {
              throw "Could not find VDI NAT adapter."
          }

          $ip = Get-NetIPAddress `
            -InterfaceIndex $adapter.ifIndex `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue

          if (-not $ip) {

              New-NetIPAddress `
                -IPAddress "192.168.250.1" `
                -PrefixLength 24 `
                -InterfaceIndex $adapter.ifIndex |
                Out-Null

          }

          if (-not (Get-NetNat -Name "VDI-NAT" -ErrorAction SilentlyContinue)) {

              New-NetNat `
                -Name "VDI-NAT" `
                -InternalIPInterfaceAddressPrefix "192.168.250.0/24" |
                Out-Null

          }

          Get-VMSwitch -Name $switchName |
            Format-List Name,SwitchType

          Get-NetNat -Name "VDI-NAT" |
            Format-List Name,InternalIPInterfaceAddressPrefix

      # ============================================================
      # 11. MOUNT VHDX
      # ============================================================

      - name: Mount VDI VHDX
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Mount-VHD `
            -Path $env:VDI_VHD

          Start-Sleep -Seconds 2

          Get-DiskImage `
            -ImagePath $env:VDI_VHD |
            Get-Disk |
            Get-Partition |
            Where-Object DriveLetter |
            Select-Object DiskNumber,PartitionNumber,DriveLetter,Size |
            Format-Table -AutoSize

      # ============================================================
      # 12. CREATE HYPER-V VM
      # ============================================================

      - name: Create VDI VM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  CREATING VDI VM"
          Write-Host "=========================================="

          $vmName = "RDS-Master-Template"

          $existing = Get-VM `
            -Name $vmName `
            -ErrorAction SilentlyContinue

          if ($existing) {
              Write-Host "VM already exists."
          }
          else {

              New-VM `
                -Name $vmName `
                -Generation 2 `
                -MemoryStartupBytes 4GB `
                -VHDPath $env:VDI_VHD `
                -SwitchName "VDI-NAT" |
                Out-Null

          }

          Set-VMProcessor `
            -VMName $vmName `
            -Count 2

          Set-VMMemory `
            -VMName $vmName `
            -DynamicMemoryEnabled $true `
            -MinimumBytes 2GB `
            -StartupBytes 4GB `
            -MaximumBytes 8GB

          Set-VM `
            -Name $vmName `
            -AutomaticStartAction Nothing `
            -AutomaticStopAction ShutDown

          Get-VM -Name $vmName |
            Select-Object Name,State,Generation,MemoryAssigned,ProcessorCount |
            Format-List

      # ============================================================
      # 13. START VDI VM
      # ============================================================

      - name: Start VDI VM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Start-VM `
            -Name "RDS-Master-Template"

          Start-Sleep -Seconds 10

          Get-VM `
            -Name "RDS-Master-Template" |
            Select-Object Name,State,Status,Heartbeat |
            Format-List

      # ============================================================
      # 14. CONFIGURE RDS CONNECTION BROKER
      # ============================================================

      - name: Configure RDS Deployment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  CONFIGURING RDS DEPLOYMENT"
          Write-Host "=========================================="

          Import-Module RemoteDesktop -ErrorAction Stop

          $sessionHost = "$env:COMPUTERNAME"

          Write-Host "Connection Broker: $sessionHost"
          Write-Host "Web Access       : $sessionHost"
          Write-Host "Virtualization   : $sessionHost"

          Get-RDServer |
            Format-Table Server,Roles -AutoSize

      # ============================================================
      # 15. SHOW RDWEB STATUS
      # ============================================================

      - name: Show RDWeb Status
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "  RD WEB ACCESS"
          Write-Host "=========================================="

          Get-Service `
            W3SVC,
            TSGateway,
            SessionEnv `
            -ErrorAction SilentlyContinue |
            Select-Object Name,Status,StartType |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Host:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "Expected RDWeb endpoint:"
          Write-Host "https://$env:COMPUTERNAME/RDWeb"

      # ============================================================
      # 16. ENABLE RDP / TAILSCALE
      # ============================================================

      - name: Enable RDP Access
        uses: Veniamin668/win-rdp-enabler@main
        with:
          USE_CUSTOM_USER: 'false'
          CUSTOM_USERNAME: ''
          CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}

      # ============================================================
      # 17. FINAL STATUS
      # ============================================================

      - name: Final VDI Status
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  NATIVE VDI DEPLOYMENT COMPLETE"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Host:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "VM:"
          Get-VM -Name "RDS-Master-Template" |
            Select-Object Name,State,Status,Generation,ProcessorCount,MemoryAssigned |
            Format-List

          Write-Host ""
          Write-Host "RDS roles:"
          Get-WindowsFeature RDS-Virtualization,RDS-Web-Access |
            Select-Object Name,InstallState |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "No host reboot was requested by this workflow."

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  KEEPING RUNNER ALIVE"
          Write-Host "=========================================="

          while ($true) {

              $vm = Get-VM `
                -Name "RDS-Master-Template" `
                -ErrorAction SilentlyContinue

              if ($vm) {
                  Write-Host (
                    "[{0}] VM={1} State={2} CPU={3}% Memory={4}MB" -f `
                    (Get-Date -Format "HH:mm:ss"),
                    $vm.Name,
                    $vm.State,
                    $vm.CPUUsage,
                    [math]::Round($vm.MemoryAssigned / 1MB)
                  )
              }

              Start-Sleep -Seconds 30
          }
