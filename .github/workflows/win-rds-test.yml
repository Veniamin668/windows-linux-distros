name: Deploy Windows Native VDI

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Direct Windows ISO URL"
        required: true
        type: string

      wim_index:
        description: "Windows image index"
        required: true
        default: "1"
        type: string

jobs:
  deploy-vdi:
    name: Deploy Native Windows VDI
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. DOWNLOAD WINDOWS ISO
      # ============================================================

      - name: Download Windows ISO
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iso = "$env:RUNNER_TEMP\windows.iso"
          $url = "${{ inputs.iso_url }}"

          Write-Host "=========================================="
          Write-Host "  DOWNLOADING WINDOWS ISO"
          Write-Host "=========================================="

          if (Test-Path $iso) {
              Remove-Item $iso -Force
          }

          # --------------------------------------------------------
          # Получаем размер файла через HEAD
          # --------------------------------------------------------

          Write-Host "Getting file size..."

          $headers = curl.exe `
            -s `
            -L `
            -I `
            "$url" 2>$null

          $contentLength = $null

          foreach ($line in ($headers -split "`r?`n")) {
              if ($line -match '(?i)^content-length:\s*(\d+)') {
                  $contentLength = [int64]$Matches[1]
              }
          }

          if ($contentLength) {
              $totalGB = $contentLength / 1GB
              Write-Host ("Total size: {0:N2} GB" -f $totalGB)
          }
          else {
              Write-Host "Total size: unknown"
          }

          Write-Host ""
          Write-Host "Starting download..."

          # --------------------------------------------------------
          # Запускаем curl полностью без вывода
          # --------------------------------------------------------

          $curlArgs = @(
              "-L"
              "--fail"
              "--retry", "5"
              "--retry-delay", "5"
              "--retry-all-errors"
              "-C", "-"
              "-o", $iso
              $url
          )

          $process = Start-Process `
            -FilePath "curl.exe" `
            -ArgumentList $curlArgs `
            -NoNewWindow `
            -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\curl.out" `
            -RedirectStandardError "$env:RUNNER_TEMP\curl.err"

          # --------------------------------------------------------
          # Красивый прогресс
          # --------------------------------------------------------

          while (-not $process.HasExited) {

              if (Test-Path $iso) {

                  $downloaded = (Get-Item $iso).Length
                  $downloadedGB = $downloaded / 1GB

                  if ($contentLength) {

                      $percent = ($downloaded / $contentLength) * 100

                      if ($percent -gt 100) {
                          $percent = 100
                      }

                      $remaining = $contentLength - $downloaded

                      if ($remaining -lt 0) {
                          $remaining = 0
                      }

                      $remainingGB = $remaining / 1GB

                      Write-Host -NoNewline "`rDownloaded: $($downloadedGB.ToString('N2')) / $($totalGB.ToString('N2')) GB  |  $($percent.ToString('N1'))%  |  Remaining: $($remainingGB.ToString('N2')) GB    "
                  }
                  else {

                      Write-Host -NoNewline "`rDownloaded: $($downloadedGB.ToString('N2')) GB    "
                  }
              }

              Start-Sleep -Seconds 2
          }

          $process.WaitForExit()

          Write-Host ""
          Write-Host ""

          # --------------------------------------------------------
          # Проверяем результат curl
          # --------------------------------------------------------

          if ($process.ExitCode -ne 0) {

              Write-Host "curl output:"
              if (Test-Path "$env:RUNNER_TEMP\curl.err") {
                  Get-Content "$env:RUNNER_TEMP\curl.err"
              }

              throw "curl failed with exit code $($process.ExitCode)"
          }

          if (-not (Test-Path $iso)) {
              throw "ISO was not downloaded."
          }

          $finalSize = (Get-Item $iso).Length

          Write-Host "=========================================="
          Write-Host "  DOWNLOAD COMPLETE"
          Write-Host "=========================================="
          Write-Host ("File: $iso")
          Write-Host ("Size: {0:N2} GB" -f ($finalSize / 1GB))

      # ============================================================
      # 2. MOUNT WINDOWS ISO
      # ============================================================

      - name: Mount Windows ISO
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iso = "$env:RUNNER_TEMP\windows.iso"

          Write-Host "=========================================="
          Write-Host "  MOUNTING WINDOWS ISO"
          Write-Host "=========================================="

          Mount-DiskImage -ImagePath $iso

          Start-Sleep -Seconds 3

          $volume = Get-DiskImage -ImagePath $iso |
            Get-Volume |
            Where-Object DriveLetter |
            Select-Object -First 1

          if (-not $volume) {
              throw "Could not determine ISO drive letter."
          }

          $drive = "$($volume.DriveLetter):"

          Write-Host "Mounted at: $drive"

          "ISO_DRIVE=$drive" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # ============================================================
      # 3. LOCATE INSTALL.WIM / INSTALL.ESD
      # ============================================================

      - name: Locate Windows Image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  LOCATING WINDOWS IMAGE"
          Write-Host "=========================================="

          $wim = Join-Path $env:ISO_DRIVE "sources\install.wim"
          $esd = Join-Path $env:ISO_DRIVE "sources\install.esd"

          if (Test-Path $wim) {
              $image = $wim
          }
          elseif (Test-Path $esd) {
              $image = $esd
          }
          else {
              throw "install.wim/install.esd not found."
          }

          Write-Host "Image: $image"

          "INSTALL_IMAGE=$image" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # ============================================================
      # 4. CREATE MASTER VHDX
      # ============================================================

      - name: Create Master VHDX
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  CREATING MASTER VHDX"
          Write-Host "=========================================="

          $vhd = "$env:RUNNER_TEMP\windows-vdi-master.vhdx"

          if (Test-Path $vhd) {
              Remove-Item $vhd -Force
          }

          New-VHD `
            -Path $vhd `
            -SizeBytes 60GB `
            -Dynamic |
            Out-Null

          $mountedDisk = Mount-VHD `
            -Path $vhd `
            -Passthru

          $diskNumber = $mountedDisk.DiskNumber

          Write-Host "Disk number: $diskNumber"

          Initialize-Disk `
            -Number $diskNumber `
            -PartitionStyle GPT `
            -PassThru |
            Out-Null

          $partition = New-Partition `
            -DiskNumber $diskNumber `
            -UseMaximumSize `
            -AssignDriveLetter

          Format-Volume `
            -Partition $partition `
            -FileSystem NTFS `
            -NewFileSystemLabel "Windows" `
            -Confirm:$false |
            Out-Null

          Start-Sleep -Seconds 2

          $target = "$($partition.DriveLetter):"

          Write-Host "Target: $target"
          Write-Host "VHDX : $vhd"

          "VDI_VHD=$vhd" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "VDI_TARGET=$target" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # ============================================================
      # 5. APPLY WINDOWS IMAGE
      # ============================================================

      - name: Apply Windows Image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  APPLYING WINDOWS IMAGE"
          Write-Host "=========================================="

          Write-Host "Image : $env:INSTALL_IMAGE"
          Write-Host "Target: $env:VDI_TARGET"
          Write-Host "Index : ${{ inputs.wim_index }}"

          dism.exe /Apply-Image `
            /ImageFile:"$env:INSTALL_IMAGE" `
            /Index:${{ inputs.wim_index }} `
            /ApplyDir:"$env:VDI_TARGET\" `
            /CheckIntegrity

          if ($LASTEXITCODE -ne 0) {
              throw "DISM Apply-Image failed: $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "Windows image applied successfully."

      # ============================================================
      # 6. CREATE BOOT FILES
      # ============================================================

      - name: Configure VHDX Boot Files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  CONFIGURING BOOT FILES"
          Write-Host "=========================================="

          bcdboot.exe `
            "$env:VDI_TARGET\Windows" `
            /s "$env:VDI_TARGET" `
            /f UEFI

          if ($LASTEXITCODE -ne 0) {
              throw "BCDBOOT failed: $LASTEXITCODE"
          }

          Write-Host "Boot files created."

      # ============================================================
      # 7. DISMOUNT MASTER VHDX
      # ============================================================

      - name: Dismount Master VHDX
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  DISMOUNTING MASTER VHDX"
          Write-Host "=========================================="

          Dismount-VHD `
            -Path $env:VDI_VHD

          Write-Host "Master VHDX is now offline."

          Get-VHD `
            -Path $env:VDI_VHD |
            Select-Object Path,Size,FileSize,MinimumSize,Type |
            Format-List

      # ============================================================
      # 8. INSTALL HYPER-V
      # ============================================================

      - name: Install Hyper-V
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  HYPER-V"
          Write-Host "=========================================="

          $feature = Get-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All

          if ($feature.State -ne "Enabled") {

              Write-Host "Installing Hyper-V..."

              Enable-WindowsOptionalFeature `
                -Online `
                -FeatureName Microsoft-Hyper-V-All `
                -All `
                -NoRestart

              Write-Host "Hyper-V installation requested."

          }
          else {
              Write-Host "Hyper-V already installed."
          }

          Get-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All |
            Select-Object FeatureName,State

      # ============================================================
      # 9. INSTALL RDS VIRTUALIZATION
      # ============================================================

      - name: Install RDS Virtualization
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  RDS VIRTUALIZATION"
          Write-Host "=========================================="

          $result = Install-WindowsFeature `
            -Name RDS-Virtualization `
            -IncludeManagementTools

          $result |
            Format-List `
              Name,
              DisplayName,
              Success,
              RestartNeeded,
              ExitCode

          if (-not $result.Success) {
              throw "RDS-Virtualization installation failed."
          }

          Write-Host ""
          Write-Host "Restart required: $($result.RestartNeeded)"

      # ============================================================
      # 10. INSTALL RDS WEB ACCESS
      # ============================================================

      - name: Install RDS Web Access
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  RDS WEB ACCESS"
          Write-Host "=========================================="

          $result = Install-WindowsFeature `
            -Name RDS-Web-Access `
            -IncludeManagementTools

          $result |
            Format-List `
              Name,
              DisplayName,
              Success,
              RestartNeeded,
              ExitCode

          if (-not $result.Success) {
              throw "RDS-Web-Access installation failed."
          }

          Write-Host ""
          Write-Host "Restart required: $($result.RestartNeeded)"

      # ============================================================
      # 11. VERIFY RDS WITHOUT REBOOT
      # ============================================================

      - name: Verify RDS Without Reboot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  VERIFICATION WITHOUT REBOOT"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Windows Features:"

          Get-WindowsFeature `
            RDS-Virtualization,
            RDS-Web-Access |
            Select-Object Name,InstallState |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Hyper-V:"

          Get-WindowsOptionalFeature `
            -Online `
            -FeatureName Microsoft-Hyper-V-All |
            Select-Object FeatureName,State |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Services:"

          Get-Service `
            vmms,
            TermService,
            W3SVC `
            -ErrorAction SilentlyContinue |
            Select-Object Name,Status,StartType |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Master VHDX:"

          Get-VHD `
            -Path $env:VDI_VHD |
            Select-Object Path,Size,FileSize,Type |
            Format-List

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  NO HOST REBOOT"
          Write-Host "  MASTER VHDX REMAINS OFFLINE"
          Write-Host "=========================================="

      # ============================================================
      # 12. CREATE VDI NETWORK
      # ============================================================

      - name: Create VDI Network
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  VDI NETWORK"
          Write-Host "=========================================="

          $switchName = "VDI-NAT"

          $existing = Get-VMSwitch `
            -Name $switchName `
            -ErrorAction SilentlyContinue

          if (-not $existing) {

              New-VMSwitch `
                -SwitchName $switchName `
                -SwitchType Internal |
                Out-Null

              Write-Host "Created switch: $switchName"

          }
          else {
              Write-Host "Switch already exists."
          }

          $adapter = Get-NetAdapter |
            Where-Object {
              $_.Name -like "*$switchName*"
            } |
            Select-Object -First 1

          if (-not $adapter) {
              throw "Could not find VDI NAT adapter."
          }

          $existingIP = Get-NetIPAddress `
            -InterfaceIndex $adapter.ifIndex `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue |
            Where-Object IPAddress -eq "192.168.250.1"

          if (-not $existingIP) {

              New-NetIPAddress `
                -IPAddress "192.168.250.1" `
                -PrefixLength 24 `
                -InterfaceIndex $adapter.ifIndex |
                Out-Null

          }

          $nat = Get-NetNat `
            -Name "VDI-NAT" `
            -ErrorAction SilentlyContinue

          if (-not $nat) {

              New-NetNat `
                -Name "VDI-NAT" `
                -InternalIPInterfaceAddressPrefix "192.168.250.0/24" |
                Out-Null

          }

          Write-Host ""
          Get-VMSwitch -Name $switchName |
            Select-Object Name,SwitchType |
            Format-List

          Get-NetNat -Name "VDI-NAT" |
            Select-Object Name,InternalIPInterfaceAddressPrefix |
            Format-List

      # ============================================================
      # 13. VERIFY MASTER IMAGE
      # ============================================================

      - name: Verify Master Image
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "  MASTER IMAGE"
          Write-Host "=========================================="

          Write-Host "Path:"
          Write-Host $env:VDI_VHD

          Write-Host ""
          Write-Host "VHDX:"

          Get-VHD `
            -Path $env:VDI_VHD |
            Select-Object Path,Size,FileSize,Type |
            Format-List

          Write-Host ""
          Write-Host "Hyper-V VMs currently present:"

          Get-VM |
            Select-Object Name,State,Generation |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "The master VHDX is NOT started as a VM."

      # ============================================================
      # 14. ENABLE RDP / TAILSCALE
      # ============================================================

      - name: Enable RDP Access
        uses: Veniamin668/win-rdp-enabler@main
        with:
          USE_CUSTOM_USER: 'false'
          CUSTOM_USERNAME: ''
          CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}

      # ============================================================
      # 15. FINAL STATUS
      # ============================================================

      - name: Final VDI Status
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  NATIVE VDI DEPLOYMENT STATUS"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Host:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "RDS roles:"

          Get-WindowsFeature `
            RDS-Virtualization,
            RDS-Web-Access |
            Select-Object Name,InstallState |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Master VHDX:"
          Write-Host $env:VDI_VHD

          Write-Host ""
          Write-Host "Hyper-V VMs:"

          Get-VM |
            Select-Object Name,State,Generation |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Host reboot:"
          Write-Host "NOT REQUESTED"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  KEEPING RUNNER ALIVE"
          Write-Host "=========================================="

          while ($true) {

              Write-Host (
                "[{0}] Host={1} | VMs={2}" -f `
                (Get-Date -Format "HH:mm:ss"),
                $env:COMPUTERNAME,
                ((Get-VM -ErrorAction SilentlyContinue).Count)
              )

              Start-Sleep -Seconds 30
          }
