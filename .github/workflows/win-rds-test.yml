name: Deploy Windows Native VDI (RDS Collection + Native Reboot Method)

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: 'Прямая ссылка на ISO Windows Server / Windows 11 для шаблона VDI'
        required: true
        default: ''
        type: string
      wim_index:
        description: 'Индекс редакции для шаблона VDI (1 - Core, 2 - GUI)'
        required: true
        default: '2'

jobs:
  deploy-vdi-native:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # ==========================================
      # ЭТАП 1: СБОРКА ШАБЛОНА VHDX ИЗ ISO ЧЕРЕЗ DISM (НА ДИСКЕ D:\)
      # ==========================================
      - name: "Generate VDI Template VHDX via DISM"
        shell: powershell
        run: |
          # Включаем UTF-8 в консоли, чтобы логи читались как родные
          [Console]::InputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          
          # Готовим рабочую папку на диске D:\ внутри репозитория (где много места)
          $WorkDir = "${{ github.workspace }}\vdi_build"
          New-Item -ItemType Directory -Force -Path $WorkDir
          
          Write-Host "Скачиваем ISO для шаблона на maximal'noy skorosti cherez curl na disk D:\..."
          curl.exe -L -o "$WorkDir\windows.iso" "${{ inputs.iso_url }}"
          
          Write-Host "Montiruem ISO..."
          $MountDrive = (Mount-DiskImage -ImagePath "$WorkDir\windows.iso" -PassThru | Get-Volume).DriveLetter
          $WimPath = "$($MountDrive):\sources\install.wim"
          if (-not (Test-Path $WimPath)) { $WimPath = "$($MountDrive):\sources\install.esd" }
          
          Write-Host "Sozdaem chistyy VHDX disk na diske D:\..."
          # Жесткий фикс синтаксиса: Создаем и монтируем в две отдельные строки
          New-VHD -Path "$WorkDir\vdi_template.vhdx" -SizeBytes 60GB -Dynamic
          
          Write-Host "Montiruem sozdannyy VHDX disk..."
          $Vhd = Mount-VHD -Path "$WorkDir\vdi_template.vhdx" -Passthru
          
          Initialize-Disk -Number $Vhd.DiskNumber -PartitionStyle GPT
          $Part = New-Partition -DiskNumber $Vhd.DiskNumber -UseMaximumSize -DriveLetter T
          Format-Volume -DriveLetter T -FileSystem NTFS -Confirm:$false
          
          Write-Host "Raspakovyvaem OS na disk shablona..."
          DISM.exe /Apply-Image /ImageFile:$WimPath /Index:${{ inputs.wim_index }} /ApplyDir:T:\
          bcdboot T:\Windows /s T: /f UEFI
          
          # Инжектируем автозапуск сети в шаблон диска
          Write-Host "Inzhektiruem avtozapusk seti v shablon diska..."
          $UserStartup = "T:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          New-Item -ItemType Directory -Force -Path $UserStartup
          
          $InternalScript = @"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          curl.exe -L -o "C:\tailscale.msi" "https://tailscale.com"
          Start-Process msiexec.exe -ArgumentList '/i C:\tailscale.msi /qn /norestart' -Wait
          Start-Sleep -Seconds 10
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAIL_KEY }}" --hostname="win-vdi-desktop"
          "@
          $InternalScript | Out-File -FilePath "$UserStartup\VDI-Init.ps1" -Encoding ascii
          
          # Размонтируем всё наружу
          Dismount-VHD -Path "$WorkDir\vdi_template.vhdx"
          Dismount-DiskImage -ImagePath "$WorkDir\windows.iso"
          Write-Host "Shablon VHDX uspeshno podgotovlen na diske D:\!"

      # ==========================================
      # ЭТАП 2: УСТАНОВКА РОЛЕЙ, СМЕНА ПАРОЛЯ, ФИКС РЕЕСТРА И РЕБУТ
      # ==========================================
      - name: "Install Native RDS, Change Password, Patch AutoLogon Registry & Reboot"
        shell: powershell
        # Безопасно передаем секреты через переменные среды
        env:
          SECURE_ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          [Console]::InputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          Write-Host "1. Ustanavlivaem sluzhby nativnoy roli RDS / VDI..."
          Import-Module ServerManager
          Install-WindowsFeature Remote-Desktop-Services, RDS-Connection-Broker, RDS-Virtualization-Host -IncludeManagementTools
          
          Write-Host "2. SMENA PAROLYA V SISTEME: Primenyaem ADMIN_PASS dlya runneradmin..."
          $SecurePassword = ConvertTo-SecureString $env:SECURE_ADMIN_PASS -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $SecurePassword
          
          Write-Host "3. PATCH AVTOLOGINA REESTRA: Sinhroniziruem klyuchi Winlogon..."
          $RegPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon"
          Set-ItemProperty -Path $RegPath -Name "AutoAdminLogon" -Value "1"
          Set-ItemProperty -Path $RegPath -Name "DefaultUserName" -Value "runneradmin"
          Set-ItemProperty -Path $RegPath -Name "DefaultPassword" -Value $env:SECURE_ADMIN_PASS
          Set-ItemProperty -Path $RegPath -Name "ForceAutoLogon" -Value "1"
          
          Write-Host "=========================================="
          Write-Host "  OTPRAVLYAEM HOST V REBUT DLYA AKTIVIZACII ROLEY!"
          Write-Host "=========================================="
          
          Restart-Computer -Force

      # ==========================================
      # ЭТАП 3: ЗАПУСКАЕМ ТВОЙ ЭКШЕН (СТАРТ ПОСЛЕ ПЕРЕЗАГРУЗКИ)
      # ==========================================
      - name: Run Win RDP Enabler (Post-Reboot Connect)
        uses: Veniamin668/win-rdp-enabler@main
        env:
          TAIL_KEY: ${{ secrets.TAIL_KEY }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          USE_CUSTOM_USER: 'false'
          CUSTOM_USERNAME: ''
          CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}

      # ==========================================
      # ЭТАП 4: УДЕРЖАНИЕ СЕССИИ И ВЫВОД БАННЕРА
      # ==========================================
      - name: "Start VDI Engine and Keep Alive"
        shell: powershell
        run: |
          [Console]::InputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          Write-Host "=========================================="
          Write-Host "  VINDOVYY專 RDS-VDI STAND POLNOST'YU PODNYAT!"
          Write-Host "  Podklyuchaytes' k mashine cherez Tailscale!"
          Write-Host "  Login RDP: runneradmin"
          Write-Host "  Parol' RDP: tvoy sekret ADMIN_PASS"
          Write-Host "=========================================="
          
          while ($true) {
              Write-Host "=== Nativnyy RDS host aktivien. Vremya: $(Get-Date) ==="
              Start-Sleep -Seconds 60
          }
