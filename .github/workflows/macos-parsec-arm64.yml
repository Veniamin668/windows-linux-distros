name: MACOSOS Parsec new ARM64

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'name custom user'
        required: true
        default: 'ktoya'
        type: string
      use_secrets:
        description: 'Использовать секреты из GitHub Secrets (true/false)'
        required: true
        default: true
        type: boolean
      create_user:
        description: 'Создавать кастомного пользователя через dscl (true/false)'
        required: true
        default: true
        type: boolean

jobs:
  build-cloud-pc-mac:
    runs-on: xcode-27
    timeout-minutes: 420

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Connect Tailscale (Official Action)
        uses: tailscale/github-action@v4
        with:
#          authkey: ${{ secrets.TAIL_KEY }}
          oauth-client-id: ${{ secrets.TAIL_OAUTH_CLIENT_ID  }}
          oauth-secret: ${{ secrets.TAIL_OAUTH }}
          tags: tag:ci
          hostname: macos-arm64
          args: '--advertise-exit-node --ssh'
          version: 'latest'
    
      - name: 2. Setup Users, SSH & Environment
        env:
          CREATE_USER: ${{ github.event.inputs.create_user }}
          USE_SECRETS: ${{ github.event.inputs.use_secrets }}
          CUSTOM_USER: ${{ github.event.inputs.username }}
          SECRET_PASS: ${{ secrets.CUSTOM_PASSWORD }}
          MANUAL_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          # Жестко меняем хостнейм в самой macOS, чтобы система тоже знала своё имя
          sudo scutil --set ComputerName "runner-macosos"
          sudo scutil --set HostName "runner-macosos"
          sudo scutil --set LocalHostName "runner-macosos"
          dscacheutil -flushcache
          sudo hostname "runner-macosos"

          # fix network
          sudo networksetup -setdnsservers Ethernet 8.8.8.8 1.1.1.1 || true
          yes | brew install fastfetch telegram htop btop cmatrix > /dev/null 2>&1
          fastfetch
          if [ "$CREATE_USER" = "false" ]; then
              echo "Создание кастомного пользователя отключено (create_user: false). Пропускаем шаг."
              exit 0
          fi

          echo "Настраиваем пользователя $CUSTOM_USER и окружение..."
          if [ "$USE_SECRETS" = "true" ]; then
              ACTIVE_PASS="$SECRET_PASS"
              echo "Используем пароль из GitHub Secrets (CUSTOM_PASSWORD)."
          else
              ACTIVE_PASS="$MANUAL_PASS"
              echo "Используем пароль из ручного инпута."
          fi

          if ! id "$CUSTOM_USER" &>/dev/null; then
              sudo dscl . -create /Users/$CUSTOM_USER
              sudo dscl . -create /Users/$CUSTOM_USER UserShell /bin/zsh
              sudo dscl . -create /Users/$CUSTOM_USER RealName "$CUSTOM_USER"
              sudo dscl . -create /Users/$CUSTOM_USER UniqueID 502
              sudo dscl . -create /Users/$CUSTOM_USER PrimaryGroupID 20
              sudo dscl . -create /Users/$CUSTOM_USER NFSHomeDirectory /Users/$CUSTOM_USER
              sudo mkdir -p /Users/$CUSTOM_USER
              sudo chown -R $CUSTOM_USER:staff /Users/$CUSTOM_USER
              echo "Пользователь $CUSTOM_USER создан через dscl."
          else
              echo "Пользователь $CUSTOM_USER уже существует."
          fi

          echo "$ACTIVE_PASS" | sudo dscl . -passwd /Users/$CUSTOM_USER
          sudo dseditgroup -o edit -a "$CUSTOM_USER" -t user admin || true

          echo "Проверяем статус SSH..."
          sudo launchctl list | grep sshd || true

      - name: 2.1. Deploy Parsec Host Server & Generate Connect Link
        run: |
          echo "======================================================================"
          echo "            DEPLOYING PARSEC HOST SERVER & GENERATING LINK            "
          echo "======================================================================"
          
          echo " >> Installing Parsec App via Homebrew..."
          brew install --cask parsec > /dev/null 2>&1

          echo " >> Creating modern Parsec JSON configuration..."
          # Жестко создаем обе папки — и скрытую .parsec, и системную в Application Support
          sudo launchctl asuser 501 mkdir -p /Users/runner/.parsec
          sudo launchctl asuser 501 mkdir -p "/Users/runner/Library/Application Support/Parsec"
          
          TS_IP=$(tailscale ip -4 2>/dev/null || echo "127.0.0.1")

          # Генерируем конфиг в новом формате JSON, который требует Parsec 150+
          sudo launchctl asuser 501 tee "/Users/runner/Library/Application Support/Parsec/config.json" << EOF > /dev/null
          {
            "app_lan_address": { "value": "$TS_IP" },
            "app_network": { "value": 1 },
            "app_run_bg": { "value": 1 },
            "host_enabled": { "value": 1 }
          }
          EOF

          # Дублируем в старую папку на всякий случай
          sudo launchctl asuser 501 cp "/Users/runner/Library/Application Support/Parsec/config.json" /Users/runner/.parsec/config.json
          sudo chown -R runner:staff /Users/runner/.parsec
          sudo chown -R runner:staff "/Users/runner/Library/Application Support/Parsec"

          echo " >> Launching Parsec daemon in background..."
          sudo launchctl asuser 501 /Applications/Parsec.app/Contents/MacOS/parsecd > /tmp/parsec_start.log 2>&1 &
          
          echo " >> Waiting for Parsec process to wake up..."
          sleep 10

          # Ищем лог-файл в новом системном пути macOS
          PARSEC_LOG="/Users/runner/Library/Application Support/Parsec/log.txt"
          
          if [ ! -f "$PARSEC_LOG" ]; then
            # Если в новом пути нет, проверяем старый
            PARSEC_LOG="/Users/runner/.parsec/log.txt"
          fi

          echo " >> Reading Parsec log from: $PARSEC_LOG"
          
          if [ -f "$PARSEC_LOG" ]; then
            echo " >> Searching for Peer ID..."
            PEER_ID=$(grep -oE "peer_id=[0-9]+" "$PARSEC_LOG" | head -n 1 | cut -d'=' -f2 || true)
          else
            echo " >> WARNING: log.txt still not found. Checking process output..."
            cat /tmp/parsec_start.log || true
          fi
          
          echo "======================================================================"
          echo " PARSEC DEPLOY REPORT:"
          echo " "
          if [ ! -z "$PEER_ID" ]; then
            echo " Your Tailscale PC IP: $TS_IP"
            echo " Your Parsec Peer ID: $PEER_ID"
            echo " "
            echo " Команда для Win+R на твоем ПК:"
            echo " parsec://peer_id=$PEER_ID"
          else
            echo " Ошибка: Не удалось вытащить Peer ID автоматически."
            echo " "
            echo " Текущие процессы на раннере:"
            ps aux | grep -i parsec || true
          fi
          echo "======================================================================"

      - name: 3. Wait session (6 hours)
        run: |
          echo "Всё поднято, держим сессию..."
          while true; do
            sleep 60
          done
