name: Cloud PC test auto

on:
  workflow_dispatch:
    inputs:
      enable_hyperv_gui:
        description: 'Install Hyper-V Manager (GUI)?'
        type: boolean
        required: false
        default: false
  
jobs:
  test-cloud-pc-auto:
    runs-on: windows-latest
    timeout-minutes: 365

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Win RDP Enabler
        uses: Veniamin668/win-rdp-enabler@main
        env:
         TAIL_KEY: ${{ secrets.TAIL_KEY }}
         ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
         USE_CUSTOM_USER: 'false'
         CUSTOM_USERNAME: ''
         CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}

      - name: Purge Windows Bloat
        uses: Veniamin668/windows-debloater-runner@v1
        with:
          enable: 'true'

      - name: 4. Install Hyper-V Tools GUI (Optional)
        if: ${{ github.event.inputs.enable_hyperv_gui == 'true' }}
        shell: pwsh
        run: |
          Write-Host "=========================================" -ForegroundColor Cyan
          Write-Host "Запускаем наглую установку Hyper-V Manager GUI..." -ForegroundColor Cyan
          Install-WindowsFeature -Name Hyper-V-Tools
          Write-Host "ГУИ успешно развёрнут! Оснастка VirtMgmt.msc готова к бою." -ForegroundColor Green
          Write-Host "=========================================" -ForegroundColor Green
      - name: 4. wait session (6 hours)
        run: |
          Write-Host "Cloud PC дрочилка запущена и ждет тебя в сети! Не закрывай этот воркфлоу."
          while ($true) {
              Start-Sleep -Seconds 60
          }
        shell: pwsh
