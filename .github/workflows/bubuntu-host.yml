name: Ubuntu host machine for tailscale

on:
  workflow_dispatch:

jobs:
  overkill:
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    steps:
      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAIL_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAIL_OAUTH }}
          tags: tag:ci
          hostname: ubuntu-runner
          args: '--advertise-exit-node '
#          log-mode: 'quiet'
          version: 'latest'

      - name: Enable KVM hardware acceleration
        env:
          RUNNER_PASSWORD: ${{ secrets.ADMIN_PASS }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger
          sudo usermod -aG kvm $USER
          echo "runner:$RUNNER_PASSWORD" | sudo chpasswd
          
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main
        
      # 1. Скачиваем репозиторий с твоим docker-compose.yml
      - name: Checkout Repository
        uses: actions/checkout@v4
          
      - name: вечный затык
        run: |
          # Железобетонный вечный затык
          tail -f /dev/null
