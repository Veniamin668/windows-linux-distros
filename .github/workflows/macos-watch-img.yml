
name: Watch runner-images macOS updates

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force notification for all tracked images'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: runner-images-watcher
  cancel-in-progress: false

jobs:
  watch:
    name: Watch macOS runner images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new runner-images releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_NOTIFY: ${{ inputs.force_notify }}
        run: |
          set -euo pipefail

          echo "[watcher] Initializing..."

          mkdir -p .github

          STATE=".github/image-watch-state.json"

          if [ ! -f "$STATE" ]; then
            printf '{}\n' > "$STATE"
          fi

          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import html
          import urllib.request
          import urllib.parse
          import urllib.error

          from html.parser import HTMLParser

          # ============================================================
          # CONFIGURATION
          # ============================================================

          API = (
              "https://api.github.com/"
              "repos/actions/runner-images/releases"
          )

          STATE = ".github/image-watch-state.json"

          PREFIXES = [
              "xcode-27-arm64",
              "macos-26-arm64",
              "macos-15-arm64",
              "macos-26-intel",
          ]

          GH_TOKEN = os.environ.get("GH_TOKEN", "")
          TG_TOKEN = os.environ.get("TG_BOT_TOKEN", "")
          TG_CHAT = os.environ.get("TG_CHAT_ID", "")

          FORCE_NOTIFY = (
              os.environ.get("FORCE_NOTIFY", "").lower()
              == "true"
          )

          # Conservative raw-text limit to leave room for
          # MarkdownV2 escaping and Telegram message headers.
          CHUNK_SIZE = 1700

          TELEGRAM_DELAY = 3.1

          if not GH_TOKEN:
              sys.exit("ERROR: GITHUB_TOKEN is missing")

          if not TG_TOKEN or not TG_CHAT:
              sys.exit("ERROR: Telegram secrets are missing")

          # ============================================================
          # LOGGING
          # ============================================================

          def log(message):
              print(f"[watcher] {message}", flush=True)

          # ============================================================
          # HTTP REQUESTS
          # ============================================================

          def request_json(url, data=None, headers=None):

              headers = headers or {}

              for attempt in range(4):

                  try:

                      request = urllib.request.Request(
                          url,
                          data=data,
                          headers=headers,
                          method="POST" if data is not None else "GET"
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=45
                      ) as response:

                          return json.loads(
                              response.read().decode("utf-8")
                          )

                  except urllib.error.HTTPError as error:

                      if error.code == 429 or error.code >= 500:

                          retry_after = error.headers.get(
                              "Retry-After"
                          )

                          try:
                              delay = int(retry_after)
                          except (TypeError, ValueError):
                              delay = min(3 * (2 ** attempt), 30)

                          if attempt == 3:
                              raise

                          log(
                              f"HTTP {error.code}; "
                              f"retrying in {delay}s"
                          )

                          time.sleep(delay)
                          continue

                      raise

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      OSError
                  ) as error:

                      if attempt == 3:
                          raise

                      delay = min(3 * (2 ** attempt), 30)

                      log(
                          f"Network error: {error}; "
                          f"retrying in {delay}s"
                      )

                      time.sleep(delay)

              raise RuntimeError("HTTP request failed")

          # ============================================================
          # FETCH ALL RELEASES
          # ============================================================

          def get_releases():

              releases = []
              page = 1

              while True:

                  url = f"{API}?per_page=100&page={page}"

                  data = request_json(
                      url,
                      headers={
                          "Authorization": f"Bearer {GH_TOKEN}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                          "User-Agent": "macos-runner-image-watcher"
                      }
                  )

                  if not isinstance(data, list):
                      raise RuntimeError(
                          "Unexpected GitHub API response"
                      )

                  releases.extend(data)

                  log(
                      f"Fetched page {page}: "
                      f"{len(data)} releases"
                  )

                  if len(data) < 100:
                      break

                  page += 1

              return releases

          # ============================================================
          # HTML PARSER
          # Handles HTML tables, lists, links and block elements.
          # ============================================================

          class ReleaseHTMLParser(HTMLParser):

              BLOCK_TAGS = {
                  "p", "div", "section", "article",
                  "h1", "h2", "h3", "h4", "h5", "h6",
                  "ul", "ol", "li", "blockquote",
                  "details", "summary", "br", "hr"
              }

              def __init__(self):

                  super().__init__(convert_charrefs=True)

                  self.output = []

                  self.rows = []
                  self.row = []
                  self.cell = []

                  self.in_table = False
                  self.in_cell = False

                  self.links = []
                  self.ignored = 0

              def newline(self):

                  if self.in_cell:
                      return

                  if self.output and self.output[-1] != "\n":
                      self.output.append("\n")

              def write(self, value):

                  if not value:
                      return

                  if self.in_cell:
                      self.cell.append(value)
                  else:
                      self.output.append(value)

              def handle_starttag(self, tag, attrs):

                  attrs = dict(attrs)

                  if tag in ("script", "style"):
                      self.ignored += 1
                      return

                  if self.ignored:
                      return

                  if tag == "table":

                      self.newline()

                      self.in_table = True
                      self.rows = []

                  elif tag == "tr" and self.in_table:

                      self.row = []

                  elif tag in ("td", "th") and self.in_table:

                      self.in_cell = True
                      self.cell = []

                  elif tag == "a":

                      self.links.append(
                          attrs.get("href", "")
                      )

                  elif tag == "img":

                      self.write(
                          attrs.get("alt", "")
                      )

                  elif tag == "br":

                      if self.in_cell:
                          self.cell.append(" ")
                      else:
                          self.newline()

                  elif tag == "hr":

                      self.newline()
                      self.write("---")
                      self.newline()

                  elif tag == "li" and not self.in_cell:

                      self.newline()
                      self.write("- ")

                  elif tag in self.BLOCK_TAGS:

                      self.newline()

              def handle_data(self, data):

                  if self.ignored:
                      return

                  self.write(data)

              def handle_endtag(self, tag):

                  if tag in ("script", "style"):

                      self.ignored = max(
                          0,
                          self.ignored - 1
                      )

                      return

                  if self.ignored:
                      return

                  if tag == "a":

                      if self.links:

                          url = self.links.pop()

                          if url and url.startswith(
                              ("https://", "http://")
                          ):

                              self.write(
                                  f" — {url}"
                              )

                  elif tag in ("td", "th") and self.in_cell:

                      value = " ".join(
                          "".join(self.cell).split()
                      )

                      if value:
                          self.row.append(value)

                      self.cell = []
                      self.in_cell = False

                  elif tag == "tr" and self.in_table:

                      if self.row:
                          self.rows.append(self.row)

                      self.row = []

                  elif tag == "table":

                      for row in self.rows:

                          cells = [
                              " ".join(str(cell).split())
                              for cell in row
                              if str(cell).strip()
                          ]

                          if cells:

                              self.output.append(
                                  "\n"
                                  + " | ".join(cells)
                                  + "\n"
                              )

                      self.in_table = False
                      self.newline()

                  elif tag in self.BLOCK_TAGS:

                      self.newline()

          # ============================================================
          # MARKDOWN TABLE PROCESSING
          # ============================================================

          def is_table_separator(line):

              cells = [
                  cell.strip()
                  for cell in line.strip().strip("|").split("|")
              ]

              return bool(cells) and all(
                  re.fullmatch(r":?-{3,}:?", cell)
                  for cell in cells
              )

          def normalize_markdown_tables(text):

              result = []

              for line in text.splitlines():

                  stripped = line.strip()

                  if not stripped:
                      result.append("")
                      continue

                  if (
                      stripped.startswith("|")
                      and stripped.endswith("|")
                  ):

                      if is_table_separator(stripped):
                          continue

                      cells = [
                          cell.strip()
                          for cell in stripped.strip("|").split("|")
                      ]

                      cells = [
                          cell for cell in cells if cell
                      ]

                      if cells:
                          result.append(" | ".join(cells))

                  else:
                      result.append(line)

              return "\n".join(result)

          # ============================================================
          # RELEASE BODY NORMALIZATION
          # ============================================================

          def normalize_release_body(body):

              if not body:
                  return "No release description provided."

              parser = ReleaseHTMLParser()

              parser.feed(body)
              parser.close()

              text = "".join(parser.output)

              # Remove any remaining HTML tags.
              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              # Decode HTML entities.
              text = html.unescape(text)

              # Normalize invisible Unicode spaces.
              text = (
                  text.replace("\u00a0", " ")
                  .replace("\u2000", " ")
                  .replace("\u2001", " ")
                  .replace("\u2002", " ")
                  .replace("\u2003", " ")
                  .replace("\u2004", " ")
                  .replace("\u2005", " ")
                  .replace("\u2006", " ")
                  .replace("\u2007", " ")
                  .replace("\u2008", " ")
                  .replace("\u2009", " ")
                  .replace("\u200a", " ")
                  .replace("\u202f", " ")
                  .replace("\u205f", " ")
                  .replace("\u3000", " ")
                  .replace("\u200b", "")
                  .replace("\ufeff", "")
              )

              # Remove image syntax but preserve alt text.
              text = re.sub(
                  r"!\[([^\]]*)\]\([^)]+\)",
                  r"\1",
                  text
              )

              # Convert Markdown links exactly once.
              # Result: readable label and original URL.
              text = re.sub(
                  r"\[([^\]]+)\]\((https?://[^)\s]+)\)",
                  r"\1 — \2",
                  text
              )

              # Convert autolinks.
              text = re.sub(
                  r"<(https?://[^>]+)>",
                  r"\1",
                  text
              )

              # Normalize Markdown tables.
              text = normalize_markdown_tables(text)

              lines = []

              for line in text.splitlines():

                  # Decode any remaining entities.
                  line = html.unescape(line)

                  # Remove invisible spacing artifacts.
                  line = re.sub(
                      r"[\u200b\ufeff]",
                      "",
                      line
                  )

                  # Normalize whitespace without destroying
                  # the actual content.
                  line = re.sub(
                      r"[ \t]+",
                      " ",
                      line
                  )

                  line = line.strip()

                  # Ignore lines containing only whitespace,
                  # separators or empty HTML artifacts.
                  if not line:
                      lines.append("")
                      continue

                  if re.fullmatch(
                      r"(?:&#x20;|&nbsp;|\s|[|]*)+",
                      line,
                      flags=re.IGNORECASE
                  ):
                      continue

                  lines.append(line)

              # Collapse multiple blank lines into one.
              cleaned = []
              previous_blank = False

              for line in lines:

                  blank = not line.strip()

                  if blank and previous_blank:
                      continue

                  cleaned.append(line)
                  previous_blank = blank

              return "\n".join(cleaned).strip()

          # ============================================================
          # TELEGRAM MARKDOWNV2 ESCAPING
          # ============================================================

          def escape_md(text):

              return re.sub(
                  r"([_*\[\]()~`>#+\-=|{}.!\\])",
                  r"\\\1",
                  str(text)
              )

          def escape_code(text):

              return (
                  str(text)
                  .replace("\\", "\\\\")
                  .replace("`", "\\`")
              )

          def escape_url(url):

              return (
                  str(url)
                  .replace("\\", "\\\\")
                  .replace(")", "\\)")
              )

          # ============================================================
          # SMART TEXT SPLITTING
          # ============================================================

          def split_text(text, limit):

              if not text:
                  return ["No release description provided."]

              chunks = []
              current = ""

              for line in text.splitlines():

                  # Handle unusually long individual lines.
                  while len(line) > limit:

                      if current:
                          chunks.append(current)
                          current = ""

                      chunks.append(line[:limit])
                      line = line[limit:]

                  candidate = (
                      current + "\n" + line
                      if current else line
                  )

                  if len(candidate) > limit:

                      if current:
                          chunks.append(current)

                      current = line

                  else:
                      current = candidate

              if current:
                  chunks.append(current)

              return chunks or [
                  "No release description provided."
              ]

          # ============================================================
          # TELEGRAM API
          # ============================================================

          def send_telegram(message):

              url = (
                  f"https://api.telegram.org/"
                  f"bot{TG_TOKEN}/sendMessage"
              )

              payload = urllib.parse.urlencode({
                  "chat_id": TG_CHAT,
                  "text": message,
                  "parse_mode": "MarkdownV2",
                  "disable_web_page_preview": "true"
              }).encode("utf-8")

              result = request_json(
                  url,
                  data=payload,
                  headers={
                      "Content-Type":
                          "application/x-www-form-urlencoded",
                      "User-Agent":
                          "macos-runner-image-watcher"
                  }
              )

              if not isinstance(result, dict):
                  raise RuntimeError(
                      "Unexpected Telegram response"
                  )

              if not result.get("ok"):
                  raise RuntimeError(
                      f"Telegram API error: {result}"
                  )

              return result

          # ============================================================
          # BUILD TELEGRAM MESSAGES
          # ============================================================

          def build_messages(release, prefix, force):

              tag = release.get("tag_name", "unknown")

              title = (
                  release.get("name")
                  or tag
              )

              url = release.get("html_url", "")

              published = release.get("published_at", "")

              prerelease = release.get("prerelease", False)
              draft = release.get("draft", False)

              body = normalize_release_body(
                  release.get("body") or ""
              )

              parts = split_text(
                  body,
                  CHUNK_SIZE
              )

              messages = []

              for index, part in enumerate(parts, start=1):

                  header = (
                      "🖼 *"
                      + escape_md(prefix)
                      + " обновился*\n"
                      + "`"
                      + escape_code(tag)
                      + "`"
                  )

                  if force:
                      header += (
                          "\n\n🔄 _Forced notification_"
                      )

                  if prerelease:
                      header += "\n🧪 _Pre\\-release_"

                  if draft:
                      header += "\n📝 _Draft_"

                  if published:
                      header += (
                          "\n🕒 "
                          + escape_md(published)
                      )

                  header += (
                      "\n\n*"
                      + escape_md(title)
                      + "*"
                  )

                  if len(parts) > 1:

                      header += (
                          "\n📄 Part "
                          + str(index)
                          + "/"
                          + str(len(parts))
                      )

                  message = (
                      header
                      + "\n\n"
                      + escape_md(part)
                  )

                  if index == len(parts) and url:

                      message += (
                          "\n\n[Открыть оригинальный релиз]("
                          + escape_url(url)
                          + ")"
                      )

                  messages.append(message)

              return messages

          # ============================================================
          # SEND COMPLETE RELEASE
          # ============================================================

          def deliver_release(release, prefix, force):

              messages = build_messages(
                  release,
                  prefix,
                  force
              )

              total = len(messages)

              log(
                  f"{prefix}: sending {total} message(s)"
              )

              for index, message in enumerate(
                  messages,
                  start=1
              ):

                  if len(message) > 4096:

                      raise RuntimeError(
                          "Telegram message exceeds 4096 "
                          f"characters: {len(message)}"
                      )

                  send_telegram(message)

                  log(
                      f"{prefix}: sent part "
                      f"{index}/{total}"
                  )

                  if index < total:
                      time.sleep(TELEGRAM_DELAY)

          # ============================================================
          # STATE MANAGEMENT
          # ============================================================

          def save_state(state):

              temporary = STATE + ".tmp"

              with open(
                  temporary,
                  "w",
                  encoding="utf-8"
              ) as file:

                  json.dump(
                      state,
                      file,
                      indent=2,
                      ensure_ascii=False
                  )

                  file.write("\n")

              os.replace(
                  temporary,
                  STATE
              )

          # ============================================================
          # MAIN
          # ============================================================

          log("=" * 60)
          log("Starting macOS runner image watcher")
          log("=" * 60)

          log(
              "Mode: "
              + (
                  "FORCE NOTIFY"
                  if FORCE_NOTIFY
                  else "NORMAL"
              )
          )

          with open(
              STATE,
              "r",
              encoding="utf-8"
          ) as file:

              state = json.load(file)

          if not isinstance(state, dict):
              raise RuntimeError("Invalid watcher state")

          releases = get_releases()

          log(
              f"Total releases retrieved: {len(releases)}"
          )

          sent = 0
          skipped = 0
          failed = 0

          for prefix in PREFIXES:

              candidates = [
                  release
                  for release in releases
                  if isinstance(
                      release.get("tag_name"),
                      str
                  )
                  and release["tag_name"].startswith(
                      prefix + "/"
                  )
                  and not release.get("draft", False)
              ]

              if not candidates:

                  log(
                      f"{prefix}: no releases found"
                  )

                  skipped += 1
                  continue

              latest = max(
                  candidates,
                  key=lambda release: (
                      release.get("published_at") or ""
                  )
              )

              tag = latest["tag_name"]
              old_tag = state.get(prefix, "")

              if tag == old_tag and not FORCE_NOTIFY:

                  log(
                      f"{prefix}: already up to date ({tag})"
                  )

                  skipped += 1
                  continue

              if FORCE_NOTIFY:

                  log(
                      f"{prefix}: forced notification: {tag}"
                  )

              else:

                  log(
                      f"{prefix}: new release: {tag}"
                  )

              try:

                  deliver_release(
                      latest,
                      prefix,
                      FORCE_NOTIFY
                  )

                  # Update state only after all message parts
                  # have been successfully delivered.

                  state[prefix] = tag

                  save_state(state)

                  sent += 1

                  log(
                      f"{prefix}: release delivered successfully"
                  )

              except Exception as error:

                  failed += 1

                  log(
                      f"{prefix}: DELIVERY FAILED: {error}"
                  )

          # ============================================================
          # SUMMARY
          # ============================================================

          log("=" * 60)
          log("WATCHER SUMMARY")
          log("=" * 60)

          log(f"Tracked images: {len(PREFIXES)}")
          log(f"Successfully delivered: {sent}")
          log(f"Skipped: {skipped}")
          log(f"Failed: {failed}")

          log("=" * 60)

          if failed:
              sys.exit(1)

          log("Watcher completed successfully")

          PY

      - name: Commit updated watcher state
        if: always() && steps.checkout.outcome == 'success'
        run: |
          set -euo pipefail

          STATE=".github/image-watch-state.json"

          if [ ! -f "$STATE" ]; then
            echo "State file does not exist."
            exit 0
          fi

          git config user.name "image-watch-bot"
          git config user.email "actions@users.noreply.github.com"

          git add "$STATE"

          if git diff --cached --quiet; then
            echo "State unchanged. Nothing to commit."
            exit 0
          fi

          git commit -m "image-watch: update last-seen release tags"

          git push
