
name: Watch runner-images macOS updates

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      force_notify:
        description: 'Force notification for all tracked images'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: runner-images-watcher
  cancel-in-progress: false

jobs:
  watch:
    name: Watch macOS runner images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new runner-images releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_NOTIFY: ${{ inputs.force_notify }}
        run: |
          set -euo pipefail

          mkdir -p .github

          STATE=".github/image-watch-state.json"

          [ -f "$STATE" ] || printf '{}\n' > "$STATE"

          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import html
          import urllib.request
          import urllib.parse
          import urllib.error

          from html.parser import HTMLParser

          # ============================================================
          # CONFIGURATION
          # ============================================================

          API = (
              "https://api.github.com/"
              "repos/actions/runner-images/releases"
          )

          STATE = ".github/image-watch-state.json"

          PREFIXES = [
              "xcode-27-arm64",
              "macos-26-arm64",
              "macos-15-arm64",
              "macos-26-intel",
          ]

          GH_TOKEN = os.environ.get("GH_TOKEN", "")
          TG_TOKEN = os.environ.get("TG_BOT_TOKEN", "")
          TG_CHAT = os.environ.get("TG_CHAT_ID", "")

          FORCE_NOTIFY = (
              os.environ.get("FORCE_NOTIFY", "false").lower()
              == "true"
          )

          # Telegram maximum is 4096 characters per message.
          # Keep a safe margin for MarkdownV2 and headers.
          TELEGRAM_CHUNK_SIZE = 2800

          # Avoid flooding group chats with multipart releases.
          TELEGRAM_DELAY = 3.1

          if not GH_TOKEN:
              sys.exit("ERROR: GITHUB_TOKEN is missing")

          if not TG_TOKEN or not TG_CHAT:
              sys.exit("ERROR: Telegram secrets are missing")

          # ============================================================
          # LOGGING
          # ============================================================

          def log(message):
              print(f"[watcher] {message}", flush=True)

          # ============================================================
          # HTTP
          # ============================================================

          def request_json(url, data=None, headers=None):
              headers = headers or {}

              for attempt in range(4):

                  try:
                      req = urllib.request.Request(
                          url,
                          data=data,
                          headers=headers,
                          method="POST" if data is not None else "GET"
                      )

                      with urllib.request.urlopen(
                          req,
                          timeout=45
                      ) as response:

                          return json.loads(
                              response.read().decode("utf-8")
                          )

                  except urllib.error.HTTPError as error:

                      if error.code == 429 or error.code >= 500:

                          retry_after = error.headers.get(
                              "Retry-After"
                          )

                          try:
                              delay = int(retry_after)
                          except (TypeError, ValueError):
                              delay = min(2 ** attempt * 3, 30)

                          if attempt == 3:
                              raise

                          log(
                              f"HTTP {error.code}; "
                              f"retrying in {delay}s"
                          )

                          time.sleep(delay)
                          continue

                      raise

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      OSError
                  ) as error:

                      if attempt == 3:
                          raise

                      delay = min(2 ** attempt * 3, 30)

                      log(
                          f"Network error: {error}; "
                          f"retrying in {delay}s"
                      )

                      time.sleep(delay)

              raise RuntimeError("HTTP request failed")

          # ============================================================
          # GITHUB RELEASES
          # ============================================================

          def get_releases():

              releases = []
              page = 1

              while True:

                  url = f"{API}?per_page=100&page={page}"

                  data = request_json(
                      url,
                      headers={
                          "Authorization": f"Bearer {GH_TOKEN}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                          "User-Agent": "macos-runner-image-watcher"
                      }
                  )

                  if not isinstance(data, list):
                      raise RuntimeError(
                          "Unexpected GitHub API response"
                      )

                  releases.extend(data)

                  log(
                      f"Fetched release page {page}: "
                      f"{len(data)} releases"
                  )

                  if len(data) < 100:
                      break

                  page += 1

              return releases

          # ============================================================
          # HTML -> TEXT CONVERTER
          # ============================================================

          class ReleaseHTMLParser(HTMLParser):

              BLOCK_TAGS = {
                  "p", "div", "section",
                  "article", "h1", "h2",
                  "h3", "h4", "h5", "h6",
                  "ul", "ol", "li",
                  "blockquote", "details",
                  "summary", "br"
              }

              def __init__(self):
                  super().__init__(convert_charrefs=True)

                  self.output = []
                  self.table_rows = []
                  self.table_row = []
                  self.table_cell = []
                  self.in_table = False
                  self.in_row = False
                  self.in_cell = False

              def newline(self):

                  if self.output and not self.output[-1].endswith("\n"):
                      self.output.append("\n")

              def handle_starttag(self, tag, attrs):

                  if tag == "table":

                      self.newline()
                      self.in_table = True
                      self.table_rows = []

                  elif tag == "tr" and self.in_table:

                      self.in_row = True
                      self.table_row = []

                  elif tag in ("td", "th") and self.in_table:

                      self.in_cell = True
                      self.table_cell = []

                  elif tag == "br":

                      if self.in_cell:
                          self.table_cell.append(" ")
                      else:
                          self.newline()

                  elif tag in self.BLOCK_TAGS and not self.in_cell:

                      self.newline()

              def handle_data(self, data):

                  if self.in_cell:
                      self.table_cell.append(data)

                  else:
                      self.output.append(data)

              def handle_endtag(self, tag):

                  if tag in ("td", "th") and self.in_cell:

                      value = " ".join(
                          "".join(self.table_cell).split()
                      )

                      self.table_row.append(value)

                      self.table_cell = []
                      self.in_cell = False

                  elif tag == "tr" and self.in_table:

                      if self.table_row:
                          self.table_rows.append(self.table_row)

                      self.table_row = []
                      self.in_row = False

                  elif tag == "table":

                      for row in self.table_rows:

                          values = [
                              value for value in row if value
                          ]

                          if values:

                              self.output.append(
                                  "\n" + " | ".join(values) + "\n"
                              )

                      self.in_table = False
                      self.newline()

                  elif tag in self.BLOCK_TAGS and not self.in_cell:

                      self.newline()

          # ============================================================
          # MARKDOWN TABLES
          # ============================================================

          def is_separator_row(line):

              cells = [
                  cell.strip()
                  for cell in line.strip().strip("|").split("|")
              ]

              return bool(cells) and all(
                  re.fullmatch(r":?-{3,}:?", cell)
                  for cell in cells
              )

          def convert_markdown_tables(text):

              output = []

              for line in text.splitlines():

                  stripped = line.strip()

                  if (
                      stripped.startswith("|")
                      and stripped.endswith("|")
                  ):

                      if is_separator_row(stripped):
                          continue

                      cells = [
                          cell.strip()
                          for cell in stripped.strip("|").split("|")
                      ]

                      if cells:
                          output.append(
                              " | ".join(cells)
                          )

                  else:
                      output.append(line)

              return "\n".join(output)

          # ============================================================
          # MARKDOWN NORMALIZATION
          # ============================================================

          def normalize_release_body(body):

              if not body:
                  return "No release description provided."

              # Convert HTML tables and block elements.
              parser = ReleaseHTMLParser()
              parser.feed(body)
              parser.close()

              text = "".join(parser.output)

              # Remove any remaining HTML tags.
              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = html.unescape(text)

              # Images -> descriptive text.
              text = re.sub(
                  r"!\[([^\]]*)\]\([^)]+\)",
                  r"\1",
                  text
              )

              # Links -> label + URL.
              text = re.sub(
                  r"\[([^\]]+)\]\((https?://[^)]+)\)",
                  r"\1 (\2)",
                  text
              )

              # Autolinks.
              text = re.sub(
                  r"<(https?://[^>]+)>",
                  r"\1",
                  text
              )

              # Markdown tables.
              text = convert_markdown_tables(text)

              # Preserve headings as readable plain text.
              text = re.sub(
                  r"(?m)^\s{0,3}#{1,6}\s*",
                  "",
                  text
              )

              # Remove inline formatting markers.
              text = re.sub(
                  r"(\*\*|__|~~|`)",
                  "",
                  text
              )

              # Clean excessive whitespace.
              text = re.sub(
                  r"[ \t]+",
                  " ",
                  text
              )

              text = re.sub(
                  r"\n[ \t]*\n[ \t]*\n+",
                  "\n\n",
                  text
              )

              return text.strip()

          # ============================================================
          # TELEGRAM MARKDOWNV2
          # ============================================================

          def escape_md(text):

              return re.sub(
                  r"([_*\[\]()~`>#+\-=|{}.!\\])",
                  r"\\\1",
                  str(text)
              )

          def escape_code(text):

              return (
                  str(text)
                  .replace("\\", "\\\\")
                  .replace("`", "\\`")
              )

          def escape_url(url):

              return (
                  str(url)
                  .replace("\\", "\\\\")
                  .replace(")", "\\)")
              )

          # ============================================================
          # SPLIT LONG RELEASES
          # ============================================================

          def split_text(text, limit):

              if not text:
                  return ["No release description provided."]

              chunks = []
              current = ""

              for line in text.splitlines():

                  # Handle exceptionally long individual lines.
                  while len(line) > limit:

                      if current:
                          chunks.append(current)
                          current = ""

                      chunks.append(line[:limit])
                      line = line[limit:]

                  candidate = (
                      current + "\n" + line
                      if current else line
                  )

                  if len(candidate) > limit:

                      if current:
                          chunks.append(current)

                      current = line

                  else:
                      current = candidate

              if current:
                  chunks.append(current)

              return chunks or ["No release description provided."]

          # ============================================================
          # TELEGRAM API
          # ============================================================

          def send_telegram(message):

              url = (
                  f"https://api.telegram.org/"
                  f"bot{TG_TOKEN}/sendMessage"
              )

              payload = urllib.parse.urlencode({
                  "chat_id": TG_CHAT,
                  "text": message,
                  "parse_mode": "MarkdownV2",
                  "disable_web_page_preview": "true"
              }).encode("utf-8")

              result = request_json(
                  url,
                  data=payload,
                  headers={
                      "Content-Type":
                          "application/x-www-form-urlencoded",
                      "User-Agent":
                          "macos-runner-image-watcher"
                  }
              )

              if not isinstance(result, dict):
                  raise RuntimeError(
                      "Unexpected Telegram response"
                  )

              if not result.get("ok"):
                  raise RuntimeError(
                      f"Telegram API error: {result}"
                  )

              return result

          # ============================================================
          # BUILD TELEGRAM MESSAGES
          # ============================================================

          def build_messages(release, prefix, force):

              tag = release.get("tag_name", "unknown")
              title = release.get("name") or tag

              url = release.get("html_url", "")

              published = release.get("published_at", "")
              draft = release.get("draft", False)
              prerelease = release.get("prerelease", False)

              body = normalize_release_body(
                  release.get("body") or ""
              )

              parts = split_text(
                  body,
                  TELEGRAM_CHUNK_SIZE
              )

              messages = []

              for index, part in enumerate(parts, start=1):

                  header = (
                      "🖼 *"
                      + escape_md(prefix)
                      + " обновился*\n"
                      + "`"
                      + escape_code(tag)
                      + "`"
                  )

                  if force:
                      header += "\n\n🔄 _Forced notification_"

                  if prerelease:
                      header += "\n🧪 _Pre\\-release_"

                  if draft:
                      header += "\n📝 _Draft_"

                  if published:
                      header += (
                          "\n🕒 "
                          + escape_md(published)
                      )

                  header += (
                      "\n\n*"
                      + escape_md(title)
                      + "*"
                  )

                  if len(parts) > 1:
                      header += (
                          "\n📄 Part "
                          + str(index)
                          + "/"
                          + str(len(parts))
                      )

                  message = (
                      header
                      + "\n\n"
                      + escape_md(part)
                  )

                  if index == len(parts) and url:

                      message += (
                          "\n\n[Открыть оригинальный релиз]("
                          + escape_url(url)
                          + ")"
                      )

                  messages.append(message)

              return messages

          # ============================================================
          # DELIVER COMPLETE RELEASE
          # ============================================================

          def deliver_release(release, prefix, force):

              messages = build_messages(
                  release,
                  prefix,
                  force
              )

              total = len(messages)

              log(
                  f"{prefix}: sending {total} Telegram message(s)"
              )

              for index, message in enumerate(messages, start=1):

                  if len(message) > 4096:
                      raise RuntimeError(
                          f"Telegram message too long: "
                          f"{len(message)} characters"
                      )

                  send_telegram(message)

                  log(
                      f"{prefix}: delivered part "
                      f"{index}/{total}"
                  )

                  if index < total:
                      time.sleep(TELEGRAM_DELAY)

          # ============================================================
          # STATE MANAGEMENT
          # ============================================================

          def save_state(state):

              temporary = STATE + ".tmp"

              with open(
                  temporary,
                  "w",
                  encoding="utf-8"
              ) as file:

                  json.dump(
                      state,
                      file,
                      indent=2,
                      ensure_ascii=False
                  )

                  file.write("\n")

              os.replace(temporary, STATE)

          # ============================================================
          # MAIN
          # ============================================================

          log("=" * 65)
          log("macOS RUNNER IMAGE RELEASE WATCHER")
          log("=" * 65)

          log(
              f"Mode: "
              f"{'FORCE NOTIFY' if FORCE_NOTIFY else 'NORMAL'}"
          )

          with open(
              STATE,
              "r",
              encoding="utf-8"
          ) as file:

              state = json.load(file)

          if not isinstance(state, dict):
              raise RuntimeError("Invalid state file")

          releases = get_releases()

          log(
              f"Total releases retrieved: {len(releases)}"
          )

          sent = 0
          skipped = 0
          failed = 0

          for prefix in PREFIXES:

              candidates = [
                  release
                  for release in releases
                  if isinstance(
                      release.get("tag_name"), str
                  )
                  and release["tag_name"].startswith(
                      prefix + "/"
                  )
                  and not release.get("draft", False)
              ]

              if not candidates:

                  log(
                      f"{prefix}: no releases found"
                  )

                  skipped += 1
                  continue

              latest = max(
                  candidates,
                  key=lambda release: (
                      release.get("published_at") or ""
                  )
              )

              tag = latest["tag_name"]

              old_tag = state.get(prefix, "")

              if tag == old_tag and not FORCE_NOTIFY:

                  log(
                      f"{prefix}: already up to date ({tag})"
                  )

                  skipped += 1
                  continue

              if FORCE_NOTIFY:

                  log(
                      f"{prefix}: force notification for {tag}"
                  )

              else:

                  log(
                      f"{prefix}: new release detected: {tag}"
                  )

              try:

                  deliver_release(
                      latest,
                      prefix,
                      FORCE_NOTIFY
                  )

                  # Save only after every Telegram part succeeds.
                  state[prefix] = tag

                  save_state(state)

                  sent += 1

                  log(
                      f"{prefix}: complete release delivered"
                  )

              except Exception as error:

                  failed += 1

                  log(
                      f"{prefix}: DELIVERY FAILED: {error}"
                  )

          # ============================================================
          # SUMMARY
          # ============================================================

          log("=" * 65)
          log("WATCHER SUMMARY")
          log("=" * 65)

          log(f"Tracked images: {len(PREFIXES)}")
          log(f"Successfully delivered: {sent}")
          log(f"Skipped: {skipped}")
          log(f"Failed: {failed}")

          log("=" * 65)

          if failed:
              sys.exit(1)

          log("All operations completed successfully")

          PY

      - name: Commit updated watcher state
        if: always()
        run: |
          set -euo pipefail

          STATE=".github/image-watch-state.json"

          git config user.name "image-watch-bot"
          git config user.email "actions@users.noreply.github.com"

          git add "$STATE"

          if git diff --cached --quiet; then
            echo "State unchanged. Nothing to commit."
            exit 0
          fi

          git commit -m "image-watch: update last-seen release tags"

          git push
