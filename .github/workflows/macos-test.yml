name: Я ЕБУЕБУ МАКОСОСЬ

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'name custom user'
        required: true
        default: 'ktoya'
        type: string
      use_secrets:
        description: 'Использовать секреты из GitHub Secrets (true/false)'
        required: true
        default: true
        type: boolean
      manual_tail_key:
        description: 'Tailscale Key (если use_secrets: false)'
        required: false
        default: ''
        type: string
      manual_password:
        description: 'Password для пользователя (если use_secrets: false)'
        required: false
        default: ''
        type: string

jobs:
  build-cloud-pc-mac:
    runs-on: xcode-27
    timeout-minutes: 420

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Install Tailscale via Homebrew
        run: |
          echo "Ставим Tailscale через brew..."
          brew install tailscale

      - name: 2. Start and Auth Tailscale
        env:
          USE_SECRETS: ${{ github.event.inputs.use_secrets }}
          SECRET_KEY: ${{ secrets.TAIL_KEY }}
          MANUAL_KEY: ${{ github.event.inputs.manual_tail_key }}
        run: |
          echo "Запускаем Tailscaled сервис..."
          sudo brew services start tailscale

          if [ "$USE_SECRETS" = "true" ]; then
              ACTIVE_TAIL_KEY="$SECRET_KEY"
              echo "Используем Tailscale ключ из GitHub Secrets (TAIL_KEY)."
          else
              ACTIVE_TAIL_KEY="$MANUAL_KEY"
              echo "Используем Tailscale ключ из ручного инпута."
          fi

          echo "Авторизуемся в сети Tailscale..."
          sudo tailscale up --auth-key="$ACTIVE_TAIL_KEY" --accept-risk=all --advertise-exit-node

      - name: 3. Setup Users, SSH & Environment
        env:
          USE_SECRETS: ${{ github.event.inputs.use_secrets }}
          CUSTOM_USER: ${{ github.event.inputs.username }}
          SECRET_PASS: ${{ secrets.CUSTOM_PASSWORD }}
          MANUAL_PASS: ${{ github.event.inputs.manual_password }}
        run: |
          echo "Настраиваем пользователя $CUSTOM_USER и окружение..."

          if [ "$USE_SECRETS" = "true" ]; then
              ACTIVE_PASS="$SECRET_PASS"
              echo "Используем пароль из GitHub Secrets (CUSTOM_PASSWORD)."
          else
              ACTIVE_PASS="$MANUAL_PASS"
              echo "Используем пароль из ручного инпута."
          fi

          if ! id "$CUSTOM_USER" &>/dev/null; then
              sudo dscl . -create /Users/$CUSTOM_USER
              sudo dscl . -create /Users/$CUSTOM_USER UserShell /bin/zsh
              sudo dscl . -create /Users/$CUSTOM_USER RealName "$CUSTOM_USER"
              sudo dscl . -create /Users/$CUSTOM_USER UniqueID 502
              sudo dscl . -create /Users/$CUSTOM_USER PrimaryGroupID 20
              sudo dscl . -create /Users/$CUSTOM_USER NFSHomeDirectory /Users/$CUSTOM_USER
              sudo mkdir -p /Users/$CUSTOM_USER
              sudo chown -R $CUSTOM_USER:staff /Users/$CUSTOM_USER
              echo "Пользователь $CUSTOM_USER создан через dscl."
          else
              echo "Пользователь $CUSTOM_USER уже существует."
          fi

          echo "$ACTIVE_PASS" | sudo dscl . -passwd /Users/$CUSTOM_USER
          sudo dseditgroup -o edit -a "$CUSTOM_USER" -t user admin || true

          echo "Проверяем статус SSH..."
          sudo launchctl list | grep sshd || true

      - name: Setup 1280x1024 Virtual Display and Grant All Permissions
        run: |
          VNC_PASSWORD="${{ secrets.CUSTOM_PASSWORD }}"

          echo "=== 1. Создание виртуального дисплея 1280x1024 ==="
          # Скачиваем микро-утилиту для управления виртуальными мониторами macOS
          curl -L -o betterdisplaycli https://github.com
          chmod +x betterdisplaycli

          # Создаем виртуальный монитор и жестко форсируем разрешение вашего физического экрана
          ./betterdisplaycli create -name="MyVirtualMonitor" -width=1280 -height=1024 || echo "Используем стандартный буфер"

          # Утилита caffeinate не дает графическому процессору Mac "уснуть" без реального кабеля HDMI
          caffeinate -d -i -m -s -t 3600 &

          echo "=== 2. Выдача тотальных прав безопасности ==="
          # Инжектируем права на Screen Recording, Accessibility и симуляцию ввода напрямую в базу TCC.
          # Это навсегда лечит черный экран MDM-блокировки.
          NOW=$(date +%s)
          sudo sqlite3 /Library/Application\ Support/com.apple.TCC/TCC.db <<EOF
          INSERT OR REPLACE INTO access VALUES('kTCCServiceScreenCapture','com.apple.RemoteManagement.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$NOW);
          INSERT OR REPLACE INTO access VALUES('kTCCServiceAccessibility','com.apple.RemoteManagement.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$NOW);
          INSERT OR REPLACE INTO access VALUES('kTCCServicePostEvent','com.apple.RemoteManagement.agent',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$NOW);
          INSERT OR REPLACE INTO access VALUES('kTCCServiceSystemPolicyAllFiles','com.apple.RemoteManagement.agent',0,2,4,1,NULL,NULL,0,$NOW);
          EOF

          echo "=== 3. Конфигурация и запуск VNC ==="
          # Запускаем штатный Apple Screen Sharing
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate

          # Разрешаем полный контроль для всех пользователей
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -allowAccessFor -allUsers -privs -all
          
          # Задаем секретный пароль и разрешаем совместимость с TightVNC/RealVNC на Windows (vnclegacy)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASSWORD"

          echo "=== 4. Мягкая перезагрузка VNC-агента ==="
          # Перезапускаем сервис удаленного доступа, чтобы применились новые права TCC.
          # Это безопасно: джоба НЕ упадет, сессия останется активной!
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent

          echo "=== ИМБА НАСТРОЕНА НА 1280x1024! Подключайтесь ==="



      - name: 4. Wait session (7 hours)
        run: |
          echo "Всё поднято, держим сессию..."
          while true; do
            sleep 60
          done
