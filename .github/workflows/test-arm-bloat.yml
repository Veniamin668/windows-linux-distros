name: 11 ARM64 test BLOAT!!

on:
  workflow_dispatch:
  
jobs:
  test-cloud-pc-auto:
    runs-on: windows-11-arm
    timeout-minutes: 365

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4


#      - name: configure Pagefile
#        uses: al-cheb/configure-pagefile-action@v1.2
#        with:
#          minimum-size: 4GB
#          maximum-size: 4GB
#          disk-root: "C:"

#      - name: Setup RAM Disk
#        uses: chad-golden/setup-ramdisk@main
#        with:
#          size-in-mb: 4096    # Optional: Default is 2048
#          drive-letter: 'R'   # Optional: Default is R
#          copy-workspace: false # Optional: Default is false

      - name: Run Win RDP Enabler
        uses: Veniamin668/win-rdp-enabler@arm-oauth
        with:
#           TAIL_KEY: ${{ secrets.TAIL_KEY }} 
           OAUTH_KEY: ${{ secrets.TAIL_OAUTH }}
           ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
           USE_CUSTOM_USER: 'false'
           CUSTOM_USERNAME: ''
           CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}
           HOSTNAME: 'runner-arm64-bloat'
           ADVERTISE_TAGS: 'tag:ci'
      
      - name: Purge Windows Bloat
        uses: Veniamin668/windows-debloater-runner@v8
        with:
          enable: 'false'
          azure-del: 'false'
          choco-del: 'false'
          uwp-del: 'false'
          path-clean: 'false'
          del-installer-user: 'false'
          oobe-disable: 'true'
          npm-del: 'false'
          wsl-rename: 'true'
          optimize: 'false'
          
      - name: Setup TIGHTVNC (RANDOM PASSWD)
        shell: cmd
        run: |
          curl -O https://www.tightvnc.com/download/4.0.2/tightvnc-4.0.2-x64.msi
          msiexec /i tightvnc-4.0.2-x64.msi /quiet /norestart FEATURES=Server REGISTER_SERVICE=1 FIREWALL_EXCEPTION=1

      - name: Run TightVNC Configuration Script
        shell: powershell
        run: |
          ./configure-vnc.ps1

      - name: 4. wait session (6 hours)
        run: |
          Write-Host "Cloud PC дрочилка запущена и ждет тебя в сети! Не закрывай этот воркфлоу."
          while ($true) {
              Start-Sleep -Seconds 60
          }
        shell: pwsh
        
